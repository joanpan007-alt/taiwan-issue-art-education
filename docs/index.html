k53:{"why":"Verified: the core facts — that Lukang Gilgle (Chang Ching-yeh) launched the This-Autumn Arts Festival from 2015 and worked with local shops and old houses — are separately reported and cross-confirmed by several independent sources including CommonWealth Magazine, Smile Taiwan and PAR (Performing Arts Review); but these are mostly profiles of the person or organization and do not pin down the full details of any one edition, so specific editions remain to be verified.","name": "Lukang This-Autumn Arts Festival", "creator": "Lukang Gilgle cultural enterprise (curator Chang Ching-yeh) and the Changhua Baolu Movement Association", "place": "Lukang Township, Changhua County (old houses, the streets and local shops)", "year": "First edition 2015 (originally 'Lukang Arts Festival: This-Autumn Gathering'), roughly every other year since", "summary":"The Lukang Autumn Arts Festival is a self-funded civil arts festival launched in 2015 by returning youth Chang Ching-yeh after building community momentum through the “Save Lukang movement”; the first edition was originally called “Lukang Arts Festival: Autumn Gathering”, held roughly every other year (Commonwealth says “every two years”).\n\nThe festival works with local shops and old houses, extending exhibition space into everyday places (a family restaurant, a bar, a youth start-up base) and using neighbourhood curating, walking tours, performances, film and talks to overturn outside tourist stereotypes of Lukang.\n\nPAR Performing Arts Magazine reports that the curators first meant it for locals, but participants were mostly from outside, while locals gradually grew used to the festival’s existence. The dates of a particular edition and whether it has continued recently are not given or lack a year in the sources.", "selfDesc": "PAR (Performing Arts Review) reports that the curator originally meant the festival for locals, but most participants came from elsewhere while locals gradually grew used to its presence. CommonWealth Magazine and Smile Taiwan also report Chang Ching-yeh and Lukang Gilgle launching the festival in 2015 and working with local shops and old houses.", "pedagogicalInsight":"A self-funded civil arts festival run by a returning youth and set in old houses and shops, it shows how exhibition space can extend into everyday places such as restaurants and bars. PAR notes the curators first meant it for locals but mostly outsiders came; this gap of “who is it for / who comes” is itself a topic worth discussing with students about local arts festivals."},
k54:{"why":"Verified: the core facts — that Goldfish Neighbour (Peng Ren-hong) organized the Toucheng Old Street Arts Festival from 2014 and founded a young-and-old co-creation space and the 'Young & Old Journal' — are cross-confirmed by several independent sources including PeoPo, UDN, GVM Cities and CommonWealth / Smile Taiwan; but most are interviews with the person or organization, with no complete record of any single edition, so specific editions remain to be verified.","name": "Goldfish Neighbour and the Toucheng Old Street Culture & Arts Festival", "creator": "Goldfish Neighbour (founder Peng Ren-hong); visiting and international artists also take part in street-based work", "place": "Toucheng Township, Yilan County (the old street, the former township mayor's residence)", "year": "From 2014 (first Toucheng Old Street Arts Festival), held yearly since", "summary":"Peng Ren-hong, from Toucheng, returned home to work after graduate school and in 2014 applied for the Ministry of Culture’s Youth Village programme to organise the first Toucheng Old Street Art Season, which has been held each year since.\n\nHe later founded “Goldfish Neighbours”, turning the old mayor’s former residence into a youth-and-elder co-creation space, inviting elderly artists and craftspeople to be the protagonists telling their own stories, letting outside and local artists exchange, and publishing the “Youth–Silver Magazine”.\n\nGoldfish Neighbours is a long-running place-regeneration organisation whose single “project” boundary is unclear, so it is recorded as an organisation / arts season; the Commonwealth Cities book excerpt mentions Argentine artists taking part in street-level creation, and recent editions and scale are not given in the sources.", "selfDesc": "News Lens, PeoPo citizen journalism, a GVM Cities book excerpt, and CommonWealth / Smile Taiwan report that Peng Ren-hong, after applying to the Ministry of Culture's 2014 youth-village programme, organized the first Toucheng Old Street Arts Festival, then founded Goldfish Neighbour, ran a young-and-old co-creation space, and published the 'Young & Old Journal'.", "pedagogicalInsight":"Peng Ren-hong turned the old mayor’s residence into a youth-and-elder co-creation space and invited elderly artists and craftspeople to tell their own stories as protagonists, modelling “elders as protagonists, not interviewees”. For those working across generations or on place regeneration, the point is to stay long-term and build community relations first, and only then talk about making."},
k55:{"why":"Unverified: CNA (2025-01-23) reports the Hua family show 'We Are Not the Only Ones on This Land' at the Pingtung Indigenous Peoples Gallery; Taiwan News also reports it but with an opening close to CNA's, so its independence is unconfirmed, and 94ipt shares CNA's source. As an individual/family show with no resident participation, it is included under standard 2 (identity); its dates and whether it touches concrete land-rights issues remain to be filled in.","name": "We Are Not the Only Ones on This Land (Hua Heng-ming, Hua Yi-da and Hua Lu-sha, a father-and-daughters show)", "creator": "Paiwan artists Hua Heng-ming and his daughters Hua Yi-da and Hua Lu-sha; co-organized with the Pingtung County Government (Indigenous Peoples Administration)", "place": "Pingtung Indigenous Peoples Gallery, Pingtung 1936 Cultural Base, Pingtung County", "year": "2025 (CNA 2025-01-23; runs to 4/27)", "summary":"Three Paiwan artists — Hua Heng-ming, Hua Yi-da and Hua Lu-sha, a father and daughters — put their longing for home and freedom, and their exploration of multiple identities as selves, tribe and family, into knives, painting and pottery; the show ran in 2025 at the Pingtung Indigenous Museum in the Pingtung Tobacco 1936 Cultural Base, until 27 April.\n\nIt was jointly planned by the Pingtung County Government’s Indigenous Peoples Administration and the three artists, around family (Mavaliu), tribe and shared land (Paiwan “BALILAOU”).\n\nThe county’s indigenous affairs office explains the curatorial idea comes from the Hengchun Peninsula once being land shared by different ethnic groups, where differences and conflicts are hard to avoid when plural identities coexist. It is an individual / family exhibition without resident participation; whether the works touch a concrete social issue (such as land rights) is not given in the sources.", "selfDesc": "CNA (2025-01-23) reports that the show was co-curated by the Pingtung County Government's Indigenous Peoples Administration and the three Paiwan artists, shown at the Pingtung Indigenous Peoples Gallery in the Pingtung 1936 Cultural Base, around the themes of family (Mavaliu), tribe and shared land (the Paiwan word 'BALILAOU').", "pedagogicalInsight":"This is a joint exhibition by a Paiwan father and daughters without community participation, suited as material for “looking at works and talking about identity”. Students can see how the three makers put questions about home, freedom and plural identities (self / tribe / family) into knives, painting and pottery. It is work-oriented, not a participatory workshop.", "why": "Verified: besides CNA (2025-01-23), United Daily News independently covered the show under a different headline, corroborating the Pingtung Indigenous Peoples Museum at Pingtung 1936, the three Paiwan artists (Hua Heng-ming and his daughters Hua Yi-ta and Hua Lu-sha) working in knives, painting and ceramics, the county Indigenous Peoples Department, the run to 4/27, and the BALILAOU (sharing the land) and Mavaliu themes; upgraded to verified. The udn page shows no byline or date, so a wire reprint cannot be fully ruled out. (Daily source expansion, 2026-11-19)"},
k56:{"why":"Unverified: the 2025 Falling-Mountain Wind Arts Festival 'Hey, Haikou!' is reported by several outlets (Minpao, UDN, Taiwan News, Smile Taiwan), but mostly as event publicity or county-supplied material, with weak evidence of resident participation (only sparse mentions of the 'Haikou Canteen' and old-house reworking), so it is listed as unverified. The length of the residencies and whether residents actually took part in creation remain to be filled in.","name": "2025 Falling-Mountain Wind Arts Festival: Hey, Haikou!", "creator": "Pingtung County Government; 16 artists from Taiwan, France, the US, Japan and Mexico (e.g. Yosuke Yamauchi, Yu Wen-fu, Chen Shu-yen, Liu Dong, Chang Yu-chia and others)", "place": "Haikou Village, Checheng Township, Pingtung County (three zones — village, harbour, beach — and the Sea-view Art Museum)", "year": "2025/12/20–2026/3/1", "summary":"The 2025 Fall Wind Art Season, “Hey, Haikou!”, ran from 20 December 2025 to 1 March 2026 in Haikou Village, Checheng, Pingtung; the curation centres on the winter “falling wind” peculiar to Haikou and brings together 16 artists from Taiwan and abroad, with works spread across three zones — village, harbour and beach — and the Sea-Viewing Museum.\n\nArtists took up residence and made work to the spaces and environment: a Japanese illustrator turned cat and dog sculptures into village figures; Yu Wen-fu rebuilt an abandoned stone house with bamboo weaving and plastic chairs; the “Haikou Canteen” had Japanese cuisine craftspeople and local residents jointly offer limited lunch boxes.\n\nNOWnews reports 2024 as the sixth edition. How long residencies lasted, whether residents actually took part in making, and whether climate and fishing-village change were actual responses in the works are not given in the sources.", "selfDesc": "Minpao, UDN, Taiwan News and Smile Taiwan report the 2025 Falling-Mountain Wind Arts Festival under the title 'Hey, Haikou!', gathering 16 artists from Taiwan and abroad on the Haikou beach, harbour and village and at the Sea-view Art Museum; NOWnews separately reports the 2024 edition as the sixth.", "pedagogicalInsight":"This is a tourism-leaning landscape arts festival with limited direct reference for classroom teaching; what is more borrowable is the “Haikou Canteen”, where Japanese cuisine craftspeople and residents offered limited lunch boxes together, showing that food can be a medium of contact between visiting artists and the local community. Note most works are still artist-in-residence creation, with only scattered resident participation."},
k57:{"why":"Verified: Lin Chieh-wen (Labay Eyong)'s Dungku Asang is reported and cross-confirmed by several independent sources including The News Lens (News Lens photo feature), the Taishin Arts Award site and the Academia Sinica newsletter — the artist, the Taishin shortlisting, and weaving blankets with community women to wrap the mining mountain are consistent; the number of weavers and exhibition-date details remain to be filled in.","name": "Dungku Asang ('Wrapping the Mountain') (Lin Chieh-wen / Labay Eyong)", "creator": "Lin Chieh-wen (Labay Eyong, Truku of Hongye community, Hualien) and women weavers of the community", "place": "The Ruixin mining area around Hongye community, Wanrong Township, Hualien County", "year": "2021 (shortlisted for the 2020 Taishin Arts Award; the Taishin page dates it 2021/3/6–3/27)", "summary":"“Dungku Asang” (Wrapping the Mountain) is a work by Lin Chieh-wen (Labay Eyong), who invited tribal women to weave blankets together and drape them over the Ruixin mining area worked by Asia Cement and Taiwan Cement around Hongye Village, Wanrong, Hualien; the work was shortlisted for the 2020 Taishin Arts Award, and the Taishin page is dated 6–27 March 2021.\n\nThe work leads viewers onto the land and traditional territory to look back at the traces history left in the mountain, and brings out women’s weaving and cultural traits.\n\nReports say she widened weaving into a concept of healing, treating the mined mountain as a wounded body. One exhibition note lists “Wrapping the Mountain” under “Labai Iyong”, probably another Chinese rendering of Labay Eyong; details of dates and place are not fully given in the sources.", "selfDesc": "The News Lens (News Lens photo feature), the Taishin Arts Award site and the Academia Sinica newsletter report Lin Chieh-wen draping blankets over the mining mountain and being shortlisted for the Taishin Arts Award; the Taishin page dates it 2021/3/6–3/27.", "pedagogicalInsight":"Lin Chieh-wen invited tribal women to weave blankets together and drape them over a mined mountain, likening the mined mountain to a wounded body, modelling how collective weaving — a women’s, local craft — can respond to mining and traditional-territory issues. For teachers discussing environmental or indigenous issues, this is a high-quality example of “speaking through the community’s own craft”."},
k58:{"why":"Unverified: so far a single source, 1111 News (from NTOU). The partner units, the mayor presiding over the lighting, the lantern's provenance and the marine-debris display are as the release states; the festival's exact dates and title, and who made the marine-debris works, remain to be filled in. 'NTOU' is National Taiwan Ocean University.","name": "Kouhu Seaside Arts Festival (with the NTOU USR team in residence)", "creator": "National Taiwan Ocean University (NTOU) USR team; Qinku Yajiao Cultural & Creative Association (chair Wang Yao-xin); Kouhu Township Office", "place": "Xialun area, Kouhu Township, Yunlin County", "year": "2025 (after the 2025 Taiwan Lantern Festival; exact dates to be confirmed)", "summary":"The Chenku Yajiao Cultural and Creative Association has long promoted community building and arts education in the Xialun area of Kouhu, Yunlin. The 2025 Kouhu Coastal Art Season was held by the National Taiwan Ocean University (NTOU) USR team together with the association and the Kouhu Township Office.\n\nThe art season adopted a lantern left over from the 2025 Taoyuan Taiwan Lantern Festival, with the lighting ceremony led by the township mayor, and used an ocean-debris art display to let residents understand environmental sustainability while enjoying the lantern, echoing the ideas of reusing lanterns and reusing marine debris.\n\nResidents came with their families, but the co-creation process is thinly described, so evidence of resident participation is weak to moderate; the exact dates and name of the art season and who made the marine-debris works are not given in the sources.", "selfDesc": "1111 News (from NTOU) reports that the festival was run by NTOU's USR team with the Qinku Yajiao Cultural & Creative Association and the Kouhu Township Office, adopting a lantern left from the 2025 Taoyuan Taiwan Lantern Festival, with the township mayor presiding over the lighting, and promoting marine education through marine-debris art displays.", "pedagogicalInsight":"Adopting a lantern left over from the Taiwan Lantern Festival for a second life and combining it with a marine-debris art display lets residents grasp environmental sustainability while enjoying the lantern, showing how a “ready-made festival object” can become an environmental education medium. Note that the co-creation process is thinly described, so it is closer to a showing of results."},
k59:{"why":"Unverified: although the Wuta Elementary x National Taiwan Museum 'Tnunan' Atayal-artefacts exhibition has several reports (Liberty Times, Lianet, Yahoo from the museum) agreeing on dates and place, several appear to derive from school or museum press releases and, by the platform's rules, do not count as mutually independent; the Liberty Times page could not be opened to check the full text this time. The 30-plus artefacts, 10 elder interviews and student guides are as the reports state.","name": "Tnunan: Returning Through Objects, Bound Together (Wuta Elementary x NTM Nan'ao Atayal artefacts special exhibition)", "creator": "Wuta Elementary School, Nan'ao Township, Yilan County (co-curators include teacher Wilang Mawi), the National Taiwan Museum, the Nan'ao Township Atayal Culture Hall, and the Yilan County History Museum", "place": "2F special-exhibition room, Atayal Culture Hall, Nan'ao Township, Yilan County", "year": "Opened 2026/10/6, runs to 2027/2/26", "summary":"“Tnunan: Returning Through Objects, Bound Together” is a special exhibition of Nan’ao Atayal artefacts by Wuta Elementary School with the National Taiwan Museum and others, opening 6 October 2026 and running to 26 February 2027 in the second-floor special exhibition room of the Atayal Cultural Hall in Nan’ao, Yilan.\n\nAfter about two years of artefact research, fieldwork and elders’ oral accounts, the school followed names left in the century-old acquisition registers to reconnect over 30 Nan’ao Atayal artefacts, acquired by the National Taiwan Museum in the Japanese period, with tribal families; ten elders who had lived in the old mountain settlements were interviewed, and some went to the museum’s storeroom to identify objects.\n\nThe school also turned the results into lesson plans and teaching kits and trained students as young guides. It leans toward museum curating and cultural education, and whether it fully fits the platform’s definition of an “art form” is open to discussion; some reports’ headlines say “National Museum of Taiwan History” while the text says the National Taiwan Museum, probably a headline error that could not be confirmed.", "selfDesc": "Liberty Times, Lianet and Yahoo (from the National Taiwan Museum) report that the exhibition, by Wuta Elementary with the National Taiwan Museum and others, shows more than 30 Nan'ao Atayal artefacts, interviewed 10 elders and trained student guides, running from 6 Oct 2026 to 26 Feb 2027.", "pedagogicalInsight":"The school followed names in century-old acquisition registers to reconnect the museum’s artefacts with tribal families, then turned results into lesson plans, a teaching kit and student guiding — a complete example of “taking artefacts as the starting question and letting students be researchers and guides”. For teachers of local culture or indigenous education, it shows how returning artefacts can be research, identity and curriculum at once."},
k60:{"why":"Unverified: so far a single independent report, in UDN, corroborating that TNUA's College of Fine Arts held the micro art festival with the Cheng Family Historic House, Wang Yu-song's 'parent-child homecoming day' turtle-mould sand-printing, and the 1980s turtle memory at Shalun; the second link, an Accupass ticketing/registration page, does not count as a second independent source. Details such as a single host's name and the 2023 opening date remain to be filled in.","name": "Watershed Aesthetics Art Initiative: Gongsitian Creek Action (Gongsitian Creek Micro Art Festival)", "creator": "College of Fine Arts, Taipei National University of the Arts (TNUA); in cooperation with the Cheng Family Historic House on Gongsitian Creek; artist Wang Yu-song (sea-turtle participatory work)", "place": "Along Gongsitian Creek to its mouth in Tamsui District, New Taipei (Shalun Beach, Zhouzi Bay, the Cheng Family Historic House)", "year": "USR 2020–2022; 2023 Micro Art Festival (opened 10/28), 2024 satellite show 'Sea Turtles Home 1980' (10/13)", "summary":"The Taipei National University of the Arts College of Fine Arts used the Gongsitian Creek basin in Tamsui as its stage, turning coastal environment issues into participatory making through the micro art festival of the “Watershed Aesthetics Art Initiation: Gongsitian Creek Action” (USR, academic years 109–111); the activity was held by the university with the Cheng Family Old House, and included a market and talks.\n\nIn 2023 three zones were set along the creek, opening on 28 October; artist Wang Yu-sung planned a “Parent-Child Sea Turtle Return Day”, where families used large and small turtle moulds to take sand rubbings on Shalun Beach, recreating turtles coming ashore.\n\nThis echoes the local memory that sea turtles appeared on Shalun Beach in the 1980s and later left after war, built structures and breakwater blocks; in 2024 it continued with the satellite exhibition “Sea Turtle Return 1980” (13 October, Zhouzi Bay). The United Daily News says only “sea turtles” without naming the species.", "selfDesc": "UDN's report 'Tamsui's Gongsitian Creek Micro Art Festival: knowing the coast through art' says the festival, run by TNUA's College of Fine Arts with the Cheng Family Historic House, included a market and talks; Wang Yu-song hosted the parent-child homecoming day, with families printing turtle tracks in the sand at Shalun using large and small turtle moulds. The report notes turtles appeared at Shalun in the 1980s (the most recent record) and left after the coast went through war, man-made structures and wave-breakers. An Accupass event page also records the 2024 'Sea Turtles Home 1980' satellite show (10/13, Zhouzi Bay).", "pedagogicalInsight":"Turning the local ecological memory that “sea turtles once came ashore and later vanished” into families taking sand rubbings with moulds to “recreate turtles coming ashore” shows teachers of environmental education how a concrete, hands-on bodily action can carry abstract ecological change, closer to children than talking directly about ocean pollution. Note that sand rubbing is a one-off experience, so depth is still limited."},
k61:{"why":"Verified: Hakka News (Li Tai-yuan, 2023-12-23) and PeoPo (Wang Zheng-kui, 2023-12-18) are two independent sources, both directly describing Dienguang community's 'Telling the Tale of Leigonghuo', residents performing it themselves, TNUA's center accompanying them, the Amis 'Battle of Leigonghuo' history and multilingual mother tongues as the core, and the run from 2013 to the 11th edition in 2023. Details of earlier editions and each USR year remain to be filled in.","name": "Leigonghuo Little-Play Festival: 'Telling the Tale of Leigonghuo' (Dienguang community, Guanshan)", "creator": "Residents of Dienguang community performing of their own accord, the Dienguang Community Development Association; accompanied by TNUA's Center for Art and Social Practice & Continuing Education; 2023 director Chan Yi-chia (performing-arts teacher at Guanshan Junior High)", "place": "Dienguang community (Kaadaadaan), Guanshan Township, Taitung County (about 70% Amis, 20% Hakka)", "year": "'Telling the Tale of Leigonghuo' from 2013 (11th edition in 2023); TNUA USR sub-project 2018–2019 and 2023–2024", "summary":"The Dianguang tribe (Kaadaadaan) in Guanshan, Taitung — about 70% Amis and 20% Hakka — takes as its collective memory the 1896 “Thunder Fire Battle”, in which ancestors drove off remnants of Qing troops with bamboo cannons. From 2013 residents took this story onto the terraced rice fields after harvest and developed “Playing Thunder Fire”, whose 2023 run was the 11th.\n\nThe roughly one-hour show is performed by villagers, returning youth and local schoolchildren, with bamboo cannon sound effects, interweaving Amis, Hoklo, Hakka and Mandarin without subtitles, hoping to plant seeds of the mother tongue in children; in 2023 there was a first full script, directed by Zhan Yi-jia of Guanshan Junior High.\n\nThe Taipei National University of the Arts Centre for Art and Social Practice joined as an accompanying partner through the “Thunder Fire Little Theatre Festival” USR sub-project (academic years 107–108 and 112–113), helping build the theatre structure. Independent reports centre on 2023; details of earlier editions are not given in the sources.", "selfDesc": "Hakka News (Li Tai-yuan, 2023-12-23) reports: the little play, from 2013, grew into an hour-long terraced-field theatre, performed by villagers, returnee youth and local students, with bamboo cannons added for sound; 2023 had the first full script, directed by Guanshan Junior High's Chan Yi-chia; the dialogue mixes Amis, Hoklo, Hakka and Mandarin to revitalize mother tongues. PeoPo (Wang Zheng-kui, 2023-12-18) also reports the rice-fragrance theatre opening, with thanks to TNUA among others, in its 11th staging this year.", "pedagogicalInsight":"This is a high-quality example of three in one: the community’s own history, its own languages and its own bodies. Residents took the tribe’s Thunder Fire Battle onto their own rice fields and performed in several languages without subtitles, letting the mother tongue pass on naturally in the act of performing. For teachers of indigenous or local education, the most borrowable thing is this informal language revival of “letting children hear elders speak the mother tongue inside a play”, which feels stronger than a language class. Taipei National University of the Arts accompanied and helped build the theatre structure rather than leading, a good model of outside resources supporting local people."},
k62:{"why":"Verified: UDN (11th edition) and China Times (2018-02-22, 5th edition) are two independent sources confirming that the Hao-Cai-Tou Arts Festival is a long-running community art event in Luzhunan with resident and artist participation. TNUA's involvement appears only in UDN's programme as 'a TNUA performance', with China Times 2018 not mentioning TNUA, and the specific USR accompaniment seen mainly on school-sourced pages; so the local festival is taken as the subject and TNUA listed as a participant.","name": "Hao-Cai-Tou (Good Omen) Arts Festival (Luzhunan historic compound settlement)", "creator": "Miaoli County Traditional Settlement Culture Association (local host); participation by TNUA staff and students; 2018 chief director Li Xiao-ping, visual director Qu De-yi", "place": "Luzhunan historic compound settlement, Toufen City, Miaoli County (about 50 three-sided courtyard houses)", "year": "Hao-Cai-Tou Arts Festival (5th in 2018, 11th in 2024); TNUA USR sub-project 'Home in Luzhunan' 2018–2019", "summary":"The Luzhunan old house cluster is the last large cluster of three-sided courtyard houses (about 50) in Toufen, Miaoli, kept by chance because of the 1968 building restrictions for an industrial zone. For years the local Miaoli Traditional Settlement Culture Association has built on the “Good Fortune Arts Festival”, inviting artists to make work in the old houses; 2018 was the 5th edition and 2024 the 11th.\n\nThe festival combines folk customs such as the Lantern Festival turtle-asking, street parade and DIY radish lanterns so that art interweaves with ordinary life. In 2018 director-general Li Xiao-ping stressed “the villagers are the protagonists”, with six artist teams making 12 works that year.\n\nTaipei National University of the Arts staff and students took part in performances during the USR “Home in Luzhunan” sub-project (academic years 107–108); the United Daily News’s programme for the 11th edition lists “Taipei National University of the Arts performance”, while the China Times 2018 report does not mention the university.", "selfDesc": "China Times (2018-02-22), 'Li Xiao-ping gives Luzhunan an artistic face', reports the 5th 2018 festival: six artist teams made 12 works, the community preserves nearly 50 courtyard houses, and Li Xiao-ping joined for the first time as chief director, saying 'the villagers are the protagonists' (no mention of TNUA). UDN's 'Into its 11th year! … Hao-Cai-Tou festival opens on the 24th' reports the 11th edition's programme, explicitly listing a TNUA performance, radish-lantern digging, turtle-borrowing and parades, running to 2/29.", "pedagogicalInsight":"Using “Lantern Festival customs (turtle-asking, street parade, radish lanterns)” as the festival’s skeleton lets artists’ residency work grow on ordinary people’s festivals rather than running a separate art event; for teachers working with communities it shows that “connecting art to the existing rhythm of life” mobilises residents better than inventing a festival from nothing. Li Xiao-ping’s “the villagers are the protagonists” also marks the boundary of visiting artists in a community."},
k63:{"why":"Verified: ARTouch (review by Chen Si-yu) and Commercial Times (2024-01-30) are two independent sources confirming that 'A Wanhua Walk for Ordinary People' is a city art season under the Taipei Department of Urban Development's social-housing public-art framework, curator Lin Hong-john, built on years of fieldwork linking Wanhua's labour history and local memory, with works by Tu Wei-cheng, Homeless Taiwan, Lin Wang-ting and Tsai Ming-liang. Neither source mentions TNUA or USR (TNUA attribution is only school-sourced), and the curatorial-team name (Waley Art vs Hengguan Creative) and dates differ slightly, noted in the editor's note.","name": "A Wanhua Walk for Ordinary People", "creator": "Host: Taipei City Department of Urban Development (social-housing public art); curator Lin Hong-john (professor, TNUA Fine Arts Dept.); curatorial team Waley Art (director Peng Cai-xuan) / execution by Hengguan Creative; more than 20 artists including Tsai Ming-liang, Chang Chien-chi and Tu Wei-cheng", "place": "Wanhua District, Taipei (Qingnian Phase II, Juguang and Fuxing social housing; venues include Zhongshan Hall, Bopiliao and Waley Art)", "year": "2024 (1/9–2/25; opened 1/30 at Zhongshan Hall)", "summary":"“A Wanhua Stroll for Ordinary People” is a city art season held from 9 January to 25 February 2024 (opening at Zhongshan Hall on 30 January), organised by the Taipei City Urban Development Bureau under its social housing public art framework, curated by Lin Hung-chang and run by the local space Water Valley Art (the Commercial Times names the curatorial team as Hengguan Creative).\n\nAbout 20 artists, drawing on several years of fieldwork, linked shops, social welfare groups and residents of social housing (Qingnian Phase 2, Juguang, Fuxing), rewriting Wanhua’s labour history and local memory through video, textiles and workshops, and giving the position of storytelling back to “ordinary people”.\n\nExamples: Tu Wei-cheng’s object-imprinting workshop “Cabinet of Many Treasures” with residents, Mangcaoxin’s work from homeless people’s cardboard boxes “Walk and Bump into Monga”, Lin Wang-ting’s “Amber Project” recording Nanjichang relocated households, and Tsai Ming-liang’s piece on “Xining National Housing”. The tie to National Taipei University of the Arts’ USR appears only in the university’s own source; neither independent source mentions the university.", "selfDesc": "ARTouch (review by Chen Si-yu) records the host as the Taipei Department of Urban Development, curator Lin Hong-john, team Waley Art, running 2024.01.09–02.25, noting Tu Wei-cheng's 'Cabinet of Many Trades' resident-object relief-printing workshop, Homeless Taiwan's 'Come Bump Around Monga' homeless cardboard boxes, and Lin Wang-ting's 'Amber Project' point-cloud scans of Nanjichang demolition households. Commercial Times (2024-01-30) records the 1/30 opening at Zhongshan Hall, three social-housing sites (Qingnian Phase II / Juguang / Fuxing), Tsai Ming-liang's 'Xining Public Housing', about 20 artists, and curatorial team Hengguan Creative.", "pedagogicalInsight":"“Giving the position of storytelling back to ordinary people” is the most borrowable spirit here: artists built on several years of fieldwork so that the labour and lives of shops, welfare clients and social-housing residents became the content of works (residents bringing objects to imprint, homeless people’s cardboard boxes used to talk about space). For teachers working with communities or issues, it shows public art need not be one big piece but long-term staying that lets locals’ everyday lives be seen. Note it is a city art season under the Urban Development Bureau’s social housing public art framework, with larger scale and resources."},
k64:{"why":"Unverified: the two sources that directly name the TNUA special exhibition 'Memory on the Margins' and curator Wang Bao-xuan both belong to the National Human Rights Museum (press release + online exhibition — same institution, not mutually independent); Storm Media / The Journalist (2020-07-18) reports only the 2020 Green Island Human Rights Art Festival as a whole (21 artist groups) and does not name the TNUA special exhibition, so that part currently rests on a single institution's sources. The museum's release confirms the collaboration with TNUA, the 'memory politics and artistic intervention' course, and five student works on 'memory's periphery'; the exact supervising teachers' names do not appear in readable sources.","name": "Memory on the Margins — TNUA Special Exhibition at the Green Island Human Rights Art Festival", "creator": "Teachers and students from art departments at Taipei National University of the Arts (TNUA); TNUA special-exhibition curator Wang Bao-xuan; the National Human Rights Museum (2020 Green Island Human Rights Art Festival, overall curator Luo Xiu-zhi)", "place": "White Terror Green Island Memorial Park, National Human Rights Museum, Green Island Township, Taitung County", "year": "2020 (exhibition 5/15–9/15); TNUA USR Hub lists 2020–2021", "summary":"The National Taipei University of the Arts worked with the National Human Rights Museum to embed an education-and-creation project in the 2020 Green Island Human Rights Art Festival (15 May to 15 September, at the White Terror Green Island Memorial Park).\n\nStudents of arts departments first learned the context of the White Terror and transitional justice through the course “Politics of Memory and Artistic Intervention”, then took up residence in the park and made site-specific work on “Memory Periphery / Edge”, producing 5 student works; the university’s special exhibition was curated by Wang Pao-hsuan and the festival’s overall curator was Luo Hsiu-chih.\n\nThe creators were university students, not local residents or victims’ communities; the press release says “students” made the works and does not mention teachers co-creating, and the exact name of the supervising teacher does not appear in readable sources.", "selfDesc": "The National Human Rights Museum's press release (2020-05-15), 'The 2020 Green Island Human Rights Art Festival opens — speaking from the margins through contemporary art', records: the festival ran 5/15–9/15 at the White Terror Green Island Memorial Park; this year it worked for the first time with domestic art departments including TNUA, combining the 'memory politics and artistic intervention' course, with students producing five works themed on memory's periphery (the release mentions student creation, not teacher co-creation); the festival's overall curator was Luo Xiu-zhi. The exhibition title 'Memory on the Margins' and curator Wang Bao-xuan appear in the museum's online exhibition. Storm Media / The Journalist (Li Jia-ying, 2020-07-18) discusses the festival as a whole (21 artist groups) without naming the TNUA special exhibition.", "pedagogicalInsight":"This is an arts-education example of “first take a course to understand the context, then make work on site”: students took “Politics of Memory and Artistic Intervention” to learn the White Terror and transitional justice, then took up residence at Green Island and turned history into works. For teachers of issues or history, it shows a full teaching arc of “knowledge building → on-site response → making”. Note the creators were university students, not local residents or victims’ communities, so it is a teaching case of “how students understand and translate others’ traumatic history”, not community co-creation."},
k65:{"why":"Verified: the core facts — that Poor People's Taipei has been run by the Poverty Solidarity alliance (Pinxuemeng) since 2017, with people experiencing poverty as creators, questioning the city's inclusiveness — are cross-confirmed by several independent sources including CNA (2024-04-26), the Museum Island newsletter (Ministry of Culture) and Right Plus (2024-06-07). Still to clarify: the year and run of the 8th edition 'Only the Shadow I'm Still Getting to Know' (the Bopiliao official page is robots-blocked and was not read); and the role of people with lived experience in curatorial decisions, which most reports do not detail. Right Plus mis-prints the run dates, noted in the editor's note, with CNA taken as authoritative.","name": "Poor People's Taipei (project)", "creator": "Initiated by the Poverty Solidarity alliance (Pinxuemeng); co-planned with Do You a Flavor (Chu Kang-yung) and others; over the years, partner NGOs and people with experience of poverty (homeless people, migrant workers, those in precarious situations) as the creators", "place": "Around Wanhua, Taipei (venues over the years include Bopiliao Historic Block, the Museum of Contemporary Art Taipei, Yima IMMA / Nanjichang, and the Little Red House Menstruation Museum)", "year": "From 2017 (in 2024, the spring preview 'Transfer Station' at MOCA and the autumn 7th edition 'Daydreaming' at Bopiliao)", "summary":"“Poor People’s Taipei” is an annual project run since 2017 by the Anti-Poverty Alliance (Learning from the Poor), using exhibitions and forums to let people with experience of poverty — homeless people, migrant workers, mothers in vulnerable situations, people with mental illness and children in adversity — speak as “creators” about the Taipei they see, asking how inclusive the city is.\n\nOver the years it has co-created with a dozen or more NGOs and artists (pottery, scent blending, painting, clay, installation, video and more), and exhibitions deliberately do not label creators’ identity or status so the works themselves stand out. In spring 2024 a pilot show “Transfer Station” (27 April–16 June, 13 artist groups) was held at the Museum of Contemporary Art Taipei, and in autumn the seventh edition “Daydream Wandering” (15 October–14 November) at Bopiliao, with satellite shows at IMMA and Little Red House.\n\nRight Plus records this as a pilot show, the project entering its 8th year and shifting to a biennial format, with 19 partner NGOs co-creating with artists. Most reports do not detail experienced people’s role in curatorial decisions, so co-creation is mostly at the level of works; the year and dates of the eighth edition could not be verified.", "selfDesc": "CNA (Wang Bao-er, 2024-04-26) reports 'Transfer Station' at MOCA Taipei (4/27–6/16, 13 artist groups): Pinxuemeng is made up of people with experience of poverty, NGOs, artists and sociologists, co-planning with Do You a Flavor's Chu Kang-yung; Chang Yu-yi's 'Friendly Chair Project' uses armrest-crowded benches to show homeless people's situation, and the show deliberately does not label the creators. Right Plus (2024-06-07) records this as a preview, the project entering its 8th year and shifting to a biennial format, with 19 partner NGOs and artists co-creating (Community Empowerment Association pottery and scent, City Wanderer painting and clay, Lohas migration maps, Do You a Flavor's long installation 'What Wind Blew You Here'). The Museum Island newsletter (Ministry of Culture) records the autumn 7th edition 'Daydreaming' at Bopiliao (10/15–11/14), with satellite shows at Yima IMMA and the Little Red House, understanding poverty as material, spiritual and relational lack and exclusion.", "pedagogicalInsight":"The most borrowable thing is that it flips people with experience of poverty from “objects displayed and labelled” into “creators”, and deliberately does not label creators’ identity or status, so the work is seen first rather than first being tagged “homeless” or “single mother”. For teachers working with disadvantaged or sensitive issues, this design of “remove the label first and let people speak as creators” is key. The co-creation methods are also varied and borrowable: pottery and scent blending, reviewing life with painting and clay, hand-drawn migration maps, and a long installation collecting voices. Note most reports do not detail experienced people’s role in curatorial decisions, so co-creation is mostly at the level of works."},
k51:{"name": "Shigang Mama Theatre", "creator": "Shigang Mama Theatre (members are mostly Hakka and working women of Shigang, non-professional; leader Yang Chen-chen); mentored into being by Assignment Theatre (artistic director Chung Chiao); director Li Hsiu-hsun", "place": "Shigang District, Taichung (a Hakka village)", "year": "Founded 2000 (out of People's Theatre workshops run by Assignment Theatre in the Shigang/Dongshi quake zone after the 1999 921 earthquake); signature work 'Pear Blossom Heart-Land' was the 2021 20th-anniversary production", "summary":"The Shigang Mothers’ Theatre Troupe grew out of the 1999 921 earthquake: Chai-Tsih Theatre (Chung Chiao, Li Hsiu-hsun) ran people’s theatre workshops with affected women in the quake areas of Shigang and Dongshi; the mothers in the drama class did not want to disband and from 2000, with Chai-Tsih’s supportive guidance, formed a self-governed community troupe. Most members are Hakka women who came to Shigang through marriage, and for years they have made work with their own bodies from their farm and daily labour (picking pears, washing clothes, stir-frying).\n\nThe 2021 20th-anniversary work “Pear Blossom Heart” was performed by the members themselves, with a script co-written by all members and then edited by a professional director; it opened with a documentary film on the troupe’s history, then began with the labour of picking pears and washing clothes and invited the audience to plant pears in Shigang together.\n\nThe work deals with Hakka women’s position under patriarchal clan rules, rebuilding the family and self-identity. In 2023 “Meeting of a Millennium”, produced by Chai-Tsih Theatre, had the troupe on stage with local residents.", "selfDesc": "The Performing Arts Reviews site (Hsu Jen-hao, 2021-03-17) notes that after the 1999 921 quake Assignment Theatre's Chung Chiao and Li Hsiu-hsun did psychological rebuilding in the Shigang Hakka village, and a year later the drama-class mothers, unwilling to disband, formed the troupe, with Yang Chen-chen as leader and Li Hsiu-hsun as director; it observes members mostly came through marriage and face Hakka patriarchal constraints, using labour such as pear-picking, washing, cooking and killing chickens as material, opening with a documentary and inviting the audience to plant pears. The NCAF grant archive records 'Pear Blossom Heart-Land' (Shigang Mama Theatre, submitted by Assignment Theatre) as a 2020 grant, performed 12-13 Mar 2021 at Treasure Hill, 2 shows and 144 attendances, directed by Li Hsiu-hsun with Chung Chiao shaping the script, co-written by all members, touring under the title 'Pear Blossom' since 2005. Assignment Theatre's site states it was founded 1996, ran People's Theatre workshops with quake-struck women in Dongshi and Shigang in 1999, and mentored the troupe from 2000. China Times (2023-02-22) reports 'Encounter of a Thousand Years' as Assignment Theatre's new Hakka work, with the resident-founded Shigang Mama Theatre on stage, an environmental-theatre version in Shigang in Nov 2022 and a 2023 run at the National Taichung Theater with the Hakka Affairs Council.", "pedagogicalInsight":"This is a rare amateur community theatre in Taiwan that has lasted more than twenty years, a treasure for facilitators. The core to borrow is “starting from participants’ own bodies and labour”: everyday work such as picking pears, washing clothes and stir-frying is turned into performance material and ritual, rather than handing out a script to act. The script is co-written by all members and edited by a professional director, showing how to balance amateur autonomy and professional guidance. The opening documentary lets participants first see “who we are and how far we have come”; the ending invites the audience to plant pears in Shigang, turning them from onlookers into participants. A reminder for educators is the time scale: its depth comes from twenty years of accompaniment, not a one-off workshop. With Chai-Tsih Theatre and Li Hsiu-hsun’s professional guidance behind it, how to keep professionals from drowning out amateur voices is a question to keep asking.", "why": "Verified: the origin (Assignment Theatre mentoring in Shigang after the 1999 921 quake, founded 2000) is consistent across The News Lens, the Performing Arts Reviews site and Assignment Theatre's own account; that the troupe is made of Shigang Hakka women, works from labour, and has long resident participation is corroborated by the Performing Arts Reviews critique, China Times and the NCAF grant archive."},
k50:{"name": "Sixteen Coming-of-Age Youth Arts Festival (series, incl. the Youth Playmaking Project)", "creator": "Tainan City Cultural Affairs Bureau (host); Influence New Theatre (partner on the Youth Playmaking Project; artistic director Lu Yi-hsin, per 2017 reporting); supported by the Ministry of Culture and the TSMC Education and Culture Foundation", "place": "Tainan City (2026 venues: Tainan Cultural Center, Tsang-kang Cultural Center, Wu Garden Hall and the new Tainan Public Library main branch)", "year": "From about 2015 (inferred from edition numbers; sources do not state a start year); 2017 was the Playmaking Project's 3rd year, 2025 the 11th edition, 2026 the 12th year", "summary":"Tainan’s old city has the coming-of-age tradition of “doing sixteen”, which the city’s Cultural Affairs Bureau has turned into a youth arts festival each summer. It has run since about 2015 (the sources do not state the start year; it is calculated from edition numbers), and its core “Youth Stage Play Project” recruits 16- to 18-year-old vocational and senior high students who, after six months and three stages of training, collectively create and publicly perform a ticketed original play.\n\nIn 2017 (then named the “Sixteen Little Theatre Festival”) the project reached its third year, with nearly 50 students from 17 high schools creating “Kaleidoscope”; the 11th edition in 2025 (5 July–31 August, theme “Real Me”) recruited 48 participants and staged the 11th play, “Authentic”, plus a street culture month, a visual exhibition, weekend talks and an outdoor performance market.\n\nThe 12th year in 2026 (18 July–23 August, theme “Touch: the Frequency of Youth”) staged the 12th play, “Touch · Feel Seen”, recruiting youths from 16 schools across 19 districts of Tainan, Yunlin and Kaohsiung, and ran youth theatre observers and the community senior programme “Interactive GO”.", "selfDesc": "China Times (2017-03-23) reported the Cultural Affairs Bureau's collaboration with Influence New Theatre, the 'Sixteen Little Theatre Festival – Youth Playmaking Project', in its 3rd year: from March, over half a year of three-stage training, about 50 students from 17 high schools created 'Kaleidoscope' from the Tainan coming-of-age rite, performed in August at the Tainan Cultural Center; the project combined art with life education, was led by Influence New Theatre's artistic director Lu Yi-hsin and supported by the TSMC foundation. UDN (2025) reported the 11th edition ('Real Me', 5 Jul–31 Aug): 48 recruits, the 11th play 'Authentic' (15–17 Aug, 4 shows), a cumulative 536 participants and over 40,000 attendances, limited gifts for those born Sep 2008–Aug 2009 who complete the rite, plus a July street-culture month, an August visual show, eight weekend talks and a 16–17 Aug outdoor market. UDN (2026) reported the 12th year ('Touch', 18 Jul–23 Aug), recruiting youths from 16 schools across 19 districts of Tainan, Yunlin and Kaohsiung to create the 12th play 'Feel Seen' (22–23 Aug, Tsang-kang Theatre, ticketed via OPENTIX), with youth theatre observers and a senior-community Interactive GO.", "pedagogicalInsight":"This is a good case of turning a local coming-of-age tradition into a platform for young people’s own creation. The most borrowable part is the full arc: six months and three stages of training, youths collectively create a play from their own life experience, then really perform it publicly with tickets. It treats young people as real creators rather than as doing an exercise to hand in; “really performing for people and selling tickets” is itself strong motivation. Using “doing sixteen”, a local rite, as the theme also makes abstract “identity / growing up” concrete and tied to their own city; facilitators can start from a real ritual or milestone in students’ lives instead of asking vaguely “who are you?”. Note it is a large city-run festival with ticketing, a market and souvenirs; what belongs to arts education is the training and collective creation of the play project, while the festival’s outer layer is more city branding — students can look at the two separately.", "why": "Verified: the festival's existence and year-on-year continuity are corroborated across different years and outlets (China Times 2017, UDN 2026). Each year's detail is largely press-release style and partly single-source (and the two 2025 pieces appear to be the same release, not independent), as noted."},
k49:{"name": "Treasure Hill 'art-and-living coexistence' settlement (series)", "creator": "Taipei City Cultural Affairs Bureau and the Taipei Culture Foundation's Artist Village division (operation); resident artists and original residents; ceramicist Chou Ling-chih (in residence from 2008, co-designed the shared garden)", "place": "Zhongzheng District, Taipei — the Treasure Hill settlement", "year": "Settlement mainly 1960s–70s informal buildings (official site); registered a historic settlement in 2004, art village taken over by the foundation on 2 Oct 2010, continuing today", "summary":"Treasure Hill is an informal settlement built by retired veterans on a hillside in Gongguan, Taipei; it was zoned as park land in 1980 and, after residents’ petitions and pushes by academics and heritage groups, was registered as a historic settlement in 2004. The Taipei City Department of Cultural Affairs planned it as a “co-living of art and residence” settlement where households and an artist village coexist, run by the Taipei Cultural Foundation, which formally took over the Treasure Hill International Artist Village on 2 October 2010.\n\nAfter artists moved in, they held shared “one dish each” meals with residents, the annual March Lantern Festival (light installations), jointly opened a shared vegetable garden and helped original residents run the “Baocun Grocery”. The official site admits that the “residence” in “co-living” first meant community residents but has since widened to units and resident artists in the settlement.\n\nBut preservation came with the dispute over residents’ 2006 relocation, the number of residents kept falling and 19 original households remain; scholars also criticise that interaction between artists and residents is “still too little” and analyse the preservation as a kind of “museumification”. The settlement was kept, but not necessarily its people.", "selfDesc": "The official site says 'art-and-living coexistence' revitalises Treasure Hill by building art and living together, and admits that 'living' first meant the community's residents but has since widened to all the units and occupants in the settlement; the settlement is formed of 1960s–70s informal buildings, was registered as a historic settlement in 2004, repairs by the Bureau began in late 2006, and over twenty-odd years the Taipei Artist Village and Treasure Hill together have hosted more than 500 creators from over 40 countries. Fu Jen student outlet Vita (on PeoPo, 2023-11-03) records resident participation: a roughly bimonthly 'one dish per household' meal; after the March light festival residents also create in the garden, and a big bamboo cage left from an earlier festival was taken by residents to raise chickens and geese; the 'Treasure Village' shop is run by Auntie Qiuhong with the village's help, serving a set meal on Tuesdays and Thursdays; Chou Ling-chih moved in in 2008 and co-designed the shared garden; early on an elderly veteran demanded artists show a 'residence permit' and waved a cane to drive them off, tourists wandered into homes, and the village used surname signs and stanchions to protect privacy; 19 original households remain. PTS 'Our Island' (a 2007 piece, not re-read this time) is cited by the user as reporting that in 2006 some sixty-odd households moved out but only 16 actually entered transitional housing, with some residents calling it eviction in disguise. Eyes on Place (Liu Ke-chiang, 2021-01-06) notes residents keep declining, that under current rules the housing area could be empty within about a decade, that artist–resident interaction is 'still too little', and that a film-and-video experimental school occupies housing originally reserved for residents but vacated as they left. King's College London scholar Igor Rogelja analyses the preservation as a form of 'museumification': after the city offered three compensation/relocation options in 2006, it cleared the village on 22 Dec 2006 and riot police cleared the rest on 30 Jan 2007; renovated houses were let on 12-year tenancies, and households fell from over 70 before eviction to 21 in 2014 and 19 in 2018, the author arguing this turns residents and artists into a watched 'living diorama'.", "pedagogicalInsight":"This is the best case for discussing what happens when art moves into a place where people still live and which carries historical scars; both sides must be seen. What can be borrowed is making shared life itself the method: one-dish-each meals, a shared garden and a grocery are not an event but a way for artists and residents to build relations slowly in daily life; after the Lantern Festival residents made things in the garden and used the big bamboo cages to raise chickens and geese, an example of residents taking art over into life. The more important material is its cracks: the site widened “residence” from original residents to all units, while scholars point to shrinking numbers and “still too little” interaction. Ask students: when we say “co-living”, whose “residence” is counted? Does preserving the houses mean keeping the people? Scholar Rogelja’s critique can serve as a sharper question: when preserved residents become “living dioramas” to be watched, who is preservation for?", "why": "Verified: the core facts (an informal settlement saved as a historic settlement, the coexistence model, the three-option 2006 relocation and clearance, a fall from over 70 households to about 19, the museumification dispute) are corroborated by the official site, Rogelja's academic paper citing Taipei City documents, the 2006 Liberty Times report, the Eyes on Place scholar piece and PTS. The specific resident co-creation activities still rest on a single source, as noted."},
k48:{"name": "Daxi Daxi (series)", "creator": "Taoyuan City Cultural Affairs Bureau and the Daxi Wood Art Ecomuseum (hosts); designer Liao Xiao-zi (key visuals for four editions); BIAS Architects (execution, book)", "place": "Daxi District, Taoyuan — Puji Temple and the old town", "year": "From 2018 (series; detailed content known for 2022, 2–22 Jul, and 2026, opening 18 Jul)", "summary":"The procession for the birthday of Lord Guan at Daxi Puji Temple (24th day of the sixth lunar month, called Daxi people’s “second New Year”) was originally a faith celebration begun by residents themselves. From 2018 the Taoyuan Daxi Wood Art Ecomuseum used museum methods to turn it into the festival brand “Daxi Daxi”, with the core idea “experience × participation × revival” and designer Liao Xiao-zi making the main visual for four editions.\n\nThe 2022 edition (2–22 July) offered the pop-up picture book “Daxi Daxi” with lesson plans and the interactive deity-generals exhibition “Wu De Dian”, and invited people to wear paper generals’ hats and join the “Parade with the Gods”; the 2026 edition (opening 18 July) centred on “festival music”, with 32 shetou groups and about 40 events, including a concert in which 9 shetou worked with pop music teams.\n\nThe festival involves the temple, volunteers, Daxi’s trades and shetou from many places; a shetou is a procession group formed by residents on the basis of shared trade or locality. The platform has read fuller material only for the 2022 and 2026 editions; other editions are not checked in detail.", "selfDesc": "The museum's official page frames Daxi Daxi as preserving and re-presenting a 'century-old intangible cultural asset', using Daxi itself as the stage and drawing residents, shops and audiences into experiential learning; it explains the participants include temple staff, volunteers, Daxi's trades and the shetou — self-organised procession troupes formed by shared trade or locality (e.g. the ox-plough, ink-line and plasterer-boy troupes). VERSE's book panel (2023) notes Daxi Daxi has run since 2018, that BIAS Architects and the museum produced the book, and that Liao Xiao-zi designed the key visuals for four editions, calling it 'a city festival across contemporary design and folk belief'. Marie Claire (2022) records the pop-up book (Liao as art director), the 'Wu De Dian' show (with a 'righteous-steps' learning device), the 'procession with the gods' handing out paper hats, Vitali co-branded sodas, and 'Daxi Daxi' merchandise and amulets. Storm (2026) notes the bureau's 'experience, participation, revival' core and that residents, shetou and shops co-created the curation.", "pedagogicalInsight":"This case shows how an existing local tradition can be turned into a scene that outsiders and young people can enter. The point is not what the museum invented but how design and experience devices turn onlookers into participants: paper generals’ hats walk people into the procession, the “Righteous Step” learning device lets the body understand the deity-generals, and the picture book and lesson plans help Daxi people tell their own festival as a story. What can be borrowed is to first find what the community already does, then design an “entrance for participation”; a shetou is an existing group formed by trade or locality, not an individual. Another tension to ask students about is commercialisation: do the Guan Gong co-branded soda and the “righteous bag” bring more people into the festival, or turn faith into consumption? There is no standard answer, which suits a class debate.", "why": "Verified: the official page and three different outlets (VERSE 2023, Marie Claire 2022, Storm 2026) corroborate the hosts, the 'experience/participation/revival' idea, Liao Xiao-zi's four editions of key visuals and shetou participation. A few details (the 2018 start, 32 shetou / ~40 events) still rest on single sources, as noted."},
k47:{"name": "2022 Mattauw Land Art Festival: A Thousand Names of the Zengwen River", "creator": "Chief curator Gong Zhuo-jun (龔卓軍); co-curator Luo Jian-yu (羅健毓); advisers Qiu Ru-hua (丘如華) and Zeng Xu-zheng (曾旭正); hosted by the Tainan City Government Cultural Affairs Bureau (per Storm Media; the official site shows the host only as logos); nine sub-projects", "place": "Zongye Art Center in Mattau, Tainan, plus the Dubar and Dalongtian zones (per the official site) and the Provincial Road 171 area, with partners from the upper to lower Zengwen River; sources name the zones differently", "year": "2022 (15 Oct – 29 Jan 2023)", "summary":"The 2022 Mattauw Land Art Festival, “The Thousand Names of the Zengwen River”, is an “advocacy-type” land art festival organised by the Tainan City Government Cultural Affairs Bureau with the whole Zengwen River basin as its protagonist, running from 15 October 2022 to 29 January 2023; its venues include Magoh Sogo Art Centre, Dubao and Dalongtian (spelled differently by sources), and it is the edition before the 2026 one (K32). The official site calls it the “first nationwide” land art festival with a whole stream as its subject, with the long-term goal of “river legal personhood” and a “river-basin community” as the core of action.\n\nThe site mentions “three years of long-term field surveys”; the programme has nine units — small projects, water, bamboo, stealth photography, planting, soil, farming, sound and original projects — linking local partners from the Tsou villages upstream, the meandering rural areas midstream and the irrigation canals and fish ponds downstream.\n\nIt also ran civic participation activities such as the “Parliament of All Things” and the “Little News” news camp, plus three joint presentations. The Reporter’s “stealth photography project” feature records photographers and writers staying long-term along the basin, photographing modern Tsou hunters, mango growers, “water keepers” and youths from multicultural families.", "selfDesc": "The official site's 'About' page calls it the 'nation's first' land art festival with a whole river as its subject, with the long-term goal of 'legal personhood for rivers' and a 'watershed community' as the core of its action and awareness; it calls on people to 'exchange bodies with bodies' and enter the living worlds of the river. It mentions 'three years of long-term fieldwork' and 'three years of research', lists nine sub-projects and three joint presentations, and says it links partners from Tsou villages upstream, meandering farm villages midstream and canal-and-fishpond areas downstream, promoting public participation and deliberation through the 'Parliament of All Things' and the 'Little News' news camp. Storm Media (2022) calls it 'Taiwan's first art festival focused on river rights', hosted by the Tainan Cultural Affairs Bureau, and says Chiayi County and the Water Resources Agency were invited to sign a watershed governance agreement (the article does not say whether it was signed). The Reporter's Sneak Photography feature records photographers and writers staying long-term along the basin, photographing a Tsou modern hunter, mango growers, 'water keepers' and young people from multicultural families.", "pedagogicalInsight":"“A river with a thousand names” is a very usable classroom question: what is the same stream called, and how is it used, by hunters, fruit growers, water keepers and children? Take students along a canal, drain or small river to collect what people call it and their water-use stories, so the issue grows from residents’ own words. The case also models “stay first, curate later”. Note: it is an advocacy-type festival whose goal of “river legal personhood” was set from the start, so ask one more layer in class: where did this stance come from, and can students disagree? The site gives only the names of the “Parliament of All Things” and “Little News” camp, not how they were led, so check the organiser’s own method before borrowing.", "why": "The official site (organiser's own account), Storm Media and the Reporter feature agree on the host, chief curator, run dates, zones and theme, and the Commercial Times (2023) also gives the host and chief curator; but the Reporter feature is output of one of the festival's own sub-projects and does not count as independent, and the edition numbering and level of resident participation remain unconfirmed, as noted (November 2026)."},
k46:{"name": "Matsu International Art Island (ten-year ‘turning the soil’ art plan)", "creator": "Lienchiang County Government (host); General Association of Chinese Culture (support); ‘Dapu plus+’ on Dongju (co-execution). First edition (2022) led by Wu Han-chung; third edition (2025) theme curator Nakaw Putun, with zone curators including Hung Yu-cheng, Huang Chen-yen and Kuo Mei-chun.", "place": "The five islands of Lienchiang (Nangan, Beigan, Dongyin, Dongju, Xiju); sites include wartime strongpoints, bunkers, bomb shelters, harbours and village houses", "year": "From 2022 (three editions held: 2022, 2023, 2025; planned by the county as a ten-year project)", "summary":"The Matsu International Art Island (Ten-Year Art Soil-Turning Project) is a ten-year large-scale art programme by the Lienchiang County Government; three editions have been held since 2022 (2022, 2023, 2025), across the county’s four townships and five islands (Nangan, Beigan, Dongyin, Dongju, Xiju), at front-line strongpoints, bunkers, air-raid shelters, harbour inlets and settlement houses. The Reporter notes that after wartime governance ended in 1992 the county proposed the art island as the first step of cultural governance, aiming to stabilise tourist flows, deepen cultural value and train local talent.\n\nThe programme invites artists from Taiwan and abroad to place works in Matsu’s front-line sites, settlements and maritime life, and to translate military space with local materials such as Matsu glass liquor bottles and marine debris. The first edition (2022, “Island Brewing”) had 41 teams and 39 works, with 50 Taiwanese volunteers coming to the islands for the “Island Return Bar” sub-project; the third edition (2025, “Clap Chiu — Your Sea, My Land”) had over 50 works under three themes, “Front-line Matsu”, “Islands’ Matsu” and “Ocean’s Matsu”, plus “Ten People, Ten Seas”, made by local teachers and students with residents of Ogijima in Japan.\n\nIssues covered include regenerating strongpoints after wartime governance ended, everyday memory, revival of the Eastern Min language, population loss and the marine environment. The Reporter also notes that residents mostly see the art island as a way of bringing tourists and income and feel little about the art itself, a short publicity period made works less visible, and one student said the art island has “not yet been put into locals’ calendars”.", "selfDesc": "The Reporter (2024-08-03) notes the county, after military rule was lifted in 1992, drew on Matsu’s Eastern Min culture, wartime culture, baimei beliefs and ecology to launch the art island as a first step in cultural governance, aiming to stabilise tourism and train local talent; it also records that residents largely see the island as a channel for tourists and income rather than for art, that the promotion window is too short, and that one student said the art island ‘has not yet entered local people’s calendar’. Rti (2022) records the first edition led by Wu Han-chung, 41 teams, 39 works, 8 curatorial projects and 50 volunteers (part of the ‘Island Return’ sub-project). Artemperor records the 2025 third edition hosted by the county and the General Association of Chinese Culture, with multiple curators and over 50 works.", "pedagogicalInsight":"This is the case most worth discussing on “how a large arts festival relates to the local place”: look not only at the works but at the distance between the festival and residents. What can be borrowed is treating particular sites and local materials as starting points, and the cross-island co-making of “Ten People, Ten Seas”; the residents’ alienation recorded by The Reporter is equally teaching material — students can ask “who is the festival actually for?”, the counter-example to IBAE’s “start from context, not a preset theme”.", "why": "Confirmed after your review (November 2026). Three independent outlets — The Reporter, Rti and Artemperor — agree on the host, curators, years and scale across three editions. Resident co-creation is moderately strong (there are concrete partners), but The Reporter also records residents’ distance, so both are kept."},
k41:{"name": "Chao Fangyuan: Seeing the Tidal Flats Art Festival (Ren Theatre's Fangyuan community theatre)", "creator": "Fangyuan Township Office (host); Ren Theatre (operator, director Tsai Min-ni); Ren-ai community theatre (co-host)", "place": "Fangyuan, Changhua (fishers’ plaza, tidal flats, mangrove sea-sky walk, Putian Temple)", "year": "2026 edition (Jul 26–Aug 1); the community theatre was formed in 2023", "summary":"Chaofangyuan | Seeing the Tidal Flats Art Festival is a community theatre and arts festival by Ren Theatre in Fangyuan Township, Changhua County (Fishermen’s Plaza, the intertidal zone, the mangrove sea-and-sky boardwalk and Pu Tian Temple); the 2026 edition ran from 26 July to 1 August, and the community theatre was founded in 2023. Ren Theatre’s director Tsai Min-ni proposed the “Seeing the Tidal Flats” incubation project in 2022 and in 2023 founded the community theatre with the Fangyuan Ren’ai Community Development Association.\n\nThey began with field walks, then used collective improvisation with a dozen or so local amateurs in Fangyuan (including a 90-year-old elder and junior-high students) to co-create the script, turning fishing-village life, fishing songs and oral memories into a play performed on the mud flats and intertidal zone, completing “Fangyuan, Our Hometown”. Tsai says, “collective improvisation is my working method”. A free drama class once had too few sign-ups, and the association’s chairman widened recruitment.\n\nIt has grown year by year: in June 2024 “Podou Arts Festival in Fangyuan”, in October joining the Changhua Theatre Arts Festival and moving to the Yuanlin Performing Arts Hall, and in 2025 (the third year) expanding into an arts festival answered by local Fangyuan groups and linked to government resources. The 2026 edition presented four series (Tidal Settlement, Tidal Theatre, Tidal Market, Tidal Images), themed on fishing-village cultural memory and coexistence with the tidal-flat environment, with a 40-table “tide banquet” of over 400 people and a Fangyuan Junior High lion-dance drum troupe opening.", "selfDesc": "A 2025 feature by The Reporter says Tsai met documentary director Ke Chin-yuan in 2021, proposed the plan in 2022, and in 2023 formed the community theatre, completing Fangyuan, Our Home; she calls collective improvisation her working method, and the performers are a dozen locals of widely varying ages. A free drama class was expanded when sign-ups fell short. United Daily News (2026) reports the 2026 edition’s four series, a ‘tide banquet’ of 40 tables and 400+ guests, and that Ren Theatre has taken part for four years running.", "pedagogicalInsight":"This is one of the fullest cases of “amateurs making theatre”: the facilitator does not teach acting but uses collective improvisation so residents turn their fishing-village life, fishing songs and oral memories into a play. Note: the free drama class once had too few sign-ups and recruitment was widened — a reminder that recruitment is itself part of a participatory project.", "why": "Confirmed as verified at your request (November 2026) on the strength of The Reporter’s independent feature plus United Daily News: the former confirms how the community theatre formed and who performed, the latter the scale of this edition."},
k42:{"name": "2026 South-Link Art Festival: Flow of Mountain Trails", "creator": "Taitung County Government (host); Dagedan Sea Travel (planning); curator Osan Karo; artists LUA RIVERA, basakanlan (Hsieh Cheng-yi), Wang Kuan-tung, Chen Sheng-chih", "place": "Along the South-Link route in Daren, Jinfeng and Taimali, Taitung (Huayuan Elementary, Jialan, Jinlun Station, Laliba co-creation base and other communities)", "year": "2026 (City.gvm gives Jul 1–Oct 31)", "summary":"The 2026 South Link Art Festival “Flow of the Mountain Path” takes place along Daren, Jinfeng and Taimali in Taitung County (villages and sites including Huayuan Elementary School, Jialan, Jinlun Station and the Lalipa co-creation base); a City Study summary gives the exhibition period as 1 July to 31 October. The festival takes the river basin as its concept.\n\nFour groups of artists were invited to survey the South Link landscape through residencies and live with local communities, each in residence for at least 12 days, bringing in Indigenous, Hoklo, Hakka and foreign perspectives through field collection. Works are spread across a primary school, a railway station and a co-creation base: LUA RIVERA (Mexico)’s “Elder” at Huayuan Elementary, basakanlan Hsieh Cheng-yi’s “Resilience of Life”, Wang Kuan-tung’s “Circle of Symbiosis” at Jinlun Station and Chen Sheng-chih’s “Hope · Wings” at Lalipa; Wang did Paiwan field research during his residency and put its elements into his work.\n\nThe festival also has walking tours, workshops and satellite sites such as lodgings and dining tables, and launched a limited “Wave Picnic Box” with local businesses.", "selfDesc": "City.gvm (Global Views) reports each artist spent at least 12 days in residence, gathering fieldwork and living with residents across Indigenous, Hoklo, Hakka and foreign perspectives; Wang Kuan-tung did Paiwan fieldwork for his work. The festival also offered a limited ‘wave picnic box’ with local businesses.", "pedagogicalInsight":"Artists worked through residencies of at least 12 days, field collection and living with residents, modelling a residency ethic of “live there first, then make”. Note: residents were mostly people being researched and lived alongside, and the real degree of co-creation is not described; with a clear tourism-promotion element, students can also discuss the line between an arts festival and tourism.", "why": "Verified: City.gvm/Global Views (2026-08-22) and the Taitung County Government official page independently corroborate the core facts — the watershed concept, the four artists (LUA RIVERA, basakanlan/Hsieh Cheng-yi, Wang Kuan-tung, Chen Sheng-chih) and their four works and sites (THE ELDER at Huayuan Elementary, THE RESILIENCE OF LIFE at Jialan, COEXISTENCE CIRCLE at Jinlun Station, HOPE TAKES WING at Laliba), the run 1 Jul–31 Oct 2026, and the organiser (Taitung County Government) — so it is upgraded to verified. The planning team 'Dagedan Hailu' and curator Osan Karo still appear only in the original (unreadable) Hub News report, and residents actual role in creation is not detailed in any source. (daily source expansion, 2026-11-16)"},
k43:{"name": "CTBC New Stage Arts Festival Charity Show: Puppet Theatre by Rural Schools", "creator": "CTBC Cultural Foundation; Puppet & Its Double Theater (artistic director Cheng Chia-yin); teachers and students in Yilan and Gongliao (New Taipei)", "place": "Yilan (Neicheng, Lize, Dongxing schools) and Gongliao, New Taipei (Gongliao Experimental Junior High); charity show at CTBC Financial Park, Taipei", "year": "2026 (performed Sep 12)", "summary":"The CTBC New Stage Arts Festival charity show, “Dreamers’ Wish Fulfilment Project”, was an outdoor performance on 12 September 2026 at the CTBC Financial Park in Taipei; U-Theatre has long gone to remote areas to train seed teachers and guide students in making puppet theatre, and this year’s winning schools included Lize Elementary, Dongxing Elementary and Neicheng Junior High and Elementary in Yilan and Gongliao Experimental Junior High in New Taipei.\n\nStudents of Neicheng Junior High and Elementary in Yilan took the village’s big tree god, the Earth God and water resources as their theme and devised “The Wrongly Granted Wish” — a story about over-wishing, animals left without water and a little tree god finally growing; Gongliao Experimental Junior High took the Tanlan Historic Trail as its theme.\n\nThe charity show opened with a large puppet production co-made by U-Theatre and Japanese puppeteer Nori SAWA, combined with stories devised by teachers and students from remote areas.", "selfDesc": "United Daily News (2026-09-14, Ho Ting-chao) says the show opened with a large puppet work co-produced by Puppet & Its Double and Japanese puppeteer Nori SAWA and combined stories by rural teachers and students; the winning schools included Lize, Dongxing and Neicheng in Yilan and Gongliao Experimental in New Taipei. The name ‘Dream Builder project’ appears in only one of the reports.", "pedagogicalInsight":"A typical “seed teachers + student creation” model: the company does not perform for children but trains teachers and guides students to turn local beliefs (the tree god, the Earth God) and water-resource problems into their own puppet theatre. For teachers in remote or local-focused courses it shows using puppetry to let students handle an abstract ecological issue (over-wishing as water imbalance). Note: this is a corporate charity show, so the presentation carries corporate-image and performance pressure unlike the freedom of an everyday classroom.", "why": "Verified: the two original reports were from the same media group (UDN) and not independent; on 2026-11-19 two further sources independent of each other and of UDN were found — Liberty Times / art.ltn.com.tw (Tung Po-ting, 2026-09-14) and Commercial Times (Wang Tzu-ya, 2026-09-28) — both confirming the core facts: the CTBC Cultural Foundation's New Stage Arts Festival outdoor charity show on 2026-09-12 at CTBC Financial Park, with Puppet & Its Double leading teachers and students from four rural schools (Gongliao Experimental in New Taipei; Lize, Dongxing and Neicheng schools in Yilan) in co-created puppet plays; upgraded to verified. The headline puppet musical is named 'Play On! Good Earth Band' in the two independent reports (UDN's 'co-produced with Nori SAWA' framing stays single-source); the Neicheng play title 'The Mis-wished Wish' and the Gongliao theme (this entry's summary says the Tamsui-Kavalan Trail, but Liberty Times says Gongliao 'terraced paddies') remain to be checked. (Daily source expansion, 2026-11-19)"},
k44:{"name": "Making the Village Together: Zhongxing New Village Co-scene Action", "creator": "Changhua County Cultural Affairs Bureau (host); sound artist Wu Hsiu-ming, artist Hsu Chia-chen, with the Muzhiyan team", "place": "Zhongxing New Village (juan-cun) cultural park, Changhua", "year": "2026 (exhibition May 2–31; art actions May 2, 3, 9, 10)", "summary":"“Everyone Makes a Village: Zhongxing Village Shared-Scenery Action” is a public participation programme run by the Changhua County Cultural Affairs Bureau for the public art installation at the Zhongxing Village military dependents’ village cultural park; the exhibition runs from 2 to 31 May 2026, with art actions on 2, 3, 9 and 10 May.\n\nIt arranges a series of hands-on actions: sound collection and card-game workshops, timber-frame building, parent-child interactive theatre, VR creation and photography.\n\nThe aim is to turn a formerly closed dependents’ village site into an open public space and let outsiders and residents rediscover its living memories together. The sources give dates, workshop types, artists and organisers, but not actual participant numbers or results.", "selfDesc": "The source gives dates, workshop types, artists and host, but no attendance figures or outcomes.", "pedagogicalInsight":"Opening a formerly closed dependents’ village site as a public space through hands-on activities such as sound collection, card games and timber-frame building is a common heritage-regeneration strategy of “opening up through participation”; it splits one site into several low-barrier entrances (sound, games, timber, VR), worth a look for teachers of local culture. Note in particular: the source is a county advertorial that the platform could not read directly, the activities are as planned, and actual participation and results have no independent corroboration, so discount it when using it as a teaching reference.", "why": "Beyond the county-government advertorial (a CNA message-platform submission the
