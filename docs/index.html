ses')+'</text>'+'<text x="705" y="240" text-anchor="middle" font-size="10" class="abx-mut">'+L('口述・影像・劇場・走讀','oral · photo · theatre · walks')+'</text>'+'<rect x="600" y="268" width="210" height="54" rx="12" class="abx-bf"/><rect x="600" y="268" width="210" height="54" rx="12" class="abx-bs" stroke="var(--muted)" stroke-dasharray="6 5"/>'+'<text x="705" y="291" text-anchor="middle" font-size="14.5" class="abx-ttld">'+L('深度報導','Feature Stories')+'</text>'+'<text x="705" y="309" text-anchor="middle" font-size="10.5" class="abx-acc">'+L('規劃中・模擬內容','in planning · simulated')+'</text>'+'<rect x="600" y="344" width="210" height="56" rx="12" class="abx-bf"/><rect x="600" y="344" width="210" height="56" rx="12" class="abx-bs"/>'+'<text x="705" y="368" text-anchor="middle" font-size="14.5" class="abx-ttl">'+L('關於本計畫','About')+'</text>'+'<text x="705" y="387" text-anchor="middle" font-size="10.5" class="abx-mut">'+L('宗旨・收錄標準・查證制度','aims · criteria · verification')+'</text>'+'<text x="40" y="312" text-anchor="middle" font-size="13" class="abx-acc" font-family="var(--mono)">②</text>'+'<text x="40" y="330" text-anchor="middle" font-size="9.5" class="abx-mut">'+L('核心','core')+'</text>'+'<text x="185" y="16" text-anchor="middle" font-size="11" class="abx-acc">'+L('① AI 資料抓取','① AI gathering')+'</text>'+'<text x="705" y="16" text-anchor="middle" font-size="11" class="abx-mut">'+L('③ 各分頁呈現','③ The pages')+'</text>'+'</svg>'+'<div class="abd-legend">'+'<span class="lg"><svg viewBox="0 0 28 12"><line x1="2" y1="6" x2="25" y2="6" class="abx-t"/></svg>'+L('資料流向／進入案例','Data flow / enter')+'</span>'+'<span class="lg"><svg viewBox="0 0 28 12"><line x1="2" y1="6" x2="25" y2="6" class="abx-a"/></svg>'+L('內容雙向連動','Two-way link')+'</span>'+'<span class="lg"><svg viewBox="0 0 28 12"><line x1="2" y1="6" x2="25" y2="6" class="abx-d"/></svg>'+L('規劃中','Planned')+'</span>'+'<span class="lg"><svg viewBox="0 0 28 12"><line x1="2" y1="6" x2="25" y2="6" class="abx-loop"/></svg>'+L('每日自動擴充','Daily auto')+'</span>'+'<span class="lg"><svg viewBox="0 0 28 12"><rect x="3" y="2" width="22" height="8" class="abx-g"/></svg>'+L('人工把關','Human gate')+'</span>'+'</div>'+'</figure></section>'+
  '<section class="block" style="margin-top:28px"><div class="sec-head"><h2>'+L('四個入口','Four entry points')+'</h2><p>'+L('四個分頁互相連結，從任何一端都能走到另一端。','The four pages link to one another; from any one you can reach the rest.')+'</p></div>'+
   '<div class="three four">'+
    '<div><div class="kicker">A・DIRECTORY</div><h3>'+L('案例資料庫','Case Directory')+'</h3><p>'+L('整合藝術家、團體、計畫與原始網站連結。','Brings together artists, groups, projects and links to the original sites.')+'</p><ul><li>'+L('議題分類','By issue')+'</li><li>'+L('地區搜尋','By region')+'</li><li>'+L('藝術形式','By art form')+'</li><li>'+L('團體與創作者','By group & creator')+'</li></ul><p class="linkrow"><a href="#directory" data-go="directory">'+L('進入資料庫','Enter the directory')+'</a></p></div>'+
    '<div><div class="kicker">B・STORIES</div><h3>'+L('深度報導','Feature Stories')+'</h3><p>'+L('訪談創作者、參與者與地方社群，記錄過程與複雜性。','Interviews with creators, participants and local communities, recording the process and its complexity.')+'</p><ul><li>'+L('藝術家訪談','Artist interviews')+'</li><li>'+L('社群參與經驗','Community experience')+'</li><li>'+L('創作過程','The making')+'</li><li>'+L('反思與影響','Reflection & impact')+'</li></ul><p class="linkrow"><a href="#stories" data-go="stories">'+L('閱讀報導','Read the features')+'</a></p></div>'+
    '<div><div class="kicker">C・GLOSSARY</div><h3>'+L('名詞解釋','Glossary')+'</h3><p>'+L('解釋案例裡的概念與詞彙，例如 USR、社區劇場、限地製作。','Explains the concepts and terms in the cases, such as USR, community theatre and site-specific work.')+'</p><ul><li>'+L('概念定義','Definitions')+'</li><li>'+L('相關案例','Related cases')+'</li><li>'+L('相關名詞','Related terms')+'</li></ul><p class="linkrow"><a href="#glossary" data-go="glossary">'+L('查看名詞','Browse the glossary')+'</a></p></div><div><div class="kicker">D・METHODS</div><h3>'+L('教學方法','Teaching Methods')+'</h3><p>'+L('把案例裡「怎麼做」的方法整理出來，給教育工作者參考。','Distils the “how” of the cases into methods for educators to borrow.')+'</p><ul><li>'+L('帶領方法','Leading methods')+'</li><li>'+L('適用場域','Where it fits')+'</li><li>'+L('相關案例','Related cases')+'</li></ul><p class="linkrow"><a href="#methods" data-go="methods">'+L('查看方法','Browse the methods')+'</a></p></div>'+
   '</div></section>'+
  '<section class="block"><div class="sec-head"><h2>'+L('四個分頁怎麼一起運作','How the four pages work together')+'</h2><p>'+L('案例資料庫是核心，其他分頁從不同角度整理同一批案例。','The Case Directory is the core; the other pages reorganise the same cases from different angles.')+'</p></div>'+'<div class="prose" style="max-width:48em">'+ '<p>'+L('<b>案例資料庫</b>是平台的核心——一筆筆經查證的真實案例。另外三個分頁，從不同角度重新整理這些案例：','<b>The Case Directory</b> is the core of the platform — real, verified cases one by one. The other three pages reorganise them from different angles:')+'</p>'+ '<ul>'+  '<li>'+L('<b>名詞解釋</b>——解釋案例裡的概念與詞彙（例如 USR、社區劇場、限地製作），讓你知道案例「是什麼概念的例子」。','<b>Glossary</b> — explains the concepts and terms in the cases (USR, community theatre, site-specific work, and so on), so you can see which idea each case is an example of.')+'</li>'+  '<li>'+L('<b>教學方法</b>——把案例裡「怎麼做」的方法整理出來（口述歷史、影像自述、社區劇場、走讀……），給教育工作者參考。','<b>Teaching Methods</b> — distils the “how” of the cases (oral history, photovoice, community theatre, field walks…) for educators to borrow.')+'</li>'+  '<li>'+L('<b>深度報導</b>——用故事與訪談補上結構化卡片缺少的「人的聲音」（規劃中）。','<b>Feature Stories</b> — adds the human voice that the structured cards leave out, through stories and interviews (in planning).')+'</li>'+ '</ul>'+ '<p>'+L('這四塊是互通的：在一個<b>案例頁</b>，你能看到它牽涉哪些概念（相關名詞）、用了哪些方法（相關教學方法），也能跳到關注同樣議題的其他案例；反過來，從一個名詞或一種方法，也能看到有哪些案例用到它。','The four are interlinked: on a <b>case page</b> you can see which concepts it touches (related terms), which methods it used (related teaching methods), and jump to other cases on the same issue; conversely, from a term or a method you can see which cases use it.')+'</p>'+ '</div></section>'+
  '<section class="block"><div class="sec-head"><h2>'+L('案例收錄的標準','Who gets included')+'</h2><p>'+L('哪些案例會被收進平台。','Which cases make it onto the platform.')+'</p></div>'+'<div class="prose" style="max-width:48em">'+ '<p>'+L('<b>核心定義：</b>平台收錄的是「台灣的<b>議題本位藝術</b>（Issue-Based Art）實踐案例」——也就是以社會議題為入口、或有社區／居民實際參與的藝術計畫。','<b>Core definition:</b> the platform collects <b>issue-based art</b> practised in Taiwan — art projects that either take a social issue as their entry point, or involve real participation by a community or its residents.')+'</p>'+ '<p>'+L('<b>收錄門檻（兩條擇一即可）：</b>','<b>Inclusion thresholds (meeting either one is enough):</b>')+'</p>'+ '<ol>'+  '<li>'+L('<b>有社區或居民實際參與</b>的藝術計畫——涵蓋社區藝術、社會參與式藝術、公共藝術、藝術教育、藝術節與駐村。','An art project with <b>real participation by a community or its residents</b> — including community art, socially engaged art, public art, art education, and art festivals and residencies.')+'</li>'+  '<li>'+L('<b>以社會議題為主題</b>的創作或展覽——議題包括環境、都市發展、地方記憶、移民與移工、性別、社宅與居住、災害與創傷、勞動與人權、原住民族與客家文化，以及文化／血緣／地區／身份等各種認同。','A work or exhibition <b>built around a social issue</b> — issues include the environment, urban development, local memory, migration and migrant workers, gender, social housing, disaster and trauma, labour and human rights, Indigenous and Hakka cultures, as well as cultural, ancestral, regional and personal identity.')+'</li>'+ '</ol>'+ '</div></section>'+
  '<section class="block"><div class="sec-head"><h2>'+L('資料怎麼查證','How we verify')+'</h2><p>'+L('每筆案例都標了查證狀態，資料真實性優先。','Every case carries a verification status; accuracy comes first.')+'</p></div>'+'<div class="prose" style="max-width:48em">'+ '<ul>'+  '<li>'+L('<b>已查證</b>——有兩個以上獨立來源互相印證，或已經人工審核確認。','<b>Verified</b> — corroborated by two or more independent sources, or confirmed by human review.')+'</li>'+  '<li>'+L('<b>待查證</b>——新收錄、尚待擴充查證，或目前只有一個來源。','<b>To be verified</b> — newly added and awaiting further source checking, or only one source so far.')+'</li>'+ '</ul>'+ '<p>'+L('<b>怎麼算「獨立來源」：</b>不同的媒體或作者，而且確實讀過內容、確認它佐證案例的核心事實；同一篇新聞稿的轉載不算兩個來源，廣編稿、廣告稿也不算。','<b>What counts as an “independent source”:</b> a different outlet or author, actually read and confirmed to support the case’s core facts; a reprint of the same press release is not two sources, and advertorials and ads do not count.')+'</p>'+ '<p>'+L('來源分成「官方網站與主辦單位頁面」與「報導與其他來源」兩區。每筆案例都寫明查證理由，哪些細節仍只有單一來源也會誠實標註。平台絕不編造人名、日期、數字或網址。','Sources are split into “official and organiser pages” and “news and other sources.” Every case states why it is verified, and honestly flags which details still rest on a single source. The platform never fabricates names, dates, figures or links.')+'</p>'+ '</div></section>'+
  '<section class="block"><div class="sec-head"><h2>'+L('AI 在資料流程中的位置','Where AI sits in the workflow')+'</h2><p>'+L('AI 協助蒐集與整理，不決定藝術實踐的價值，也不取代田野訪談。','AI helps gather and organise; it does not judge the worth of an art practice, nor replace fieldwork.')+'</p></div>'+
  '<ol class="steps"><li><div><b>'+L('AI 搜尋','AI search')+'</b><span>'+L('用不同關鍵字尋找公開的藝術計畫與網站。','Finds public art projects and sites with varied keywords.')+'</span></div></li><li><div><b>'+L('AI 整理','AI organise')+'</b><span>'+L('提取地點、議題、創作者與實踐方式，並提出分類建議。','Extracts place, issue, creator and practice, and proposes a classification.')+'</span></div></li><li><div><b>'+L('人工審核','Human review')+'</b><span>'+L('確認資料正確性、分類合理性與來源。','Checks accuracy, whether the classification holds, and the sources.')+'</span></div></li><li><div><b>'+L('網站發布','Publish')+'</b><span>'+L('建立案例頁面，連結原始資料與深度報導。','Builds the case page, linking to the original material and feature stories.')+'</span></div></li></ol>'+
  '<p style="margin-top:14px;color:var(--muted);font-size:.93rem">'+L('初期以原始網站連結與簡介為主，以降低著作權與長期維護的負擔。','In the early stage it relies mainly on links to the original sites plus short summaries, to ease the copyright and long-term maintenance burden.')+'</p></section>';
}

function gname(g){return lang==="en"?TGROUPS_EN[g[0]]:g[1];}
function bubble(t){
  return '<a class="bubble" href="#term-'+t.id+'" data-go="term-'+t.id+'"><span>'+esc(tname(t))+'</span><small data-notr>'+esc(tsub(t))+'</small><span class="tip" role="tooltip">'+esc(tget(t,"short"))+'</span></a>';
}
var METHODS=[{"id": "oral", "cases": ["k01", "k08", "k10", "k35", "k44", "k03", "k54", "k59","k11", "k61", "k63", "k78"], "zh": {"n": "口述歷史與物件敘事", "def": "請參與者帶一件物件或老照片，從「這件東西的故事」進入地方與家族記憶，而不是直接問大問題。", "how": ["請每人帶一件有故事的物件或老照片", "用固定提問引導：這是誰的？什麼時候的？為什麼留著？", "把口述錄下或寫下，連同物件一起保存", "最後組成展覽、聲音導覽或一本小誌"], "fit": "地方記憶、家族史、長者；對不擅長抽象表達的人特別友善。"}, "en": {"n": "Oral history & object storytelling", "def": "Ask participants to bring an object or old photo and enter local and family memory through “the story of this thing”, instead of asking a big question head-on.", "how": ["Each person brings one object or old photo with a story", "Guide with set questions: whose is it? from when? why kept?", "Record or write down the telling, and keep it with the object", "Assemble the results into an exhibition, audio tour or zine"], "fit": "Local memory, family history, elders; especially kind to people less at ease with abstraction."}}, {"id": "photovoice", "cases": ["k14", "k38", "k40"], "zh": {"n": "Photovoice／影像自述", "def": "把相機交給參與者，由他們決定拍什麼、希望外界怎麼認識自己。", "how": ["給一個開放的提問（例如「如果每月只有一天假」）", "參與者自行拍攝，不規定主題", "小組一起討論選片與下標題", "展出時由拍攝者決定呈現與說法"], "fit": "移工、少年、常被貼標籤的群體；核心是把話語權交給當事人。"}, "en": {"n": "Photovoice", "def": "Hand the camera to participants and let them decide what to shoot and how they want to be seen.", "how": ["Pose one open question (e.g. ‘if you had one day off a month’)", "Participants shoot on their own, with no set subject", "Choose photos and write captions together in small groups", "At the show, the photographer decides how it is presented"], "fit": "Migrant workers, youth, often-labelled groups; the point is to hand narrative control to the people themselves."}}, {"id": "theatre", "cases": ["k38", "k41", "k50", "k51", "k61"], "zh": {"n": "社區劇場與集體即興", "def": "不教表演，用戲劇遊戲與集體即興，讓居民把自己的生活編成戲。", "how": ["先用身體與信任的暖身遊戲破冰", "田野採集居民的生活故事", "用集體即興把故事發展成片段", "不追求專業演出，重點在過程與關係"], "fit": "社區、班級、跨世代；可容納素人與長者。"}, "en": {"n": "Community theatre & collective improvisation", "def": "Don’t teach acting; use theatre games and collective improvisation so residents turn their own lives into a play.", "how": ["Break the ice with body and trust warm-up games", "Gather residents’ life stories through fieldwork", "Develop the stories into scenes by collective improvisation", "Don’t chase a professional show; the process and relationships matter most"], "fit": "Communities, classes, across generations; room for non-professionals and elders."}}, {"id": "sound", "cases": ["k07", "k34", "k40", "k44","k04","k26"], "zh": {"n": "聲音採集與聲音地景", "def": "用錄音把一個地方或一群工作者的聲音收集起來，做成聲音故事或語音導覽。", "how": ["選定對象：攤商、工作者或一段地景", "訪談或現場收音", "剪成幾分鐘內的短聲音故事", "用耳機或語音導覽讓人在真實空間裡聆聽"], "fit": "勞動、地方記憶；適合不想露臉的參與者。"}, "en": {"n": "Sound collection & soundscape", "def": "Use recording to gather the sounds of a place or a group of workers into sound stories or an audio tour.", "how": ["Pick a subject: vendors, workers, or a stretch of landscape", "Interview or record on site", "Edit into short sound stories of a few minutes", "Let people listen in the real space through headphones or an audio guide"], "fit": "Labour, local memory; suits participants who would rather not be seen."}}, {"id": "material", "cases": ["k03", "k09", "k23", "k25", "k46", "k34", "k52", "k56", "k58","k17","k19","k20"], "zh": {"n": "在地素材與廢棄物再製", "def": "用在地或被丟棄的材料（漁網、漂流木、海廢、舊布條）創作，讓材料本身承載議題。", "how": ["一起蒐集材料：淨灘、撿拾或向社區徵集", "認識材料的來歷與它背後的問題", "動手改造成作品", "展示時連結材料的來源故事"], "fit": "環境、社區；讓行動（淨灘）與創作合而為一。"}, "en": {"n": "Local & found-material making", "def": "Make work from local or discarded materials — fishing nets, driftwood, marine debris, old banners — so the material itself carries the issue.", "how": ["Gather materials together: beach cleanups, scavenging, or a community call", "Learn where the material came from and the problem behind it", "Remake it into a work by hand", "Link the display back to the material’s origin story"], "fit": "Environment, community; fuses action (a cleanup) with creation."}}, {"id": "walk", "cases": ["k04", "k19", "k40", "k03"], "zh": {"n": "走讀、地圖與感知資料庫", "def": "帶參與者實地走讀一個地方，用地圖、學習單或蓋章存檔把觀察收集起來。", "how": ["設計走讀路線與一份《探索筆記》", "邊走邊記錄：照片、聲音、訪談", "把成果匯整成地圖或資料庫", "回饋給社區，成為公共的資料"], "fit": "地方認識、都市變遷；適合親子與學生。"}, "en": {"n": "Field walks, maps & perception archives", "def": "Take participants on a field walk and gather their observations with maps, worksheets or a stamp-and-file system.", "how": ["Design a walking route and an ‘exploration notebook’", "Record while walking: photos, sound, interviews", "Compile the results into a map or database", "Give it back to the community as a public resource"], "fit": "Getting to know a place, urban change; good for families and students."}}, {"id": "document", "cases": ["k10", "k37", "k39", "k59", "k64"], "zh": {"n": "以現成文件與文物當提問起點", "def": "從一份真實的歷史文件、館藏或文物出發，讓大問題從具體的物件長出來，而不是老師先定題目。", "how": ["選一件有張力的文件或文物（一句話、一幅畫、一件文物）", "用它向參與者拋問，而不是給答案", "讓參與者接著發展自己的回應與創作", "把個人創作連回那份文件的脈絡"], "fit": "歷史、認同、美感教育；是「議題從脈絡浮現」的關鍵技巧。"}, "en": {"n": "Found documents & artefacts as provocation", "def": "Start from a real historical document, collection or artefact, letting the big question grow from a concrete object rather than a teacher-set topic.", "how": ["Pick a charged document or artefact (a single line, a painting, an object)", "Use it to pose a question, not to give an answer", "Let participants develop their own responses and work", "Tie the personal work back to the document’s context"], "fit": "History, identity, aesthetic education; the key move for letting issues emerge from context."}}, {"id": "intergen", "cases": ["k10", "k24", "k33", "k54", "k59"], "zh": {"n": "跨世代共作", "def": "刻意讓不同世代（長者與學生、舞者）同組創作，讓記憶與技藝在互動中傳遞。", "how": ["把不同世代配成一組", "設計需要彼此的任務：長者口述、年輕人記錄或編創", "一起排練、同台發表", "讓雙方都被看見，而不只是長者被訪問"], "fit": "地方記憶、客庄與族群文化；長照與樂齡場域。"}, "en": {"n": "Cross-generational co-creation", "def": "Deliberately put different generations — elders with students or dancers — in the same group, so memory and skills pass on through interaction.", "how": ["Pair up across generations", "Design tasks that need each other: elders tell, younger ones record or choreograph", "Rehearse and present on stage together", "Make sure both sides are seen, not just the elder interviewed"], "fit": "Local memory, Hakka and ethnic cultures; care-station and senior settings."}}, {"id": "site", "cases": ["k08", "k44", "k45", "k46", "k64","k79"], "zh": {"n": "在歷史現場與軍事遺構裡創作", "def": "不把歷史現場當背景看板，而是直接在防空洞、碉堡、眷村、老屋裡創作或展演，讓空間本身成為教材與媒材；這是限地製作（site-specific）用在記憶場域教學的一種應用。", "how": ["選一處有張力、仍保有痕跡的現場（碉堡、防空洞、眷村、廢墟）", "先帶參與者用身體與感官認識這個空間：走、聽、觸、記錄", "從空間的用途與歷史拋問，而不是先講解牌式地給答案", "讓作品或展演留在原地發生，而非搬到展間；必要時結合在地媒材"], "fit": "地方史、冷戰與戰地記憶、文資活化；把抽象歷史變成可被身體經驗的現場。"}, "en": {"n": "Working inside historical sites and military remains", "def": "Don’t treat the historical site as a backdrop; create or perform straight inside bomb shelters, bunkers, villages and old houses, so the space itself becomes both lesson and material; it is one educational application of site-specific art to memory-laden places.", "how": ["Pick a charged site that still bears its traces (bunker, bomb shelter, village, ruin)", "First have participants know the space through body and senses: walk, listen, touch, record", "Pose questions from the site’s use and history, rather than giving wall-label answers", "Let the work or performance happen in place, not moved to a gallery; bring in local materials where it fits"], "fit": "Local history, Cold-War and battlefield memory, heritage activation; turns abstract history into something the body can experience on site."}},{"id":"food","cases":["k12","k13","k34","k49","k56"],"zh":{"n":"共食共作：以餐桌與食物凝聚關係","def":"先不急著創作，用一起吃飯、交換食譜、共同備餐等飲食活動當媒介，讓參與者先建立關係與信任，關係成熟後再長出作品。","how":["固定節奏的共餐或共同備餐（例如每月一次『一家一菜』）","用食物交換引出個人故事：換食譜就是換記憶、換家鄉","先累積關係與信任，不要第一次就談創作","關係成熟後再導入共創，並把餐桌經驗轉成作品或刊物"],"fit":"社宅、社區、長照與跨文化等『需要先交陪』的場域；對陌生、異質或流動的住民特別有效。"},"en":{"n":"Cooking and eating together","def":"Don’t rush to make art; use shared meals, recipe-swaps and cooking together as the medium, letting participants build relationships and trust first, and let the work grow once the relationships are there.","how":["Hold regular shared meals or cook-togethers (e.g. a monthly potluck)","Use food exchange to draw out personal stories: swapping recipes swaps memories and homelands","Build relationship and trust first — don’t talk about ‘creating’ at the first meal","Bring in co-creation once the relationships are there, and turn the table into a work or a zine"],"fit":"Social housing, communities, elder care and cross-cultural settings that need trust first; especially good for unfamiliar, mixed or transient residents."}},{"id":"craft","cases":["k09","k26","k33","k34","k57"],"zh":{"n":"在地職人與耆老當老師：以活工藝共作","def":"刻意翻轉師生角色，請社區裡的匠師與耆老當老師，帶參與者以在地仍活著的工藝技藝（編織、染、陶、糊紙等）共同創作。","how":["先在社區裡找到還在做的匠師或耆老，請他們當老師","由職人示範並帶領在地技藝（編織、植物染、陶、糊紙等）","參與者動手學，再一起把技藝用到共同作品上","把成果連回這項技藝的來歷與傳承脈絡"],"fit":"原住民族與客庄文化、傳統工藝活化；讓在地知識被看見、也被傳下去。（與『在地素材再製』『跨世代共作』部分重疊，差別在這裡以『職人為師、活的技藝』為核心。）"},"en":{"n":"Local masters and elders as teachers","def":"Deliberately invert the teacher–student roles: invite the community’s craftspeople and elders to teach, and co-create with participants through living local crafts (weaving, dyeing, ceramics, paper-craft, etc.).","how":["Find craftspeople or elders in the community who still practise, and invite them to teach","Have the masters demonstrate and lead a living local craft (weaving, plant-dyeing, ceramics, paper-craft…)","Participants learn hands-on, then put the craft to work on a shared piece","Tie the result back to the craft’s origins and its line of transmission"],"fit":"Indigenous and Hakka cultures, reviving traditional crafts; lets local knowledge be seen and passed on. (Overlaps partly with found-material making and cross-generational co-creation; the difference is its focus on masters-as-teachers and living skills.)"}},
{"id":"placecuration","cases":["k78","k70","k71"],"zh":{"n":"地域策展：把一處閒置空間或一塊地方變成作品現場","def":"不是在白盒子裡辦一檔展覽，而是以『一塊地方／一處閒置空間』為單位，用策展的方式把調查、徵集或共創、展呈串起來，讓空間本身被重新看見、被使用。與操作卡『在歷史現場與軍事遺構裡創作（site）』不同：site 談在現場做一件作品，這張談用策展把整個空間或地域組織、持續活化。","how":["選一處閒置或有故事的空間／一塊地域，先做田野踏查，盤點它的歷史、現況與使用者","定出策展的提問或主題，不先給答案，讓在地的人、物、記憶成為素材","用徵集、駐村或共創，把創作者和居民帶進來一起做，而不是只把作品掛上去","把成果留在空間現場展呈（展覽、走讀、出版、節慶），並設法讓空間在計畫結束後仍被使用"],"fit":"閒置老屋與蚊子館、港町與老街、文資活化；想讓一個地方被『重新組織起來』而不只是辦一次展覽時。注意：這偏向策展與組織的模式，不是單堂課的操作；且居民在決策上的參與深度會因計畫而異——踏查紀錄（如 k70）、個人廢墟創作（如 k71）與共創活化（如 k78）是不同程度，引用時要分清。"},"en":{"n":"Place-based curation: turning an idle space or a locality into a site for work","def":"Not a show in a white cube, but taking ‘a place / an idle space’ as the unit and using curation to string together survey, commissioning or co-creation, and display, so the space itself is seen anew and used. Unlike the method card ‘working inside historical sites and military remains (site)’, which is about making one work on site, this is about using curation to organise and keep reactivating a whole space or locality.","how":["Pick an idle or story-rich space / a locality, and start with fieldwork: map its history, present state and users","Set the curatorial question or theme without giving answers first; let local people, objects and memory become the material","Use commissioning, residency or co-creation to bring creators and residents in to make things together, rather than just hanging works","Keep the results on site (exhibition, walking tours, publications, festivals), and find ways for the space to keep being used after the project ends"],"fit":"Idle old houses and ‘mosquito halls’, port towns and old streets, heritage activation; for when you want a place to be ‘re-organised’, not just hosted for one show. Note: this is a curatorial and organisational mode, not a single-lesson technique; and residents’ role in decisions varies by project — survey/archive (e.g. k70), individual ruin-based creation (e.g. k71) and co-creative activation (e.g. k78) are different degrees, so keep them apart when citing."}}

var OPENM={};
function layoutMethods(){
  var box=document.querySelector(".methods");if(!box)return;
  var cards=box._cards;if(!cards){cards=box._cards=Array.prototype.slice.call(box.querySelectorAll(".mcard"));}
  var n=Math.max(1,Math.floor((box.clientWidth+18)/318));
  if(box.getAttribute("data-cols")==String(n)&&box.querySelector(".mcol"))return;
  box.setAttribute("data-cols",n);box.innerHTML="";
  var cols=[],i;for(i=0;i<n;i++){var c=document.createElement("div");c.className="mcol";box.appendChild(c);cols.push(c);}
  cards.forEach(function(card){var best=cols[0],j;for(j=1;j<cols.length;j++){if(cols[j].offsetHeight<best.offsetHeight)best=cols[j];}best.appendChild(card);});
}
window.addEventListener("resize",function(){layoutMethods();});
document.addEventListener("toggle",function(e){var t=e.target;if(t&&t.classList&&t.classList.contains("mcard"))OPENM[t.id.slice(2)]=t.open;},true);
function viewMethods(){
  var en=lang==="en";
  var intro=L("這一頁把平台上很多案例反覆用到的帶領手法，整理成可以直接拿來用的方法。每個方法都連到真的用過它的案例，點進去就能看到實際怎麼做。這是平台自己的教學整理，不是學術分類；同一個案例常常會用到好幾種方法。","This page gathers the leading methods that come up again and again across the platform’s cases, turned into ones you can use directly. Each links to cases that actually used it, so you can see how it played out. This is the platform’s own teaching synthesis, not an academic taxonomy; one case often uses several methods.");
  return '<div class="page-title"><h1>'+L("教學方法","Teaching Methods")+'</h1><p>'+intro+'</p></div>'+
  '<div class="methods">'+METHODS.map(function(m){
    var d=en?m.en:m.zh;
    var chips=m.cases.map(function(cid){var c=BYID[cid];var nm=en&&CASE_EN[cid]?CASE_EN[cid].name:c.name;return '<a class="mcase" href="#case-'+cid+'" data-go="case-'+cid+'">'+esc(cid.toUpperCase()+" "+nm)+'</a>';}).join("");
    return '<details class="mcard" id="m-'+m.id+'"'+(OPENM[m.id]?' open':'')+'><summary><h2>'+esc(d.n)+'</h2><p class="mdef">'+esc(d.def)+'</p><span class="mhint"><span class="mh-o">'+L("點開看做法","Tap to open")+'</span><span class="mh-c">'+L("收合","Collapse")+'</span></span></summary><div class="mbody">'+
      '<div class="mhow"><h3>'+L("怎麼帶","How to run it")+'</h3><ul>'+d.how.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'+
      '<h3>'+L("適用","Good for")+'</h3><p class="mfit">'+esc(d.fit)+'</p>'+
      '<h3>'+L("關聯案例","Cases")+'</h3><div class="mcases">'+chips+'</div></div></details>';
  }).join("")+'</div>';
}
function viewGlossary(){
  return '<div class="page-title"><h1>名詞解釋</h1><p>平台用到的專有名詞，各以一顆泡泡呈現。滑鼠移上去會看到一句話的解釋，點進去有較完整的說明、相關案例與引用來源。解釋是簡述，不是學術定義；標有「編輯整理」的內容沒有直接的定義來源。</p></div>'+
  TGROUPS.map(function(g){
    var list=TERMS.filter(function(t){return t.g===g[0];});
    return '<section class="block" style="margin-top:28px"><h2 class="sub" style="margin-top:0">'+esc(gname(g))+'</h2><div class="bubbles">'+list.map(bubble).join("")+'</div></section>';
  }).join("");
}
function shortHtml(t){var sh=tget(t,"short");var labs=["定義：","Definition: "];for(var i=0;i<labs.length;i++){if(sh.indexOf(labs[i])===0){return '<strong>'+esc(labs[i].replace(/\s+$/,""))+'</strong><br>'+esc(sh.slice(labs[i].length));}}return esc(sh);}

  var rel=t.rel.length?'<h2 class="sub">'+(en?"Related terms":"相關名詞")+'</h2><div class="bubbles">'+t.rel.map(function(r){return bubble(TERM_BY[r]);}).join("")+'</div>':"";
  return '<div class="dhead"><div class="crumb"><a href="#glossary" data-go="glossary">'+(en?"← Back to Glossary":"← 回到名詞解釋")+'</a></div>'+
  '<div class="case-head"><div class="top" style="margin-bottom:8px"><span class="id" data-notr>'+esc(gname(g))+'</span></div>'+
  '<h1>'+esc(tname(t))+'</h1><div class="en" data-notr>'+esc(tsub(t))+'</div>'+
  '<p class="lead" style="margin-top:12px;max-width:40em">'+shortHtml(t)+'</p></div></div>'+
  '<div class="prose" style="max-width:44em"><h2 class="sub" style="margin-top:0">'+(en?"In depth":"深入說明")+'</h2>'+
  tget(t,"long").map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+
  (note?'<div class="srcbox" style="margin-top:12px"><p>'+esc(note)+'</p></div>':"")+
  '<h2 class="sub">'+esc(casesLabel)+'</h2>'+cases+fb+rel+
  '<h2 class="sub">'+(en?"Sources":"引用來源")+'</h2><div class="srcbox">'+(srcs?'<ul style="margin:0;padding-left:1.2em">'+srcs+'</ul>':'<p>'+(en?"None.":"無。")+'</p>')+
  (srcs?'<p style="margin-top:8px">'+(en?"Sources were read by the platform's editors in October 2026; links point to the original pages. Page contents may have changed since.":"以上來源由平台編輯於 2026 年 10 月讀取，連結指向原始頁面，之後內容可能已更動。")+'</p>':'')+'</div></div>';
}

/* ---------- routing ---------- */
var current="";
function navSubHtml(){
  var en=lang==="en";
  function it(x){return '<li><a href="#series-'+x.id+'" data-go="series-'+x.id+'" data-notr>'+esc(en?x.en:x.zh)+'</a></li>';}
  return SERIES.filter(function(x){return !x.parent&&x.type==="fixed";}).map(it).join("");
}
function renderNav(token){
  var active=token.indexOf("case-")===0?"directory":(token.indexOf("story-")===0?"stories":(token.indexOf("term-")===0?"glossary":(token.indexOf("method-")===0?"methods":(token.indexOf("series-")===0?"directory":token))));
  document.getElementById("nav").innerHTML=NAV.map(function(n){
    var a='<a href="#'+n[0]+'" data-go="'+n[0]+'"'+(n[0]===active?' aria-current="page"':'')+'>'+n[1]+(n[0]==="stories"?' <span class="navplan">規劃中</span>':'')+'</a>';
    if(n[0]==="directory")return '<li class="hasSub">'+a+'<button type="button" class="navtog" aria-expanded="false" aria-label="'+(lang==="en"?"Show series menu":"展開系列選單")+'" data-notr>▾</button><ul class="navsub" data-notr>'+navSubHtml()+'</ul></li>';
    return '<li>'+a+'</li>';
  }).join("");
}
function route(token){
  token=token||"home";current=token;
  renderNav(token);
  if(token==="home"){app.innerHTML=viewHome();bindHome();}
  else if(token==="directory"){app.innerHTML=viewDirectory();bindDirectory();}
  else if(token.indexOf("case-")===0){app.innerHTML=viewCase(token.slice(5));}
  else if(token==="stories"){app.innerHTML=viewStories();bindStories();}
  else if(token.indexOf("story-")===0){app.innerHTML=viewStory(token.slice(6));}
  else if(token==="glossary"){app.innerHTML=viewGlossary();}
  else if(token.indexOf("term-")===0){app.innerHTML=viewTerm(token.slice(5));}
  else if(token==="methods"||token.indexOf("method-")===0){if(token.indexOf("method-")===0)OPENM[token.slice(7)]=true;app.innerHTML=viewMethods();layoutMethods();}
  else if(token==="about"){app.innerHTML=viewAbout();}
  else if(token==="series"){app.innerHTML=viewSeriesList();}
  else if(token.indexOf("series-")===0){app.innerHTML=viewSeries(token.slice(7));}
  else{app.innerHTML=viewNotFound();}
  applyLang();
}
function jumpToResults(){
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(e){}
  var rb=document.querySelector(".resbar");
  if(rb)rb.scrollIntoView({behavior:"smooth",block:"start"});
}
function go(token){
  try{history.replaceState(null,"","#"+token);}catch(e){}
  route(token);
  if(token.indexOf("method-")===0){var _el=document.getElementById("m-"+token.slice(7));if(_el){_el.scrollIntoView();return;}}
  window.scrollTo(0,0);
}
function bindHome(){
  bindMap();
  document.getElementById("quick").addEventListener("submit",function(e){
    e.preventDefault();
    DIMS.forEach(function(d){state.sel[d.key].clear();});
    state.q="";
    var i=document.getElementById("q-issue").value,c=document.getElementById("q-city").value,p=document.getElementById("q-practice").value;
    if(i)state.sel.issue.add(i);if(c)state.sel.city.add(c);if(p)state.sel.practice.add(p);
    go("directory");
  });
}
function bindDirectory(){
  var f=document.getElementById("filters");
  try{if(window.matchMedia("(min-width:861px)").matches)f.setAttribute("open","");}catch(e){}
  var q=document.getElementById("q");q.value=state.q;
  q.addEventListener("input",function(){state.q=q.value;updateDirectory();});
  q.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();jumpToResults();}});
  var see=document.getElementById("seeresults");if(see)see.addEventListener("click",jumpToResults);
  document.getElementById("clear").addEventListener("click",function(){
    DIMS.forEach(function(d){state.sel[d.key].clear();});state.q="";q.value="";updateDirectory();
  });
  document.getElementById("ysort").addEventListener("click",function(){state.ydir=state.ydir==="desc"?"asc":"desc";updateDirectory();});
  updateDirectory();
}
document.getElementById("lang").addEventListener("click",function(){
  lang=lang==="en"?"zh":"en";
  try{localStorage.setItem("iaLang",lang);}catch(e){}
  route(current);
});
document.addEventListener("click",function(e){
  var tg=e.target.closest&&e.target.closest(".navtog");
  if(tg){var li=tg.parentNode,o=li.classList.toggle("open");tg.setAttribute("aria-expanded",o?"true":"false");return;}
  var openLi=document.querySelector("nav li.hasSub.open");
  if(openLi&&!(e.target.closest&&e.target.closest("li.hasSub"))){openLi.classList.remove("open");var _b=openLi.querySelector(".navtog");if(_b)_b.setAttribute("aria-expanded","false");}
  var fbtn=e.target.closest&&e.target.closest(".filterbtn");
  if(fbtn){DIMS.forEach(function(d){state.sel[d.key].clear();});state.q="";state.sel[fbtn.dataset.dim].add(fbtn.dataset.val);go("directory");return;}
  var a=e.target.closest&&e.target.closest("a[data-go]");
  if(a){e.preventDefault();go(a.getAttribute("data-go"));return;}
  var ch=e.target.closest&&e.target.closest(".chip");
  if(ch&&current==="directory"){
    var s=state.sel[ch.dataset.dim];
    if(s.has(ch.dataset.val))s.delete(ch.dataset.val);else s.add(ch.dataset.val);
    updateDirectory();
  }else if(ch&&current==="stories"&&ch.dataset.sdim){
    var ss=sstate.sel[ch.dataset.sdim];
    if(ss.has(ch.dataset.val))ss.delete(ch.dataset.val);else ss.add(ch.dataset.val);
    updateStories();
  }
});
function clampTip(e){
  var b=e.target.closest&&e.target.closest(".bubble");if(!b)return;
  var tip=b.querySelector(".tip");if(!tip)return;
  tip.style.left="0px";
  var r=tip.getBoundingClientRect(),over=r.right-(window.innerWidth-16);
  if(over>0)tip.style.left=(-over)+"px";
}
document.addEventListener("mouseover",clampTip);document.addEventListener("focusin",clampTip);
window.addEventListener("hashchange",function(){var t=location.hash.slice(1);if(t&&t!==current)route(t);});
route(location.hash.slice(1));
})();
</script>
