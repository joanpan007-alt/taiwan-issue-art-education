{id:"k37",name:"義家藝館（系列）",en:"",creator:"國立臺北藝術大學藝術與人文教育研究所團隊；合作：臺北榮譽國民之家；授課教師暨策展人吳岱融（頁面沒有明說學校是否為主辦單位）",city:"台北",place:"臺北榮譽國民之家（義士之家）；創作與展演在義士的生活空間進行",year:"2014 起（團隊 2014 年進入臺北榮譽國民之家；2016 年起以《義家藝館》為名，每年於國際博物館日發表半日展；GPI 2022 年書評稱為長達 8 年的互動；2019 年於 5/18 發表、適逢義士來臺 65 年）",yk:2019,yk0:2014,yd:"2014 起",yde:"From 2014",
 issue:["地方記憶","身分與歷史記憶"],form:["展覽"],practice:["社會參與式藝術","藝術教育"],audience:["榮民","長者"],
 summary:"義家藝館是北藝大團隊從 2014 年起進入臺北榮譽國民之家（義士之家）、長期與韓戰反共義士相處的計畫；2016 年起以「義家藝館」為名，把義士的生活空間變成創作與展演的現場，每年於國際博物館日發表半日展。計畫網站說明構想是把義士之家轉化為藝術性生態博物館，著重共創歷程而非成品，並搭配選修課程進行。\n\n2019 年適逢義士來臺 65 年，策展團隊重新整理家史室，以泛黃文件上的句子「怎樣在一百八十天內，成為一個完全的自由人！」為題，駐站藝術家與教師以「藝述實踐」探討自由如何被再現與詮釋，並邀請參與者共同思考，計畫回到家史室的歷史文件，追問「自由」這個詞怎麼被定義與使用。\n\n2019 年於 5 月 18 日以半日展對外發表。GPI 政府出版品資訊網 2022 年的書評指出，義士在共創過程中從外圍的觀眾變成參與者，以自己為主體思考自由、家國、創傷與生死觀；疫情期間原定的線下展出曾改為線上展覽。",
 selfDesc:"計畫網站說明構想是把義士之家轉化為藝術性生態博物館，著重共創歷程而非成品，並搭配選修課程進行；2019 年由策展團隊重新整理家史室，以泛黃文件上的句子「怎樣在一百八十天內，成為一個完全的自由人！」為題，駐站藝術家與教師以「藝述實踐」探討自由如何被再現與詮釋，並邀請參與者共同思考。GPI 書評（曾怡評吳岱融《當教學成為形式》）另寫到：吳岱融發展「藝術家教師駐館計畫」，鼓勵修課學生現地創作；參與者包括學生、藝術家教師，以及台北榮家的義士居民與行政團隊；書評形容義士經由藝術創作自我賦權、成為創作主體。",
 educatorRole:"facilitator-led",
 pedagogicalInsight:"這是把「教學過程本身」當成創作的計畫，對帶長期工作坊的老師特別有參考價值。帶領者可以自問：我的提問是從參與者的生活裡浮現的，還是我預設好了答案？要提醒的是：義士（參與者）在個別作品裡有多少決定權，來源沒有細寫，實際的共創程度仍待查。",
 techniques:[{t:"用現成的歷史文件當提問起點：從家史室一句泛黃的「怎樣在一百八十天內，成為一個完全的自由人」出發，讓大題目從真實文件裡長出來。",te:"Use an existing historical document as the starting question: begin from a yellowed line in the family-history room so the big theme grows out of a real document.",m:"document"},{t:"把場地本身變成「概念性生態博物館」：不另外搭展場，直接在參與者的生活空間裡創作。",te:"Make the site itself a “conceptual ecomuseum”: no separate exhibition venue, make work directly in the participants’ living space."},{t:"重歷程勝於成品：讓參與者從被看的對象變成共同創作者。",te:"Value process over product: let participants move from being looked at to being co-creators."},{t:"每年固定在國際博物館日發表半日展，讓長期合作有一個定期的出口。",te:"Present a half-day exhibition every year on International Museum Day, giving long-term collaboration a regular outlet."}],
ibaeContext:["人", "時", "地"], ibaeOrigin:"context",  editNote:"",
 sources:[["2019 義家藝館3.0 關於計畫（國立臺北藝術大學×臺北榮譽國民之家，計畫團隊網站）","https://2019824.webnode.tw/%E9%A6%96%E9%A0%81/",1],["《義家藝館》教學暨創作計畫團隊（計畫團隊網站）","https://vm3vm06tjp6.wixsite.com/tnuaedu/blank-5",1],["不合時宜之必要：讀吳岱融《當教學成為形式：一個教育性藝術計畫的生成與反響》（曾怡，GPI 政府出版品資訊網，2022-06-15）","https://gpi.culture.tw/news/16093"]],
 story:null,status:"已查證",statusWhy:"經你審核確認為已查證（2026 年 11 月）。2026-11-03 補入 GPI 書評作為第三個來源，與團隊網站對 2014 年進駐、國際博物館日展出與榮家合作的說法一致；但書評評述的是計畫負責人自己的著作，獨立性仍有限，義士的個別參與情形也仍沒有細節。"}
,{"id": "k38", "name": "逆風計畫（誠正中學）", "en": "", "creator": "台灣好基金會推動；教育部、法務部支持；合作：差事劇團（戲劇）、雲門舞集舞蹈教室（武術與生活律動）；影像展策展人暨攝影盧德真", "city": "新竹", "place": "新竹誠正中學（少年矯正學校）；2018 年影像展在台北中山地下書街（誠品 R79）", "year": "2017 起（2018/7/12 起在台北辦影像展，展期依台灣好基金會頁面為 7/12–7/30，該頁未標年份）", "yk": 2018,"yk0": 2017, "yd": "2017 起", "yde": "From 2017", "issue": ["教育"], "form": ["表演", "攝影", "影像", "工作坊", "展覽"], "practice": ["藝術教育"], "audience": ["青少年"], "summary":"逆風計畫由台灣好基金會自 2017 年起在新竹誠正中學（少年矯正學校）推動，把藝術帶進矯正學校。\n\n差事劇團帶領互動式戲劇遊戲，從少年的生命經驗蒐集故事、共同編劇；雲門舞集舞蹈教室帶領武術與生活律動，練習專注、耐受力與身體表達；另有一個班級的少年在策展人盧德真帶領下，花約十個月用影像記錄自己與彼此。戲劇組與武術組各 15 名學生，影像展班級 30 名少年。\n\n成果以影像展於 2018 年 7 月 12 日起（展期至 7 月 30 日）在台北中山地下書街（誠品 R79）對外發表，展覽有「身體肖像」、由少年自行掌鏡的「底片日記」與記錄戲劇與舞蹈工作坊的「舞蹈劇場」三個主題。", "selfDesc": "中央社（2018-07-12）寫到戲劇組與武術組各 15 名學生，影像展班級 30 名少年，影像展由台灣好基金會與誠品書店共同主辦。台灣好基金會的展覽頁面說明展覽有三個主題：「身體肖像」、由少年自行掌鏡的「底片日記」，以及記錄戲劇與舞蹈工作坊的「舞蹈劇場」。端傳媒（2018-11-03）指誠正中學是台灣第一間實施感化教育的少年矯正學校，並寫到計畫透過舞蹈、戲劇和攝影，帶少年練習舞蹈發表與戲劇走位。", educatorRole:"facilitator-led", pedagogicalInsight:"在矯正學校用戲劇、武術、影像三條線並行：戲劇從少年的生命故事編劇、影像由少年自己掌鏡，讓「非典型」學生握有創作主導權，是這個案例最值得借鏡的地方。要提醒的是：少年是未成年收容人，成果呈現要特別保護個資。",
 techniques:[{t:"用互動式戲劇遊戲，從少年的生命經驗蒐集故事、共同編劇。",te:"Use interactive drama games to collect stories from the youths’ life experience and write the play together.",m:"theatre"},{t:"讓少年自己掌鏡，用約十個月的影像記錄自己與彼此。",te:"Let the youths hold the camera themselves and record themselves and each other over about ten months.",m:"photovoice"},{t:"用武術與生活律動練習專注、耐受力與身體表達。",te:"Use martial arts and everyday movement to practise focus, endurance and bodily expression."},{t:"成果辦成影像展，讓少年的作品走出學校被看見。",te:"Present the results as a photo exhibition so the youths’ work leaves the school and is seen."}], ibaeContext:["人"], ibaeOrigin:"context", "editNote": "", "sources": [["逆風影像展 藝術矯正教育有無限可能（中央社，2018-07-12）", "https://www.cna.com.tw/news/acul/201807120301.aspx"], ["跳舞有時：矯正學校裏的青春（端傳媒，2018-11-03）", "https://theinitium.com/article/20181103-taiwan-boys-in-juvenile-correction-schools/"], ["<逆風x顯影x進行式> 影像展 開幕茶會（台灣好基金會，推動單位自己的頁面）", "https://new.lovelytaiwan.org.tw/news/b31169",1]], "story": null, "status": "已查證", "statusWhy": "經你確認收錄為已查證（2026 年 11 月）。中央社與端傳媒是獨立的新聞報導，對台灣好基金會、差事劇團、雲門舞集舞蹈教室與誠正中學合作的說法一致，台灣好基金會頁面補充了影像展的細節；但起始年份 2017 目前只有中央社一個來源。"}
,{"id": "k39", "name": "「聽見上河的聲音」國立故宮博物院非典型教育展（誠正中學）", "en": "", "creator": "國立故宮博物院、法務部矯正署（合辦）；誠正中學承辦；協辦：中華民國心突破職涯探索協會、104 希望基金會（依工商時報；大紀元只寫心突破協會共同參與）；藝術師資姓名報導未提及", "city": "新竹", "place": "新竹縣誠正中學行政大樓 3 樓禮堂", "year": "2019（12/20–12/29）", "yk": 2019, "yd": "2019", "yde": "2019", "issue": ["教育"], "form": ["展覽", "繪畫"], "practice": ["藝術教育", "策展與展覽"], "audience": ["青少年"], "summary":"「聽見上河的聲音」是國立故宮博物院非典型教育展，2019 年 12 月 20 日至 29 日在新竹縣誠正中學行政大樓 3 樓禮堂舉行。故宮自 1990 年代起以巡迴展服務收容人，2010 年起與矯正機關合作複製文物展示，2012 年起合作規劃藝術課程、培訓青少年收容人導覽。\n\n這次故宮教育團隊與誠正中學校內國文、數學、汽機車修護與電腦職訓課程教師合作，將【清 院本 清明上河圖】融入教學；並從【宋 蘇軾 書黃州寒食詩】連結學生生命經驗、延伸當代饒舌韻腳，學生自己作詞作曲。籌備期間花了將近 9 個月教導學生相關技能。\n\n展場有故宮文物複製品、VR 與影片，也展出學生以粉彩、漫畫、禪繞畫、LINE 貼圖、雕塑、動力自造與音樂詞曲創作的作品，學生並擔任導覽解說，少年的全名與容貌不顯影，以音樂、口述與文字表達心聲。", "selfDesc": "依故宮官方貼文與誠正中學/矯正署新聞稿：故宮自 1990 年代起以巡迴展服務收容人，自民國 99 年（2010）起與台北監獄等 7 所矯正機關合作複製文物展示，2012 年起與矯正機構合作規劃藝術課程、培訓青少年收容人導覽（原媒體寫的 2010 與 2012 分屬不同階段，並不矛盾）。本次與誠正中學校內國文、數學、汽機車修護與電腦職訓課程教師合作，將【清 院本 清明上河圖】融入教學；並從【宋 蘇軾 書黃州寒食詩】連結學生生命經驗、延伸當代饒舌韻腳，學生自己作詞作曲。故宮另與心突破職涯探索協會合作、透過 104 希望基金會邀油漆工程、搬家師傅、塔羅牌占卜師等職人入校，為學生離校後職涯探索作準備。展覽由學生擔任導覽，少年的全名與容貌不顯影，以音樂、口述與文字表達心聲。", educatorRole:"facilitator-led", pedagogicalInsight:"把故宮文物（清明上河圖、寒食帖）當起點，讓矯正學校學生用粉彩、漫畫、貼圖等多種媒材重新詮釋，還自己當導覽，示範了「用高門檻的經典文物，做低門檻的親近設計」。要提醒的是：報導像新聞稿，學生如何參與創作沒有細寫。",
 techniques:[{t:"以故宮文物（清明上河圖、寒食帖）當起點，連到學生的生命經驗。",te:"Take Palace Museum objects (Along the River, the Cold Food poem) as the starting point and link them to students’ life experience.",m:"document"},{t:"讓學生用粉彩、漫畫、LINE 貼圖等多種媒材重新詮釋文物。",te:"Let students reinterpret the objects in many media such as pastel, comics and LINE stickers."},{t:"延伸到當代饒舌韻腳，學生自己作詞作曲。",te:"Extend to contemporary rap rhymes, with students writing their own lyrics and music."},{t:"由學生擔任導覽解說，並保護少年的全名與容貌。",te:"Have students serve as guides, while protecting the youths’ full names and faces."}], ibaeContext:["人"], ibaeOrigin:"content", "editNote": "", "sources": [["故宮非典教育展 邀民眾聽見青年收容人之聲（工商時報，2019-12-20）", "https://www.ctee.com.tw/news/20191220700557-431401"], ["故宮文物誠正展創意 國寶收藏披上現代衣（大紀元，2019-12-23）", "https://www.epochtimes.com/b5/19/12/23/n11740369.htm"], ["「聽見上河的聲音—故宮非典型教育展」（國立故宮博物院教育巡迴展官網）：載明 2019.12.20–29、新竹縣誠正中學 3F 禮堂、與矯正署誠正中學教師及專業藝術工作者、職涯探索團隊合作、清明上河圖融入教學、少年以口語文字美術戲劇音樂拼貼生活史", "https://www.npm.gov.tw/Education-Promotion.aspx?sno=04012609&l=1", 1], ["『聽見上河的聲音』故宮文物誠正展創意（法務部矯正署誠正中學官網新聞稿，發布 2019-12-20）：故宮與矯正署聯合主辦、108/12/20–29 於誠正中學 3F 大禮堂、自民國 99 年起與台北監獄等 7 所矯正機關合作、結合心突破職業探索協會花近 9 個月入校教學、學生擔任導覽、陳宏義校長主持開幕", "https://www.ctg.moj.gov.tw/15267/15403/15405/797871/post", 1], ["故宮「聽見上河的聲音」誠正中學非典型教育展（PeoPo 公民新聞，公民記者 KarlTing，2019-12-28）：另述與國文、數學、汽機車修護、電腦職訓課程教師合作、培訓導覽尖兵、學生口述工作心得並寫話給觀眾", "https://www.peopo.org/news/437169"], ["【聽見上河的聲音—故宮非典型教育展】國立故宮博物院官方 Facebook 貼文（2019-12-18）：故宮自 1990 年代起以巡迴展服務收容人、2012 年起培訓青少年收容人導覽；本次與國文/數學/汽機車修護/電腦職訓課程結合，從蘇軾〈寒食帖〉連結學生生命經驗並延伸當代饒舌，透過 104 希望基金會邀油漆、搬家、塔羅等職人入校", "https://www.facebook.com/share/p/1FViSZfe8G/", 1]], "story": null, "status": "已查證", "statusWhy": "已查證：由兩個共同主辦單位的官方說法互證——法務部矯正署誠正中學官網新聞稿（2019-12-20：故宮與矯正署聯合主辦、108/12/20–29 於誠正中學 3F 大禮堂、心突破職業探索協會入校近 9 個月、學生擔任導覽）與國立故宮博物院官方 Facebook 貼文暨教育巡迴展頁面（清明上河圖等文物融入國文/數學/汽機車修護/電腦職訓課程、蘇軾寒食帖連結生命經驗、104 邀職人入校）；另有工商時報、大紀元報導與 PeoPo 公民記者 KarlTing 獨立報導佐證。來源充分且一致，列為已查證。"}
,{"id": "k40", "name": "原型樂園（Prototype Paradise）", "en": "Prototype Paradise", "creator": "原型樂園；主要創作者與負責人貢幼穎；長期合作夥伴蕭於勤（依臺東縣政府活動頁）", "city": ["台北", "台東"], "place": "台北環南市場（2023）、臺東美術館園區（2023）；團體所在地報導未寫", "year": "2012 起（2012 年正式開始運作；本平台讀得到的計畫為 2015、2023、2026）", "yk": 2026,"yk0": 2012, "yd": "2012 起", "yde": "From 2012", "issue": ["勞動與人權"], "form": ["表演", "聲音", "工作坊"], "practice": ["社會參與式藝術"], "audience": [], "summary":"原型樂園是 2012 年正式開始運作的當代表演團體，以「跟現實互動」為核心，把表演放進真實空間，作品常以訪談為基礎；本平台讀得到的計畫有 2015、2023、2026 年，2023 年的地點含台北環南市場與臺東美術館園區。\n\n團隊邀請不以藝術為職業的人擔任「日常生活專家」，比起「取材」，團隊自己形容做的更像「擾動」；主角包括攤商、清潔隊員、美術館第一線工作人員與移工，見案例頁下方子計畫。\n\nC-LAB 專訪（侯伯彥撰文，2022-11-10）寫到，「日常生活專家」是里米尼紀錄劇團發明的詞彙，指不以藝術為職業或專業、也並非真正表演者的素人；團隊作為創作方，尤其要注意不影響清潔隊員的工作，並需要付出溝通成本與配套措施，確保一切在知情同意下進行。", "selfDesc": "C-LAB 專訪（侯伯彥撰文，2022-11-10）寫到，「日常生活專家」是里米尼紀錄劇團發明的詞彙，指不以藝術為職業或專業、也並非真正表演者的素人；團隊作為創作方，尤其要注意不影響清潔隊員的工作，並需要付出溝通成本與配套措施，確保一切在知情同意下進行。", educatorRole:"mixed", pedagogicalInsight:"這個團體跨了整個光譜：台東那場讓青少年當「心聲採集者」自己去訪談（促進者主導），環南夜鶯則是藝術家把攤商自白剪成聲音劇場（藝術家主導）。對教育者，最值得學的是「日常生活專家」這個定位：把不是藝術家的人當成某個領域的專家來邀請，而不是當素人。知情同意、不影響當事人工作的倫理，也是帶參與式計畫的必修。",
 techniques:[{t:"把不是藝術家的人當成某個領域的「日常生活專家」來邀請，而不是當素人。",te:"Invite non-artists as “everyday-life experts” in some field rather than as amateurs."},{t:"讓青少年當「心聲採集者」，自己去訪談。",te:"Let teenagers be “collectors of voices” and do the interviews themselves.",m:"photovoice"},{t:"把攤商的自白剪輯成聲音劇場。",te:"Edit stall holders’ confessions into sound theatre.",m:"sound"},{t:"在知情同意下進行，並避免影響當事人的工作。",te:"Proceed with informed consent and avoid disrupting people’s work."}], ibaeContext:["人", "地"], ibaeOrigin:"context", "editNote": "", "sources": [["日常的原型，可以是樂園――專訪貢幼穎（C-LAB 臺灣當代文化實驗場 CLABO，2022-11-10）", "https://mag.clab.org.tw/clabo-article/interview-with-yoyo-from-prototype-paradise/"], ["【2023臺東聲音藝術節】聲音工作坊（四）用耳朵Revisit臺東美術館（台東藝文平台，臺東縣政府）", "https://culture.taitung.gov.tw/activity/%E3%80%902023%E8%87%BA%E6%9D%B1%E8%81%B2%E9%9F%B3%E8%97%9D%E8%A1%93%E7%AF%80%E2%94%80%E9%9A%B1%E6%B2%92%E7%9A%84%E5%AD%95%E9%9C%87%E5%B8%B6%E3%80%91%E8%81%B2%E9%9F%B3%E5%B7%A5%E4%BD%9C%E5%9D%8A-4",1], ["傳統綜合市場與藝術共生 《環南的餐桌—365天的市場旬味》揭幕（非池中藝術網，2023-06-03）", "https://artemperor.tw/focus/5464"], ["走進環南市場看展覽 透過錄像、聲音劇場探索攤商日常（CTWANT，2023-06-06）", "https://www.ctwant.com/article/261295/"], ["原型樂園 PROTOTYPE PARADISE 官網首頁（團隊自己的網站，只有專案清單與年份，沒有作品說明）","https://www.prototypeparadise.com/",1],["演出節目（2026 桃園鐵玫瑰藝術節官網，只有日期與時間）", "https://ironrose-fest.com/category/%E6%BC%94%E5%87%BA%E7%AF%80%E7%9B%AE/",1],["原型樂園《Travelling Around Taipei with Garbage Trucks（搭垃圾車遊台北）》案例研究（Institute for Public Art 國際公共藝術機構，2015）：獨立記錄原型樂園為策展團隊，以街頭表演、BusStory（清潔人員當導覽分享生命故事）、劇場、裝置與民眾參與為方法", "https://instituteforpublicart.org/case-studies/travelling-around-taipei-with-garbage-trucks"],["貢幼穎作者文章列表（PAR 表演藝術雜誌，國家兩廳院）：收有其談『素人參與形式趨向社會投入』等文，佐證貢幼穎為參與式表演領域的創作／評論者", "https://par.npac-ntch.org/tw/article/photoer/1653578699154000"]], "subs": [{"n": "用耳朵 Revisit 台東美術館", "y": "2023", "t": "2023 年 10 月 22 日在臺東美術館園區進行兩場（10:30–11:30、13:30–14:30），主辦臺東縣政府，講師貢幼穎與蕭於勤，協作老師楊惠如、張伶宇，21 位學生共同參與；邀請臺東寶桑國中畢業生或在校生擔任「心聲採集者」，帶領觀眾走訪園區，聆聽他們與美術館第一線工作者的訪談；免費，報名上限 20 人。（依臺東縣政府活動頁；學生人數 21 與報名上限 20 的差別未說明）"}, {"n": "百工圖——環南夜鶯", "y": "2023", "t": "《環南的餐桌—365天的市場旬味》（2023/5/20–8/6，環南市場；興辦單位臺北市市場處、文化局，忠泰建築文化藝術基金會策劃執行）受邀的四組團隊之一。原型樂園經數月田野調查與近身訪談，探索攤商在零碎睡眠中的潛意識畫面，把攤商自白轉成聲音劇場中的貼身耳語。（依非池中藝術網與 CTWANT，兩篇內容相近，都沒有攤商直接引述；報導寫的「蹲點 18 個月」指四組團隊整體，原型樂園本身只寫「數月」）"}, {"n": "跟著垃圾車遊台北", "y": "2015", "t": "原型樂園與清潔隊員沿線出勤，在街頭進行不同形式的表演與互動，並含由資深隊員分享清潔作業經驗的「故事小巴」單元。（依 C-LAB 專訪；路線、時間與合作單位本平台未能確認）"}, {"n": "走進她的日常——移工遛狗聲音故事", "y": "2026", "t": "列在 2026 桃園鐵玫瑰藝術節的演出節目中，日期為 2026 年 3 月 11 日至 16 日，19:00–21:00。（鐵玫瑰藝術節頁面沒有寫地點、是否免費、創作團隊與補助單位，也沒有節目說明；團隊網站本平台讀不到，所以訪談人數、做法與後續演出都未收錄）"}], "story": null, "status": "已查證", "statusWhy": "已查證：團體層級的資料除 C-LAB 專訪外，國際公共藝術機構 Institute for Public Art 的案例研究另獨立記錄原型樂園策劃的《搭垃圾車遊台北》（2015），佐證這是一個以表演、劇場、裝置與民眾參與為方法的策展團隊；PAR 表演藝術雜誌亦收有貢幼穎談素人參與的文章。團體的存在與參與式工作方法因此有兩個以上獨立來源互證。個別子計畫的來源強弱不一（台東案為主辦活動頁、環南案兩篇內容相近疑同一新聞稿、2026 桃園項只有演出時間），已於各處並陳。"},
{"id": "k41", "name": "潮芳苑｜看見灘地藝術季（人劇團芳苑社區劇場）", "en": "", "creator": "芳苑鄉公所（主辦）；人劇團（承辦，團長蔡旻霓）；仁愛社區劇場（協辦）", "city": "彰化", "place": "彰化縣芳苑鄉（漁民廣場、潮間帶、紅樹林海空步道、普天宮）", "year": "2026 屆（7/26–8/1）；社區劇場自 2023 年成立", "yk": 2026,"yk0": 2023, "yd": "2023 起", "yde": "From 2023", "issue": ["環境", "地方記憶"], "form": ["表演", "影像", "工作坊"], "practice": ["社區藝術", "藝術節與駐村"], "audience": ["地方居民", "青少年", "長者"], "summary":"潮芳苑｜看見灘地藝術季是人劇團在彰化縣芳苑鄉（漁民廣場、潮間帶、紅樹林海空步道、普天宮）的社區劇場與藝術季，2026 屆為 7 月 26 日至 8 月 1 日，社區劇場自 2023 年成立。人劇團團長蔡旻霓 2022 年提出《看見灘地》孵育計畫，2023 年與芳苑仁愛社區發展協會成立社區劇場。\n\n他們先做田野踏查，再以集體即興和十幾位芳苑在地素人（含 90 歲長者與國中生）共創劇本，把漁村生活、漁歌與口述記憶編成戲，在泥灘與潮間帶上演，完成《芳苑，我們的故鄉》。蔡旻霓說「集體即興創作是我的工作方法」。免費戲劇課曾因報名人數不足而由協會理事長擴大招生。\n\n此後逐年擴大：2024 年 6 月辦《破豆藝術祭 in 芳苑》、10 月加入彰化劇場藝術節並移師員林演藝廳演出，2025 年（第三年）擴大為由芳苑地方社團互助響應、串連政府資源的藝術季。2026 屆以四大系列（潮聚落、潮劇場、潮市集、潮影像）呈現，主題是漁村文化記憶與灘地環境共生，潮辦桌 40 桌逾 400 人，芳苑國中醒獅鼓陣開幕。", "selfDesc": "《報導者》2025 年的深度報導寫到，蔡旻霓 2021 年認識紀錄片導演柯金源、2022 年提孵育計畫、2023 年與社區協會成立社區劇場並完成《芳苑，我們的故鄉》；她說「集體即興創作是我的工作方法」，演出者是十幾位在地素人，年齡橫跨數十歲。免費戲劇課曾因報名人數不足而由協會理事長擴大招生。聯合報 2026 年報導 2026 屆四大系列、潮辦桌 40 桌逾 400 人、芳苑國中醒獅鼓陣開幕，並寫人劇團已連續四年參與灘地藝術活動。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"這是「素人做戲」最完整的案例之一：帶領者不教表演，而是用集體即興，讓居民把自己的漁村生活、漁歌與口述記憶變成戲。要提醒的是：免費戲劇課曾因報名不足而擴大招生，提醒參與式計畫的招募本身就是功課。",
 techniques:[{t:"先做田野踏查，再共創劇本，不追求專業演出。",te:"Do field walks first, then co-create the script, without aiming for a professional production.",m:"theatre"},{t:"用集體即興，讓居民把漁村生活、漁歌與口述記憶變成戲。",te:"Use collective improvisation to let residents turn fishing-village life, fishing songs and oral memories into a play.",m:"theatre"},{t:"讓 90 歲長者和國中生同台。",te:"Put a 90-year-old elder and junior-high students on the same stage."},{t:"逐年擴大，從社區劇場長成串連地方社團的藝術季。",te:"Grow year by year, from a community theatre into an arts festival linking local groups."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["潮「戲」起落——在芳苑潮間帶的素人做戲（報導者，2025-08-17，洪伃青）", "https://www.twreporter.org/a/fangyuan-sea-buffaloes-humanity-theater"], ["彰化「潮芳苑」四大系列活動開跑 「普門品」壓軸（聯合報，2026-07-26，簡慧珍）", "https://udn.com/news/story/7325/9652179"]], "story": null, "status": "已查證", "statusWhy": "經你確認，依《報導者》獨立深度報導與聯合報新聞互證，收錄為已查證（2026 年 11 月）。《報導者》證實社區劇場的成形與居民演出，聯合報證實本屆活動規模。"},
{"id": "k42", "name": "2026 南迴藝術季「山徑之流」", "en": "", "creator": "臺東縣政府（主辦）；打個蛋海旅團隊（策劃）；策展人武撒恩・卡羅（Osan Karo）；藝術家 LUA RIVERA、basakanlan 謝政義、王冠東、陳聖志", "city": "台東", "place": "臺東縣達仁、金峰、太麻里沿線（華源國小、嘉蘭、金崙車站、啦里吧共創基地等部落與據點）", "year": "2026（城市學寫展期 7/1–10/31）", "yk": 2026, "yd": "2026", "yde": "2026", "issue": ["原住民族文化", "環境"], "form": ["裝置", "工作坊"], "practice": "藝術節與駐村", "audience": ["地方居民"], "summary":"2026 南迴藝術季「山徑之流」在臺東縣達仁、金峰、太麻里沿線（華源國小、嘉蘭、金崙車站、啦里吧共創基地等部落與據點）舉行，城市學寫展期為 7 月 1 日至 10 月 31 日。藝術季以流域為概念。\n\n邀 4 組藝術家以駐村方式踏查南迴地景、與在地社區共處，每位至少駐村 12 天，透過田野採集融入原住民族、閩南、客家與外籍等多元視角。作品分布在國小、火車站與共創基地：LUA RIVERA（墨西哥）在華源國小的〈長者〉、basakanlan 謝政義的〈生之韌〉、王冠東在金崙車站的〈共生之圓〉、陳聖志在啦里吧的〈冀・翼〉；王冠東駐村期間做排灣族田野調查並把元素放進作品。\n\n另設走讀、工作坊與旅宿、餐桌等衛星據點，並與在地業者推出限定「浪間野餐盒」。", "selfDesc": "城市學（遠見）整理：參展藝術家皆駐村至少 12 天，透過田野採集與居民共處，融入原住民族、閩南、客家與外籍等多元視角；王冠東在駐村期間做排灣族田野調查並把元素放進作品。藝術季並與在地業者推出限定「浪間野餐盒」。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"藝術家以駐村至少 12 天、田野採集、與居民共處的方式創作，示範了「先在地生活、再創作」的駐村倫理。要提醒的是：居民多半是被田調、共處的對象，實際共創程度來源沒有細寫，加上有明顯觀光推廣成分，帶學生看時可一併討論「藝術季與觀光」的界線。",
 techniques:[{t:"駐村至少 12 天，先在地生活、田野採集，再創作。",te:"Stay in residence for at least 12 days, living locally and doing field collection before making."},{t:"做在地族群的田野調查（如排灣族），再把元素放進作品。",te:"Do field research on the local people (such as the Paiwan) and bring its elements into the work."},{t:"把作品放在國小、火車站與共創基地等日常空間。",te:"Place works in everyday spaces such as a primary school, a railway station and a co-creation base."},{t:"設走讀、工作坊與衛星據點，讓人多種方式進入藝術季。",te:"Offer walking tours, workshops and satellite sites so people can enter the festival in different ways."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "between", "sources": [["2026南迴藝術季「山徑之流」（The Hub News；使用者提供，本平台未能直接讀取）", "https://www.thehubnews.net/archives/665878"], ["2026夏末秋初全台藝術季懶人包（城市學／遠見，2026-08-22）", "https://city.gvm.com.tw/article/132515"], ["2026南迴藝術季—山徑之流（臺東縣政府／台東觀光旅遊網）：主辦方官方頁面，佐證主辦臺東縣政府、展期2026/7/1–10/31、以流域為概念（啦里吧 Drarepaq／金崙 Kanadun 部落），及四件作品與地點——LUA RIVERA〈長者〉於華源國小、basakanlan 謝政義〈生之韌〉於嘉蘭、王冠東〈共生之圓〉於金崙車站、陳聖志〈冀・翼〉於啦里吧銀青共創基地", "https://tour.taitung.gov.tw/zh-tw/event-calendar/details/6274", 1]], "story": null, "status": "已查證", "statusWhy": "已查證：城市學／遠見（2026-08-22）與臺東縣政府官方頁面兩個獨立來源互證核心事實——以流域為概念、四位藝術家（LUA RIVERA、basakanlan 謝政義、王冠東、陳聖志）及四件作品與地點（華源國小〈長者〉、嘉蘭〈生之韌〉、金崙車站〈共生之圓〉、啦里吧〈冀・翼〉）、展期2026/7/1–10/31、主辦臺東縣政府，升為已查證。惟策劃單位「打個蛋海旅」與策展人武撒恩・卡羅（Osan Karo）仍僅見於 The Hub News 原報導（本平台未能直接讀取），部落居民實際參與創作程度亦未有來源細寫。（每日來源擴充，2026-11-16）"},
{"id": "k43", "name": "中信新舞臺藝術節公益場——偏鄉學校偶戲創作（夢想家圓夢工程）", "en": "", "creator": "中信文教基金會、無獨有偶工作室劇團（藝術總監鄭嘉音）；宜蘭與新北貢寮的學校師生", "city": ["宜蘭", "新北"], "place": "宜蘭縣（內城國中小、利澤國小、東興國小）、新北市貢寮（貢寮實驗國中）；公益場演出於臺北中信金融園區", "year": "2026（9/12 演出）", "yk": 2026, "yd": "2026", "yde": "2026", "issue": ["教育", "環境", "地方記憶"], "form": ["表演", "工作坊"], "practice": "藝術教育", "audience": ["青少年"], "summary":"中信新舞臺藝術節公益場「夢想家圓夢工程」是 2026 年 9 月 12 日在臺北中信金融園區的戶外演出；無獨有偶劇團長年到偏鄉培育種子教師、帶學生創作偶戲，今年勝出的學校包括宜蘭利澤國小、東興國小、內城國中小與新北貢寮實中。\n\n宜蘭內城國中小的學生以家鄉的大樹公、土地公與水資源為題，編出《被許錯的願望》——一個關於過度許願、導致動物缺水、最後長出小樹公的故事；貢寮實驗國中則以淡蘭古道為題。\n\n公益場由無獨有偶與日本偶戲家 Nori SAWA 跨國共製的大型偶戲揭幕，並結合偏鄉師生編創的故事。", "selfDesc": "聯合報（2026-09-14，何定照）寫到，公益場由無獨有偶與日本偶戲家 Nori SAWA 跨國共製的大型偶戲揭幕，並結合偏鄉師生編創的故事；今年勝出的學校包括宜蘭利澤國小、東興國小、內城國中小與新北貢寮實中。計畫名稱「夢想家圓夢工程」只出現在其中一篇。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"這是「種子教師＋學生創作」的典型：劇團不是去演給孩子看，而是培訓老師、帶學生把家鄉的信仰（大樹公、土地公）和水資源問題編成自己的偶戲。對偏鄉或在地課程的老師，示範了用偶戲讓學生處理抽象的生態議題（過度許願＝水資源失衡）。要提醒的是：這是企業公益場，成果呈現帶有企業形象與展演壓力，和日常課堂的自由度不同。",
 techniques:[{t:"培訓種子教師，再由老師帶學生創作偶戲。",te:"Train seed teachers, who then guide students in creating puppet theatre."},{t:"以家鄉的信仰（大樹公、土地公）和水資源為題編故事。",te:"Build stories from local beliefs (the tree god, the Earth God) and water resources."},{t:"用偶戲處理抽象的生態議題（過度許願＝水資源失衡）。",te:"Use puppetry to handle an abstract ecological issue (over-wishing as water imbalance)."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["中信新舞臺藝術節 學生用偶戲說家鄉故事（聯合報，2026-09-14，何定照）", "https://udn.com/news/story/6656/9752380"], ["中信新舞臺藝術節公益場 偏鄉偶戲（聯合報系；使用者提供）", "https://udn.com/news/story/7266/9752380"], ["3.5公尺巨偶搖滾開唱 新舞臺藝術節公益場登場（自由時報／自由藝文網，董柏廷，2026-09-14）：獨立報導，佐證中國信託文教基金會主辦新舞臺藝術節戶外公益場 9/12 於中國信託金融園區、無獨有偶工作室劇團大型偶戲音樂劇《演奏吧！好土樂團》、新北貢寮實中與宜蘭利澤／東興／內城國中小四校師生接力演出自編偶戲（貢寮以「水梯田」四季風景為題）", "https://art.ltn.com.tw/article/paper/1770522"], ["中信新舞臺藝術節 逾千人共賞（工商時報，王姿雅，2026-09-28）：獨立報導，佐證公益場 9/12 於中國信託金融園區、無獨有偶劇團《演奏吧！好土樂團》、培育種子教師帶偏鄉四校（貢寮實中、利澤、東興、內城國中小）師生共創偶戲", "https://www.ctee.com.tw/news/20260928700151-439901"]], "story": null, "status": "已查證", "statusWhy": "已查證：原僅兩篇聯合報系報導、不算獨立互證；2026-11-19 另查得自由時報／自由藝文網（董柏廷，2026-09-14）與工商時報（王姿雅，2026-09-28）兩個彼此獨立、且與聯合報系不同的來源，均佐證核心事實——中國信託文教基金會主辦「新舞臺藝術節」戶外公益場於 2026/9/12 在中國信託金融園區登場、由無獨有偶工作室劇團帶偏鄉四校（新北貢寮實中、宜蘭利澤國小、東興國小、內城國中小）師生接力演出共創偶戲，據此升為已查證。惟巨偶主秀自由、工商記為《演奏吧！好土樂團》（聯合報另稱與日本偶戲家 Nori SAWA 跨國共製，此點仍單一來源）；內城《被許錯的願望》劇名、及貢寮一校主題（本案 summary 記為「淡蘭古道」、自由時報則記為貢寮「水梯田」四季風景，兩說不一致）仍待人工覆核。企業公益場帶企業形象成分，收錄時已註記。（每日來源擴充，2026-11-19）"},
{"id": "k44", "name": "眾人成莊：中興莊共景行動（中興莊公共藝術民眾參與計畫）", "en": "", "creator": "彰化縣文化局（主辦）；聲音藝術家吳修銘、藝術家許家禎，與木製研團隊", "city": "彰化", "place": "彰化縣，中興莊眷村文化園區", "year": "2026（展覽 5/2–5/31；藝術行動 5/2、3、9、10）", "yk": 2026, "yd": "2026", "yde": "2026", "issue": ["地方記憶", "身分與歷史記憶"], "form": ["聲音", "工作坊", "展覽"], "practice": "公共藝術", "audience": ["地方居民", "兒童"], "summary":"《眾人成莊：中興莊共景行動》是彰化縣文化局為中興莊眷村文化園區公共藝術設置所辦的民眾參與計畫，展覽 2026 年 5 月 2 日至 31 日，藝術行動在 5 月 2、3、9、10 日。\n\n安排一系列讓民眾動手的行動：聲音採集與卡牌遊戲工作坊、木構搭建、親子互動劇場、VR 創作與攝影。\n\n目標是把原本封閉的眷村遺址轉為開放的公共場域，讓外界與居民一起重新看見這裡的生活記憶。來源寫到活動日期、工作坊類型、藝術家與主辦單位，但沒有寫實際參與人數或成果。", "selfDesc": "來源寫到活動日期、工作坊類型、藝術家與主辦單位，但沒有寫實際參與人數或成果。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"把一個原本封閉的眷村遺址，用聲音採集、卡牌遊戲、木構搭建等多種動手活動打開成公共場域，是文資活化常見的「以參與帶動開放」策略；它把單一場域拆成多種低門檻入口，值得做地方文化的老師參考。要特別提醒：這筆的來源是縣府廣告稿、且本平台未能直接讀取，活動內容是規劃說法，實際參與與成果都沒有獨立佐證，當教案參考時要打折。",
 techniques:[{t:"用聲音採集與卡牌遊戲工作坊，讓民眾動手重新看見眷村的生活記憶。",te:"Use sound-collection and card-game workshops to let people see the village’s living memories afresh by doing.",m:"sound"},{t:"把單一場域拆成聲音、遊戲、木構、VR 等多種低門檻入口。",te:"Split one site into several low-barrier entrances: sound, games, timber building and VR."},{t:"把活動辦在原本封閉的眷村遺址現場，並安排親子互動劇場。",te:"Hold the activities at the formerly closed village site itself and include parent-child interactive theatre.",m:"site"}], "ibaeContext": ["地", "人"], "ibaeOrigin": "between", "sources": [["眾人成莊：中興莊共景行動（中央社訊息平台投稿；標示訊息來源：彰化縣政府〔廣告〕；本平台未能直接讀取）", "https://www.cna.com.tw/postwrite/chi/432367", 1], ["走進眷村時光 中興莊故事館開館 公共藝術《同舟》亮相（風傳媒，2026-06-10；為同園區不同作品，未提及本計畫）", "https://www.storm.mg/article/11140329"], ["眾人成莊：中興莊共景行動（風傳媒，王秀禾，2026-05-01）：署名報導，佐證主辦彰化縣文化局、吳修銘《中興莊記憶果實－聲音行動工作坊》、許家禎《找回過去－卡牌遊戲工作坊》、木製研《眷村再造－木構共築工作坊》，及親子劇場《穿越時空的小敏》、VR與攝影行動，展期 5/1–5/31、藝術行動 5/2・3・9・10；內容多引述文化局、配圖由彰化縣政府提供", "https://www.storm.mg/article/11127069"], ["中興莊變身大型共創現場 民眾一起『築庄』（蕃新聞／觀傳媒彰化新聞，記者陳雅芳，2026-05-01）：另一家媒體署名報導，佐證同一計畫之主辦、三場工作坊（聲音、卡牌、木構）與藝術家，配圖由彰化縣文化局提供", "https://n.yam.com/Article/20260501764668"]], "story": null, "status": "待查證", "statusWhy": "核心活動除縣府廣編稿（中央社訊息平台投稿、本平台原未能直接讀取）外，現另讀到兩篇不同媒體署名報導——風傳媒（王秀禾，2026-05-01）與蕃新聞／觀傳媒彰化新聞（陳雅芳，2026-05-01）——皆佐證主辦為彰化縣文化局、藝術家吳修銘（聲音工作坊）、許家禎（卡牌遊戲工作坊）與木製研（木構共築），以及親子劇場、VR、攝影等活動與展期；惟兩篇內容均大量引述文化局說法、配圖由彰化縣政府／文化局提供，與原廣編稿同源，不屬獨立採訪互證，故仍維持待查證。實際參與人數、眷村原住戶是否參與創作、成果是否留存，仍無來源佐證。（每日來源擴充，2026-11-17）"},
{"id": "k45", "name": "2026 二村開門｜藝術・舞蹈・記憶《未歸的回聲》", "en": "", "creator": "雲林縣政府（主辦）；TAMtamARTTAIWAN（策劃）；壞鞋子舞蹈劇場（「赤足學」系列）；虎尾鎮建國眷村再造協會（營運）", "city": "雲林", "place": "雲林縣虎尾鎮建國眷村（建國一村、二村；防空洞、崗哨、水塔等軍事遺構）", "year": "2026（10/31 登場，展期至 11/1；原定 10/24 因颱風延期）", "yk": 2026, "yd": "2026", "yde": "2026", "issue": ["地方記憶", "身分與歷史記憶"], "form": ["裝置", "聲音", "表演"], "practice": ["策展與展覽", "藝術節與駐村"], "audience": ["地方居民"], "summary":"《2026 二村開門｜藝術・舞蹈・記憶《未歸的回聲》》是雲林縣虎尾鎮建國眷村（建國一村、二村）的藝術活動，2026 年 10 月 31 日登場，展期至 11 月 1 日，原定 10 月 24 日因颱風延期。\n\n藝術團隊與國際策展人把作品置入建國眷村的防空洞、崗哨、水塔等軍事遺構，結合舞蹈工作坊、講座與眷村導覽。\n\n讓眷村記憶以當代藝術的方式被看見；活動同時推廣建國二村的食農與環境教育方向。報導提到「地方參與」，但沒有具體說明居民如何參與策展或創作。", "selfDesc": "大紀元報導寫到策展團隊、場域、活動內容與日期；提到「地方參與」，但沒有具體說明居民如何參與策展或創作。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"把當代藝術作品直接放進防空洞、崗哨、水塔這些軍事遺構，是「以場域本身當展場」的文資活化手法，讓眷村記憶不靠解說牌、而靠空間被經驗。對做地方史的老師，示範了「讓歷史現場自己說話」。要提醒的是：來源提到「地方參與」但沒說居民怎麼參與，實際共創程度未明，偏策展導向。",
 techniques:[{t:"把作品直接放進防空洞、崗哨、水塔等軍事遺構，以場域本身當展場。",te:"Place works directly in military remains such as air-raid shelters, sentry posts and a water tower, using the site itself as the gallery.",m:"site"},{t:"讓眷村記憶靠空間被經驗，而不是靠解說牌。",te:"Let village memory be experienced through space rather than wall labels.",m:"site"},{t:"搭配舞蹈工作坊、講座與眷村導覽，讓人用不同方式進入。",te:"Pair it with dance workshops, talks and village tours so people can come in in different ways."}], "ibaeContext": ["地", "時"], "ibaeOrigin": "between", "sources": [["二村開門｜藝術・舞蹈・記憶《未歸的回聲》（大紀元，2026-11-01；本平台未能直接讀取，內容依使用者提供）", "https://www.epochtimes.com/b5/26/11/1/n14880633.htm"], ["雲林虎尾建國眷村二村開門 藝術舞蹈記憶盛大登場（中華日報／中華新聞雲，記者陳正芬雲林報導、陳正芬攝影，2026-10-31）：現場署名報導（記者自攝），佐證雲林縣府主辦、虎尾鎮建國眷村再造協會承辦、TAMtamARTTAIWAN共同策劃、壞鞋子舞蹈劇場『赤足學』、《未歸的回聲》國際藝術展融入建國一二村防空洞／崗哨／水塔等軍事遺構、10/31及11/1登場展至11/1、邀德國柏林貝塔寧藝術中心交流", "https://www.cdns.com.tw/articles/1483006"], ["國際藝術進駐虎尾建國眷村！『2026二村開門』登場（媒事網轉載台灣新聞網，記者李婉愉雲林報導，2026-10-31）：另一署名報導，佐證主辦、壞鞋子『赤足學』進駐建國二村、軍事遺構場域，並確認活動原訂 10/24 因颱風延期、10/31 改辦記者會、展至 11/1", "https://times.586.com.tw/2026/10/1011364/"]], "story": null, "status": "已查證", "statusWhy": "已查證：除原使用者提供的大紀元（本平台未能直接讀取）外，現另讀到兩篇獨立署名報導互證核心事實——中華日報（記者陳正芬雲林報導、記者自攝，2026-10-31）與媒事網轉載台灣新聞網（記者李婉愉，2026-10-31）——皆佐證雲林縣政府主辦、虎尾鎮建國眷村再造協會承辦、TAMtamARTTAIWAN共同策劃、壞鞋子舞蹈劇場『赤足學』、《未歸的回聲》國際藝術展融入建國一二村防空洞／崗哨／水塔等軍事遺構、10/31及11/1登場展至11/1；台灣新聞網並確認原訂 10/24 因颱風延期。中華日報為記者現場自攝、屬獨立採訪，升為已查證。惟眷村住戶／居民是否參與創作、工作坊參與規模，三個來源均未說明，仍待確認。（每日來源擴充，2026-11-17）"},
{"id": "k46", "name": "馬祖國際藝術島（十年藝術翻土計畫）", "en": "", "creator": "連江縣政府（主辦）；中華文化總會（協力）；東莒「大浦plus+」（協同執行）。第一屆（2022）總策劃吳漢中；第三屆（2025）年度主題策展人那高．卜沌（Nakaw Putun），另有洪榆橙、黃貞燕、郭美君等分區策展人。", "city": "連江", "place": "連江縣四鄉五島（南竿、北竿、東引、東莒、西莒）；場域包括戰地據點、碉堡、防空洞、澳口與聚落民宅", "year": "2022 起（已辦三屆：2022、2023、2025；縣府規劃為十年計畫）", "yk": 2025,"yk0": 2022, "yd": "2022 起", "yde": "From 2022", "issue": ["地方記憶", "身分與歷史記憶", "環境"], "form": ["裝置", "表演", "影像", "工作坊"], "practice": ["藝術節與駐村", "社區藝術", "策展與展覽"], "audience": ["地方居民", "青少年", "長者"], "summary":"馬祖國際藝術島（十年藝術翻土計畫）是連江縣政府以十年為期的大型藝術計畫，2022 年起已辦三屆（2022、2023、2025），場域涵蓋連江縣四鄉五島（南竿、北竿、東引、東莒、西莒）的戰地據點、碉堡、防空洞、澳口與聚落民宅。《報導者》指出，縣府在 1992 年戰地政務解除後提出藝術島作為文化治理的第一步，目標是穩定觀光人流、深化文化價值與培育在地人才。\n\n計畫邀國內外藝術家把作品放進馬祖的戰地據點、聚落與海洋生活，並以在地特有媒材（如馬祖玻璃酒瓶、海洋廢棄物）轉譯軍事空間。第一屆（2022，「島嶼釀」）有 41 組團隊、39 件作品，並有 50 位台灣志工登島協助「迴島嶼吧」子計畫；第三屆（2025，「拍楸——你的海洋，我的陸」）超過 50 件作品，分「前線馬祖」「島嶼的馬祖」「海洋的馬祖」三主軸，另有「十人十海」由地方師生與日本男木島居民共作。\n\n議題涵蓋戰地政務解除後的據點再生、常民記憶、閩東語復振、人口流失與海洋環境。《報導者》也寫到，居民多把藝術島視為帶來遊客與收入的管道，對藝術本身較無感，宣傳期過短使作品較不顯眼，一名受訪學生說藝術島「還沒被放進當地人的行事曆」。", "selfDesc": "《報導者》（2024-08-03，馬雨辰）指出，連江縣政府在 1992 年戰地政務解除後，看重馬祖的閩東文化、戰地文化、擺暝信仰與生態，提出藝術島作為文化治理的第一步，目標是穩定觀光人流、深化文化價值與培育在地人才；報導也寫到，居民多把藝術島視為帶來遊客與收入的管道，對藝術本身較無感，宣傳期過短使作品較不顯眼，一名受訪學生說藝術島「還沒被放進當地人的行事曆」。央廣（2022-02-18，江昭倫）記錄第一屆由吳漢中總策劃、41 組團隊、39 件作品、8 個策展計畫、50 位志工（屬「迴島嶼吧」子計畫），縣府已選定 13 個營區與海防據點進行軍事文化遺產轉譯。非池中（第三屆報導）記錄 2025 年由連江縣政府與文化總會主辦、那高．卜沌等多位策展人、超過 50 件作品。", "editNote": "", "educatorRole": "mixed", "pedagogicalInsight":"這是「大型藝術節如何與在地發生關係」最值得拿來討論的案例，不只看作品，更看它和居民之間的距離。可借鏡的是把特定場域和在地媒材當成創作起點，以及「十人十海」的跨島共作設計；《報導者》記錄的居民疏離感同樣是教材，帶學生時可以一起追問「藝術節到底為誰而辦」，這正是 IBAE「從脈絡出發，而非預設主題」的反面教材。",
 techniques:[{t:"把特定場域（戰地碉堡、防空洞、澳口）當成創作起點。",te:"Take particular sites (front-line bunkers, air-raid shelters, harbour inlets) as starting points for making.",m:"site"},{t:"用在地媒材（馬祖玻璃酒瓶、海洋廢棄物）轉譯軍事空間。",te:"Translate military space with local materials (Matsu glass liquor bottles, marine debris).",m:"material"},{t:"「十人十海」：讓地方師生與日本男木島居民跨島共作。",te:"“Ten People, Ten Seas”: have local teachers and students co-make with residents of Ogijima across the sea."},{t:"和學生一起追問：藝術節到底為誰而辦？怎樣才算把在地放進來，而不只是當背景？",te:"Ask students together: who is the festival for? What counts as putting the local in, rather than using it as background?"}], "ibaeContext": ["地", "人", "時"], "ibaeOrigin": "between", "sources": [["馬祖國際藝術島與在地居民：藝術能為離島帶來什麼？（報導者，2024-08-03，馬雨辰）", "https://www.twreporter.org/a/photo-matsu-international-art-island-and-residents"], ["2022 首屆馬祖國際藝術島「島嶼釀」（中央廣播電臺，2022-02-18，江昭倫）", "https://www.rti.org.tw/news?uid=3&pid=29501&typeId=2"], ["第三屆馬祖國際藝術島「拍楸——你的海洋，我的陸」（非池中藝術網）", "https://artemperor.tw/focus/6741"], ["連江縣長施政滿意度專訪（城市學／遠見天下文化，2026-05-29；僅帶過藝術島，作背景參考）", "https://city.gvm.com.tw/article/130498"]], "story": null, "status": "已查證", "statusWhy": "經你確認，依《報導者》、中央廣播電臺、非池中三個獨立媒體互證三屆的主辦單位、策展人、年份與規模，收錄為已查證（2026 年 11 月）。居民共創程度中等偏強（有具體合作對象），但《報導者》也記錄了居民的疏離，收錄時並陳。"},
{"id": "k47","series":["k32"], "name": "2022 Mattauw 大地藝術季《曾文溪的一千個名字》", "en": "2022 Mattauw Land Art Festival: A Thousand Names of the Zengwen River", "creator": "總策展人龔卓軍；協同策展人羅健毓；顧問丘如華、曾旭正；臺南市政府文化局主辦（依風傳媒報導；官網以圖示列主辦單位，文字未寫明）；九大子計畫", "city": ["台南", "嘉義"], "place": "臺南麻豆總爺藝文中心、渡拔展區、大隆田展區（依官網；沿 171 市道一帶），曾文溪上游至下游流域夥伴；各來源對展區名稱寫法不一", "year": "2022（10/15–2023/1/29）", "yk": 2022, "yd": "2022", "yde": "2022", "issue": ["環境", "地方記憶"], "form": ["影像", "聲音", "展覽"], "practice": ["藝術節與駐村", "策展與展覽"], "audience": ["地方居民"], "summary":"2022 Mattauw 大地藝術季《曾文溪的一千個名字》是臺南市政府文化局主辦、以曾文溪全流域為主角的「倡議型」大地藝術季，2022 年 10 月 15 日至 2023 年 1 月 29 日，展區含麻豆總爺藝文中心、渡拔、大隆田（各來源寫法不一），是 2026 年版（K32）的前一屆。官網自稱這是「全國首屆」以溪流全域為主體的大地藝術季，長期目標為「河川法人化」，以「流域共同體」為行動核心。\n\n官網寫到「三年的長期踏查蹲點」；計畫分為小計畫、水計畫、竹材計畫、潛行攝影計畫、植生計畫、土壤計畫、農計畫、聲音計畫、原計畫九個單元，串連上游鄒族部落、中游曲流鄉村與下游水圳田塭的在地夥伴。\n\n並辦理「萬物議會」與「小事報」新聞營等公民參與活動，另有三項聯合展演。報導者「潛行攝影計畫」專題則記錄多位攝影與文字創作者沿流域長期蹲點，拍到鄒族現代獵人、芒果果農、「掌水人」與多元文化家庭青年。", "selfDesc": "官方網站「關於」頁自稱這是「全國首屆」以溪流全域為主體的大地藝術季，長期目標為「河川法人化」，以「流域共同體」為行動與意識的核心，號召民眾「以身體交換身體」走入溪流萬物的生命場域；頁面並寫到「三年的長期踏查蹲點」與「三年的踏查調研」，列出九大子計畫與三項聯合展演（2022再壹波藝術節、簡吉與日治台灣農民運動特展、「曾文溪的一千個名字＋1大埔篇：水鄉藝術行動」），並寫到串連上游鄒族部落、中游曲流鄉村與下游水圳田塭的在地夥伴，透過「萬物議會」與「小事報」新聞營推動公民參與與公民審議。風傳媒（2022）稱它是「台灣首個聚焦溪流權益的藝術季」，由臺南市文化局主辦，並寫到邀請嘉義縣政府與水利署簽署流域治理協議（是否完成簽署該文未寫）。報導者「潛行攝影計畫」專題則記錄多位攝影與文字創作者沿流域長期蹲點，拍到鄒族現代獵人、芒果果農、「掌水人」與多元文化家庭青年。", "editNote": "", "educatorRole": "mixed", "pedagogicalInsight":"「一條河有一千個名字」是很好用的課堂提問：同一條溪，在獵人、果農、掌水人和孩子口中叫什麼、怎麼被使用？帶學生沿著水圳、排水溝或小河，蒐集大家對它的稱呼和用水故事，議題就從居民的說法裡長出來。這個案例也示範「先蹲點、再策展」。要留意的是，它是「倡議型」藝術季，「河川法人化」的目標一開始就設定好了，用在課堂時可以多問一層：這個立場是怎麼來的？學生可以不同意嗎？官網只寫了「萬物議會」「小事報」新聞營的名稱，沒有寫怎麼帶領，要借用請先查原主辦單位的做法。",
 techniques:[{t:"用「一條河有一千個名字」當提問，蒐集獵人、果農、掌水人與孩子對同一條溪的稱呼與用水故事。",te:"Use “a river with a thousand names” as a question, collecting what hunters, fruit growers, water keepers and children call the same stream and their water-use stories."},{t:"先長期蹲點踏查，再策展。",te:"Stay and survey for a long time first, then curate."},{t:"串連上、中、下游的在地夥伴，並用「萬物議會」等公民參與活動讓議題被討論。",te:"Link local partners upstream, midstream and downstream, and use civic participation activities such as the “Parliament of All Things” to get the issue discussed."},{t:"帶學生追問：這個立場是怎麼來的？可以不同意嗎？",te:"Ask students: where did this stance come from? Can you disagree?"}], "ibaeContext": ["地", "人"], "ibaeOrigin": "between", "sources": [["2022 Mattauw 大地藝術季官方網站「關於」頁", "https://tyart.tnc.gov.tw/mattauw2022/about/index.htm", 1], ["台灣首次以溪流權益為主的「2022 Mattauw大地藝術季」台南盛大登場（風傳媒）", "https://www.storm.mg/lifestyle/4567144"], ["2022 Mattauw 大地藝術季「潛行攝影計畫」專題（報導者；藝術季子計畫產出）", "https://www.twreporter.org/topics/photo-2022-mattauw-triennial-sneak-photography-project"], ["Mattauw 大地藝術季獲日本 GOOD DESIGN 金獎（工商時報，2023-10-05）", "https://www.ctee.com.tw/news/20231005701324-431401"]], "story": null, "status": "已查證", "statusWhy": "官網（主辦方自述）、風傳媒與報導者專題對主辦單位、總策展人、展期、展區與主題的說法一致，工商時報（2023）另寫主辦單位與總策展人；但報導者專題是藝術季子計畫產出，不算獨立來源，屆次與頻率、居民參與程度仍有未確認處，已在備註寫明（2026 年 11 月）。"},
{"id": "k48", "name": "大溪大禧（系列）", "en": "Daxi Daxi (series)", "creator": "桃園市政府文化局、桃園市立大溪木藝生態博物館（主辦）；設計師廖小子（四屆主視覺）；衍序規劃設計（執行、專書）", "city": "桃園", "place": "桃園市大溪區，大溪普濟堂與老城區（老街）", "year": "2018 年起（系列；已知 2022 年 7/2–7/22、2026 年 7/18 開幕兩屆內容）", "yk": 2026,"yk0": 2018, "yd": "2018 起", "yde": "From 2018", "issue": ["地方記憶"], "form": ["表演", "裝置", "展覽", "聲音"], "practice": ["藝術節與駐村", "社區藝術"], "audience": ["地方居民"], "summary":"大溪普濟堂關聖帝君聖誕的祝壽遶境（農曆六月廿四，被稱為大溪人的「第二個過年」）原是居民自發的信仰慶典。桃園市立大溪木藝生態博物館自 2018 年起，以博物館方法把它做成節慶品牌「大溪大禧」，核心理念是「體驗×參與×復振」，由設計師廖小子操刀四屆主視覺。\n\n2022 年版（7/2–7/22）推出立體繪本《大溪大禧》與教案、神將互動特展《舞德殿》，並邀民眾佩戴神將紙帽加入「與神同巡」遶境；2026 年版（7/18 開幕）以「慶典音樂」為主軸，32 個社頭齊聚、約 40 場系列活動，其中「聲聲不息音樂會」由 9 個社頭與流行音樂團隊合作。\n\n慶典由廟方、志工、大溪各行各業與各地社頭共同參與；社頭是依同行業或地緣自發組成的遶境團體。平台只讀到 2022、2026 兩屆的較完整內容，其餘屆別未詳查。", "selfDesc": "官方頁面（木博館）把大溪大禧定位為「傳承百年無形文化資產」的保存與再現，理念是以大溪現地為展演場域，促進居民與商家參與、觀眾體驗學習；並說明參與者包括廟方人員、志工、大溪百工百業與各地社頭，社頭是地方自發組成的遶境團體，常因同行業或地緣關係形成（例如牛犁陣、墨斗陣、土水仙童）。VERSE 專書座談（2023）寫到大溪大禧自 2018 年起籌辦、由衍序規劃設計與木博館完成專書、廖小子設計四屆主視覺，並把它定位為「一場跨越當代設計與民俗信仰的城市祭典」。美麗佳人（2022）記錄立體繪本《大溪大禧》（廖小子任藝術總監）、神將特展《舞德殿》（含「正氣步」學習裝置）、「與神同巡」發放神將紙帽、與維大力聯名的「關公維大力」「神龍沙士」、以及「大溪大禧正氣包」與紀念平安符等商品。風傳媒（2026）寫到文化局以「體驗、參與、復振」為核心、策展設計有居民社頭與店家共同參與。", "editNote": "", "educatorRole": "mixed", "pedagogicalInsight":"這個案例示範「怎麼把既有的在地傳統，轉成外人與年輕人進得去的現場」。重點不是博物館發明了什麼，而是用設計與體驗裝置把旁觀者變成參與者：神將紙帽讓民眾走進遶境，「正氣步」學習裝置讓人用身體理解神將，繪本與教案讓大溪人學會把自己的慶典說成故事。可借鏡的是先找到社區已經在做的事，再設計「參與的入口」；社頭是依同行業或地緣組成的既有團體，不是個人。另一個可以和學生一起追問的張力是商品化：關公聯名汽水、正氣包，是讓更多人進入慶典，還是把信仰變成消費？這題沒有標準答案，適合課堂辯論。",
 techniques:[{t:"先找到社區已經在做的事（遶境），再設計「參與的入口」，而不是從零發明活動。",te:"First find what the community already does (the procession), then design an “entrance for participation”, instead of inventing an event from zero."},{t:"用神將紙帽、「正氣步」學習裝置，讓旁觀者用身體走進慶典。",te:"Use paper generals’ hats and the “Righteous Step” learning device to bring onlookers into the festival through the body."},{t:"用繪本與教案，讓在地人學會把自己的慶典說成故事。",te:"Use a picture book and lesson plans so locals learn to tell their own festival as a story."},{t:"和學生辯論商品化：聯名商品是讓更多人進入慶典，還是把信仰變成消費？",te:"Debate commercialisation with students: do co-branded products bring more people in, or turn faith into consumption?"}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "between", "sources": [["大溪大禧官方頁面（桃園市立大溪木藝生態博物館）", "https://daxidaxi.tycg.gov.tw/web/daxidaxi/Overview", 1], ["大溪大禧專書座談：跨越當代設計與民俗信仰的城市祭典（VERSE，2023）", "https://www.verse.com.tw/article/daxidaxi-discussion"], ["2022 大溪大禧報導（美麗佳人，2022）", "https://www.marieclaire.com.tw/lifestyle/art/66684"], ["2026 大溪大禧報導（風傳媒，2026）", "https://www.storm.mg/article/11150452"]], "story": null, "status": "已查證", "statusWhy": "已查證：官方頁面與三家不同媒體（VERSE 2023、美麗佳人 2022、風傳媒 2026）對主辦、理念（體驗×參與×復振）、廖小子四屆主視覺與社頭參與等核心事實互相印證。少數細節（起始年份 2018、32 社頭／約 40 場）仍各見於單一來源，已於備註標明。"},
{"id": "k49", "name": "寶藏巖「藝居共生」聚落（系列）", "en": "Treasure Hill 'art-and-living coexistence' settlement (series)", "creator": "臺北市政府文化局、財團法人臺北市文化基金會藝術村營運部（營運）；駐村藝術家與原居民；陶藝家周靈芝（2008 年進駐，與居民共同設計共生菜園）", "city": "台北", "place": "臺北市中正區，寶藏巖聚落", "year": "聚落主體為 1960–70 年代違建（官網）；2004 登錄歷史聚落、2010-10-02 基金會接管藝術村，持續至今", "yk": 2026,"yk0": 2004, "yd": "2004 起", "yde": "From 2004", "issue": ["社宅與居住", "身分與歷史記憶", "地方記憶"], "form": ["裝置"], "practice": ["社會參與式藝術", "社區藝術", "藝術節與駐村"], "audience": ["地方居民", "長者"], "summary":"寶藏巖是退伍老兵在臺北公館山坡自力搭建的違章聚落，1980 年被劃為公園用地，後在居民陳情與學界、文史團體推動下，2004 年登錄為歷史聚落保存下來。臺北市政府文化局把它規劃為住戶與藝術村並存的「藝居共生」聚落，由臺北市文化基金會營運，2010 年 10 月 2 日正式接管寶藏巖國際藝術村。\n\n藝術家進駐後，與居民辦「一家一菜」共食、每年三月的光節（光雕），並共同開闢共生菜園、協助原居民經營「寶村柑仔店」。官網坦言「藝居共生」的「居」原先針對社區居民，後來已擴大為聚落內各單位與進駐者。\n\n但保存過程伴隨 2006 年居民遷離的爭議，居民人數持續減少，現仍有 19 戶原居民；學者也批評藝術家與居民的互動「依舊太少」，並把這個保存過程分析為一種「博物館化」。聚落保存了，卻不一定保住了人。", "selfDesc": "官網說「藝居共生」以「用藝、居共構」活化寶藏巖，並坦言「居」原先針對社區居民、後來已擴大為聚落內各單位與進駐者；聚落由 1960、70 年代的違章建築形成，2004 年登錄歷史聚落，文化局自 2006 年底起進行修繕，二十餘年來（臺北國際藝術村與寶藏巖合計）接待超過 500 位、來自 40 多個國家的創作者。輔大生命力新聞（刊於 PeoPo，2023-11-03）記錄居民參與：約每兩個月一次「一家一菜」居民與藝術家共餐；每年三月光節後居民也在菜園創作，前幾年光節留下的大竹籠被居民拿去養雞養鵝；「寶村柑仔店」由秋紅阿姨在藝術村協助下經營、週二週四供「寶村便當」；周靈芝 2008 年進駐、與居民共同設計共生菜園；初期有年長榮民要藝術家出示「居住證」、揮拐杖驅趕，遊客也曾誤闖住家，藝術村以姓氏告示牌與紅龍保護隱私；現仍有 19 戶原居民。公視我們的島（2007 年文章，本次未能重新讀取）據使用者整理寫到 2006 年六十多戶搬離、實際入住中繼住宅僅 16 戶、有居民質疑是變相驅離。眼底城事劉可強（2021-01-06）指居民持續減少、依現行資格限制聚落住居區約十年內可能無人，藝術家與居民互動「依舊太少」，且一間影視實驗教育機構占用了原保留給居民、因居民減少而空出的房舍。倫敦國王學院 Igor Rogelja 的學術論文把這個保存過程分析為一種『博物館化』：市府 2006 年提出三種補償／安置方案後，於 2006-12-22 清村、2007-01-30 由鎮暴警察清場，整修後房舍以 12 年租約出租，住戶由遷離前逾 70 戶降到 2014 年 21 戶、2018 年 19 戶，作者批評這讓居民與藝術家成了被觀看的『活體透視模型』。", "editNote": "", "educatorRole": "mixed", "pedagogicalInsight":"這是討論「藝術進駐一個還有人住、而且有歷史傷痕的地方時，會發生什麼」最好的案例，正反都要看。正面可借鏡的是把共同生活本身當成方法：一家一菜、共生菜園、柑仔店，不是辦一場活動，而是讓藝術家和居民在日常裡慢慢發生關係；光節之後居民自己也在菜園創作、大竹籠被拿去養雞鵝，是居民把藝術「接管」成生活的例子。更重要的教材是它的裂縫：官網把「居」從原居民擴大到各進駐單位，學者卻指出居民持續減少、互動「依舊太少」。帶學生時可以追問：說「共生」時誰的「居」被算進去？保存了房子，是不是就等於保住了人？學者 Rogelja 的批評可當成更尖銳的提問：當被保存的居民變成被觀看的「活體透視模型」，保存到底是為了誰？",
 techniques:[{t:"用「一家一菜」共食與共生菜園，讓藝術家和居民在日常裡慢慢發生關係。",te:"Use shared “one dish each” meals and a shared garden so artists and residents build relations slowly in daily life.",m:"food"},{t:"讓居民把藝術接管成生活（光節後的大竹籠被拿去養雞養鵝）。",te:"Let residents take art over into daily life (the big bamboo cages after the Lantern Festival were used to raise chickens and geese)."},{t:"保護住戶隱私：用姓氏告示牌與紅龍，避免遊客誤闖住家。",te:"Protect residents’ privacy: use surname signs and ropes so visitors do not wander into homes."},{t:"追問：說「共生」時誰的「居」被算進去？保存了房子，是不是等於保住了人？",te:"Ask: when we say “co-living”, whose “residence” is counted? Does keeping the houses mean keeping the people?"}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "between", "sources": [["寶藏巖國際藝術村官網「關於我們」", "https://www.artistvillage.org/about.php", 1], ["寶藏巖藝居共生：一家一菜、光節與寶村柑仔店（輔大生命力新聞，刊於 PeoPo，2023-11-03）", "https://www.peopo.org/news/658604"], ["公視我們的島：寶藏巖（2007 年文章；本次未能重新讀取，內容依使用者整理）", "https://ourisland.pts.org.tw/content/1341"], ["劉可強〈寶藏巖共生聚落的下一步〉（眼底城事，2021-01-06）", "https://eyesonplace.net/2021/01/06/16045/"], ["Treasure Hill residents move out as renovation begins（Taipei Times，2006-12-23；2006 遷離的獨立佐證）", "https://www.taipeitimes.com/News/taiwan/archives/2006/12/23/2003341567"], ["Igor Rogelja，《The Museumification of Treasure Hill》（倫敦國王學院；引用臺北市政府 2001／2004／2006 官方文件）", "https://discovery-pp.ucl.ac.uk/10092594/3/Rogelja_The%20Museumification%20of%20Treasure%20Hill%20RPS.pdf"], ["寶藏巖清村抗爭報導（自由時報，2006-12-23，鄭學庸；經 Soundtraces 時間軸轉載）", "https://soundtraces.tw/?p=102737"], ["寶藏巖藝術村 北市首座指定歷史聚落（公視新聞 PNN，2018-06-08）", "https://news.pts.org.tw/article/396314"]], "story": null, "status": "已查證", "statusWhy": "已查證：核心事實（違建聚落保存為歷史聚落、藝居共生、2006 年三選項遷離與清村、戶數由遷離前逾 70 戶降至約 19 戶、博物館化爭議）由官網、Rogelja 學術論文（引用臺北市官方文件）、自由時報 2006、眼底城事學者文、公視多方互證。居民共創的具體活動（一家一菜、光節、寶村柑仔店）目前仍只有輔大生命力新聞一個來源，已於備註標明。"},
{"id": "k50", "name": "十六歲正青春藝術節（系列，含青少年扮戲計畫）", "en": "Sixteen Coming-of-Age Youth Arts Festival (series, incl. the Youth Playmaking Project)", "creator": "臺南市政府文化局（主辦）；影響．新劇場（青少年扮戲計畫合作，藝術總監呂毅新，依 2017 年報導）；獲文化部、台積電文教基金會支持", "city": "台南", "place": "臺南市（2026 年據點：台南文化中心、台江文化中心、吳園公會堂、台南市立圖書館新總館）", "year": "約 2015 年起（依屆次推算，來源未直接寫起始年）；2017 扮戲計畫第 3 年、2025 第 11 屆、2026 第 12 年", "yk": 2026,"yk0": 2015, "yd": "約 2015 起", "yde": "From ~2015", "issue": ["身分與歷史記憶", "地方記憶"], "form": ["表演", "展覽", "工作坊"], "practice": ["藝術教育", "藝術節與駐村"], "audience": ["青少年", "長者", "地方居民"], "summary":"臺南府城有「做十六歲」的成年禮傳統，市府文化局把它轉化為每年暑假的青少年藝術節。約 2015 年起辦理（來源未直接寫起始年，依屆次推算），核心的「青少年扮戲計畫」招募 16 至 18 歲高中職學生，經半年、三階段培訓後，由青少年集體創作並公開售票演出一部原創劇作。\n\n2017 年（當時名為「十六歲小戲節」）扮戲計畫邁入第 3 年，17 所高中近 50 位學生創作《萬花筒》；2025 年第 11 屆（7/5–8/31，主題「Real Me 真實的我」）招募 48 名學員、推出第 11 部劇作《Authentic》，另有街頭文化月、視覺展、週末講座與戶外展演市集。\n\n2026 年第 12 年（7/18–8/23，主題「Touch 青春的頻率」）推出第 12 部劇作《觸 Feel Seen》，招募台南、雲林、高雄 19 個行政區、16 所高中職青少年，並辦青少年劇場觀察員與社區樂齡「互動GO」。", "selfDesc": "中國時報（2017-03-23）報導，臺南市文化局與影響．新劇場合作的青少年劇場「十六歲小戲節─少年扮戲計畫」邁入第 3 年，3 月起經半年、三階段戲劇培訓，17 所高中近 50 位學生以府城十六歲成年禮為發想、集體創作《萬花筒》，8 月於台南文化中心原生劇場演出，計畫結合藝術與生命教育課程、由影響新劇場藝術總監呂毅新主持，獲台積電文教基金會支持。聯合報（2025）報導第 11 屆（7/5–8/31，主題「Real Me 真實的我」），扮戲計畫 3 月起招募 48 名 16–18 歲學員、推出第 11 部原創劇作《Authentic》（8/15–17 共 4 場），文中稱已累積 536 位學員參與、帶動逾四萬人次，民國 97 年 9 月至 98 年 8 月出生者完成成年禮可領限量紀念品，另有七月街頭文化月（嘻哈、街舞、塗鴉、DJ）、八月視覺展與八場週末講座、8/16–17 戶外展演市集。聯合報（2026）報導邁入第 12 年（7/18–8/23，主題「Touch 青春的頻率」），扮戲計畫招募台南、雲林、高雄 19 個行政區、16 所高中職青少年創作第 12 部劇作《觸 Feel Seen》（8/22–23 台江劇場、OPENTIX 售票），並辦青少年劇場觀察員與社區樂齡互動GO。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"這是把在地成年禮傳統變成青少年自己創作平台的好案例。最值得借鏡的是完整的弧線：半年、三階段培訓，青少年從自己的生命經驗集體創作一齣戲，再真的對外售票公開演出。這把青少年當成真正的創作者，而不是做一個交差的習作，「真的要演給人看、還要賣票」本身就是很強的學習動力。用「做十六歲」這個在地成年禮當主題，也讓抽象的「自我認同／長大」變得具體、和自己的城市有關；帶領者可以找一個學生生活裡真實存在的儀式或節點切入，而不是空談「你是誰」。要留意的是，這是市府主辦的大型藝術節，另有票務、市集與紀念品等推廣成分；屬於藝術教育核心的是扮戲計畫的培訓與集體創作，藝術節外層比較是城市品牌，帶學生參照時可以分開看。",
 techniques:[{t:"用「做十六歲」這個在地成年禮當主題，讓「自我認同」變得具體、和自己的城市有關。",te:"Use “doing sixteen”, a local rite, as the theme so “identity” becomes concrete and tied to their own city."},{t:"半年、三階段培訓，讓青少年從自己的生命經驗集體創作一齣戲。",te:"Six months and three stages of training so youths collectively create a play from their own life experience.",m:"theatre"},{t:"真的公開演出並售票，把青少年當成真正的創作者。",te:"Really perform publicly with tickets, treating young people as real creators.",m:"theatre"},{t:"帶學生把藝術節的城市品牌外層與扮戲計畫的培訓核心分開看。",te:"Help students separate the festival’s city-branding layer from the training core of the play project."}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "between", "sources": [["官方粉絲專頁「十六歲正青春藝術節」（官方管道；內容本平台未能讀取）", "https://www.facebook.com/sixteenfestival/", 1], ["臺南觀光旅遊局活動頁（臺南市政府觀光旅遊局，2016 發布）", "https://twtainan.net/en/event-calendar/details/3421/", 1], ["2026 第 12 年「Touch 青春的頻率」（聯合報，2026）", "https://udn.com/news/story/7326/9615270"], ["2025 第 11 屆「Real Me 真實的我」（聯合報，2025）", "https://udn.com/news/story/7326/8850379"], ["2025 第 11 屆（中華日報，2025；與聯合報該篇疑似同一新聞稿）", "https://www.cdns.com.tw/articles/1246759"], ["2017「十六歲小戲節─少年扮戲計畫」第 3 年《萬花筒》（中國時報，2017-03-23）", "https://www.chinatimes.com/realtimenews/20170323003857-260508"]], "story": null, "status": "已查證", "statusWhy": "已查證：藝術節的存在與逐年持續由不同年度、不同媒體（中國時報 2017、聯合報 2026）互相印證，核心可靠。各年細節多為新聞稿風格、部分為單一來源（且 2025 年的聯合報與中華日報研判同一新聞稿、不算獨立），已於備註標明。"},
{"id": "k51", "name": "石岡媽媽劇團", "en": "Shigang Mama Theatre", "creator": "石岡媽媽劇團（成員多為石岡客庄的客家婦女與勞動女性、素人，團長楊珍珍）；差事劇團（藝術總監鍾喬）協力輔導成團；導演李秀珣（資深民眾戲劇工作者）", "city": "台中", "place": "臺中市石岡區（客庄）", "year": "2000 年成立（源於 1999 年 921 後差事劇團在石岡、東勢災區的民眾戲劇工作坊）；代表作《梨花心地》為 2021 年 20 周年製作", "yk": 2000, "yd": "2000 成立", "yde": "Founded 2000", "issue": ["災害與創傷", "性別", "客家文化"], "form": ["表演", "影像"], "practice": ["社區藝術", "社會參與式藝術"], "audience": ["地方居民", "長者"], "summary":"石岡媽媽劇團源於 1999 年 921 地震：差事劇團（鍾喬、李秀珣）在石岡、東勢災區與受災婦女辦民眾戲劇工作坊，戲劇班的媽媽們不願解散，2000 年起在差事協力輔導下組成由成員自治的社區劇團。成員多為因婚姻來到石岡的客家婦女，長期以自己的農務與日常勞動（採梨、洗衣、炒菜）為素材，用素人身體創作。\n\n2021 年 20 周年作品《梨花心地》由成員自己演出，劇本由全體團員共同編寫、再由專業導演修整；開場以紀錄影片回顧劇團歷程，再以採梨、洗衣的勞動開場並邀觀眾一起到石岡種梨。\n\n作品處理客家女性在父權宗法制度中的處境、家族重建與自我認同。2023 年差事劇團製作的《千年之遇》則由石岡媽媽劇團與在地居民同台演出。", "selfDesc": "表演藝術評論台（許仁豪，2021-03-17）寫到，1999 年 921 後差事劇團的鍾喬與李秀珣到台中石岡客家村做心靈重建，一年後戲劇班的媽媽們不願解散、隔年成團，團長楊珍珍、導演李秀珣；評論指出成員多因婚姻來到石岡，面對客家父權宗法的限制（不得參與家族事務、洗衣等勞動的性別規訓），以採梨、洗衣、炒菜、殺雞等勞動為素材，開場以紀錄影片回顧劇團歷史、並邀觀眾到石岡一起種梨。國藝會補助成果檔案記載《梨花心地》（石岡媽媽劇團，差事劇團提供、負責人鍾政瑩）2020 年常態補助、2021/3/12–13 於寶藏巖藝術村山城廣場演出 2 場共 144 人次，李秀珣導演、藝術總監鍾喬編導修整，劇本由全體團員共同編寫，自 2005 年起以《梨花》劇名巡迴。差事劇團網站則自述 1996 年成立、1999 年在東勢石岡與受災婦女辦民眾戲劇工作坊、2000 年起協力輔導石岡媽媽劇團。中時（陳淑芬，2023-02-22）寫到《千年之遇》為差事劇團的客家當代戲劇新作、由在地居民創立的石岡媽媽劇團與在地居民同台，2022 年 11 月在石岡演環境劇場版、2023 年與台中國家歌劇院及客委會合作於歌劇院小劇場演出。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"這是台灣少見、持續超過二十年的素人社區劇場，對帶領者是一座寶庫。核心的可借鏡是「從參與者自己的身體與勞動出發」：採梨、洗衣、炒菜這些日常勞動被轉化為表演素材與儀式，而不是發一個劇本給大家演。劇本由全體團員共同編寫、再由專業導演修整，示範了素人自主與專業引導怎麼平衡。開場用紀錄影片回顧劇團自己的歷程，讓參與者先看見「我們是誰、走到哪裡」；結尾邀觀眾一起到石岡種梨，把觀眾也從旁觀者變成參與者。對教育者的提醒是時間尺度：它的深度來自二十年的長期陪伴，不是一次性工作坊。背後有差事劇團與李秀珣的專業引導，帶領這類劇場時，如何不讓專業蓋過素人的聲音，是要一直自問的課題。",
 techniques:[{t:"從參與者自己的身體與勞動（採梨、洗衣、炒菜）出發，轉化為表演素材。",te:"Start from participants’ own bodies and labour (picking pears, washing clothes, stir-frying) and turn them into performance material.",m:"theatre"},{t:"劇本由全體團員共同編寫，再由專業導演修整，平衡素人自主與專業引導。",te:"The script is co-written by all members and edited by a professional director, balancing amateur autonomy and professional guidance.",m:"theatre"},{t:"開場用紀錄影片回顧團史，讓參與者先看見「我們是誰、走到哪裡」。",te:"Open with a documentary on the troupe’s history so participants first see who they are and how far they have come."},{t:"結尾邀觀眾一起去種梨，把旁觀者變成參與者。",te:"End by inviting the audience to plant pears together, turning onlookers into participants."}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "context", "sources": [["差事劇團與石岡媽媽劇團（差事劇團 multitude.asia）：協力團體自述，1999 東勢石岡民眾戲劇工作坊、2000 起協力輔導成團", "https://www.multitude.asia/archives/314", 1], ["石岡媽媽劇團《梨花心地》補助成果（國藝會補助成果檔案庫）：2020 補助、2021/3/12–13 寶藏巖 2 場 144 人次、李秀珣導演、鍾喬編導修整、全體團員共同編寫", "https://archive.ncafroc.org.tw/result?id=ab744f2175384baa9fc6063a581e6fb4", 1], ["石岡媽媽劇團《梨花心地》劇評（表演藝術評論台，許仁豪，2021-03-17）", "https://pareviews.ncafroc.org.tw/?p=65687"], ["石岡媽媽劇團《梨花心地》（關鍵評論網）", "https://www.thenewslens.com/article/146806"], ["農村婦女劇場（關鍵評論網）", "https://www.thenewslens.com/article/134170"], ["《千年之遇》差事劇團×石岡媽媽劇團（中時，2023-02-22，陳淑芬）", "https://www.chinatimes.com/realtimenews/20230222004317-264211"]], "story": null, "status": "已查證", "statusWhy": "已查證：成立脈絡（1999 921 後差事劇團在石岡輔導、2000 成團）由關鍵評論網、表演藝術評論台與差事劇團自述一致；劇團由石岡客家婦女組成、以勞動為素材、居民長期參與，由表演藝術評論台劇評、中時、國藝會補助成果檔案等多個獨立來源互相印證。"},
{"id": "k52", "name": "共創藤牛光之影計畫（大村貢旗社區藤牛裝置）", "en": "", "creator": "大葉大學設計學系賴建源（USR Hub「傳統新生」計畫）、造形藝術學系吉田敦；格瑋國際有限公司；貢旗社區發展協會（總幹事賴國淮）", "city": "彰化", "place": "彰化縣大村鄉貢旗社區中心兒童公園", "year": "2024（報導 2024/11/28）", "yk": 2024, "yd": "2024", "yde": "2024", "issue": ["環境"], "form": ["裝置"], "practice": ["公共藝術", "社區藝術"], "audience": ["地方居民"], "summary":"大葉大學設計學系與造形藝術學系師生，與彰化縣大村鄉貢旗社區志工合作，以廢棄葡萄藤為材料，在社區中心兒童公園完成一件高約三公尺的藤牛裝置，象徵農村的堅韌與創新。\n\n這是大葉大學 USR 計畫的一部分（設計系賴建源「傳統新生」、造形藝術系吉田敦），報導日期為 2024 年 11 月 28 日。\n\n社區總幹事形容過程歷經時間與空間的多項挑戰；計畫獲文化部、彰化生活美學館、大村鄉公所等支持。志工人數、工作坊次數與落成日期來源未載。", "selfDesc": "1111 新聞（校方供稿）寫到，作品以廢棄葡萄藤製作、高約三公尺，由大葉大學設計學系與造形藝術學系師生與貢旗社區志工共同完成，計畫獲文化部、彰化生活美學館、大村鄉公所等支持。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"把廢棄葡萄藤變成三公尺高的藤牛，讓大學師生與社區志工共同動手，對帶 USR 或社區的老師，示範了用「在地廢材＋共同製作」凝聚社區。要提醒的是：議題偏地方凝聚、社會性較淡，適合當「材料轉化與社區協作」的例子，而非議題深掘。",
 techniques:[{t:"用在地廢材（廢棄葡萄藤）當創作材料。",te:"Use local waste material (discarded grapevines) as the making material.",m:"material"},{t:"大學師生與社區志工共同動手製作。",te:"University staff, students and community volunteers make it together."},{t:"把作品放在社區兒童公園，成為社區日常空間的一部分。",te:"Place the work in the community’s children’s park so it becomes part of everyday community space."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "between", "sources": [["大葉大學設計系、造藝系攜手貢旗社區 葡萄藤變身藤牛裝置藝術（1111 新聞，校方供稿）", "https://www.1111.com.tw/news/jobns/158352"]], "story": null, "status": "待查證", "statusWhy": "待查證：目前僅 1111 新聞（校方供稿）單一來源。材料、尺寸、參與單位與支持機關為稿中所寫，稿中明說學生與社區志工共同完成；志工人數、工作坊次數與落成日期待補。（每日來源擴充，2026-11-19：再次上網查找 1111 校方供稿以外的獨立來源，僅查得大葉大學 2025–2026 年與貢旗社區「青銀共學／大村共創」USR 系列報導，多為校方供稿或同系轉載，且主題為青銀共學、健康福祉，非 2024 年的廢葡萄藤藤牛裝置，無法佐證本筆；故維持待查證、不新增來源。）"},
{"id": "k53", "name": "鹿港今秋藝術節", "en": "", "creator": "鹿港囝仔文化事業（策展人張敬業）、彰化縣保鹿運動協會", "city": "彰化", "place": "彰化縣鹿港鎮（老屋、街區與在地店家）", "year": "2015 年首屆（原名「鹿港藝術節：今秋會」）起，約隔年舉辦", "yk": 2023, "yk0": 2015, "yd": "2015 起", "yde": "From 2015", "issue": ["地方記憶", "都市發展"], "form": ["展覽", "表演"], "practice": "藝術節與駐村", "audience": ["地方居民"], "summary":"鹿港今秋藝術節是返鄉青年張敬業以「保鹿運動」累積社區動能後，於 2015 年發起的民間自籌藝術節，首屆原名「鹿港藝術節：今秋會」，約隔年舉辦（天下寫「每兩年一次」）。\n\n藝術節與在地店家與老屋合作，把展覽空間延伸為日常生活場所（如家庭餐廳、酒吧、青創基地），以街區策展、散策、表演、電影與講座翻轉外界對鹿港的觀光刻板印象。\n\nPAR 表演藝術雜誌報導指出，策展者原本想辦給在地人，但參與者多為外地人，在地人則漸漸習慣這個節慶的存在。某一屆的檔期與近年是否續辦，來源未載或未標年份。", "selfDesc": "PAR 表演藝術雜誌報導指出，策展者原本想辦給在地人，但參與者多為外地人，在地人則漸漸習慣這個節慶的存在。天下雜誌與微笑台灣亦報導張敬業與鹿港囝仔自 2015 年發起今秋藝術節、與在地店家與老屋合作的脈絡。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"一個由返鄉青年自籌、辦進老屋與店家的民間藝術節，示範了把展覽空間延伸進餐廳、酒吧等日常場所。PAR 指出策展者原想辦給在地人、實際來的多是外地人，這個「辦給誰／誰會來」的落差，本身就是地方藝術節值得和學生討論的課題。",
 techniques:[{t:"與在地店家和老屋合作，把展覽空間延伸進餐廳、酒吧等日常場所。",te:"Work with local shops and old houses to extend exhibition space into everyday places such as restaurants and bars."},{t:"以街區策展、散策、表演、電影與講座，翻轉外界對地方的觀光刻板印象。",te:"Use neighbourhood curating, walking tours, performances, film and talks to overturn tourist stereotypes of the place."},{t:"和學生討論：藝術節辦給誰？實際來的又是誰？",te:"Discuss with students: who is the festival for, and who actually comes?"}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["鹿港囝仔與今秋藝術節報導（天下雜誌）", "https://www.cw.com.tw/article/5126192"], ["鹿港囝仔用今秋藝術節點亮古城，建構地方支持網絡 為青年返鄉推一把（微笑台灣）", "https://smiletaiwan.cw.com.tw/article/6099"], ["鹿港今秋藝術節相關報導（PAR 表演藝術雜誌）", "https://par.npac-ntch.org/article/tag/1672424982662000"]], "story": null, "status": "已查證", "statusWhy": "已查證：鹿港今秋藝術節由鹿港囝仔（張敬業）自 2015 年發起、與在地店家及老屋合作等核心事實，由天下雜誌、微笑台灣與 PAR 表演藝術雜誌等多個獨立來源各自報導互證；惟三者多為人物／組織專題，未對照到同一屆的完整細節，特定屆次仍待查證。"},
{"id": "k54", "name": "金魚厝邊與頭城老街文化藝術季", "en": "", "creator": "金魚厝邊（創辦人彭仁鴻）；另有外地與國際藝術家參與街區創作", "city": "宜蘭", "place": "宜蘭縣頭城鎮（老街、老鎮長故居）", "year": "2014 年起（首屆頭城老街藝術季），後續每年舉辦", "yk": 2023, "yk0": 2014, "yd": "2014 起", "yde": "From 2014", "issue": ["地方記憶", "都市發展"], "form": ["展覽"], "practice": ["藝術節與駐村", "社區藝術"], "audience": ["地方居民"], "summary":"頭城人彭仁鴻在研究所畢業後回鄉工作，2014 年申請文化部青年村落計畫，籌辦第一屆頭城老街藝術季，其後每年舉辦。\n\n他後來創辦「金魚厝邊」，把老鎮長故居改成青銀共創空間，邀老藝術家與老技藝者擔任主角講述自己的故事，並讓外地與在地藝術家交流，也發行《青銀誌》。\n\n金魚厝邊是長期經營的地方創生組織，單一「計畫」邊界不清，收錄以組織／藝術季為單位；遠見城市學書摘提到阿根廷藝術家曾參與街區創作，近年屆次與規模來源未載。", "selfDesc": "新聞鏡頭、PeoPo 公民新聞、遠見城市學書摘與天下／微笑台灣等報導指出，彭仁鴻 2014 年申請文化部青年村落計畫後籌辦第一屆頭城老街藝術季，之後創辦金魚厝邊、經營青銀共創空間並發行《青銀誌》。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"彭仁鴻把老鎮長故居改成青銀共創空間，邀老藝術家與老技藝者當主角講自己的故事，示範了「讓長者當主角而非受訪者」。對帶跨世代或地方創生的人，重點是先長期蹲點累積社區關係，再談創作。",
 techniques:[{t:"讓老藝術家與老技藝者當主角講自己的故事，而不是被訪問的對象。",te:"Let elderly artists and craftspeople be the protagonists telling their own stories, not interviewees.",m:"oral"},{t:"把老鎮長故居改成青銀共創空間，讓不同世代共處創作。",te:"Turn the old mayor’s residence into a youth-and-elder co-creation space where generations make together.",m:"intergen"},{t:"先長期蹲點累積社區關係，再談創作。",te:"Stay long-term and build community relations first, then talk about making."}], "ibaeContext": ["地", "人", "時"], "ibaeOrigin": "context", "sources": [["金魚厝邊與頭城老街藝術季報導（PeoPo 公民新聞）", "https://www.peopo.org/news/330275"], ["彭仁鴻與頭城老街藝術季報導（聯合新聞網）", "https://udn.com/news/story/6845/9118610"], ["城市書摘《二地居：地方創生未來式》—「金魚厝邊」創辦人彭仁鴻，蹲點夠久就有機會被看見（遠見城市學）", "https://city.gvm.com.tw/article/82671"]], "story": null, "status": "已查證", "statusWhy": "已查證：金魚厝邊（彭仁鴻）自 2014 年籌辦頭城老街藝術季、創辦青銀共創空間與《青銀誌》等核心事實，由 PeoPo、聯合新聞網、遠見城市學與天下／微笑台灣等多個獨立來源報導互證；惟多為人物或組織專訪，未有某一屆的完整紀錄，特定屆次仍待查證。"},
{"id": "k55", "name": "這塊土地上不只有我們（華恆明、華伊達、華露莎父女聯展）", "en": "", "creator": "排灣族藝術家華恆明與女兒華伊達、華露莎；屏東縣政府（原住民族行政處）共同策劃", "city": "屏東", "place": "屏東縣，屏菸 1936 文化基地—屏東原民館", "year": "2025（中央社 2025-01-23；展至 4/27）", "yk": 2025, "yd": "2025", "yde": "2025", "issue": ["原住民族文化"], "form": ["工藝", "繪畫"], "practice": "策展與展覽", "audience": [], "summary":"三位排灣族藝術家華恆明、華伊達、華露莎（父女）把對家園與自由的嚮往，以及對自我、部落與所屬家族等多重身分的探索，融入刀具、繪畫與陶器創作；展覽於 2025 年在屏東屏菸 1936 文化基地的屏東原民館展出，展至 4 月 27 日。\n\n展覽由屏東縣政府原住民族行政處與三位藝術家共同策劃，主題環繞家族（Mavaliu）、部落與土地共享（排灣語「BALILAOU」）。\n\n屏東縣原民處說明，策展概念來自恆春半島曾是不同族群共享的土地，在多元身分認同並存時難免產生分歧與衝突。這是個人／家族創作展，沒有居民參與；作品是否涉及具體社會議題（如土地權益）來源未載。", "selfDesc": "中央社（2025-01-23）報導指出，展覽由屏東縣政府原住民族行政處與三位排灣族藝術家共同策劃，於屏菸 1936 文化基地的屏東原民館展出，主題環繞家族（Mavaliu）、部落與土地共享（排灣語『BALILAOU』）。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"這是一檔排灣族父女的創作聯展，沒有社群參與，適合當「看作品、談身分」的教材。可帶學生看三位創作者如何把對家園、自由與多重身分（自我／部落／家族）的探問，放進刀具、繪畫與陶器裡。它是作品導向，不是參與式工作坊。",
 techniques:[{t:"看三位創作者如何把對家園與自由的探問放進刀具、繪畫與陶器。",te:"See how the three makers put questions about home and freedom into knives, painting and pottery."},{t:"從自我、部落、家族三層身分，討論多重身分如何並存。",te:"Use the three layers of self, tribe and family to discuss how plural identities coexist."}], "ibaeContext": ["人"], "ibaeOrigin": "content", "sources": [["屏東原民館華恆明、華伊達、華露莎父女聯展報導（中央社，2025-01-23）", "https://www.cna.com.tw/news/acul/202501230363.aspx"], ["排灣族父女聯展『這塊土地上不只有我們』報導（台灣英文新聞）", "https://www.taiwannews.com.tw/zh/news/5891219"], ["『這塊土地上不只有我們』排灣藝術家父女屏東開展 秀南排灣生命力（聯合報／聯合新聞網）：獨立報導，以不同標題與行文佐證屏菸1936文化基地屏東原民館、華恆明與女兒華伊達／華露莎以刀具繪畫陶器創作、屏東縣政府原住民處、展至4/27、BALILAOU（讓不同族群共享土地）與Mavaliu家族主題", "https://udn.com/news/story/7327/8511250"]], "story": null, "status": "已查證", "statusWhy": "已查證：除中央社（2025-01-23）外，2026-11-19 另查得聯合報／聯合新聞網（標題『排灣藝術家父女屏東開展秀南排灣生命力』）以不同標題與行文獨立報導本展，佐證核心事實——屏菸 1936 文化基地屏東原民館、華恆明與女兒華伊達／華露莎以刀具／繪畫／陶器創作、屏東縣政府原住民處參與、展至 4/27、BALILAOU（讓不同族群共享這片土地）與 Mavaliu 家族擔任公正調解者等主題——與中央社互證，升為已查證。原台灣英文新聞與 94ipt 與中央社開頭相近、視為同源，不另計。屬個人／家族創作展、無居民參與，依標準2 身分認同收錄；是否涉及具體土地權益議題仍待補。聯合新聞網頁面未顯示記者署名與日期，若要完全排除轉稿可能可再覆核。（每日來源擴充，2026-11-19）"},
{"id": "k56", "name": "2025 落山風藝術季《看！海口 Hey, Haikou!》", "en": "Hey, Haikou!", "creator": "屏東縣政府；16 位台、法、美、日、墨藝術家（如山內庸資、游文富、陳淑燕、艾斯特．卡瑟爾、劉棟、張育嘉等）", "city": "屏東", "place": "屏東縣車城鄉海口村（村落、港灣、沙灘三展區與看海美術館）", "year": "2025/12/20–2026/3/1", "yk": 2026, "yk0": 2025, "yd": "2025–2026", "yde": "2025–2026", "issue": ["環境", "地方記憶"], "form": ["裝置", "雕塑"], "practice": "藝術節與駐村", "audience": ["地方居民"], "summary":"2025 落山風藝術季《看！海口 Hey, Haikou!》於 2025 年 12 月 20 日至 2026 年 3 月 1 日在屏東縣車城鄉海口村舉辦，策展以海口冬季特有的落山風為核心，集結國內外 16 位藝術家，作品散布在村落、港灣、沙灘三展區與看海美術館。\n\n藝術家進駐並依空間與環境創作：日本插畫家以貓狗雕像化身村落人物；游文富以竹編與塑膠椅改造廢棄石屋；活動中的「海口食堂」由日本料理職人與在地居民合作推出限定便當。\n\nNOWnews 另以 2024 年為第六屆報導。駐村時間長度、居民是否實際參與創作、氣候與漁村變遷是否為作品實際回應的內容，來源未載。", "selfDesc": "民報、聯合新聞網、台灣英文新聞與微笑台灣等報導指出，2025 落山風藝術季以《看！海口 Hey, Haikou!》為題，集結國內外 16 位藝術家於海口沙灘、港灣、村落與看海美術館展出；NOWnews 另以 2024 年為第六屆報導。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"這是偏觀光型的地景藝術節，對第一線教學的直接參考有限；比較可借鏡的是「海口食堂」，由日本料理職人與在地居民合作推出限定便當，示範了飲食可以是外來藝術家與在地社群接觸的媒介。要提醒的是：多數作品仍以藝術家駐地創作為主，居民參與零星。",
 techniques:[{t:"以「海口食堂」的限定便當，讓外來職人與在地居民合作。",te:"Use the “Haikou Canteen” limited lunch boxes to have visiting craftspeople and local residents cooperate.",m:"food"},{t:"用老屋與在地常見物（竹編、塑膠椅）改造廢棄石屋。",te:"Rebuild an abandoned stone house with everyday local things such as bamboo weaving and plastic chairs.",m:"material"},{t:"以當地特有的落山風作為策展核心。",te:"Take the local peculiar falling wind as the curatorial core."}], "ibaeContext": ["地", "時"], "ibaeOrigin": "content", "sources": [["屏東落山風藝術季開跑 歐美日台藝術家集結說在地故事（民報）", "https://www.peoplenews.tw/?p=8845"], ["屏東落山風藝術季登場 16名藝術家大型作品驚豔開箱（聯合新聞網）", "https://udn.com/news/story/7327/9215649"], ["2025 落山風藝術季《看！海口 Hey, Haikou!》報導（台灣英文新聞）", "https://www.taiwannews.com.tw/zh/news/6275861"]], "story": null, "status": "待查證", "statusWhy": "待查證：2025 落山風藝術季《看！海口 Hey, Haikou!》由多家媒體（民報、聯合新聞網、台灣英文新聞、微笑台灣）報導，但多為活動宣傳稿或縣府提供資料，居民參與證據弱（僅『海口食堂』與老屋改造零星描述），故列待查證。駐村時間長度、居民是否實際參與創作待補。"},
{"id": "k57", "name": "《裹山》Dungku Asang（林介文／Labay Eyong）", "en": "Dungku Asang", "creator": "林介文（Labay Eyong，花蓮紅葉部落太魯閣族）與部落女性織者", "city": "花蓮", "place": "花蓮縣萬榮鄉紅葉部落一帶的瑞欣礦區", "year": "2021（2020 入圍台新藝術獎；台新獎頁面日期 2021/3/6–3/27）", "yk": 2021, "yd": "2021", "yde": "2021", "issue": ["環境", "原住民族文化"], "form": ["裝置", "工藝", "展覽"], "practice": ["社會參與式藝術", "策展與展覽"], "audience": ["地方居民"], "summary":"《裹山》Dungku Asang 是林介文（Labay Eyong）的作品，她邀請部落女性一同編織被毯，包覆在花蓮縣萬榮鄉紅葉部落一帶、亞泥與台泥開採的瑞欣礦區山上，作品入圍 2020 年台新藝術獎，台新獎頁面日期為 2021 年 3 月 6 日至 27 日。\n\n作品帶觀眾走進土地與傳統領域，回看歷史在山裡留下的痕跡，並彰顯女性的編織與文化特質。\n\n報導寫她把編織擴大為療癒的概念，把被開採的山視為受傷的身體。另有展覽簡介把「裹山」寫在「拉拜．伊勇」名下，應為 Labay Eyong 的不同中文譯名；展期與地點細節來源未全載。", "selfDesc": "關鍵評論網（新聞鏡頭）、台新藝術獎官網與中央研究院通訊等報導指出，林介文以被毯披覆礦山、入圍台新藝術獎；台新獎頁面標示日期為 2021/3/6–3/27。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"林介文邀部落女性一同編織被毯、包覆在被開採的礦山上，把「被開採的山」比作受傷的身體，示範了用集體編織這種女性的、在地的技藝，去回應礦業與傳統領域的議題。對談環境或原住民議題的老師，這是「用社群自己的技藝發聲」的高品質範例。",
 techniques:[{t:"邀部落女性一同編織被毯，用社群自己的技藝回應議題。",te:"Invite tribal women to weave blankets together and respond to the issue with the community’s own craft.",m:"craft"},{t:"把被毯包覆在被開採的礦山上，將「被開採的山」比作受傷的身體。",te:"Drape the blankets over the mined mountain, likening the mined mountain to a wounded body."},{t:"帶觀眾走進土地與傳統領域，回看歷史留在山裡的痕跡。",te:"Lead viewers onto the land and traditional territory to look back at the traces history left in the mountain."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["林介文《裹山》Dungku Asang 報導（關鍵評論網／新聞鏡頭）", "https://www.thenewslens.com/article/173009"], ["Labay Eyong《Dungku Asang 裹山》（第十九屆台新藝術獎提名，台新藝術獎官網）", "https://taishinart.org.tw/en/art-award-year-detail/2021/622", 1], ["Labay Eyong and U.S. Aid to Taiwan（中央研究院，英文）", "https://archives.sinica.edu.tw/wp-content/uploads/2022/11/Labay_Eyong_and_U.S._Aid_to_Taiwan.pdf"]], "story": null, "status": "已查證", "statusWhy": "已查證：林介文（Labay Eyong）《裹山》Dungku Asang 由關鍵評論網（新聞鏡頭）、台新藝術獎官網與中央研究院通訊等多個獨立來源報導互證——藝術家、入圍台新藝術獎、於礦區以部落女性共織被毯披覆礦山等核心一致；參與織者人數與展期細節待補。"},
{"id": "k58", "name": "口湖濱海藝術季（海大 USR 團隊進駐）", "en": "", "creator": "國立臺灣海洋大學 USR 團隊；沁窟ㄚ腳文創協會（理事長王耀新）；口湖鄉公所", "city": "雲林", "place": "雲林縣口湖鄉下崙地區", "year": "2025（晚於 2025 臺灣燈會，確切日期待確認）", "yk": 2025, "yd": "2025", "yde": "2025", "issue": ["環境"], "form": ["裝置"], "practice": ["藝術節與駐村", "社區藝術"], "audience": ["地方居民", "兒童"], "summary":"沁窟ㄚ腳文創協會長期在雲林縣口湖鄉下崙地區推動社區營造與藝術教育。2025 年的口湖濱海藝術季由國立臺灣海洋大學（海大）USR 團隊與該協會、口湖鄉公所合作舉辦。\n\n藝術季認養一座 2025 桃園臺灣燈會結束後的花燈，點燈儀式由鄉長主持，並以海廢藝術展示讓居民在賞燈的同時理解環境永續，呼應花燈二次利用與海廢再利用的理念。\n\n居民攜家帶眷參與，但共創過程描述不足，居民參與證據弱到中；藝術季確切日期與名稱、海廢展示作品由誰創作，來源未載。", "selfDesc": "1111 新聞（海大校方供稿）寫到，藝術季由海大 USR 團隊與沁窟ㄚ腳文創協會、口湖鄉公所合作，認養一座 2025 桃園臺灣燈會結束後的花燈，點燈儀式由鄉長主持，並以海廢藝術展示推廣海洋教育。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"認養一座臺灣燈會結束後的花燈、二次利用，再結合海廢藝術展示，讓居民在賞燈的同時理解環境永續，示範了把「現成的節慶物件」轉為環境教育媒介。要提醒的是：共創過程描述不足，較接近成果展示。",
 techniques:[{t:"認養燈會結束後的花燈做二次利用，把現成節慶物件轉為環境教育媒介。",te:"Adopt a lantern left after the lantern festival for reuse, turning a ready-made festival object into an environmental education medium."},{t:"用海廢藝術展示，讓居民賞燈時理解環境永續。",te:"Use a marine-debris art display so residents grasp environmental sustainability while enjoying the lantern.",m:"material"}], "ibaeContext": ["地"], "ibaeOrigin": "content", "sources": [["海大USR團隊進駐口湖濱海藝術季 創意展現海廢再利用、推廣海洋教育（1111 新聞，校方供稿）", "https://www.1111.com.tw/news/jobns/162015"]], "story": null, "status": "待查證", "statusWhy": "待查證：目前僅 1111 新聞（海大校方供稿）單一來源。合作單位、點燈由鄉長主持、花燈來源與海廢展示為稿中所寫；藝術季確切日期與名稱、海廢展示作品由誰創作待補。『海大』指國立臺灣海洋大學。"},
{"id": "k59", "name": "Tnunan 循物而返，相繫共生（武塔國小 × 臺博館南澳泰雅文物特展）", "en": "", "creator": "宜蘭縣南澳鄉武塔國小（共同策展人含教師韋文豪 Wilang Mawi）、國立臺灣博物館、南澳鄉公所泰雅文化館、宜蘭縣史館", "city": "宜蘭", "place": "宜蘭縣南澳鄉泰雅文化館 2 樓特展室", "year": "2026/10/6 開幕，展至 2027/2/26", "yk": 2026, "yk0": 2026, "yd": "2026–2027", "yde": "2026–2027", "issue": ["原住民族文化", "地方記憶"], "form": ["展覽"], "practice": ["藝術教育", "策展與展覽"], "audience": ["青少年", "長者"], "summary":"《Tnunan 循物而返，相繫共生》是武塔國小與國立臺灣博物館等合作的南澳泰雅文物特展，2026 年 10 月 6 日開幕，展至 2027 年 2 月 26 日，地點在宜蘭縣南澳鄉泰雅文化館 2 樓特展室。\n\n學校歷經約兩年的文物研究、田野調查與耆老口述，循著百年前入藏清冊留下的姓名，把 30 多件日治時期入藏臺博館的南澳泰雅文物重新連回部落家族；調查訪談了十位曾生活於山區舊社的耆老，部分耆老還到臺博館庫房辨認文物。\n\n校方並把成果轉成教案與教具箱，培訓學生擔任小小導覽員。偏博物館策展與文化教育，是否完全符合平台「藝術形式」定義可再討論；部分報導標題寫「台史博」、內文為臺博館，疑為標題誤植，未能確認。", "selfDesc": "自由時報、樂聯網與 Yahoo（臺博館提供）等報導指出，展覽由武塔國小與國立臺灣博物館等合作，展出 30 多件南澳泰雅文物，訪談 10 位耆老、培訓學生導覽員，展期自民國 115 年 10 月 6 日至 116 年 2 月 26 日。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"學校循百年前入藏清冊上的姓名，把臺博館的文物重新連回部落家族，再把成果轉成教案、教具箱與學生導覽，這是「以文物為提問起點、讓學生當研究者與導覽者」的完整範例。對做在地文化或原住民教育的老師，示範了文物回鄉如何同時是研究、是認同、也是課程。",
 techniques:[{t:"循著百年前入藏清冊上的姓名，把文物連回部落家族。",te:"Follow names in century-old acquisition registers to reconnect artefacts with tribal families.",m:"document"},{t:"訪談曾生活於舊社的耆老，並請耆老到庫房辨認文物。",te:"Interview elders who lived in the old settlements and ask them to identify objects in the storeroom.",m:"oral"},{t:"把成果轉成教案與教具箱，讓學生當研究者與小小導覽員。",te:"Turn results into lesson plans and a teaching kit so students become researchers and young guides.",m:"intergen"}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "context", "sources": [["武塔國小《Tnunan 循物而返，相繫共生》臺博館南澳泰雅文物特展（自由時報）", "https://news.ltn.com.tw/news/life/breakingnews/5595761"]], "story": null, "status": "待查證", "statusWhy": "待查證：武塔國小與國立臺灣博物館『Tnunan 循物而返』泰雅文物特展雖有自由時報、樂聯網、Yahoo（臺博館提供）多篇報導、日期地點一致，但多篇疑似源自校方或臺博館新聞稿、依規則不算互相獨立；自由時報頁面本次無法開啟核對全文。展品 30 多件、10 位耆老訪談、學生導覽員等為各報導所寫。"}

{"id": "k60", "name": "流域美學藝術啟動計劃：公司田溪行動（公司田溪微型藝術祭）", "en": "", "creator": "國立臺北藝術大學美術學院；協同：公司田溪程氏古厝；藝術家王毓淞（海龜主題參與式創作）", "city": "新北", "place": "新北市淡水區公司田溪沿線至出海口（沙崙海灘、洲子灣、程氏古厝）", "year": "USR 109–111 年度；2023 微型藝術祭（10/28 開幕）、2024 衛星展「海龜海歸1980」（10/13）", "yk": 2024, "yk0": 2023, "yd": "2023–2024", "yde": "2023–2024", "issue": ["環境", "地方記憶"], "form": ["工作坊", "裝置"], "practice": ["社會參與式藝術"], "audience": ["兒童", "地方居民"], "summary":"北藝大美術學院以淡水公司田溪流域為舞台，透過「流域美學藝術啟動計劃：公司田溪行動」（USR 109–111 年度）的微型藝術祭，把海岸環境議題化為可參與的創作；活動由北藝大協同程氏古厝舉辦，含市集與講座。\n\n2023 年沿溪設三個展區，10 月 28 日開幕；藝術家王毓淞策劃「親子海歸日」，讓親子在沙崙海灘用大小海龜模具翻沙拓印、重現海龜上岸。\n\n這呼應沙崙海灘 1980 年代曾有海龜出沒、後因戰爭、人工建物與消波塊而離開的在地記憶；2024 年以「海龜海歸1980」衛星展（10 月 13 日、洲子灣）延續。聯合報只寫「海龜」未指明物種。", "selfDesc": "聯合報〈淡水「公司田溪微型藝術祭」用藝術認識海岸生態〉報導，藝術祭由北藝大美術學院協同程氏古厝舉辦，含市集、講座；王毓淞主辦『親子海歸日』、親子在沙崙海灘以大小海龜模具拓印海龜足跡。報導指沙崙 1980 年代有海龜出沒（為最近紀錄），海岸歷經戰爭與人工建物、消波塊後海龜離開。ACCUPASS 活動頁另載 2024『海龜海歸1980』衛星展（10/13、洲子灣）。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"把「海龜曾經上岸、後來消失」這個在地生態記憶，變成親子用模具翻沙拓印「重現海龜上岸」的身體參與，對帶環境教育的老師，示範了用一個具體、可動手的身體動作承載抽象的生態變遷，比直接講海洋污染更貼近孩子。要提醒的是：翻沙拓印是一次性體驗活動，深度仍有限。",
 techniques:[{t:"把「海龜曾經上岸、後來消失」的在地生態記憶，變成親子可動手的活動。",te:"Turn the local ecological memory of sea turtles once coming ashore and later vanishing into a hands-on activity for families."},{t:"用海龜模具翻沙拓印，讓孩子用身體重現海龜上岸。",te:"Use turtle moulds for sand rubbings so children recreate turtles coming ashore with their bodies."},{t:"沿溪設展區並結合市集與講座，讓海岸議題進到流域日常。",te:"Set exhibition zones along the creek with a market and talks so coastal issues enter everyday life in the basin."}], "ibaeContext": ["地", "時"], "ibaeOrigin": "context", "sources": [["淡水「公司田溪微型藝術祭」 用藝術認識海岸生態（聯合報）", "https://udn.com/news/story/7323/7539640"], ["公司田溪微型藝術祭／海龜海歸1980 衛星展（ACCUPASS 活動頁，2024）：活動報名頁，非獨立報導", "https://www.accupass.com/event/2409251650307151662130"]], "story": null, "status": "待查證", "statusWhy": "待查證：目前僅聯合報一篇獨立報導，佐證北藝大美術學院協同程氏古厝舉辦微型藝術祭、王毓淞『親子海歸日』海龜模具翻沙拓印、沙崙 1980 年代海龜記憶等核心；第二個連結 ACCUPASS 為活動售票／報名頁，不算第二個獨立來源。單一主持人姓名與 2023 開幕日期等細節仍待補。"},
{"id": "k61", "name": "雷公火小戲節《戲說雷公火》（關山電光部落）", "en": "", "creator": "電光社區居民自發演出、電光社區發展協會；國立臺北藝術大學藝術社會實踐暨推廣教育中心陪伴；2023 年導演詹益嘉（關山國中表演藝術教師）", "city": "台東", "place": "台東縣關山鎮電光部落（Kaadaadaan，約七成阿美族、兩成客家）", "year": "《戲說雷公火》2013 年起（2023 年第 11 屆）；北藝大 USR 子計畫 107–108、112–113 年度", "yk": 2023, "yk0": 2013, "yd": "2013 起", "yde": "From 2013", "issue": ["原住民族文化", "客家文化", "地方記憶"], "form": ["表演"], "practice": ["社區藝術", "社會參與式藝術"], "audience": ["地方居民", "青少年"], "summary":"台東關山電光部落（Kaadaadaan，約七成阿美族、兩成客家）以 1896 年先民用竹炮擊退清軍殘部的「雷公火之役」為集體記憶。2013 年起居民把這個故事搬上收割後的稻田梯田，發展《戲說雷公火》，2023 年為第 11 屆。\n\n演出由村民、返鄉青年與在地學童自演，約一小時，竹炮加入音效，以阿美、河洛、客、華語交織、不打字幕，盼在孩子心中種下母語種子；2023 年有首個完整劇本，由關山國中詹益嘉執導。\n\n北藝大藝術社會實踐暨推廣教育中心以「雷公火小戲節」USR 子計畫（107–108、112–113 年度）進場陪伴、協助建立劇場結構。獨立報導集中在 2023 年，更早各屆細節來源未載。", "selfDesc": "客新聞（李台源，2023-12-23）報導：小戲 2013 年起、發展成約一小時的稻田梯田劇場，村民、返鄉青年與在地學生自演，竹炮加入音效；2023 年有首個完整劇本、由關山國中詹益嘉執導；對白混用阿美、河洛、客、華語以復振母語。PeoPo（王政魁，2023-12-18）另報導稻香劇場開演、感謝名單含臺北藝術大學、今年第 11 次演出。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"這是「社區自己的歷史＋自己的語言＋自己的身體」三合一的高品質範例：居民把部落的雷公火之役搬上自家稻田、用多語不打字幕演出，讓母語在演的過程中自然傳承。對帶原住民或在地教育的老師，最可借鏡的是「讓孩子在戲裡聽長輩說母語」這種非正式的語言復振，比母語課更有感。北藝大的角色是陪伴與建立劇場結構、不是主導，是外部資源協力在地的好示範。",
 techniques:[{t:"把部落自己的歷史（雷公火之役）搬上自家稻田，由居民自演。",te:"Take the tribe’s own history (the Thunder Fire Battle) onto its own rice fields, performed by residents themselves.",m:"theatre"},{t:"以阿美、河洛、客、華語交織、不打字幕演出，讓孩子在戲裡聽長輩說母語。",te:"Perform in Amis, Hoklo, Hakka and Mandarin without subtitles so children hear elders speak the mother tongue within the play.",m:"oral"},{t:"外部單位只陪伴並協助建立劇場結構，不主導。",te:"The outside institution only accompanies and helps build the theatre structure, without leading."}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "context", "sources": [["竹炮、火燒茅草屋：在花東縱谷下的大舞台 電光部落用戲劇種下母語的種子（客新聞，李台源，2023-12-23）", "https://hakkanews.tw/2023/12/23/the/"], ["『戲說雷公火』電光部落稻香劇場開演（PeoPo 公民新聞，王政魁，2023-12-18）", "https://www.peopo.org/news/666941"]], "story": null, "status": "已查證", "statusWhy": "已查證：客新聞（李台源，2023-12-23）與 PeoPo（王政魁，2023-12-18）為兩個獨立來源，均直接寫到電光部落《戲說雷公火》、居民自演、北藝大藝推中心陪伴、以阿美族『雷公火之役』歷史與多語母語為核心、2013 年起至 2023 年第 11 屆等核心事實。更早各屆與 USR 各年度細節仍待補。"},
{"id": "k62", "name": "好采頭藝術祭（蘆竹湳古厝聚落）", "en": "", "creator": "苗栗縣傳統聚落文化協會（在地主辦）；參與：國立臺北藝術大學師生；2018 年總導演李小平、視覺總監曲德益", "city": "苗栗", "place": "苗栗縣頭份市蘆竹湳古厝聚落（約 50 座三合院）", "year": "好采頭藝術祭（2018 第 5 屆、2024 第 11 屆）；北藝大 USR『家在蘆竹湳』子計畫 107–108 年度", "yk": 2024, "yk0": 2018, "yd": "2018 起", "yde": "From 2018", "issue": ["地方記憶", "都市發展"], "form": ["裝置", "表演"], "practice": ["社區藝術", "藝術節與駐村"], "audience": ["地方居民"], "summary":"蘆竹湳古厝是苗栗縣頭份僅存的大型三合院聚落（約 50 座三合院），因 1968 年工業區限建意外被保留。在地的苗栗縣傳統聚落文化協會多年以「好采頭藝術祭」為核心，邀藝術家進駐老屋創作；2018 年為第 5 屆，2024 年為第 11 屆。\n\n藝術祭結合元宵乞龜、踩街、蘿蔔燈 DIY 等民俗，讓藝術與庶民生活交織。2018 年總導演李小平強調「村民才是主角」，當年有六組藝術家團隊打造 12 件作品。\n\n北藝大在 USR「家在蘆竹湳」子計畫（107–108 年度）期間，師生參與演出；聯合報第 11 屆活動流程明列「台北藝術大學演出」，中時 2018 年報導未提北藝大。", "selfDesc": "中國時報（2018-02-22）〈李小平幫蘆竹湳打造藝術表情〉報導 2018 第 5 屆好采頭藝術季：六組藝術家團隊打造 12 件作品、社區保存近 50 座三合院、李小平首度加入任總導演並稱『村民才是主角』（未提北藝大）。聯合報〈邁入第 11 年！⋯好采頭藝術祭 24 日登場〉報導第 11 屆活動流程，明列『台北藝術大學演出』、挖蘿蔔燈、乞龜、踩街等，展至 2/29。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"把「元宵民俗（乞龜、踩街、蘿蔔燈）」當成藝術祭的骨架，讓藝術家進駐的創作長在庶民節慶上，而不是另外辦一個藝術活動，對帶社區的老師，示範了「藝術接上既有的生活節奏」比憑空造節更能動員居民。李小平「村民才是主角」一語，也點出外來藝術家在社區的分際。",
 techniques:[{t:"把元宵民俗（乞龜、踩街、蘿蔔燈）當成藝術祭的骨架。",te:"Use Lantern Festival customs (turtle-asking, parade, radish lanterns) as the skeleton of the festival."},{t:"讓藝術家進駐老屋創作，作品長在庶民節慶上。",te:"Have artists make work in the old houses so it grows on ordinary people’s festivals."},{t:"「村民才是主角」：外來藝術家在社區要守住分際。",te:"“The villagers are the protagonists”: visiting artists must keep their place in a community."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["邁入第11年！頭份蘆竹湳古厝社區好采頭藝術祭24日登場（聯合報）：流程明列『台北藝術大學演出』", "https://udn.com/news/story/7324/7788246"], ["李小平幫蘆竹湳打造藝術表情（中國時報，2018-02-22）：2018 第 5 屆、六組藝術家 12 件作品、李小平稱村民才是主角", "https://www.chinatimes.com/realtimenews/20180222000631-263301"]], "story": null, "status": "已查證", "statusWhy": "已查證：聯合報（第 11 屆）與中國時報（2018-02-22，第 5 屆）為兩個獨立來源，印證『好采頭藝術祭』是蘆竹湳長期舉辦、有居民與藝術家參與的社區藝術活動。惟北藝大的參與僅見於聯合報流程所列『台北藝術大學演出』，中時 2018 未提北藝大，USR 具體陪伴內容主要見校方同源頁，故以在地藝術祭為收錄主體、北藝大列參與者。"},
{"id": "k63", "name": "給平凡人的萬華散策", "en": "", "creator": "主辦：臺北市政府都市發展局（社宅公共藝術）；策展人林宏璋（北藝大美術系教授）；策展團隊水谷藝術（總監彭才瑄）／執行恆冠創意；參展藝術家含蔡明亮、張乾琦、涂維政等 20 餘位", "city": "台北", "place": "台北市萬華區（青年二期、莒光、福星社宅；展場含中山堂、剝皮寮、水谷藝術等）", "year": "2024（1/9–2/25；1/30 中山堂開幕）", "yk": 2024, "yd": "2024", "yde": "2024", "issue": ["地方記憶", "社宅與居住", "勞動與人權"], "form": ["影像", "裝置", "工作坊"], "practice": ["社會參與式藝術", "公共藝術"], "audience": ["地方居民", "長者"], "summary":"《給平凡人的萬華散策》是 2024 年 1 月 9 日至 2 月 25 日（1 月 30 日中山堂開幕）的城市藝術季，由臺北市都發局在社宅公共藝術框架下主辦，策展人林宏璋，由在地空間水谷藝術操盤（工商時報寫策展團隊為恆冠創意）。\n\n約 20 位藝術家以數年田野為本，串連店家、社福團體與社宅（青年二期、莒光、福星）住戶，透過影像、織品、工作坊重寫萬華的勞動史與地方記憶，把說故事的位置還給「平凡人」。\n\n例如涂維政辦居民物件壓印工作坊《百工多寶閣》、芒草心以無家者紙箱創作《來艋舺走撞》、林旺廷《琥珀計畫》記錄南機場拆遷戶、蔡明亮以《西寧國宅》為題。北藝大 USR 的歸屬僅見校方同源，兩個獨立來源都未提北藝大。", "selfDesc": "典藏ARTouch（陳思宇評論）載主辦為臺北市都發局、策展人林宏璋、團隊水谷藝術、展期 2024.01.09–02.25，記涂維政《百工多寶閣》居民物件壓印工作坊、芒草心《來艋舺走撞》無家者紙箱、林旺廷《琥珀計畫》南機場拆遷戶點雲掃描。工商時報（2024-01-30）載 1/30 中山堂開幕、三處社宅（青年二期／莒光／福星）、蔡明亮《西寧國宅》、約 20 位藝術家、策展團隊恆冠創意。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"「把說故事的位置還給平凡人」是這檔最可借鏡的精神：藝術家以數年田野為底，讓店家、社福對象與社宅住戶的勞動與生活成為作品內容（居民帶物件來壓印、以無家者的紙箱談空間）。對帶社區或議題的老師，示範了公共藝術可以不是擺一件大作品，而是長期蹲點、讓在地人的日常被看見。要提醒的是：這是都發局社宅公共藝術框架下的城市藝術季，規模與資源都較大。",
 techniques:[{t:"以數年田野為底，讓店家、社福對象與社宅住戶的勞動與生活成為作品內容。",te:"Build on several years of fieldwork so the labour and lives of shops, welfare clients and social-housing residents become the content of works.",m:"oral"},{t:"請居民帶物件來壓印，讓個人物件成為共同的作品。",te:"Ask residents to bring objects for imprinting so personal objects become a shared work."},{t:"以無家者的紙箱談空間，把被忽略的日常物件放到前景。",te:"Use homeless people’s cardboard boxes to talk about space, bringing overlooked everyday objects to the foreground."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["當公共藝術成為一個在地事件：「給平凡人的萬華散策」所拓展的「公共性」實踐（典藏ARTouch，陳思宇）", "https://artouch.com/art-views/art-exhibition/content-132834.html"], ["萬華社宅城市藝術季開幕 蔡明亮稱對西寧國宅用情至深（工商時報，2024-01-30）", "https://www.ctee.com.tw/news/20240130701754-431401"]], "story": null, "status": "已查證", "statusWhy": "已查證：典藏ARTouch（陳思宇評論）與工商時報（2024-01-30）為兩個獨立來源，印證《給平凡人的萬華散策》為臺北市都發局社宅公共藝術框架下的城市藝術季、策展人林宏璋、以數年田野串連萬華勞動史與地方記憶、涂維政／芒草心／林旺廷／蔡明亮等作品。惟兩來源均未提北藝大或 USR（北藝大歸屬僅校方同源），策展團隊名稱（水谷藝術 vs 恆冠創意）與日期略有出入，已於編註並陳。"},
{"id": "k64", "name": "記憶‧邊緣——綠島人權藝術季北藝大特展", "en": "", "creator": "國立臺北藝術大學藝術相關科系師生；北藝大特展策展人王寶萱；國家人權博物館（2020 綠島人權藝術季，整體策展人羅秀芝）", "city": "台東", "place": "台東縣綠島鄉，國家人權博物館白色恐怖綠島紀念園區", "year": "2020（展期 5/15–9/15）；北藝大 USR Hub 標 2020–2021", "yk": 2020, "yd": "2020", "yde": "2020", "issue": ["身分與歷史記憶", "勞動與人權"], "form": ["影像", "版畫", "表演"], "practice": ["藝術教育", "策展與展覽"], "audience": [], "summary":"北藝大與國家人權博物館合作，把教育與創作計畫嵌入 2020 綠島人權藝術季（展期 5 月 15 日至 9 月 15 日，地點為國家人權博物館白色恐怖綠島紀念園區）。\n\n北藝大藝術相關科系學生先透過「記憶政治與藝術介入」課程認識白色恐怖與轉型正義脈絡，再進駐紀念園區，以「記憶邊陲／邊緣」為題現地創作，產出 5 件學生作品；特展由王寶萱策劃，藝術季整體策展人為羅秀芝。\n\n創作主體是北藝大學生、不是在地居民或受難者社群；新聞稿寫「學生」產出作品、未提教師共創，確切指導教師姓名在可讀來源中未出現。", "selfDesc": "國家人權博物館新聞稿（2020-05-15）〈2020綠島人權藝術季正式開幕 以當代藝術創作 從邊緣發聲〉載：藝術季展期 5/15–9/15、於白色恐怖綠島紀念園區；今年首度與國立臺北藝術大學等國內藝術科系合作、結合『記憶政治與藝術介入』課程、學生產出 5 件以『記憶邊陲』為主軸的作品（新聞稿提及學生創作、未提教師共創）；藝術季整體策展人為羅秀芝。〈記憶．邊緣〉特展名與策展人王寶萱見人權館線上展。風傳媒／新新聞（李佳穎，2020-07-18）談藝術季整體（21 組藝術家），未點名北藝大特展。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"這是「先上課理解脈絡、再現地創作」的藝術教育範例：學生先修「記憶政治與藝術介入」課認識白色恐怖與轉型正義，再進駐綠島園區，把歷史轉成作品。對帶議題或歷史的老師，示範了「知識建構→現地回應→創作產出」的完整教學弧線。要提醒的是：創作主體是北藝大學生、不是在地居民或受難者社群，所以它是「學生如何理解與轉譯他人的創傷歷史」的教學案例，而非社區共創。",
 techniques:[{t:"先上課理解白色恐怖與轉型正義的脈絡，再進駐現場創作。",te:"Take a course first to understand the White Terror and transitional justice, then take up residence and make on site.",m:"document"},{t:"在歷史現場（綠島紀念園區）現地回應，把歷史轉成作品。",te:"Respond on site at the historical place (Green Island memorial park) and turn history into works.",m:"site"},{t:"追問：學生如何理解與轉譯他人的創傷歷史？",te:"Ask: how do students understand and translate others’ traumatic history?"}], "ibaeContext": ["時", "地"], "ibaeOrigin": "content", "sources": [["2020綠島人權藝術季正式開幕 以當代藝術創作 從邊緣發聲（國家人權博物館新聞稿，2020-05-15）：載與北藝大合作、『記憶政治與藝術介入』課程、學生產出5件『記憶邊陲』作品", "https://www.nhrm.gov.tw/w/nhrm/News_21090618182491031", 1], ["2020 綠島人權藝術季線上展（國家人權博物館）：載〈記憶．邊緣〉北藝大特展、策展人王寶萱", "https://vr360.nhrm.gov.tw/2020gihraf/page/index.html", 1], ["新新聞》綠島人權藝術季不說教，用藝術實現正義（風傳媒，李佳穎，2020-07-18）：藝術季整體報導，未點名北藝大特展", "https://www.storm.mg/article/2854933"]], "story": null, "status": "待查證", "statusWhy": "待查證：直接點名北藝大特展〈記憶．邊緣〉與策展人王寶萱的兩筆來源同屬國家人權博物館（新聞稿＋線上展，同機構、不算互相獨立）；風傳媒／新新聞（2020-07-18）僅報導 2020 綠島人權藝術季整體（21 組藝術家）、未點名北藝大特展，故北藝大特展部分目前為單一機構來源。人權館新聞稿確認與北藝大合作、『記憶政治與藝術介入』課程、學生產出 5 件『記憶邊陲』作品；確切指導教師姓名未在可讀來源出現。"}
