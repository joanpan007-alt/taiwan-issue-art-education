{"id": "k65", "name": "《貧窮人的台北》計畫", "en": "", "creator": "向貧窮者學習行動聯盟（窮學盟）發起；人生百味（朱剛勇）等共同策畫；歷年合作 NGO 與貧窮經驗者（無家者、移工、脆弱處境者等）為創作者", "city": "台北", "place": "台北市萬華一帶（歷年展場含剝皮寮歷史街區、台北當代藝術館、一碼IMMA／南機場、小紅厝月經博物館等）", "year": "2017 年起（2024 春季前導展《轉運站》於當代藝術館、秋季第七屆《白日夢遊》於剝皮寮）", "yk": 2024, "yk0": 2017, "yd": "2017 起", "yde": "From 2017", "issue": ["勞動與人權", "社宅與居住", "移民", "都市發展"], "form": ["裝置", "展覽", "工作坊"], "practice": ["社會參與式藝術", "策展與展覽"], "audience": ["無家者", "移工", "地方居民"], "summary":"《貧窮人的台北》是向貧窮者學習行動聯盟（窮學盟）自 2017 年起推動的年度計畫，以展覽與論壇讓貧窮經驗者（無家者、移工、脆弱處境的母親、精神疾病與逆境兒少等）以「創作者」身分訴說自己眼中的台北，追問城市的包容性。\n\n歷年與十多個 NGO 及藝術家共創（捏陶、調香、繪畫、黏土、裝置、影像等），展覽刻意不標示創作者的身分與狀態，以凸顯作品本身。2024 年春季於台北當代藝術館推出前導展《轉運站》（4/27–6/16，13 組藝術家團體），秋季於剝皮寮推出第七屆《白日夢遊》（10/15–11/14），衛星展在一碼 IMMA 與小紅厝。\n\nRight Plus 記此為前導展、貧北邁入第 8 年、改為雙年展形式、19 個合作 NGO 與藝術家共創。經驗者在策展決策中的角色多數報導未細寫，共創多在作品層次；第八屆的年份與展期未能核實。", "selfDesc": "中央社（王寶兒，2024-04-26）報導《轉運站》於台北當代藝術館（4/27–6/16，13 組藝術家團體）：窮學盟由貧窮經驗者、NGO、藝術家與社會學者組成，與人生百味朱剛勇共同策畫；張羽儀《友善的椅子計畫》以密集扶手長椅呈現無家者處境，展覽刻意不標示創作者身分。Right Plus 多多益善（2024-06-07）記此為前導展、貧北邁入第 8 年、改為雙年展形式、19 個合作 NGO 與藝術家共創（社區實踐協會捏陶調香、夢想城鄉繪畫黏土、樂窩遷徙地圖、人生百味《什麼風把你吹來的》長型裝置）。博物之島新訊（文化部）記秋季第七屆《白日夢遊》於剝皮寮（10/15–11/14）、衛星展一碼IMMA與小紅厝，把貧窮理解為物質／精神／關係上的匱乏與排除。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"最可借鏡的是它把貧窮經驗者從「被展示、被標籤的對象」翻轉成「創作者」，而且刻意不標示創作者的身分與狀態，讓作品先被看見、而不是先被貼上「遊民」「單親媽媽」的標籤。對帶弱勢或敏感議題的老師，這個「先拿掉標籤、讓人以創作者身分發聲」的設計是關鍵。共創手法也多元可借：捏陶調香、以繪畫黏土回顧生命、手繪遷徙地圖、收集心聲的長型裝置。要提醒的是：經驗者在策展決策中的角色多數報導未細寫，共創多在作品層次。",
 techniques:[{t:"讓貧窮經驗者以「創作者」身分發聲，而不是被展示的對象。",te:"Let people with experience of poverty speak as “creators”, not as objects displayed."},{t:"展覽刻意不標示創作者的身分與狀態，讓作品先被看見。",te:"Deliberately do not label creators’ identity or status so the work is seen first."},{t:"用捏陶、調香、繪畫黏土、手繪遷徙地圖等多元共創手法。",te:"Use varied co-creation methods such as pottery, scent blending, painting and clay, and hand-drawn migration maps."}], "ibaeContext": ["人", "地"], "ibaeOrigin": "context", "sources": [["首都另一面 在美術館看見貧窮人的台北（中央社，王寶兒，2024-04-26）", "https://www.cna.com.tw/news/acul/202404260292.aspx"], ["如果我們在夢境間邂逅彼此——2024 貧窮人的台北《白日夢遊》（博物之島新訊，文化部）", "https://www.tmaroc.org.tw/2024-news-101/"], ["到美術館看不一樣的臺北／2024 貧窮人的台北《轉運站》（Right Plus 多多益善，2024-06-07）", "https://rightplus.org/2024/06/07/transfer-station-24/"], ["8th 貧窮人的台北《只是我還在認識的影子》（剝皮寮歷史街區官方頁）：本次因 robots 無法讀取、年份與展期未核實", "https://www.bopiliao.taipei/Event_News/Detail/776", 1],["貧窮人的台北 Instagram（@poorpeoplestaipei，計畫官方）", "https://www.instagram.com/poorpeoplestaipei/", 1],["向貧窮者學習行動聯盟 Facebook 粉絲專頁（計畫官方）", "https://www.facebook.com/a.w.a.r.e.s.intaipei/?locale=zh_TW", 1]], "story": null, "status": "已查證", "statusWhy": "已查證：《貧窮人的台北》由向貧窮者學習行動聯盟（窮學盟）自 2017 年起推動、以貧窮經驗者為創作者、追問城市包容性等核心事實，由中央社（2024-04-26）、博物之島新訊（文化部）與 Right Plus 多多益善（2024-06-07）等多個獨立來源互證。待釐清：第八屆《只是我還在認識的影子》的年份與展期（剝皮寮官方頁 robots 擋、未讀取）；經驗者在策展決策中的角色多數報導未細寫。Right Plus 一文展期日期有誤植，已於編註並陳、以中央社為準。"},
{"id": "k66", "name": "踅，有光ê所在（大隆田生活美學進鄉 2025）", "en": "", "creator": "國立臺南藝術大學；協辦臺南市立官田國中（教育部 114 年度 USR 計畫）", "city": "台南", "place": "臺南市官田區，展場在官田國中，取材自隆田夜市與夜間街道", "year": "2025（11/8 開幕—12/30，每日 17:00–21:30）", "yk": 2025, "yd": "2025", "yde": "2025", "issue": ["地方記憶", "教育"], "form": ["裝置", "展覽"], "practice": ["藝術教育", "社會參與式藝術"], "audience": ["地方居民", "青少年"], "summary":"《踅，有光ê所在》是南藝大與臺南市立官田國中合辦的教育部 114 年度 USR 藝術展，2025 年 11 月 8 日開幕、展至 12 月 30 日，每日 17:00–21:30 免費開放，展場在官田國中。\n\n展覽以官田「踅夜市」文化為靈感，認為隆田夜間街道的攤販燈光不只聚集人潮，也承載居民的生活記憶；展品含南藝學生作品「發光的菱角」等多媒材作品。\n\n開幕開燈由兩校校長共同主持，立委與隆田夜市管理委員會會長到場。居民並非共同創作者，而是觀眾／參與者；本案歸入「大隆田生活美學進鄉」係依 2026 年續辦檔推斷。", "selfDesc": "經濟日報（2025-11-08）報導：本展由南藝大與官田國中協辦、受教育部 114 年度 USR 計畫支持，11/8 開幕、展至 12/30，每日 17:00–21:30，開幕開燈由校長邱上嘉與官田國中校長敬世龍共同主持，立委郭國文出席致詞，隆田夜市管理委員會會長到場；展品含『發著光的菱角』為南藝學生作品，展覽以官田『踅夜市』文化為靈感。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"最可借鏡的是把「夜市攤販的燈光」當成切入點：居民天天看見、卻習以為常的日常物件，被重新看成承載生活記憶的題材。對帶地方美學或生活記憶的老師，示範了怎麼從學生自己的生活場景長出創作主題，而不是給外來題目。要提醒的是：居民並非共同創作者，而是觀眾／參與者。",
 techniques:[{t:"把天天看見、習以為常的夜市攤販燈光，重新看成承載生活記憶的題材。",te:"See the night-market stall lights people see daily and take for granted anew as material carrying living memory."},{t:"讓創作主題從學生自己的生活場景長出來，而不是給外來題目。",te:"Let the theme grow from students’ own life scenes instead of giving an outside topic."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["南藝大×官田國中《踅，有光ê所在》（經濟日報，2025-11-08）：佐證教育部 114 年度 USR、南藝大與官田國中協辦、11/8 開幕至 12/30、每日 17:00–21:30、發光菱角、校長邱上嘉與敬世龍、立委郭國文、隆田夜市", "https://money.udn.com/money/story/5723/9126856"]], "story": null, "status": "待查證", "statusWhy": "待查證：目前只有經濟日報（2025-11-08）一個來源，佐證南藝大×官田國中教育部 114 年度 USR《踅，有光ê所在》、展期與發光菱角等核心。『大隆田生活美學進鄉』計畫名與跨系系所、策展人姓名未見於此篇（見於 2026 續辦的中華日報），本檔歸入大隆田為平台依相同學校與主題的推斷，待第二個直接報導 2025 這一檔的獨立來源再升級。", "series": ["k68"]},
{"id": "k68", "name": "Light Light Light 隆來（大隆田生活美學進鄉 2026）", "en": "", "creator": "國立臺南藝術大學（材質創作與設計系、藝術史與文化資產學系跨系合作）；策展老師鄭正雄、許遠達、陳明鴻；協辦臺南市立官田國中", "city": "台南", "place": "臺南市官田區，展場在官田國中，取材自隆田夜市與夜間街道", "year": "2026（11 月中旬—12/20）", "yk": 2026, "yd": "2026", "yde": "2026", "issue": ["地方記憶", "教育"], "form": ["裝置", "工作坊", "展覽"], "practice": ["藝術教育", "社會參與式藝術"], "audience": ["地方居民", "青少年"], "summary":"《Light Light Light 隆來》是南藝大「大隆田生活美學進鄉」USR 計畫 2026 年在官田國中推出的年度跨系藝術展，由材質創作與設計系、藝術史與文化資產學系合作，官田國中協辦，邀鄭正雄、許遠達、陳明鴻三位老師共同策展，展至 12 月 20 日。\n\n展名以「Light」加台語「來」的諧音邀民眾走進隆田，延續以隆田夜市與夜間街道的燈光為題，作品讓觀眾彷彿走進光影隧道。\n\n計畫團隊另在官田國中辦兩場摺紙彩繪燈籠工作坊，讓官田國中學生創作、作品同步展出。單看 2026 這一檔目前只有中華日報／Yahoo 同一篇，尚無第二個獨立來源。", "selfDesc": "中華日報（2026-11-17）報導：本展為南藝大推動 USR、攜手官田國中舉辦的年度藝術展，由材質創作與設計系、藝術史與文化資產學系跨系合作，官田國中協辦，邀鄭正雄、許遠達、陳明鴻三位老師共同策展；展覽是『大隆田生活美學進鄉』USR 計畫的重要成果，作品讓觀眾彷彿走進光影隧道，計畫團隊另在官田國中辦兩場摺紙彩繪燈籠工作坊、學生作品同步展出，展至 12/20。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"延續「夜市燈光＝生活記憶」的切入點，並以「光影隧道」把展場體驗化。燈籠工作坊是低門檻、可直接借用的參與形式，讓在地學生動手。要提醒的是：這偏向「學生創作、居民觀展」，居民並非共同創作者。",
 techniques:[{t:"用「光影隧道」把展場做成可走進去的體驗。",te:"Make the venue an experience people can walk into with a “tunnel of light and shadow”."},{t:"辦摺紙彩繪燈籠工作坊，讓在地學生動手並同步展出作品。",te:"Run paper-folding lantern-painting workshops so local students make things and show them alongside."},{t:"延續夜市燈光＝生活記憶的題目，逐年深化同一個場域。",te:"Continue the theme of night-market lights = living memory and deepen the same place year by year."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["大隆田生活美學進鄉 南藝大USR藝術展 Light Light Light隆來（中華日報，2026-11-17）：佐證計畫名『大隆田生活美學進鄉』、南藝大兩系跨系、官田國中協辦、策展人鄭正雄／許遠達／陳明鴻、展至 12/20、兩場摺紙彩繪燈籠工作坊、光影隧道", "https://www.cdns.com.tw/articles/1492050"]], "story": null, "status": "待查證", "statusWhy": "待查證：目前只有中華日報（2026-11-17，Yahoo 為同一篇轉載）一個獨立來源，佐證南藝大『大隆田生活美學進鄉』USR 計畫 2026《Light Light Light 隆來》於官田國中、兩系跨系、策展人與燈籠工作坊等核心。與 2025《踅，有光ê所在》（K66，經濟日報）同屬一計畫但為不同年度不同展覽，單看本檔仍為單一來源，待第二個獨立來源再升級。", "series": ["k66"]},
{"id": "k67", "name": "重返與扎根——南瀛地區影像行動計畫", "en": "", "creator": "國立臺南藝術大學音像學院；計畫主持人曾吉賢（音像紀錄研究所所長），共同帶領蔡慶同、謝侑恩、林巧芳；合作北門社區大學、神腦科技文教基金會", "city": "台南", "place": "臺南市；成果展於南藝大音像學院（官田區）；場域橫跨東山、玉井、七股、北門、官田，延伸將軍、佳里", "year": "2025（成果展 12/5–12/6）", "yk": 2025, "yd": "2025", "yde": "2025", "issue": ["地方記憶", "教育"], "form": ["影像", "攝影"], "practice": ["藝術教育", "社會參與式藝術"], "audience": ["兒童", "青少年", "長者"], "summary":"南藝大音像學院以教育部 USR 計畫推動「重返與扎根——南瀛地區影像行動計畫」，2025 年 12 月 5 日至 6 日在音像學院（官田區）舉辦成果展。計畫主持人為音像紀錄研究所所長曾吉賢，合作單位含北門社區大學、神腦科技文教基金會。\n\n計畫橫跨台南東山、玉井、七股、北門、官田五區，含五大子計畫「官田誌造、玉井映紀、北門鹽究、南瀛時光、篤加影像營」，透過影像讀書會、暑期影像營、行動照相館、家庭錄影帶搶救與膠卷電影戶外放映，結合國中小師生、研究生與地方耆老。\n\n記錄廟宇、鹽分地帶、芒果與香草等在地產業與庶民記憶，建立跨世代的影像行動路徑。各子計畫的參與人數與作品件數來源未載。", "selfDesc": "經濟日報（黃啟銘，2025-12-05）與自由時報（楊金城，2025-12-05）報導：南藝大音像學院參與教育部 USR 計畫，成果展 12/5–6 於音像學院展出，含五大子計畫「官田誌造、玉井映紀、北門鹽究、南瀛時光、篤加影像營」，涵蓋東山、玉井、七股、北門、官田五區。經濟日報寫計畫主持人為音像紀錄研究所所長曾吉賢；自由時報寫由教務長蔡慶同、謝侑恩、林巧芳等老師帶領研究生。合作單位含北門社區大學、神腦科技文教基金會。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"最可借鏡的是它把「影像」當成跨世代的行動工具，而不只是成果形式：搶救家庭錄影帶、行動照相館、膠卷電影戶外放映，都是把長輩與在地記憶拉進來的具體方法。對帶影像／媒體素養或地方記憶的老師，五大子計畫示範了怎麼依不同社區（鹽分地帶、芒果產區）設計不同的影像任務。要提醒的是：各子計畫由研究生與師生帶領，耆老與居民多為受訪與被記錄者，參與深度各案不一。",
 techniques:[{t:"搶救家庭錄影帶，把長輩的私人影像變成地方記憶。",te:"Rescue family videotapes and turn elders’ private footage into local memory."},{t:"用行動照相館與膠卷電影戶外放映，把影像帶到社區現場。",te:"Use a mobile photo studio and outdoor film-reel screenings to bring images into the community."},{t:"依不同社區（鹽分地帶、芒果產區）設計不同的影像任務。",te:"Design different image tasks for different communities (the salt belt, mango-growing areas)."}], "ibaeContext": ["地", "人", "時"], "ibaeOrigin": "context", "sources": [["南藝大USR《重返與扎根南瀛地區影像行動計畫》成果展（經濟日報，黃啟銘，2025-12-05）：佐證教育部 USR、音像學院、成果展 12/5–6、五大子計畫、涵蓋五區、計畫主持人曾吉賢、合作北門社大與神腦科技文教基金會", "https://money.udn.com/money/story/5723/9184354"], ["南藝大USR《重返與扎根南瀛地區影像行動計畫》成果展 跨5區展出（自由時報，楊金城，2025-12-05）：佐證教育部 USR、音像學院、五大子計畫、涵蓋五區、教務長蔡慶同與謝侑恩、林巧芳帶領研究生", "https://news.ltn.com.tw/news/life/breakingnews/5269187"]], "story": null, "status": "已查證", "statusWhy": "已查證：經濟日報（黃啟銘）與自由時報（楊金城）為兩家媒體、兩位記者，互證南藝大音像學院教育部 USR「重返與扎根」成果展（12/5–6）、五大子計畫與涵蓋五區等核心。保留：兩篇同日發稿、內容部分重疊，可能部分同源於南藝大新聞稿；校長邱上嘉為校方致詞非主持人；糖鐵路線名兩篇用字不一待查；南藝大自家網站與 USR Hub 屬同源，未列為獨立佐證。"},
{"id": "k69", "name": "加工廠", "en": "", "creator": "陳界仁", "city": "桃園", "place": "桃園・聯福製衣廠（拍攝地）；作品於美術館展出", "year": "2003", "yk": 2003, "yd": "2003", "yde": "2003", "issue": ["勞動與人權", "身分與歷史記憶"], "form": ["影像"], "practice": ["藝術家個人創作"], "audience": [], "summary":"《加工廠》是陳界仁 2003 年的錄像作品（約 30 分 50 秒、超 16mm 轉 DVD、無聲）。他邀請曾在桃園聯福製衣廠工作逾二十年、因資方惡性關廠、拒付退休金與資遣費而失業的女工，回到已廢置約七年的工廠「工作」，影片中女工扮演自己。\n\n影片穿插舊黑白紀錄片，勾勒台灣加工出口業在產業外移中的衰頹史，工廠關閉後生產移往勞力更便宜的國家。\n\n陳界仁視拍攝為替女工「創造另一個分身」、替她們「書寫人民記憶」，讓看似結束的抗爭得以延續。這是藝術家個人創作；女工回到現場扮演自己、與藝術家共謀，而非社區共創。", "selfDesc": "呂佩怡研究案把《加工廠》列為「以藝術揭露現實」的案例；陳界仁自述（IT PARK）與 iniva（倫敦國際視覺藝術中心）指出拍攝地為聯福製衣廠（Lien Fu），女工在此工作逾二十年，資方惡性關廠、拒付退休金與資遣費，廠約於拍攝前七年（約 1996 年）廢置；Public Delivery 載本片 30 分 50 秒、超 16mm 轉 DVD、無聲，邀請女工回到現場重演，工廠關閉後移往勞力更便宜的國家。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"最可借鏡的是「讓當事人扮演自己」與「回到現場」的方法：陳界仁不替勞工代言，而是讓女工回到廢廠重演、成為影片的分身。對處理勞動、地方產業史的課程，這示範了怎麼把抽象的「產業外移」變成具體的身體與場景，也提醒不要落入「藝術家關懷底層」的粗糙姿態。",
 techniques:[{t:"讓當事人（女工）扮演自己，而不是替她們代言。",te:"Let those concerned (the women workers) play themselves rather than speaking for them."},{t:"回到已廢置的原工廠現場重演，把抽象的產業外移變成具體的身體與場景。",te:"Return to the abandoned original factory to re-enact, turning abstract industrial relocation into concrete bodies and scenes."},{t:"穿插舊黑白紀錄片，把個人經驗接到產業衰頹史。",te:"Cut in old black-and-white documentaries to connect personal experience to the history of industrial decline."}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把《加工廠》(2003) 列為『以藝術揭露現實』，載邀請關廠女工回到廢置七年的工廠『工作』、影片穿插舊黑白紀錄片、勾勒加工業衰頹史，提出『書寫人民記憶』『向他者開放』", "https://www.ncafroc.org.tw/"], ["Chen Chieh-Jen: Factory（Public Delivery，藝術非營利組織）：載《加工廠》2003、30 分 50 秒、超 16mm 轉 DVD、無聲，邀請曾在該廠工作的女工回到現場重演，工廠關閉後移往勞力更便宜的國家", "https://publicdelivery.org/chen-chieh-jen/"], ["Chen Chieh-jen, Factory（iniva 倫敦國際視覺藝術中心）：載拍攝地為聯福（Lien Fu）製衣廠、女工在此工作逾二十年、資方惡性關廠拒付退休金與資遣費、拍攝時已廢置約七年", "https://iniva.org/?p=6605"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）、Public Delivery 與 iniva（兩個第三方藝術機構）互證《加工廠》2003、聯福製衣廠關廠女工回到現場重演、產業外移等核心。保留：各源未直接寫出工廠所在縣市，桃園係依『聯福製衣廠即 1996 桃園聯福關廠案』推得；IT PARK 所載為陳界仁自述、屬當事人一手資料，未單獨作為獨立佐證。"},
{"id": "k70", "name": "海市蜃樓：台灣閒置公共設施抽樣踏查計劃", "en": "", "creator": "姚瑞中＋失落社會檔案室（Lost Society Document, LSD）", "city": "台北", "place": "全台抽樣踏查（閒置公共設施／蚊子館）；團隊以台北為組織基地，成果出版與展出", "year": "2010 起（第一集 2010，系列持續）", "yk": 2014, "yd": "2010", "yde": "2010", "issue": ["都市發展"], "form": ["攝影", "展覽"], "practice": ["社會參與式藝術", "藝術家個人創作"], "audience": ["青少年"], "summary":"《海市蜃樓：台灣閒置公共設施抽樣踏查計劃》是藝術家姚瑞中與學生組成的團體「失落社會檔案室」（LSD）自 2010 年起進行的全台閒置公共設施（蚊子館）抽樣踏查，第一集於 2010 年出版，2018 年已是第 9 年。\n\n學生返鄉以藝術家之眼田野踏查、拍攝，2010–2014 年踏查四百多個閒置公共設施、出版四本專刊；新書《海市蜃樓VI》記錄 100 件閒置或低度使用案例（蚊子館約占三分之一）。成果是厚達數百頁的黑白照片檔案式專書。\n\n計畫揭露這些生活週遭卻被忽略的公共浪費，引起媒體與政府高層關注，形成民間監督力量；姚瑞中退居為計畫組織者／老師，並全程自掏腰包以確保言論自由與行動獨立。", "selfDesc": "呂佩怡研究案載本計畫 2010–2014、踏查四百多個閒置公共設施、出版四本專刊、姚瑞中作為藝術家身分向後退、化身組織者或以老師身分出現、全程自掏腰包。中央社（風傳媒 2018-05-17 轉載）載姚瑞中任教台師大與北藝大、帶學生組『失落社會檔案室』、《海市蜃樓》第一集 2010 年出版、2018 年已第 9 年、新書《海市蜃樓VI》記錄 100 件閒置或低度使用案例（蚊子館約占三分之一），並舉 2010 年時任行政院長吳敦義曾允諾一年內完成閒置空間活化、惟多案仍未改善（如屏東恆春半島遊客中心）。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"最可借鏡的是把「田野踏查＋檔案化」當成公民行動：讓學生返鄉記錄家鄉的閒置設施，既是影像訓練，也是對公共政策的監督。它示範了藝術家退居組織者、把舞台讓給參與者的做法；對地方踏查、公民議題課程是很好的方法原型。",
 techniques:[{t:"讓學生返鄉踏查、拍攝家鄉的閒置設施。",te:"Have students return home to survey and photograph idle facilities in their home towns."},{t:"把踏查結果檔案化、出版成書，形成民間監督的證據。",te:"Archive and publish survey results as books, forming evidence for civil oversight."},{t:"藝術家退居組織者，把舞台讓給參與的學生。",te:"The artist steps back to be an organiser and gives the stage to the participating students."}], "ibaeContext": ["地", "時"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把《海市蜃樓：台灣閒置公共設施抽樣踏查計劃》(2010–2014) 列為『以藝術揭露現實』，載與學生團體『失落社會檔案室』踏查四百多個閒置公共設施、出版四本專刊、引起政府關注、姚瑞中退居組織者／老師、自掏腰包", "https://www.ncafroc.org.tw/"], ["〈「失落社會檔案室」蚊子館活化再閒置〉（中央社，風傳媒 2018-05-17 轉載）：載姚瑞中任教台師大與北藝大、帶學生組『失落社會檔案室』踏查閒置空間、《海市蜃樓》第一集 2010 出版、至 2018 第 9 年、新書《海市蜃樓VI》記錄 100 件案例（蚊子館約占三分之一）、吳敦義 2010 允諾一年內活化", "https://storm.mg/article/438485"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與中央社報導（風傳媒轉載）互證《海市蜃樓》為姚瑞中帶『失落社會檔案室』學生踏查全台閒置公共設施（蚊子館）、第一集 2010、系列多冊、引起政府關注等核心。保留：踏查總數兩源不同（呂文『四百多個』為累計；中央社單冊『100 件』），係不同冊次／統計口徑，並陳；計畫名用字略異。"},
{"id": "k71", "name": "廢墟影像晶體計畫", "en": "", "creator": "高俊宏", "city": "新北", "place": "台灣各地因經濟自由化／民營化而廢棄的場所（呂文舉樹林台汽客運調度場）", "year": "2012 起", "yk": 2012, "yd": "2012", "yde": "2012", "issue": ["都市發展", "地方記憶"], "form": ["繪畫", "影像"], "practice": ["藝術家個人創作"], "audience": [], "summary":"《廢墟影像晶體計畫》（The Ruin Image Crystal Project，呂佩怡研究案作《廢墟晶體計畫》）是高俊宏自 2012 年起進行的廢墟系列計畫。他走進台灣因經濟自由化、民營化而被放棄的廢墟空間，在現場以炭筆進行壁面素描，再透過戲劇、攝影等形式呈現時代更迭，讓人看見被時代遺忘的痕跡。\n\n其中《湯姆生計畫》在因民營化荒廢的樹林台汽客運調度場牆面，重繪 1871 年英國攝影師湯姆生（John Thomson）所拍下荖濃溪谷的影像；此場景後來也成為蔡明亮電影《郊遊》的重要場景。\n\n《接待室》（2014）被載為本計畫的某種後續，場景為新店廢棄監獄、三峽廢棄礦坑等。多處廢墟、無單一地點；這是藝術家個人創作，以廢墟／民營化議題為題收入。", "selfDesc": "呂佩怡研究案把《廢墟晶體計畫》(2012) 列為『以藝術揭露現實』，載高俊宏進入廢墟現地素描、以戲劇攝影呈現時代更迭；《湯姆生計畫》在樹林台汽客運調度場以炭筆繪 1871 年湯姆生下荖濃溪谷影像，場景成為蔡明亮《郊遊》場景。台灣國際錄像藝術展（twvideoart.org）高俊宏作品頁載《接待室》(2014) 為『《廢墟影像晶體計畫》的某種後續』、場景為新店廢棄監獄、三峽廢棄礦坑等。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"最可借鏡的是把「廢墟」當成閱讀政治經濟史的現場：不是把廢墟當背景，而是進去停留、在牆上畫下歷史影像，讓空間本身成為教材。對地方史、都市變遷、產業／民營化議題的課程，這示範了「身體進入現場、以繪畫與影像重寫記憶」的取徑。",
 techniques:[{t:"走進因民營化被放棄的廢墟，把它當成閱讀政治經濟史的現場。",te:"Enter ruins abandoned through privatisation and treat them as a site for reading political and economic history."},{t:"在牆面現地用炭筆素描，把歷史影像重繪在空間上。",te:"Draw on site with charcoal on the walls, redrawing historical images onto the space."},{t:"再用戲劇、攝影等形式呈現時代更迭。",te:"Then present the change of eras through drama, photography and other forms."}], "ibaeContext": ["地", "時"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把《廢墟晶體計畫》(2012) 列為『以藝術揭露現實』，載高俊宏進入廢墟現地素描、戲劇攝影呈現時代更迭；《湯姆生計畫》樹林台汽調度場炭筆繪 1871 湯姆生下荖濃溪谷影像、該場景成為蔡明亮《郊遊》場景", "https://www.ncafroc.org.tw/"], ["高俊宏《接待室》作品頁（台灣國際錄像藝術展 twvideoart.org）：載《接待室》(2014) 為『《廢墟影像晶體計畫》的某種後續』、場景為新店廢棄監獄、三峽廢棄礦坑等", "https://twvideoart.org/tiva_14/works/KAO%20Jun-Honn.htm"]], "story": null, "status": "待查證", "statusWhy": "待查證：呂佩怡研究案詳述《廢墟晶體計畫》2012、樹林台汽《湯姆生計畫》、蔡明亮《郊遊》場景等，屬單一來源的詳細敘述。台灣國際錄像藝術展作品頁獨立佐證了《廢墟影像晶體計畫》確實存在（《接待室》2014 為其後續），但未佐證 2012 年份與樹林台汽、湯姆生等具體細節，故暫列待查證，待第二個直接佐證該計畫年份與內容的獨立來源再升級。"},
{"id": "k72", "name": "寶藏巖泡茶照相館計畫", "en": "", "creator": "葉偉立（與吳語心等協作）", "city": "台北", "place": "台北・寶藏巖（公館聚落）藝術村", "year": "2004 起（駐村約 2004–2006；計畫延續至 2008）", "yk": 2008, "yd": "2004", "yde": "2004", "issue": ["都市發展", "地方記憶"], "form": ["攝影"], "practice": ["社區藝術", "藝術家個人創作"], "audience": ["地方居民"], "summary":"《寶藏巖泡茶照相館計畫》（The Treasure Hill Tea + Photo Project，THTP）是葉偉立自 2004 年起進駐台北寶藏巖聚落的長期計畫（駐村約 2004–2006，計畫延續至 2008）。他以「藝術家在社區裡可以做什麼」為提問，在聚落開設泡茶與照相的空間、替居民拍肖像、整理花園、與鄰居往來共作。\n\n相對於主動的社區介入，他採一種「等候大駕」的被動姿態——讓現實與關係自己找上門，再從中長出作品。\n\n計畫分多個階段，最後以「勘誤」（Oversight）階段集結，2008 年於溫哥華 Centre A 展出、出版專書。具社區互動，但主要仍是藝術家主導的個人計畫。", "selfDesc": "呂佩怡研究案把本計畫列為『以藝術介入現實』，載葉偉立 2004 年進駐寶藏巖、以『藝術家在社區可以做什麼』為提問，開泡茶照相館、拍肖像、整理花園、與鄰居協作，採『等候大駕』的被動方式（『現實會自己找上你』），最後階段『勘誤』於 2008 年溫哥華 Centre A 展出。亞洲藝術文獻庫（AAA）館藏記錄《The Treasure Hill Tea + Photo Project / Phase Five / Oversight》(2008)，含葉偉立攝影與書信、吳語心錄像作品，鄭慧華（Amy Cheng）撰〈葉偉立與吳語心的個人與集體創作〉，144 頁、繁中與英文。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"最可借鏡的是「被動式進場」：不帶既定方案空降社區，而是先住下來、開一個可以泡茶照相的空間，讓關係自己發生、再長出作品。對社區駐點、地方書寫的課程，這示範了放慢節奏、以日常接觸累積信任的取徑；也可對照主動介入型計畫，討論兩種姿態的利弊。",
 techniques:[{t:"不帶既定方案空降社區，先住下來。",te:"Do not parachute into a community with a fixed plan; settle in first."},{t:"開一個可以泡茶、照相的空間，讓關係自己發生。",te:"Open a space for tea and photographs and let relationships happen on their own."},{t:"對照主動介入型計畫，討論兩種姿態的利弊。",te:"Compare with actively interventionist projects and discuss the pros and cons of the two stances."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "context", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把《寶藏巖泡茶照相館計畫》列為『以藝術介入現實』，載葉偉立 2004 進駐寶藏巖、以『藝術家在社區可以做什麼』為提問、開泡茶照相館、拍肖像、整理花園、與鄰居協作、採『等候大駕』被動方式、最後階段『勘誤』2008 於溫哥華 Centre A 展出", "https://www.ncafroc.org.tw/"], ["The Treasure Hill Tea + Photo Project / Phase Five / Oversight（亞洲藝術文獻庫 AAA 館藏，2008）：載本計畫含葉偉立攝影與書信、吳語心錄像，鄭慧華（Amy Cheng）撰文，144 頁、繁中與英文", "https://aaa.org.hk/collections/search/library/the-thtp-projectphase-fiveoversight"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與亞洲藝術文獻庫（AAA）館藏記錄互證《寶藏巖泡茶照相館計畫》為葉偉立在寶藏巖的計畫、含攝影與吳語心錄像、鄭慧華撰文。保留：確切駐村起訖（2004–2006）與泡茶照相館、肖像、『等候大駕』等細節出自呂文；AAA 為 2008『第五階段』出版品、顯示計畫多階段延續至 2008，故年份標為『2004 起』。"},
{"id": "k73", "name": "鐵甲元帥—龜島", "en": "", "creator": "許家維", "city": "連江", "place": "馬祖外海小島（北竿一帶）；神明鐵甲元帥源自中國武夷山", "year": "2012", "yk": 2012, "yd": "2012", "yde": "2012", "issue": ["地方記憶", "身分與歷史記憶"], "form": ["影像"], "practice": ["藝術家個人創作"], "audience": [], "summary":"《鐵甲元帥—龜島》（Marshal Tie Jia – Turtle Island）是許家維 2012 年的錄像裝置。作品以馬祖外海一座小島及其守護神「鐵甲元帥」（一尊青蛙神明）為主軸：這尊神原在中國武夷山的廟，廟於文化大革命中被毀，神明輾轉遷到馬祖。\n\n許家維以綠幕合成，在島上重建一座虛構的原廟影像，鏡頭再緩緩拉開、露出綠幕，讓神話、歷史與兩岸遷移的記憶在同一個畫面裡並置。\n\n作品的拍攝是在不斷向神明請示、協商的過程中完成的。「龜島」見於作品標題，Art Basel 僅記「馬祖外海小島」，未寫北竿；這是藝術家個人創作，以地方歷史與信仰為題。", "selfDesc": "呂佩怡研究案把《鐵甲元帥》列為『以藝術介入現實』，指其以地點自身的歷史為主軸、透過影像訴說地方記憶，且拍攝在與神明請示協商之間完成，體現『現實會自己找上你』的被動介入。Art Basel 作品目錄載《Marshal Tie Jia – Turtle Island》(2012) 場景為馬祖外海小島、受地方神明『鐵甲元帥』（蛙神）守護、該神源自中國武夷山一座於文革被毀的廟後遷至馬祖、以綠幕合成在島上重建虛構原廟的錄像裝置。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"最可借鏡的是把「地方的神明與歷史」當成敘事主角，而非背景：許家維讓拍攝本身成為與神明協商的過程，使作品的生產方式也呼應在地信仰。對地方記憶、民間信仰、兩岸遷移史的課程，這示範了如何以一個具體的物／神，牽出一整段被忽略的歷史。",
 techniques:[{t:"把地方的神明當成敘事主角，而非背景。",te:"Make the local god the protagonist of the narrative rather than a backdrop."},{t:"讓拍攝本身成為向神明請示、協商的過程。",te:"Let the filming itself be a process of asking the god’s permission and negotiating."},{t:"用綠幕重建虛構原廟，再拉開鏡頭露出綠幕，把神話與歷史並置。",te:"Use green screen to rebuild an imagined original temple, then pull back to reveal the green screen, placing myth and history side by side."}], "ibaeContext": ["地", "時"], "ibaeOrigin": "context", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把《鐵甲元帥》列為『以藝術介入現實』，載以地點自身歷史為主軸、透過影像訴說地方記憶、拍攝在與神明請示協商間完成、採被動介入", "https://www.ncafroc.org.tw/"], ["Hsu Chia-Wei, Marshal Tie Jia – Turtle Island, 2012（Art Basel 作品目錄）：載 2012、場景為馬祖外海小島、受地方神明『鐵甲元帥』（蛙神）守護、該神源自中國武夷山一座文革被毀的廟後遷至馬祖、以綠幕合成在島上重建虛構原廟的錄像裝置", "https://www.artbasel.com/catalog/artwork/15674/Hsu-Chia-Wei-Marshal-Tie-Jia-Turtle-Island"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與 Art Basel 作品目錄互證《鐵甲元帥—龜島》(2012)、馬祖外海小島、蛙神『鐵甲元帥』源自武夷山文革被毀之廟後遷馬祖、綠幕重建虛構原廟的錄像裝置等核心。保留：『北竿』為呂文脈絡、Art Basel 僅記『馬祖外海小島』；與神明請示協商的拍攝過程出自呂文。"},
{"id": "k74", "name": "東亞照明（周育正的交換平台計畫）", "en": "", "creator": "周育正", "city": "台北", "place": "台北市立美術館等美術館展場", "year": "2010", "yk": 2012, "yd": "2010", "yde": "2010", "issue": ["勞動與人權"], "form": ["裝置"], "practice": ["藝術家個人創作"], "audience": [], "summary":"周育正以「藝術家作為資源流動的中介者」為核心做了一系列計畫，《東亞照明》（2010）是代表作：他向照明廠商要求贊助燈具，用來照亮美術館內原本空無一物的空間——燈具因此對廠商發揮了廣告作用，展覽結束後作品又被納入館藏、回應了館方的需要。\n\n作品一方面把「藝術生產的機制」攤開來看，一方面呈現藝術與經濟領域之間的合作與交換。延續同一思路，他另有《取之社會，用之社會》（2010，以補助經費製版畫販售、所得再捐回基金會）與《工作史—盧皆得》（2012，與臨時工盧皆得合作、讓他以保全身分在北美館展場看守並出書）。\n\n年份有出入：呂佩怡研究案把《東亞照明》《虹牌油漆》歸為 2011，台灣當代藝術資料庫與關鍵評論網展評記《東亞照明》為 2010，本平台採 2010。議題以「勞動與人權」標示，主要對應《工作史—盧皆得》的臨時工題材。", "selfDesc": "呂佩怡研究案把周育正列為『以藝術作為交換平台』，載《取之社會，用之社會》(2010)、《東亞照明》《虹牌油漆》(2011) 要求廠商贊助燈管／油漆、再轉化為美術館資源的『回饋』機制，以及《工作史—盧皆得》(2012)，視藝術家為資源流動的中介者。關鍵評論網所刊周育正個展展評（Rahma Khazam 撰、吳嘉穎譯，約 2016）載《東亞照明》(2010) 由贊助商提供燈具照亮美術館空無空間、展後納入館藏，『一方面呈現藝術生產的機制，另一方面說明藝術與經濟領域卓有成效的合作關係』；《工作史》(2012) 與臨時工盧皆得合作、以保全身分在北美館展場看守、並彙整成書。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"最可借鏡的是把「資源怎麼流動」本身變成作品：藝術家不迴避補助、贊助、館藏這些機制，反而把它們攤開、讓資源在其中流動並回饋。對談藝術與金錢、機構、勞動的課程，這示範了一種「中介者」的位置——不批判體制於外，而是進到體制內部操作它、再揭露它。",
 techniques:[{t:"向廠商要求贊助燈具，把「資源怎麼流動」本身做成作品。",te:"Ask companies to sponsor lamps and make “how resources flow” itself the work."},{t:"不迴避補助、贊助、館藏等機制，而是把它們攤開來看。",te:"Do not avoid mechanisms such as grants, sponsorship and collections, but lay them open."},{t:"與臨時工合作，讓他在美術館以保全身分看守並出書。",te:"Work with a temporary worker, who watched the museum as a security guard, and publish a book."}], "ibaeContext": ["時"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把周育正列為『以藝術作為交換平台』，載《取之社會，用之社會》(2010)、《東亞照明》《虹牌油漆》(2011) 要求廠商贊助、轉化為美術館資源的『回饋』機制、《工作史—盧皆得》(2012)，藝術家作為資源流動的中介者", "https://www.ncafroc.org.tw/"], ["周育正個展展評〈Chou Yu-Cheng〉（Rahma Khazam 撰、吳嘉穎譯，關鍵評論網 The News Lens，約 2016）：載《東亞照明》(2010) 由贊助商提供燈具照亮美術館空無空間、展後納入館藏，『一方面呈現藝術生產的機制，另一方面說明藝術與經濟領域卓有成效的合作關係』；《工作史》(2012) 與臨時工盧皆得合作、以保全身分在北美館展場看守", "https://www.thenewslens.com/article/44056"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與關鍵評論網所刊個展展評互證《東亞照明》贊助燈具→照亮空館→納入館藏的『回饋／交換』機制、藝術生產機制的攤開，以及《工作史—盧皆得》與臨時工的合作等核心。保留：年份兩說並陳（呂文 2011、展評與台灣當代藝術資料庫 2010，本平台採 2010）；《取之社會，用之社會》細節主要出自呂文。"},
{"id": "k75", "name": "五百棵檸檬樹", "en": "", "creator": "黃博志", "city": "新竹", "place": "廢耕地重新種檸檬（呂文載新竹北埔三塊廢耕地；黃博志對談則述靠近觀音的老家檸檬田）", "year": "2013 起（2015 檸檬樹種完、獲台北獎；2016 北美館個展）", "yk": 2016, "yd": "2013", "yde": "2013", "issue": ["環境", "勞動與人權"], "form": ["裝置"], "practice": ["社會參與式藝術", "藝術家個人創作"], "audience": [], "summary":"《五百棵檸檬樹》（呂佩怡研究案作《五百顆檸檬樹》）是黃博志自 2013 年起的長期計畫。他把美術館展覽當成一種機制，預先販賣「酒標」向大眾募資，用這筆錢在廢耕地重新整地、種下檸檬樹；待數年後檸檬收成、釀成檸檬酒，再回饋給當初認購酒標的人。\n\n計畫藉一瓶還沒釀出的酒，把農業、土地、經濟與生產消費的關係攤在眼前；黃博志的母親曾是成衣廠女工、家中有務農背景，計畫也牽連著他的家族生命史。\n\n2015 年檸檬樹種完，計畫獲台北獎，2016 年於台北市立美術館推出個展《五百棵檸檬樹：有機檔案》。地點兩說並陳：呂文載新竹北埔三塊廢耕地，黃博志對談則述靠近觀音的老家檸檬田。", "selfDesc": "呂佩怡研究案載《五百顆檸檬樹》(2013) 把美術館展覽作為機制、預先販賣酒標、資金作為新竹北埔地區三塊廢耕地重新種檸檬樹的第一桶金、兩年後製成檸檬酒給酒標認購者，以此探討農業、經濟、民生消費與生產；並提及《生產線：中國製造＆台灣製造》(2014) 以其母親成衣女工的生命史串起深圳與台北。數位荒原〈檸檬樹到檸檬酒工廠：藝術家黃博志、黃千瑜對談〉（關鍵評論網轉載）載『五百顆檸檬樹現在都種完了』、賣酒標募資、把老家一樓改建為小型檸檬酒加工廠、計畫獲 2015 年台北獎、2016 年於北美館個展《五百棵檸檬樹：有機檔案》；文中述檸檬田老家『靠近觀音』。", "editNote": "", "educatorRole": "artist-led", "pedagogicalInsight":"最可借鏡的是用一個「還沒完成的物」（還沒釀出的酒）把一條生產鏈拉開：從募資、整地、種樹到釀酒、回饋，讓參與者用認購把自己接到一塊土地與一段時間裡。對談農業、食物、土地與經濟的課程，這示範了怎麼把抽象的「產消關係」變成一件要等好幾年才收成的具體計畫。",
 techniques:[{t:"預先販賣「酒標」募資，讓參與者用認購把自己接到一塊土地與一段時間裡。",te:"Pre-sell “wine labels” to raise funds so participants connect to a piece of land and a stretch of time by buying."},{t:"用一瓶還沒釀出的酒，把農業、土地與產消關係攤開來看。",te:"Use a bottle of wine not yet made to lay open agriculture, land and the producer–consumer relation."},{t:"把美術館展覽當成機制，而不只是展出成果的地方。",te:"Treat the museum exhibition as a mechanism, not only a place to show results."}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把黃博志列為『以藝術作為交換平台』，載《五百顆檸檬樹》(2013) 以美術館展覽為機制、預售酒標、資金作新竹北埔三塊廢耕地重新種檸檬樹的第一桶金、兩年後釀檸檬酒給認購者，探討農業、經濟、民生消費與生產", "https://www.ncafroc.org.tw/"], ["〈檸檬樹到檸檬酒工廠：藝術家黃博志、黃千瑜對談〉（數位荒原 No Man's Land，關鍵評論網 The News Lens 轉載）：載《五百棵檸檬樹》賣酒標募資、五百棵檸檬樹已種完、把老家一樓改建為小型檸檬酒加工廠、計畫獲 2015 台北獎、2016 於台北市立美術館個展《五百棵檸檬樹：有機檔案》、檸檬田老家靠近觀音", "https://www.thenewslens.com/article/51802"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與數位荒原黃博志對談（關鍵評論網轉載）互證《五百棵檸檬樹》(2013 起) 預售酒標募資、在廢耕地種五百棵檸檬樹、數年後釀檸檬酒回饋認購者等核心，並由對談補 2015 台北獎、2016 北美館個展。保留：種植地點兩源不同（呂文『新竹北埔三塊廢耕地』、對談『靠近觀音的老家』）並陳；作品名『顆/棵』並陳。"},
{"id": "k76", "name": "樹梅坑溪環境藝術行動", "en": "", "creator": "吳瑪悧＋竹圍工作室", "city": "新北", "place": "新北淡水竹圍一帶、樹梅坑溪流域", "year": "2010–2012（2013 獲第 11 屆台新藝術獎視覺藝術類年度大獎）", "yk": 2012, "yd": "2010", "yde": "2010", "issue": ["環境", "教育"], "form": ["工作坊", "表演"], "practice": ["社會參與式藝術", "社區藝術", "藝術教育"], "audience": ["地方居民", "青少年"], "summary":"樹梅坑溪環境藝術行動是吳瑪悧與竹圍工作室於 2010–2012 年策畫的長期環境藝術行動，獲國藝會視覺藝術策展專案獎助，2013 年獲第 11 屆台新藝術獎視覺藝術類年度大獎。計畫提出「以水連結破碎的土地」，沿著約十公里長的樹梅坑溪，把山林、豬舍、高樓、捷運站這些看似無關的地方串起來。\n\n它不是傳統的攝影或繪畫，而是由數個文化行動組成——樹梅坑溪早餐會、村落的形狀—流動博物館、社區劇場、在地綠生活—與植物有染、我校門前有條河、水之舞（呂文記五個子計畫，非池中記六個，本平台採六項）——與在地學校師生、居民、政府部門一起進行。\n\n吳瑪悧主張「藝術扮演的不是美化的角色，而是引發、連結、思考的媒介」，把自己放在關係編織者的位置。地點依竹圍工作室所在與溪流位置標為新北淡水竹圍一帶。", "selfDesc": "呂佩怡研究案把本行動列為『以藝術作為社會變革之方法』，載其為國藝會 2010 年視覺藝術策展專案獎助、含五個子計畫（樹梅坑溪早餐會、流動博物館、與植物有染、我校門前有小溪、社區劇場），並引吳瑪悧『藝術扮演的不是美化的角色，而是引發、連結、思考的媒介』。非池中藝術網（ETtoday，2013-05-23）載本作由吳瑪悧及竹圍工作室創作、2013-05-11 獲第 11 屆台新藝術獎視覺藝術類年度大獎、提出『以水連結破碎土地』、以約 10 公里河流串起山林豬舍高樓捷運站、由六項文化行動組成（樹梅坑溪早餐會、村落的形狀—流動博物館、社區劇場、在地綠生活—與植物有染、我校門前有條河、水之舞）、與在地教育機構居民與政府部門合作。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"最可借鏡的是用一條溪當「串線」：把早餐會、劇場、植物染、學校課程等看似零散的活動，用「水」與「流域」串成一個整體，讓居民、學生、公部門都接進來。對環境教育、社區營造的課程，這示範了怎麼把一個生態議題變成可以長期、多點、跨世代參與的行動，而不只是一次性的展覽。",
 techniques:[{t:"用一條溪當串線，把看似無關的場所與活動串成一個整體。",te:"Use a stream as a thread to string seemingly unrelated places and activities into one whole."},{t:"早餐會、流動博物館、社區劇場、學校課程等多種文化行動並行。",te:"Run several cultural actions in parallel: the breakfast club, a mobile museum, community theatre and school lessons."},{t:"與在地學校、居民和政府部門一起進行，而不只是辦一次展覽。",te:"Work with local schools, residents and government departments rather than only putting on one exhibition."}], "ibaeContext": ["地", "人"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把《樹梅坑溪環境藝術行動》(2010–2012) 列為『以藝術作為社會變革之方法』，載其為國藝會 2010 視覺藝術策展專案獎助、含五個子計畫（樹梅坑溪早餐會、流動博物館、與植物有染、我校門前有小溪、社區劇場），引吳瑪悧『藝術扮演的不是美化的角色，而是引發、連結、思考的媒介』", "https://www.ncafroc.org.tw/"], ["〈樹梅坑溪環境藝術行動 奪台新藝術獎視覺藝術類大獎〉（非池中藝術網，ETtoday 2013-05-23 刊載）：載吳瑪悧及竹圍工作室之《樹梅坑溪環境藝術行動》2013-05-11 獲第 11 屆台新藝術獎視覺藝術類年度大獎、提出『以水連結破碎土地』、以約 10 公里河流串起山林豬舍高樓捷運站、由六項文化行動組成、與在地學校居民與政府部門合作", "https://www.ettoday.net/news/20130523/210742.htm"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與非池中藝術網報導互證《樹梅坑溪環境藝術行動》為吳瑪悧及竹圍工作室之長期行動、『以水連結破碎土地』、由多項文化行動組成、獲第 11 屆台新藝術獎視覺藝術類年度大獎等核心。保留：子計畫數 5（呂文）／6（非池中）並陳；『新北竹圍』為依竹圍工作室所在與溪流位置判定，兩源未逐字寫出縣市。"},
{"id": "k77", "name": "植-物新樂園（撒烏瓦知部落）", "en": "", "creator": "許淑真、盧建銘", "city": "桃園", "place": "大漢溪畔撒烏瓦知部落（都市阿美族自力造屋社區，桃園大溪一帶）", "year": "2008–2010（獲第 8 屆台新藝術獎視覺藝術類年度大獎）", "yk": 2010, "yd": "2008", "yde": "2008", "issue": ["原住民族文化", "社宅與居住", "環境"], "form": ["版畫", "裝置", "表演"], "practice": ["社會參與式藝術", "社區藝術"], "audience": ["地方居民"], "summary":"《植-物新樂園》是許淑真與盧建銘以大漢溪畔撒烏瓦知部落（遷居都市的阿美族自力造屋社區，桃園大溪一帶）為場域的長期計畫（2008–2010），獲第 8 屆台新藝術獎視覺藝術類年度大獎。他們把生態藝術與文化運動結合。\n\n先做部落農田的植物標本版畫；部落遭拆除後，再把這些圖像印在 T 恤上、以羅馬拼音標記族人的阿美名字，作為一種「命名」與認同的實踐；進而以〈建屋：一種社會契約的實踐〉投入自力造屋，甚至把在高雄市立美術館展出的展場建材運回部落、作為蓋屋的基礎。\n\n計畫以藝術作為另類社會運動，直接介入部落的居住與存續；兩位藝術家自問「對誰產生價值？部落（社區）內部和社會外部的效應為何？」。評審稱其「建立了漢人參與原民社會的一種模式」。", "selfDesc": "呂佩怡研究案把許淑真與盧建銘列為『以藝術作為社會變革之方法』，載《植-物新樂園》於大漢溪畔撒烏瓦知部落、以生態藝術結合文化運動——農田植物標本版畫、拆除後印於 T 恤為族人『命名』、〈建屋：一種社會契約的實踐〉自力造屋，並把高美館展場建材運回部落做建屋基礎；並引其自問『對誰產生價值？部落（社區）內部和社會外部的效應為何？』。台新藝術獎頁面（2010-05-13）載此作獲第 8 屆台新藝術獎視覺藝術類年度大獎，評審稱其為『小屋形式的作品』、與阿美族合作、探討居住空間與生活方式、『建立了漢人參與原民社會的一種模式』、涉及『河岸阿美的物質世界』。", "editNote": "", "educatorRole": "facilitator-led", "pedagogicalInsight":"最可借鏡的是把藝術直接接到「居住的存續」上：不是替部落發聲就停住，而是從植物標本、命名，一路做到自力造屋、把展場建材變成房子的基礎。對原住民族、土地正義、都市邊緣社區的課程，這示範了藝術如何成為一種「另類社會運動」，也逼人去問許淑真、盧建銘自己問的：這到底對「誰」產生價值。",
 techniques:[{t:"從植物標本版畫、為族人「命名」，一路做到自力造屋。",te:"Go from botanical-specimen prints and “naming” people all the way to self-built housing."},{t:"把展場建材運回部落，變成蓋屋的基礎。",te:"Carry exhibition materials back to the tribe to become the foundation for building houses."},{t:"追問：這到底對「誰」產生價值？部落內部與社會外部的效應是什麼？",te:"Ask: for whom does this actually create value? What are the effects inside the tribe and outside in society?"}], "ibaeContext": ["人", "地", "時"], "ibaeOrigin": "content", "sources": [["呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉（國藝會 2015 委託研究計畫案）：把許淑真與盧建銘列為『以藝術作為社會變革之方法』，載《植-物新樂園》(2008–2010) 於大漢溪畔撒烏瓦知部落、以生態藝術結合文化運動（農田植物標本版畫、拆除後印於 T 恤為族人『命名』、〈建屋：一種社會契約的實踐〉自力造屋、把高美館展場建材運回部落做建屋基礎）", "https://www.ncafroc.org.tw/"], ["第 8 屆台新藝術獎視覺藝術類年度大獎（台新銀行文化藝術基金會，2010-05-13）：載此『小屋形式的作品』與阿美族合作、探討居住空間與生活方式、『建立了漢人參與原民社會的一種模式』、涉及『河岸阿美的物質世界』（頁面標題誤植『許淑貞』，內文為『許淑真』）", "https://taishinart.org.tw/news-detail/292.html"]], "story": null, "status": "已查證", "statusWhy": "已查證：呂佩怡研究案（學術）與台新藝術獎官方頁互證本作為許淑真與盧建銘與阿美族部落合作、以居住／自力造屋為核心、獲第 8 屆台新藝術獎視覺藝術類年度大獎。保留：撒烏瓦知部落、大漢溪、植物標本版畫、建材運回等具體細節出自呂文；縣市（桃園）係依撒烏瓦知部落所在推定，兩源未逐字寫出；台新頁標題誤植『許淑貞』。"},
{"id":"k78","name":"星濱山共創工作室","en":"","creator":"星濱山共創工作室（主理人林書豪）","city":"基隆","place":"基隆市中正區正濱漁港（中正路393巷30號2樓）","year":"2017 成立","yk":2025,"yk0":2017,"yd":"2017 成立（工作室自述，canopi 亦載）","yde":"Founded 2017 (studio’s own account; also stated by canopi)","issue":["地方記憶","都市發展"],"form":["展覽","影像","工作坊"],"practice":["社會參與式藝術","社區藝術","策展與展覽","藝術節與駐村"],"audience":["地方居民"],"summary":"星濱山共創工作室是基隆正濱漁港的在地團隊，由創辦人林書豪與一群關心地方文化、藝術與設計的青年於 2017 年成立。面對漁港產業失傳、人口外移與文化流失，工作室希望透過藝術與設計，讓更多人重新珍視腳下的土地。\n\n工作室以「藝術共創 Creator In Residence（CIR）」與地域策展為核心：媒合藝術家、設計師、建築師、音樂家、社會學家等不同領域的創作者進駐在地，結合在地特色跨領域合作，完成集體參與的互動成果；也擅長地方設計、藝術創作、展覽策劃與空間、視覺設計整合，把地方文化轉譯為可被看見的作品。獨立報導可見其長期深耕：2018 年「苔客上岸——正濱港灣共創藝術節」、2019 年「大魚來了——正濱港灣共創插畫節」並集結成繪本，同年底成立「星濱海港學校」開設技藝課、食魚教育與漁港歷史課程；公視新聞 2020 年也報導其組織在地人、串連在地故事與資源。\n\n工作室以正濱漁港為基地持續策展與行動，近年作品包括 2023 年《999朵玫瑰の愛之船》與 2025 年星濱山雙年展《水啦 WATER LIVES HERE》；在每一次串聯中，特別重視世代傳承的文化記憶。","selfDesc":"工作室自述（官網、104）：由關心地方文化、藝術和設計背景的青年組成，以「體驗經濟、文創產品、設計服務」為創意行動主軸，共同構思、推動與實踐，並以「藝術共創」作為在地認識、對話和創作的主軸；擅長地方設計、藝術創作、展覽策劃、空間與視覺設計整合，將地方文化透過設計、藝術行動、展覽轉譯呈現，讓更多人珍視腳下的土地。經營理念「藝術共創 Creator In Residence（CIR）」是一種廣義的創作者進駐，包含藝術家、設計師、建築師、音樂家和社會學家等不同創意人才，結合地方特色、運用不同媒材、跨領域合作觸發不同文化疆界，完成集體參與的互動性成果，並重視世代傳承文化記憶的價值。","educatorRole":"facilitator-led","pedagogicalInsight":"這個案例是「工作室／組織」層級的前例：它的方法是把不同領域的創作者「進駐」在地（CIR），再透過田野、工作坊與店家、學校串連，讓在地居民與職人成為共創的一員。要提醒的是：工作室對自身理念的描述帶有經營與行銷語言，居民在各計畫中的決策角色，獨立來源著墨不多；引用時宜分清「工作室自述」與「獨立報導」。","techniques":[{"t":"以「藝術共創（CIR）」媒合藝術家、設計師、建築師、音樂家等跨領域創作者進駐在地，一起創作。","te":"Use “art co-creation (CIR)” to bring artists, designers, architects, musicians and other cross-disciplinary creators into residence in the locality to make work together.","m":""},{"t":"訪談在地耆老與漁業前輩，做田野調查，把聽到的故事帶進創作與展覽。","te":"Interview local elders and veterans of the fishing trade as fieldwork, and bring what is heard into the making and exhibitions.","m":"oral"},{"t":"開設影像、音樂、空間等不同類型的工作坊，讓居民與職人一起動手。","te":"Run workshops of different kinds — image, music, space — so residents and tradespeople take part hands-on.","m":""},{"t":"與在地店家、學校串連合作，把漁港的在地知識與日常帶進課堂與街區。","te":"Link up with local shops and schools, bringing the fishing port’s local knowledge and everyday life into classrooms and streets.","m":""},{"t":"以地域策展打開閒置的老舊空間，重新思考其使用方式。","te":"Use place-based curation to open up disused old spaces and rethink how they are used.","m":""}],"ibaeContext":["人","地"],"ibaeOrigin":"context","editNote":"","sources":[["星濱山共創工作室官網「關於我們」（工作室自述）：團隊組成、體驗經濟／文創產品／設計服務主軸、藝術共創 CIR 經營理念、地址位於基隆正濱漁港","https://www.zhengbinart.com/about-us",1],["星濱山共創工作室官網部落格〈地方創生・講座側記〉（工作室自述）","https://www.zhengbinart.com/post/%E5%9C%B0%E6%96%B9%E5%89%B5%E7%94%9F-%E8%AC%9B%E5%BA%A7%E5%81%B4%E8%A8%98-%E4%B8%80%E8%B5%B7%E8%81%8A%E8%81%8A%E6%88%91%E5%80%91%E6%98%AF%E5%A6%82%E4%BD%95%E8%A2%AB%E8%97%9D%E8%A1%93%E6%84%9F%E6%9F%93%E7%9A%84",1],["104 人力銀行・星濱山共創工作室公司介紹（工作室自述）","https://www.104.com.tw/company/1a2x6bmcvz",1],["星濱山共創工作室報導（canopi）：載 2017 年成立、創辦人林書豪（建築背景）、2018『苔客上岸』藝術節、2019『大魚來了』插畫節並集結成繪本、2019 年底成立星濱海港學校","https://canopi.tw/culture-and-lifestyle/zhengbinart/"],["〈正濱港町藝術共創〉眼底城事（eyesonplace，2018-01-26）：記錄『星濱山』2018 年起的正濱港町藝術共創、CIR 媒合職人與創作者、影像／音樂／空間工作坊","https://eyesonplace.net/2018/01/26/7363/"],["〈漁港藝術共創「星濱山」〉遠見城市學（2025-06-09）：串連居民、吸引藝術家進駐、與店家和學校合作、訪談耆老","https://city.gvm.com.tw/article/121888"],["基隆正濱漁港藝術共創報導（公視新聞網，2020-05-29）：林書豪談組織在地人、串連在地故事與資源","https://news.pts.org.tw/article/480775"],["星濱山相關訪談報導（關鍵評論網）：田野調查訪問耆老與漁業前輩、彩色屋在地顏色調查與色票統計","https://www.thenewslens.com/article/174745"],["永豐基金會社區頁面（使用者提供連結，本次未能讀取內文，未作佐證）","https://www.sinopacfoundation.org.tw/community/20"],["星濱山共創工作室 Facebook（社群連結，未作佐證）","https://www.facebook.com/zhengbinart/?locale=zh_TW"],["星濱山共創工作室 Instagram（社群連結，未作佐證）","https://www.instagram.com/zhengbin.art/"]],"story":null,"status":"已查證","statusWhy":"工作室的存在、所在地（基隆正濱漁港）與「在地青年、藝術共創（CIR）、地方設計與展覽」的性質，有多個不同年份的獨立來源互相佐證（canopi、眼底城事 2018、公視 2020、遠見 2025、關鍵評論）；「2017 成立」除工作室自述外，canopi 亦獨立載明。經平台維護者（使用者）確認收錄。保留：工作室對自身理念（CIR、體驗經濟／文創產品／設計服務）的描述屬自述，正文事實以獨立報導為準；眼底城事把『正濱港町藝術共創』計畫起點記在 2018、公視報導自 2020；永豐基金會頁面本次未能讀取，未作佐證。"}

{"id":"k79","name":"安魂工作隊：規訓的星系──戰後外省「離散」及「鎮壓」史調查創作計畫","en":"Libera Work-Gang: The Galaxy of Discipline","creator":"安魂工作隊（計畫主持：林傳凱；主創：洪瑋伶；合作：辛佩宜、李佳泓等）","city":"台北","place":"臺灣當代文化實驗場 C-LAB（原空軍總司令部，臺北市大安區）","year":"2019","yk":2019,"yk0":2019,"yd":"2019（團隊 2018 成立）","yde":"2019 (group founded 2018)","issue":["身分與歷史記憶","勞動與人權","災害與創傷"],"form":["影像","表演","工作坊","展覽"],"practice":["社會參與式藝術","藝術節與駐村"],"audience":[],"summary":"這是 2019 年在臺灣當代文化實驗場（C-LAB）進行的駐地調查與創作計畫，由「安魂工作隊」提出。團隊 2018 年成立，成員包含藝術家、研究者與群眾教育工作者，計畫主持人是白色恐怖史研究者林傳凱，主要創作者為影像工作者洪瑋伶。\n\n計畫關注戰後「外省」政治犯的處境。團隊指出，白色恐怖受難者中約有四成是外省籍、且多具軍職；他們一面是威權體制下的受害者，身分卻又常被簡化或被當成政治工具。計畫以空軍、陸軍、海軍三條線索，調查審訊與關押的空間、檔案與記憶。\n\n團隊把 C-LAB 所在的前空軍總司令部（空總）當成田野，透過老照片與曾在此工作者的口述，尋找疑似審訊與關押政治犯的空間，並完成三件影像作品《寫字的人》《負罪的人》《霧中風景》，分別對應空軍、陸軍、海軍三條線索。\n\n除了創作，團隊也辦了大量公眾活動：讀書會、多場主題座談，以及由表演工作者帶領、體驗「被規訓的身體」的工作坊，是當屆駐村中活動最密集、參與人數最多的團隊之一。","selfDesc":"團隊自述「安魂」的核心精神，是關注戒嚴時期消逝的抗爭者，讓他們的身影重新在當代浮現，也讓當代人找回走入公共的力量。計畫以「去族群化」地重看『外省人』為方法，透過密集的講座、讀書會與影片放映，凸顯階級、族群、文化與戰爭經驗的差異，並探討離散者不同的自我認同。（此段為團隊／C-LAB 頁面的自述，正文事實以獨立來源為準。）","educatorRole":"artist-led","pedagogicalInsight":"這個案例示範了怎麼把一段沉重、抽象的歷史，變成可以調查、也可以一起參與的行動。幾個手法可以借鏡：把一棟還在使用的建築（空總）當成田野，用舊照片和耆老口述去「考掘」看不見的空間；用空軍、陸軍、海軍三條線索，把龐雜的歷史分組；用讀書會、座談與身體工作坊，把觀眾變成一起探究的人。要提醒的是：這類計畫處理真實受難者的創傷與尊嚴，引用時要分清楚「團隊自述」與「獨立史料」，也要顧及受難者與家屬的感受。","techniques":[{"t":"把一棟還在使用的建築當成田野：用舊照片和曾在此工作者的口述，重建已經看不見的審訊與關押空間。","te":"Treat a building still in use as a field site: use old photographs and the oral accounts of people who once worked there to reconstruct interrogation and detention spaces that can no longer be seen."},{"t":"用空軍、陸軍、海軍三條線索，把龐雜的白色恐怖史分組調查，再各自對應成一件影像作品。","te":"Split a sprawling White Terror history into three threads — air force, army, navy — and turn each into its own moving-image work."},{"t":"用讀書會與主題座談，把政治犯的回憶錄和專題研究帶給一般觀眾共讀、共談。","te":"Use reading groups and themed talks to read political prisoners’ memoirs and specialist research together with a general audience."},{"t":"用身體工作坊讓參與者親身體驗「被規訓的身體」，把抽象的壓迫變成可以感受的經驗。","te":"Use a body workshop to let participants physically experience ‘the disciplined body’, turning abstract oppression into something that can be felt."}],"ibaeContext":["人","地","時"],"ibaeOrigin":"content","editNote":"","sources":[["安魂工作隊 Libera Work-Gang｜2019 CREATORS 創作／研發進駐計畫（臺灣當代文化實驗場 C-LAB 官方頁）","https://clab.org.tw/en/creators/2019-r7/",1],["〈過去從未過去，「安魂工作隊」的調查行動與歷史時空再考掘〉謝鎮逸（CLABO 實驗波，2020-06-10）","https://mag.clab.org.tw/clabo-article/libera-work-gang_the-galaxy-of-disciplinelibera-work-gang_the-galaxy-of-discipline/"],["2020 台北雙年展參展頁《在冷戰裡生火》秦政德＋李佳泓＋林傳凱＋陳怡君（臺北市立美術館）","https://www.taipeibiennial.org/2020/zh-TW/Participants/Participants_Content/1?type=security"],["林傳凱 助理教授個人頁：白色恐怖史研究、2018 年起推動「歷史鄉鎮化」（國立中山大學社會學系）","https://moiss.nsysu.edu.tw/p/406-1370-362061,r6014.php?Lang=zh-tw"],["〈新人發聲／林傳凱〉本人自述戰後抗爭史與外省離散研究（台灣社會學會通訊）","https://www.tsatw.org.tw/page.php?menu_id=2&new_id=3268"]],"story":null,"status":"已查證","statusWhy":"已查證：C-LAB 官方 CREATORS 2019 計畫頁載明「安魂工作隊」2018 成立、以 1949–1987 檔案調查空總與白色恐怖陸海空三軍史；CLABO 評論（謝鎮逸，2020）詳述三件影像作品與密集公眾活動；臺北市立美術館 2020 台北雙年展參展頁、林傳凱中山大學個人頁與台灣社會學會通訊，分別獨立佐證計畫主持人身分、研究主題與團隊協作。多個不同性質、不同單位的來源互相印證，故標已查證。"}

k78:{"name":"Xingbinshan Co-creation Studio","creator":"Xingbinshan Co-creation Studio (founder Lin Shu-hao)","place":"Zhengbin Fishing Port, Zhongzheng District, Keelung","year":"Founded 2017 (studio’s own account; also stated by canopi)","summary":"Xingbinshan Co-creation Studio is a local team at Zhengbin Fishing Port in Keelung, founded in 2017 by Lin Shu-hao and a group of young people who care about local culture, art and design. Facing the loss of the port’s fishing trades, outmigration and cultural loss, the studio set out to use art and design to help more people value the land under their feet.\n\nThe studio works through “art co-creation (Creator In Residence, CIR)” and place-based curation: it brings artists, designers, architects, musicians and sociologists into residence in the locality, combining local character with cross-disciplinary collaboration to produce collective, participatory outcomes. It also specialises in place design, art-making, exhibition curation and spatial and visual design, translating local culture into work that can be seen. Independent reports show its long engagement: the 2018 “Moss Guests Come Ashore” co-creation art festival, the 2019 “Here Come the Big Fish” co-creation illustration festival (later gathered into picture books), and the Xingbin Harbour School founded at the end of 2019 with classes on crafts, fish education and harbour history; Public Television Service also reported in 2020 on how it organises local people and connects local stories and resources.\n\nUsing Zhengbin Fishing Port as its base, the studio keeps curating and acting locally; recent works include “999 Roses, the Boat of Love” (2023) and the Xingbinshan Biennale “Water Lives Here” (2025). Throughout, it places particular value on passing cultural memory between generations.","selfDesc":"In its own words (official site and the 104 listing): the studio is made up of young people with backgrounds in local culture, art and design; its creative action centres on the “experience economy, cultural-creative products and design services”, with “art co-creation” as the axis for local understanding, dialogue and creation. It specialises in place design, art-making, exhibition curation and spatial and visual design, translating local culture through design, art action and exhibitions so that more people value the land under their feet. Its guiding idea, “art co-creation (Creator In Residence, CIR)”, is a broad form of creator residency taking in artists, designers, architects, musicians and sociologists, combining local character and different media in cross-disciplinary work that crosses cultural boundaries to produce collective, interactive outcomes, and valuing the passing on of cultural memory between generations.","editNote":"","pedagogicalInsight":"This is a precedent at the level of a studio or organisation: its method is to bring creators from different fields into residence in a place (CIR), then use fieldwork, workshops and partnerships with shops and schools to make local residents and tradespeople part of the co-creation. A caution: the studio’s self-description carries the language of business and marketing, and independent reports say less about residents’ decision-making role in each project, so in citing it keep “the studio’s own account” and “independent reporting” apart.","why":"The studio’s existence, its location at Zhengbin Fishing Port and its nature (a local youth team doing art co-creation, place design and exhibitions) are corroborated across different years by several independent outlets (canopi, eyesonplace 2018, PTS 2020, Global Views 2025, The Newslens); canopi independently gives the 2017 founding year. Confirmed for inclusion by the platform’s maintainer. The studio’s account of its own ethos (CIR; the experience-economy / cultural-products / design-services framing) is self-described; the body text relies on independent reporting for facts. The SinoPac Foundation page could not be read this time."},
k76:{"name": "Art as Environment - A Cultural Action at Plum Tree Creek", "creator": "Wu Mali + Bamboo Curtain Studio", "place": "Around Zhuwei, Tamsui, New Taipei; the Plum Tree Creek watershed", "year": "2010-2012 (2013 grand prize, visual arts, 11th Taishin Arts Award)", "summary":"The Shumeikeng Creek environmental art action is a long-term project planned in 2010–2012 by Wu Mali and the Zhuwei Art Studio, funded by the National Culture and Arts Foundation’s visual-arts curatorial programme, and winner of the grand prize in visual arts at the 11th Taishin Arts Award in 2013. It proposes “linking fragmented land with water”, strung along the roughly ten-kilometre Shumeikeng Creek to connect seemingly unrelated places — woodland, pig farms, high-rises and an MRT station.\n\nIt is not traditional photography or painting but is composed of several cultural actions — the Shumeikeng Creek Breakfast Club, the Village Shapes mobile museum, community theatre, Local Green Life (“Dyeing with Plants”), “A River in Front of My School Gate” and Water Dance (Lü’s study records five sub-projects, Taishin’s source six; this platform uses six) — carried out with local school teachers and students, residents and government departments.\n\nWu argues that “art plays not the role of beautification but the medium that triggers, connects and thinks”, placing herself as a weaver of relations. The location is marked as the Zhuwei area of Tamsui, New Taipei, according to the studio’s base and the creek’s position.", "selfDesc": "Lu Pei-yi's study lists it under 'art as a method of social change', as a 2010 NCAF curatorial-project grant with five sub-projects (Breakfast Meeting, mobile museum, dyeing with plants, a creek in front of my school, community theatre), quoting Wu Mali that 'art is not a beautifier but a medium that triggers, connects and makes one think'. ArtEmperor (via ETtoday, 2013-05-23) notes the work by Wu Mali and Bamboo Curtain Studio won the grand prize in the visual arts category of the 11th Taishin Arts Award on 2013-05-11, proposing 'connecting fragmented land through water', a c.10-km creek linking hills, pig pens, high-rises and an MRT station, made of six cultural actions (Breakfast Meeting, Village Shape mobile museum, community theatre, local green living - dyeing with plants, A River in Front of My School, Water Dance), working with local schools, residents and government.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is using a stream as a “thread”: seemingly scattered activities such as the breakfast club, theatre, plant dyeing and school lessons are strung into a whole by “water” and “the river basin”, bringing in residents, students and public offices. For courses on environmental education and community building, it shows how to make an ecological issue into a long-term, multi-site, cross-generation action rather than a one-off exhibition.", "why": "Verified: Lu Pei-yi's study (academic) and the ArtEmperor report corroborate that it is Wu Mali and Bamboo Curtain Studio's long-term action, 'connecting fragmented land through water', made of several cultural actions, winning the grand prize in the visual arts category at the 11th Taishin Arts Award. Caveat: the sub-project count is given both ways (Lu five; ArtEmperor six); 'Zhuwei, New Taipei' is inferred from the studio and creek, not spelled out verbatim."},k77:{"name": "New Paradise of Plants (Sa'owac community)", "creator": "Hsu Su-chen, Lu Chien-ming", "place": "The Sa'owac community on the bank of the Dahan River (an urban Amis self-build community, around Daxi, Taoyuan)", "year": "2008-2010 (grand prize, visual arts, 8th Taishin Arts Award)", "summary":"“Plant-Object New Paradise” is a long-term project (2008–2010) by Hsu Shu-chen and Lu Chien-ming at the Sawazi tribe by the Dahan River (a self-built Amis community that moved to the city, around Daxi, Taoyuan), which won the grand prize in visual arts at the 8th Taishin Arts Award. They combine ecological art with a cultural movement.\n\nFirst they made botanical-specimen prints of the tribe’s farm plants; after the tribe was demolished they printed these images on T-shirts and marked members’ Amis names in romanisation, as a practice of “naming” and identity; then, through “Building a House: A Practice of the Social Contract”, they joined in self-built housing and even carried the display materials from their Kaohsiung Museum of Fine Arts exhibition back to the tribe as the foundation for building houses.\n\nThe project treats art as an alternative social movement, intervening directly in the tribe’s housing and survival; the two artists ask themselves “for whom does it create value? what are the effects inside the tribe (community) and outside in society?”. The jury called it “a model for Han Chinese participation in indigenous society”.", "selfDesc": "Lu Pei-yi's study lists Hsu Su-chen and Lu Chien-ming under 'art as a method of social change', with New Paradise of Plants on the Dahan River bank at Sa'owac, fusing ecological art and cultural activism - botanical-specimen prints of farm plants, printed on T-shirts after demolition to 'name' residents, 'House-building: A Practice of Social Contract' self-build housing, and shipping the Kaohsiung museum's exhibition materials back as house foundations - and quoting their question 'value to whom? what effects inside the community and outside in society?'. The Taishin Arts Award page (2010-05-13) records the work winning the grand prize in the visual arts category of the 8th Taishin Arts Award, the jury calling it a 'hut-form work' made with the Amis, exploring living space and ways of life, 'establishing a model of Han participation in Indigenous society', around 'the material world of the riverside Amis'.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is connecting art directly to “the survival of dwelling”: not stopping at speaking for the tribe but going from botanical specimens and naming all the way to self-built houses, turning exhibition materials into a house foundation. For courses on indigenous peoples, land justice and urban-edge communities, it shows how art can become an “alternative social movement”, and presses the question the two artists asked themselves: for whom does it actually create value?", "why": "Verified: Lu Pei-yi's study (academic) and the official Taishin Arts Award page corroborate that the work, by Hsu Su-chen and Lu Chien-ming with an Amis community, centres on housing/self-build and won the grand prize in the visual arts category at the 8th Taishin Arts Award. Caveat: Sa'owac, the Dahan River, the botanical prints and the shipped materials come from Lu; the county (Taoyuan) is inferred from Sa'owac's location, not spelled out in either source; the Taishin page misprints the artist's name in its title."},
k74:{"name": "TOA Lighting (Chou Yu-Cheng's exchange-platform works)", "creator": "Chou Yu-Cheng", "place": "Museum spaces including the Taipei Fine Arts Museum", "year": "2010", "summary":"Chou Yu-cheng made a series of projects built on “the artist as an intermediary of resource flows”, of which “East Asia Lighting” (2010) is the signature work: he asked lighting companies to sponsor lamps to light a museum space that was originally empty — so the lamps acted as advertising for the companies, and after the exhibition the work was taken into the collection, answering the museum’s needs.\n\nThe work both lays open “the mechanisms of art production” and shows cooperation and exchange between art and the economy. Following the same line he also made “Take from Society, Use for Society” (2010, printing prints with grant money, selling them and donating the proceeds back to a foundation) and “Work History — Lu Chieh-te” (2012, working with temporary worker Lu Chieh-te, who watched the Taipei Fine Arts Museum’s galleries as a security guard, with a book published).\n\nThe year differs: Lü Pei-yi’s study puts “East Asia Lighting” and “Rainbow Paint” in 2011, while the Taiwan contemporary art database and The News Lens review give 2010 for “East Asia Lighting”; this platform uses 2010. The issue is labelled “labour and human rights”, mainly matching the temporary-worker theme of “Work History — Lu Chieh-te”.", "selfDesc": "Lu Pei-yi's study lists Chou under 'art as an exchange platform', citing Toolkit (2010), TOA Lighting and Rainbow Paint (2011) with their 'feedback' mechanism of sponsor-donated lamps/paint turned into museum resources, and The History of Work - Lu Chieh-Te (2012), with the artist as a mediator of flowing resources. A solo-show review carried by The News Lens (by Rahma Khazam, trans. Wu Chia-ying, c.2016) notes TOA Lighting (2010) using sponsor-provided fixtures to light an empty museum space, entering the collection after the show, 'on one hand showing the mechanism of art production, on the other the fruitful collaboration between art and the economy'; The History of Work (2012) with the day-labourer Lu Chieh-Te guarding the show at TFAM.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is making “how resources flow” itself the work: the artist does not avoid mechanisms such as grants, sponsorship and collections but lays them open and lets resources flow and return within them. For courses on art, money, institutions and labour, it shows an “intermediary” position — not criticising the system from outside but entering it, operating it and then exposing it.", "why": "Verified: Lu Pei-yi's study (academic) and the solo-show review on The News Lens corroborate TOA Lighting's sponsor-lamps-light-empty-museum-then-collection 'feedback/exchange' mechanism and the day-labourer collaboration in The History of Work. Caveat: the year is given two ways (Lu 2011; the review and the Taiwan Contemporary Art Archive 2010, the platform using 2010); Toolkit's details come mainly from Lu."},k75:{"name": "Five Hundred Lemon Trees", "creator": "Huang Po-chih", "place": "Abandoned farmland replanted with lemons (Lu: three plots in Beipu, Hsinchu; Huang's own talk: the family lemon field near Guanyin)", "year": "from 2013 (trees planted by 2015, Taipei Arts Award 2015; TFAM solo show 2016)", "summary":"“Five Hundred Lemon Trees” (called “Five Hundred Lemon Trees” with a different measure word in Lü Pei-yi’s study) is a long-term project by Huang Po-chih begun in 2013. He treated the museum exhibition as a mechanism, pre-selling “wine labels” to the public to raise funds, using the money to re-prepare abandoned farmland and plant lemon trees; years later the lemons would be harvested and made into lemon wine, returned to those who had bought labels.\n\nThrough a bottle of wine not yet made, the project lays out the relations of agriculture, land, economy and production and consumption; Huang’s mother had been a garment-factory worker and his family has a farming background, so the project also ties into his family’s life history.\n\nThe lemon trees were all planted by 2015, the project won the Taipei Arts Award, and in 2016 the solo show “Five Hundred Lemon Trees: Organic Archive” was held at the Taipei Fine Arts Museum. The location is given two ways: Lü’s study says three plots of abandoned farmland in Beipu, Hsinchu, while Huang’s conversation describes the family lemon field near Guanyin.", "selfDesc": "Lu Pei-yi's study gives Five Hundred Lemon Trees (2013) using the museum exhibition as a mechanism, pre-selling wine labels, the money as seed funding to replant lemon trees on three plots of abandoned farmland in Beipu, Hsinchu, made into lemon wine two years later for the label buyers, examining agriculture, economy, livelihood consumption and production; it also mentions Production Line - Made in China & Made in Taiwan (2014) linking Shenzhen and Taipei through his mother's garment-worker life. A No Man's Land talk between Huang Po-chih and Huang Chien-yu (carried by The News Lens) notes the five hundred trees were by then all planted, labels sold to crowdfund, the ground floor of the family home converted into a small lemon-wine workshop, the project winning the 2015 Taipei Arts Award and a 2016 TFAM solo show Five Hundred Lemon Trees: Organic Archive, with the lemon field at the family home 'near Guanyin'.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is using “a thing not yet finished” (wine not yet made) to open up a production chain: from fundraising, land preparation and planting to winemaking and returning the wine, participants connect themselves to a piece of land and a stretch of time by buying. For courses on agriculture, food, land and economy, it shows how to turn the abstract “producer–consumer relation” into a concrete project that takes years to harvest.", "why": "Verified: Lu Pei-yi's study (academic) and the Huang Po-chih talk on No Man's Land (via The News Lens) corroborate Five Hundred Lemon Trees (from 2013), pre-selling wine labels to crowdfund, planting five hundred lemon trees on abandoned farmland, and brewing lemon wine for the buyers years later, with the talk adding the 2015 Taipei Arts Award and the 2016 TFAM solo show. Caveat: the planting site differs by source (Lu 'three plots in Beipu, Hsinchu'; the talk 'the family field near Guanyin'), both given; the title's 'trees' character differs."},
k72:{"name": "The Treasure Hill Tea + Photo Project", "creator": "Wei-Li Yeh (with Yu-Hsin Wu and others)", "place": "Treasure Hill (Gongguan settlement) artist village, Taipei", "year": "from 2004 (residency c.2004-2006; project continued to 2008)", "summary":"The Treasure Hill Tea + Photo Project (THTP) is a long-term project by Yeh Wei-li, who moved into Taipei’s Treasure Hill settlement from 2004 (residency about 2004–2006, with the project continuing to 2008). Asking “what can an artist do in a community?”, he opened a space for tea and photography in the settlement, took portraits of residents, tidied the garden and worked with neighbours.\n\nIn contrast with active community intervention, he took a passive stance of “waiting for the visitor” — letting reality and relationships come to him, and growing work from them.\n\nThe project ran in several phases and was gathered in the final “Oversight” phase, shown at Centre A in Vancouver in 2008 with a book published. It has community interaction but remains mainly an artist-led individual project.", "selfDesc": "Lu Pei-yi's study lists it under 'art intervening in reality', with Yeh moving into Treasure Hill in 2004, asking 'what can an artist do in a community', running a tea-and-photo space, taking portraits, tending a garden and working with neighbours in a 'waiting' posture ('reality finds you'), the final 'Oversight' phase shown in 2008 at Centre A, Vancouver. The Asia Art Archive records The Treasure Hill Tea + Photo Project / Phase Five / Oversight (2008), with Yeh's photographs and letters and Yu-Hsin Wu's video, an essay by Amy Cheng, 144 pages, in Traditional Chinese and English.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is “passive entry”: rather than parachuting into a community with a fixed plan, first settle in, open a space for tea and photographs, let relationships happen and then grow work. For courses on community residency and place writing, it shows slowing down and building trust through everyday contact; it can also be contrasted with actively interventionist projects to discuss the pros and cons of the two stances.", "why": "Verified: Lu Pei-yi's study (academic) and the Asia Art Archive record corroborate that THTP is Yeh's project at Treasure Hill, with photography and Yu-Hsin Wu's video and an essay by Amy Cheng. Caveat: the exact residency span (2004-2006) and the tea-photo-house, portrait and 'waiting' details come from Lu; AAA is a 2008 'Phase Five' publication showing the project ran in phases to 2008, so the year is given as 'from 2004'."},k73:{"name": "Marshal Tie Jia - Turtle Island", "creator": "Hsu Chia-wei", "place": "A small island off Matsu (around Beigan); the deity Marshal Tie Jia came from Wu-Yi Mountain in China", "year": "2012", "summary":"“Marshal Tie Jia – Turtle Island” is a 2012 video installation by Hsu Chia-wei. It centres on a small island off Matsu and its guardian deity “Marshal Tie Jia”, a frog god: the god originally had a temple at Wuyi Mountain in China, which was destroyed in the Cultural Revolution, and the god travelled to Matsu.\n\nHsu used green-screen compositing to rebuild an imagined original temple on the island, then slowly pulled the camera back to reveal the green screen, placing myth, history and memories of cross-strait migration in one frame.\n\nThe filming was done through a continuing process of asking the god’s permission and negotiating. “Turtle Island” appears in the title, while Art Basel records only “a small island off Matsu” without naming Beigan; it is the artist’s individual work, on local history and belief.", "selfDesc": "Lu Pei-yi's study lists Marshal Tie Jia under 'art intervening in reality', built on the site's own history, telling local memory through the image, the filming done amid consulting and negotiating with the deity - a passive intervention ('reality finds you'). The Art Basel catalogue records Marshal Tie Jia - Turtle Island (2012), set on a small island off Matsu, under the protection of the local god 'Marshal Tie Jia' (a frog deity) whose temple on Wu-Yi Mountain in China was destroyed in the Cultural Revolution before migrating to Matsu, a video installation that rebuilds a fictional original temple on the island with green-screen compositing.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is making “local gods and history” the protagonist of the narrative rather than a backdrop: Hsu lets the filming itself be a process of negotiating with the god, so the work’s mode of production echoes local belief. For courses on local memory, folk belief and cross-strait migration, it shows how a concrete object / god can draw out a whole ignored history.", "why": "Verified: Lu Pei-yi's study (academic) and the Art Basel catalogue corroborate Marshal Tie Jia - Turtle Island (2012), the small island off Matsu, the frog deity whose Wu-Yi Mountain temple was destroyed in the Cultural Revolution before migrating to Matsu, and the green-screen fictional-temple video installation. Caveat: 'Beigan' is from Lu's context (Art Basel says only 'a small island off Matsu'); the consult-the-deity filming process is from Lu."},
k69:{"name": "Factory", "creator": "Chen Chieh-jen", "place": "Taoyuan - the Lien Fu Garment Factory (filming site); shown in museums", "year": "2003", "summary":"“Factory” is a 2003 video work by Chen Chieh-jen (about 30 min 50 sec, super 16 mm transferred to DVD, silent). He invited women workers who had worked more than twenty years at the Lien Fu garment factory in Taoyuan, and lost their jobs when management closed the factory in bad faith and refused to pay pensions and severance, to return to the factory, abandoned for about seven years, and “work”; in the film the women play themselves.\n\nThe film cuts in old black-and-white documentaries, outlining the decline of Taiwan’s export-processing industry as production moved out, to countries with cheaper labour after the factory closed.\n\nChen sees the filming as “creating another double” for the women and “writing people’s memory” for them, letting a struggle that seemed over continue. It is the artist’s individual work; the women returning to the site to play themselves is a collusion with the artist, not community co-creation.", "selfDesc": "Lu Pei-yi's study lists Factory as a case of 'art revealing reality'; Chen's own statement (IT PARK) and iniva (London) name the site as the Lien Fu Garment Factory, where the women worked over twenty years before an unscrupulous closure that denied them pensions and severance, the plant left derelict about seven years before filming (c.1996); Public Delivery notes the film is 30'50\", super-16mm transferred to DVD, silent, with the women re-enacting on site, the factory having reopened in a country with cheaper labour.", "pedagogicalInsight":"The most borrowable methods are “letting the people concerned play themselves” and “returning to the site”: Chen does not speak for workers but lets the women return to the abandoned factory and re-enact, becoming the film’s doubles. For courses on labour and local industrial history, it shows how to turn abstract “industrial relocation” into concrete bodies and scenes, and warns against the crude pose of “the artist who cares about the underclass”.", "why": "Verified: Lu Pei-yi's study (academic) and two third-party art institutions (Public Delivery, iniva) corroborate Factory (2003), the Lien Fu closed-factory women re-enacting on site, and the offshoring context. Caveat: none names the factory's county directly; Taoyuan is inferred from the Lien Fu plant being the 1996 Taoyuan Lien Fu closure case; IT PARK carries Chen's own statement (first-party) and is not counted alone as independent."},k70:{"name": "Mirage: Disused Public Property in Taiwan", "creator": "Yao Jui-chung + Lost Society Document (LSD)", "place": "A nationwide sampling survey of disused public facilities ('mosquito halls'); the team is Taipei-based, with books and shows", "year": "from 2010 (vol.1 2010; series ongoing)", "summary":"“Mirage: A Sampling Survey of Idle Public Facilities in Taiwan” is a nationwide sampling survey of idle public facilities (“mosquito halls”) carried out since 2010 by the Lost Society Documents (LSD), a group of artist Yao Jui-chung and his students; the first volume was published in 2010 and by 2018 it was in its ninth year.\n\nStudents returned to their home towns to survey and photograph with an artist’s eye; from 2010 to 2014 they surveyed over four hundred idle public facilities and published four volumes; the new book “Mirage VI” records 100 idle or under-used cases (about a third being “mosquito halls”). The outcome is archive-style black-and-white photo books of several hundred pages.\n\nThe project exposed public waste that surrounds daily life yet is ignored, drew attention from media and senior officials, and formed a civil watchdog force; Yao stepped back to be organiser / teacher and paid for it all himself to keep freedom of speech and independence of action.", "selfDesc": "Lu Pei-yi's study gives 2010-2014, over four hundred disused facilities surveyed, four volumes published, the artist stepping back as organiser or teacher, self-funded throughout. CNA (via Storm Media, 2018-05-17) notes Yao teaches at NTNU and TNUA, leads students as 'Lost Society Document', vol.1 of Mirage published in 2010, by 2018 in its 9th year, the new Mirage VI recording 100 idle or under-used cases (about a third being 'mosquito halls'), and recalls premier Wu Den-yih's 2010 pledge to revitalise idle spaces within a year, with many still unimproved (e.g. the Hengchun visitor centre in Pingtung).", "editNote": "", "pedagogicalInsight":"The most borrowable thing is treating “fieldwork survey + archiving” as civic action: students return home to record idle facilities, which is both image training and oversight of public policy. It shows an artist stepping back to be an organiser and giving the stage to participants; it is a good method prototype for courses on local surveying and civic issues.", "why": "Verified: Lu Pei-yi's study (academic) and the CNA report (via Storm Media) corroborate that Mirage is Yao leading 'Lost Society Document' students in surveying Taiwan's disused public facilities, vol.1 2010, a multi-volume series that drew government attention. Caveat: the counts differ (Lu's 'over four hundred' is cumulative; CNA's '100' is one volume), different volumes/measures, presented side by side; the title wording differs slightly."},k71:{"name": "The Ruin Image Crystal Project", "creator": "Kao Jun-honn", "place": "Sites across Taiwan abandoned through economic liberalisation / privatisation (Lu cites the Shulin Taiwan Bus depot)", "year": "from 2012", "summary":"“The Ruin Image Crystal Project” (called the “Ruin Crystal Project” in Lü Pei-yi’s study) is a series of ruins projects by Kao Jun-honn begun in 2012. He enters spaces in Taiwan abandoned because of economic liberalisation and privatisation, makes charcoal wall drawings on site, then presents the change of eras through drama, photography and other forms, letting people see traces forgotten by their time.\n\nAmong them, “The Thomson Project” redraws, on the walls of the Shulin Taiwan Motor Transport bus depot left derelict by privatisation, the images of the Laonong river valley taken in 1871 by British photographer John Thomson; the location later also became an important scene in Tsai Ming-liang’s film “Stray Dogs”.\n\n“Reception Room” (2014) is recorded as a kind of sequel to this project, set in the abandoned Xindian prison, a disused mine in Sanxia and elsewhere. It has many ruins and no single location; it is the artist’s individual work, included for its theme of ruins and privatisation.", "selfDesc": "Lu Pei-yi's study lists The Ruins Crystal Project (2012) under 'art revealing reality', with Kao sketching on site in ruins and presenting era-change through theatre and photography; 'The Thomson Project' redraws Thomson's 1871 Laonong-valley image in charcoal at the Shulin Taiwan Bus depot, the scene becoming a location in Tsai Ming-liang's Stray Dogs. The Taiwan International Video Art Exhibition (twvideoart.org) Kao page notes Detention Center (2014) as 'a kind of sequel to The Ruin Image Crystal Project', set in an abandoned Xindian prison, Sanxia mines and so on.", "editNote": "", "pedagogicalInsight":"The most borrowable thing is treating “ruins” as a site for reading political and economic history: not using ruins as a backdrop but entering, staying and drawing historical images on the walls so the space itself becomes teaching material. For courses on local history, urban change and industry / privatisation, it shows the approach of “the body entering the site and rewriting memory through drawing and images”.", "why": "Pending: Lu Pei-yi's study details the 2012 Ruins Crystal Project, the Shulin Taiwan Bus 'Thomson Project' and the Stray Dogs location, all as one detailed source. The Taiwan International Video Art Exhibition page independently confirms The Ruin Image Crystal Project exists (Detention Center 2014 is its sequel) but does not corroborate the 2012 year or the Shulin/Thomson specifics, so it stays pending until a second source directly corroborates the project's year and content."},
k66:{"name": "Stroll, a Place with Light (Dalongtian Living Aesthetics 2025)", "creator": "National Tainan University of the Arts; co-host Tainan Municipal Guantian Junior High School (a Ministry of Education 2025/114 USR project)", "place": "Guantian District, Tainan; shown at Guantian Junior High, drawing on the Longtian night market and its night-time streets", "year": "2025 (opens 11/8–12/30, 17:00–21:30 daily)", "summary":"“Wandering Where the Light Is” is a Ministry of Education 2025 (ROC year 114) USR art exhibition by the Tainan National University of the Arts and Tainan Municipal Guantian Junior High School, opening on 8 November 2025 and running to 30 December, free every day 17:00–21:30, with the venue at Guantian Junior High.\n\nThe exhibition takes inspiration from Guantian’s “night-market wandering” culture, holding that the stall lights of Longtian’s night streets not only gather crowds but also carry residents’ living memories; exhibits include multimedia works such as the “Glowing Water Chestnut” by the university’s students.\n\nThe lighting at the opening was led jointly by the two schools’ principals, with a legislator and the head of the Longtian Night Market management committee attending. Residents were not co-creators but audience / participants; placing this case under “Greater Longtian Life Aesthetics to the Countryside” is inferred from the continuing 2026 show.", "selfDesc": "Economic Daily News (2025-11-08) reports: the show was co-hosted by TNNUA and Guantian Junior High under a Ministry of Education 2025 (114) USR project, opening 11/8 and running to 12/30, 17:00–21:30 daily; the opening lighting was led by principal Chiu Shang-chia and Guantian Junior High principal Ching Shih-lung, with legislator Kuo Kuo-wen speaking and the Longtian night-market committee chair attending; a glowing water-caltrop was a TNNUA student work, and the show took Guantian’s night-market ‘stroll’ culture as its inspiration.", "pedagogicalInsight":"The most borrowable thing is taking “the lights of night-market stalls” as the way in: everyday things residents see daily and take for granted are looked at anew as material carrying living memory. For teachers of local aesthetics or living memory, it shows how to grow a theme from students’ own life scenes rather than giving an outside topic. Note residents were not co-creators but audience / participants.", "why": "Unverified: so far a single source, Economic Daily News (2025-11-08), corroborating the TNNUA × Guantian Junior High Ministry of Education 2025 (114) USR show ‘Stroll, a Place with Light’, its run and the glowing water-caltrops. The project name ‘Dalongtian Living Aesthetics’ and the departments and curators do not appear in this piece (they appear in the 2026 edition’s China Daily News report); grouping this edition under Dalongtian is the platform’s inference from the same school and theme, pending a second source that directly reports this 2025 edition."},
k68:{"name": "Light Light Light Longlai (Dalongtian Living Aesthetics 2026)", "creator": "National Tainan University of the Arts (a cross-department collaboration of the Dept. of Materials Art & Design and the Dept. of Art History & Cultural Heritage); curating teachers Cheng Cheng-hsiung, Hsu Yuan-ta and Chen Ming-hung; co-host Tainan Municipal Guantian Junior High School", "place": "Guantian District, Tainan; shown at Guantian Junior High, drawing on the Longtian night market and its night-time streets", "year": "2026 (mid-Nov to 12/20)", "summary":"“Light Light Light Lónglái” is the 2026 annual cross-department art exhibition of the Tainan National University of the Arts’ “Greater Longtian Life Aesthetics to the Countryside” USR project, held at Guantian Junior High by the Department of Materials Creation and Design and the Department of Art History and Cultural Heritage, with the school as co-organiser; teachers Cheng Cheng-hsiung, Hsu Yuan-ta and Chen Ming-hung co-curated it, and it runs to 20 December.\n\nThe title plays on “Light” and the Taiwanese word for “come” to invite people into Longtian, continuing the theme of the lights of Longtian night market and night streets, with works that let viewers feel they are walking into a tunnel of light and shadow.\n\nThe project team also ran two paper-folding lantern-painting workshops at Guantian Junior High, with students’ works shown at the same time. For this 2026 show alone there is so far only one article (China Daily News / Yahoo) and no second independent source.", "selfDesc": "China Daily News (2026-11-17) reports: the show is TNNUA’s annual art show run under USR with Guantian Junior High, a cross-department collaboration of the Materials Art & Design and Art History & Cultural Heritage departments, co-hosted by Guantian Junior High, curated by Cheng Cheng-hsiung, Hsu Yuan-ta and Chen Ming-hung; it is a key outcome of the ‘Dalongtian Living Aesthetics into the Countryside’ USR project, with a light-tunnel effect, two paper-lantern workshops and students’ works on show, running to 12/20.", "pedagogicalInsight":"It continues the entry point of “night-market lights = living memory” and makes the venue an experience through a “tunnel of light and shadow”. The lantern workshops are a low-barrier participation form that can be borrowed directly, letting local students make things by hand. Note it leans toward “students make, residents view”; residents are not co-creators.", "why": "Unverified: so far a single independent source, China Daily News (2026-11-17, with Yahoo a reprint of the same piece), corroborating the 2026 ‘Light Light Light Longlai’ of TNNUA’s ‘Dalongtian Living Aesthetics’ USR project at Guantian Junior High, the cross-department collaboration, curators and lantern workshops. It belongs to the same project as the 2025 ‘Stroll, a Place with Light’ (K66, Economic Daily News) but is a different year and exhibition; this edition alone still rests on one source, pending a second."},
k67:{"name": "Return and Take Root — Nanying Regional Image Action Project", "creator": "College of Sound and Image Arts, National Tainan University of the Arts; project leader Tseng Chi-hsien (director of the Graduate Institute of Documentary and Film Archiving), co-led by Tsai Ching-tung, Hsieh Yu-en and Lin Chiao-fang; partners Beimen Community University and the Senao Technology Foundation", "place": "Tainan; results show at TNNUA’s College of Sound and Image Arts (Guantian); fieldwork across Dongshan, Yujing, Qigu, Beimen and Guantian, extending to Jiangjun and Jiali", "year": "2025 (results show 12/5–12/6)", "summary":"The Tainan National University of the Arts’ College of Audio-Visual Arts ran the “Return and Root: Nan-ying Region Image Action Project” under the Ministry of Education USR programme, with a results exhibition on 5–6 December 2025 at the college in Guantian. The project lead is Tseng Chi-hsien, director of the Graduate Institute of Documentary and Film Archiving; partners include the Beimen Community University and the Shennao Technology Cultural and Educational Foundation.\n\nThe project spans five Tainan districts — Dongshan, Yujing, Qigu, Beimen and Guantian — with five sub-projects (“Guantian Chronicles, Yujing Image Records, Beimen Salt Study, Nan-ying Time, Dujia Film Camp”), using film reading groups, a summer film camp, a mobile photo studio, rescue of family videotapes and outdoor film-reel screenings, involving primary and junior high teachers and students, graduate students and local elders.\n\nThey record temples, the salt-belt area, mango and vanilla industries and ordinary people’s memories, building a cross-generation path of image action. The sources do not give participant numbers or the number of works for each sub-project.", "selfDesc": "Economic Daily News (Huang Chi-ming, 2025-12-05) and Liberty Times (Yang Chin-cheng, 2025-12-05) report: TNNUA’s College of Sound and Image Arts, under a Ministry of Education USR grant, held a results show on 12/5–6 at the college, with five sub-projects ‘Guantian Chronicle, Yujing Image, Beimen Salt Study, Nanying Time, Duka Image Camp’, covering the five districts. Economic Daily names the project leader as Tseng Chi-hsien, director of the Graduate Institute of Documentary and Film Archiving; Liberty Times says it was led by provost Tsai Ching-tung with teachers Hsieh Yu-en and Lin Chiao-fang guiding graduate students. Partners include Beimen Community University and the Senao Technology Foundation.", "pedagogicalInsight":"The most borrowable thing is treating “images” as a cross-generation tool of action, not only a form of output: rescuing family videotapes, a mobile photo studio and outdoor film-reel screenings are concrete ways to bring elders and local memory in. For teachers of media literacy or local memory, the five sub-projects show how to design different image tasks for different communities (the salt belt, mango-growing areas). Note sub-projects are led by graduate students and teachers, while elders and residents are mostly interviewees and those recorded, so depth of participation varies by case.", "why": "Verified: Economic Daily News (Huang Chi-ming) and Liberty Times (Yang Chin-cheng) are two media and two reporters, corroborating TNNUA’s College of Sound and Image Arts Ministry of Education USR ‘Return and Take Root’ results show (12/5–6), the five sub-projects and the five districts. Caveats: the two pieces ran the same day with partly overlapping content, possibly partly from a TNNUA press release; principal Chiu Shang-chia spoke as the school, not as project leader; the sugar-railway line name differs between the two pieces; TNNUA’s own site and USR Hub are same-source and not counted as independent corroboration."},
k52:{"why":"Unverified: so far a single source, 1111 News (from the university). The material, size, participating units and supporting bodies are as the release states, which explicitly says students and community volunteers made it together; the number of volunteers, how many workshops and the completion date remain to be filled in.","name": "Co-created Vine Ox 'Light and Shadow' Project (vine-ox installation, Gongqi community, Dacun)", "creator": "Lai Jian-yuan of Da-Yeh University's Dept. of Design (USR Hub 'New Life for Tradition') and Yoshida Atsushi of its Dept. of Plastic Arts; Gewei International Co.; Gongqi Community Development Association (executive secretary Lai Guo-huai)", "place": "Children's park at the Gongqi community center, Dacun Township, Changhua County", "year": "2024 (reported 2024/11/28)", "summary":"Teachers and students of Da-Yeh University’s departments of Design and Plastic Arts worked with volunteers of the Gongqi community in Dacun, Changhua, using discarded grapevines to build a rattan ox about three metres tall in the community centre’s children’s park, symbolising the resilience and innovation of farming villages.\n\nIt is part of Da-Yeh University’s USR programme (Lai Jian-yuan of Design, “Tradition Reborn”, and Yoshida Atsushi of Plastic Arts); the report is dated 28 November 2024.\n\nThe community’s general secretary described the process as facing several challenges of time and space; the project was supported by the Ministry of Culture, the Changhua Life Aesthetics Museum and the Dacun Township Office. The sources do not give the number of volunteers, workshop sessions or the completion date.", "selfDesc": "1111 News (from the university) reports that the roughly three-metre work was made from discarded grapevines by teachers and students of Da-Yeh University's design and plastic-arts departments together with Gongqi community volunteers, with support from the Ministry of Culture, the Changhua Living Art Center and the Dacun Township Office.", "pedagogicalInsight":"Turning discarded grapevines into a three-metre rattan ox, made by university staff and students together with community volunteers, models building community with “local waste material + making together” for teachers working with USR or communities. Note that the issue leans toward local cohesion with little social edge, so it suits an example of “material transformation and community collaboration” rather than issue depth."},
