platform originally could not read), two separately bylined reports from different outlets — Storm Media (Wang Hsiu-ho, 2026-05-01) and Yam News / GuanMedia Changhua (Chen Ya-fang, 2026-05-01) — now corroborate the host (Changhua Cultural Affairs Bureau), the artists (Wu Hsiu-ming's sound workshop, Hsu Chia-chen's card-game workshop, the Muzhiyan timber build) and the dates. But both quote the Bureau heavily and use county/Bureau-supplied images, sharing the same source as the original advertorial, so they are not independent corroboration and it stays to-be-verified. Attendance, whether former village residents co-created, and whether outcomes survive are still unsourced. (Daily source expansion, 2026-11-17)"},
k45:{"name": "2026 Second Village Opens: Art, Dance, Memory — Echoes of the Unreturned", "creator": "Yunlin County Government (host); TAMtamARTTAIWAN (planning); BIAU Dance Theatre (Barefoot Learning series); Huwei Jianguo Village Regeneration Association (operation)", "place": "Jianguo military-dependents’ village, Huwei, Yunlin (Villages 1 and 2; bomb shelters, sentry posts, water towers and other military remains)", "year": "2026 (opens Oct 31, runs to Nov 1; originally Oct 24, postponed by a typhoon)", "summary":"“2026 Opening the Doors of Village Two | Art · Dance · Memory: Echoes Unreturned” is an arts event at the Jianguo military dependents’ village (Villages One and Two) in Huwei Township, Yunlin County, opening on 31 October 2026 and running to 1 November; it was originally set for 24 October but postponed by a typhoon.\n\nAn arts team and an international curator placed works in the village’s military remains — air-raid shelters, sentry posts and a water tower — combined with dance workshops, talks and village tours.\n\nIt lets the village’s memory be seen through contemporary art; the event also promotes the food-and-agriculture and environmental education direction of Jianguo Village Two. The report mentions “local participation” but does not say how residents took part in curating or creating.", "selfDesc": "The Epoch Times report gives the curatorial team, sites, content and dates, and mentions ‘local participation’ but does not say how residents took part in curating or creating.", "pedagogicalInsight":"Placing contemporary artworks directly in military remains such as air-raid shelters, sentry posts and a water tower is a heritage-regeneration method of “using the site itself as the gallery”, letting village memory be experienced through space rather than wall labels. For teachers of local history it models “letting the historical site speak”. Note: the source mentions “local participation” but not how residents took part, so the degree of co-creation is unclear and it leans toward curation.", "why": "Verified: beyond the user-supplied Epoch Times report (which the platform could not read directly), two independent bylined reports now corroborate the core facts — China Daily News (reporter Chen Cheng-fen, Yunlin, with her own on-site photos, 2026-10-31) and Taiwan News Net via Mediashi (reporter Li Wan-yu, 2026-10-31) — confirming the Yunlin County Government as host, the Jianguo Village Regeneration Association as operator, TAMtamARTTAIWAN as planner, BIAU Dance Theatre's 'Barefoot Learning', works set into the Villages 1-2 bomb shelters, sentry posts and water towers, and the Oct 31 and Nov 1 run; Taiwan News Net also confirms the original Oct 24 date was postponed by a typhoon. China Daily News is first-hand on-site reporting, so this is upgraded to verified. Whether residents co-created and the scale of participation are unstated in all three sources. (Daily source expansion, 2026-11-17)"},
k40:{"name": "Prototype Paradise", "creator": "Prototype Paradise; lead artist Yoyo Kung; long-term collaborator Hsiao Yu-chin (per the Taitung County Government event page)", "place": "Huannan Market, Taipei (2023) and the grounds of Taitung Art Museum (2023); the group's base is not stated in the reports", "year": "From 2012 (began operating in 2012; the projects this platform could read date from 2015, 2023 and 2026)", "summary":"Prototype Paradise is a contemporary performance group that began formally operating in 2012, with “interacting with reality” at its core, placing performance into real spaces; its works are often based on interviews. The projects this platform can read date from 2015, 2023 and 2026, and the 2023 locations include Taipei’s Huannan Market and the Taitung Art Museum grounds.\n\nThe group invites people who do not work in the arts to be “everyday-life experts”; rather than “drawing material”, the team describes what it does as more like “disturbing”. Its protagonists have included stall holders, sanitation workers, front-line museum staff and migrant workers (see the sub-projects below on the case page).\n\nA C-LAB interview (by Hou Po-yen, 2022-11-10) notes that “everyday-life expert” is a term coined by Rimini Protokoll for amateurs who are neither professional artists nor real performers; as the creators, the team must take particular care not to disrupt sanitation workers’ work and bear the communication costs and support measures needed to ensure everything proceeds with informed consent.", "selfDesc": "A C-LAB interview (written by Hou Po-yen, 2022-11-10) says \"experts of everyday life\" is a term coined by Rimini Protokoll for laypeople who are neither professional artists nor real performers; as the creative party the group must take care not to disturb sanitation workers' work and invest in communication and safeguards so that everything happens with informed consent.", "subs": [{"n": "Revisit Taitung Art Museum with Your Ears", "y": "2023", "t": "Two sessions on October 22, 2023 (10:30–11:30, 13:30–14:30) in the grounds of Taitung Art Museum, organised by Taitung County Government; instructors Yoyo Kung and Hsiao Yu-chin, co-creating teachers Yang Hui-ju and Chang Ling-yu, and 21 students. Graduates or students of Taitung Baosang Junior High served as \"voice collectors\", leading audiences around the grounds to hear their interviews with the museum's front-line staff; free, capped at 20 sign-ups. (From the Taitung County Government event page; the gap between 21 students and the cap of 20 is not explained.)"}, {"n": "Hundred Trades Scroll: Nightingales of Huannan", "y": "2023", "t": "One of four invited teams in \"Huannan Table: 365 Days of Market Seasons\" (May 20–Aug 6, 2023, Huannan Market; commissioned by Taipei's Market Administration Office and Department of Cultural Affairs, planned and run by the Chung Tai Foundation). After months of fieldwork and close interviews, the group explored vendors' subconscious images in fragmented sleep and turned their confessions into close-whisper sound theatre. (From Artemperor and CTWANT, which read alike and quote no vendors; the \"18 months on site\" refers to all four teams, while for Prototype Paradise only \"months\" is stated.)"}, {"n": "Following the Garbage Truck Around Taipei", "y": "2015", "t": "The group went out with sanitation workers along their routes, staging street performances and interactions, with a \"story minibus\" segment where veteran workers shared their experience. (From the C-LAB interview; routes, dates and partners could not be confirmed.)"}, {"n": "Walking Through Her Everyday Life: A Migrant Worker Dog-walking Sound Story", "y": "2026", "t": "Listed in the performance programme of the 2026 Taoyuan Iron Rose Art Festival, March 11–16, 2026, 19:00–21:00. (The festival page gives no venue, price, creative team, funders or description; the group's own site could not be read, so interview numbers, method and any later shows are not included.)"}], pedagogicalInsight:"The group spans the whole spectrum: in Taitung, teenagers act as “collectors of voices” and interview people themselves (facilitator-led), while in Huannan Night Birds the artist edits stall holders’ confessions into sound theatre (artist-led). For educators, the most useful idea is the “everyday-life expert” stance: invite non-artists as experts in some field rather than as amateurs. Informed consent and not disrupting people’s work are also essential ethics for participatory projects.", "why": "Verified: beyond the C-LAB interview, the international Institute for Public Art's case study independently documents Prototype Paradise's 'Travelling Around Taipei with Garbage Trucks' (2015), corroborating a curatorial team whose method combines performance, theatre, installation and public participation; PAR performing-arts magazine also carries Gong You-ying's writing on amateur participation. The group's existence and participatory method thus have two or more independent sources. Individual sub-projects vary in sourcing (the Taitung case is an organiser activity page, the Huannan case's two reports look like the same release, and the 2026 Taoyuan item gives only show times), as noted."},
k38:{"name": "Headwind Project (Chengcheng Junior High School)", "creator": "Promoted by the Taiwan Good Foundation; supported by the Ministry of Education and Ministry of Justice; partners: Party Theatre troupe (drama) and Cloud Gate Dance School (martial arts and everyday movement); photo exhibition curator and photographer Lu Te-chen", "place": "Chengcheng Junior High School, Hsinchu (a juvenile correctional school); the 2018 photo exhibition was at Zhongshan Underground Bookstreet, Taipei (Eslite R79)", "year": "From 2017 (photo exhibition in Taipei from July 12, 2018; the Taiwan Good Foundation page gives Jul 12–30 without a year)", "summary":"The Against the Wind Project has been promoted by the Taiwan Good Foundation since 2017 at Cheng Cheng Junior High School in Hsinchu, a juvenile correctional school, bringing art into the school.\n\nSome Act Theatre led interactive drama games, collecting stories from the youths’ own life experience and writing plays together; the Cloud Gate dance classroom led martial arts and everyday movement to practise focus, endurance and bodily expression; and a class of youths, led by curator Lu De-zhen, spent about ten months recording themselves and each other on camera. There were 15 students each in the drama and martial-arts groups, and 30 youths in the photography class.\n\nThe results were presented in a photo exhibition from 12 July 2018 (to 30 July) at the Zhongshan Underground Book Street (Eslite R79) in Taipei, with three themes: “Body Portraits”, “Film Diaries” shot by the youths themselves, and “Dance Theatre” documenting the drama and dance workshops.", "selfDesc": "CNA (2018-07-12) reports 15 students each in the drama and martial arts groups and a 30-boy class for the photo exhibition, co-organised by the Taiwan Good Foundation and Eslite. The foundation's page lists three exhibition themes: \"Body Portraits\", \"Film Diaries\" shot by the boys themselves, and \"Dance Theatre\" documenting the drama and dance workshops. The Initium (2018-11-03) calls Chengcheng the first juvenile correctional school in Taiwan to practise rehabilitative education and describes dance, drama and photography with dance showings and drama rehearsals.", pedagogicalInsight:"In a correctional school, drama, martial arts and photography run in parallel: the drama is written from the youths’ own life stories and the photography is shot by the youths themselves, giving “atypical” students the lead in making — the most valuable lesson from this case. Note: the youths are minors in custody, so presentation of results needs special protection of personal data.", "why": "Confirmed as verified at your request (November 2026). CNA and The Initium are independent news reports that agree on the Taiwan Good Foundation, the drama troupe, Cloud Gate's school and Chengcheng; the foundation's own page adds exhibition detail. The 2017 start rests on CNA alone for now."},
k39:{"name": "\"Hearing the Voices of Along the River\" Atypical Education Exhibition, National Palace Museum at Chengcheng Junior High School", "creator": "National Palace Museum and the Agency of Corrections, Ministry of Justice (co-organisers); Chengcheng Junior High School (host/implementer); supporting: Heart Breakthrough Career Exploration Association and 104 Hope Foundation (per Commercial Times; the Epoch Times mentions only the former); art teachers not named", "place": "Auditorium, 3rd floor of the administration building, Chengcheng Junior High School, Hsinchu County", "year": "2019 (Dec 20–29)", "summary":"“Hearing the Sound of Along the River” is the National Palace Museum’s atypical education exhibition, held from 20 to 29 December 2019 in the auditorium on the 3rd floor of the administration building of Cheng Cheng Junior High School in Hsinchu County. Since the 1990s the Museum has served inmates with touring exhibitions, since 2010 has worked with correctional institutions on replica displays, and since 2012 on art courses and training young inmates as guides.\n\nThis time the Museum’s education team worked with the school’s Chinese, mathematics, auto repair and computer vocational teachers to bring Along the River During the Qingming Festival (Qing court version) into teaching; and from Su Shi’s Calligraphy on the Cold Food Observance poem in Huangzhou it linked to students’ life experience and extended to contemporary rap rhymes, with students writing their own lyrics and music. Preparation took nearly nine months of teaching students the relevant skills.\n\nThe venue had replicas of Palace Museum objects, VR and film, and works by students in pastel, comics, Zentangle, LINE stickers, sculpture, mechanical making and music and lyrics; students also served as guides. The youths’ full names and faces are not shown, and they express themselves through music, spoken words and text.", "selfDesc": "The reports rely on the museum's statements and quote no students or teachers. The Commercial Times says the museum has trained juvenile inmates as guides since 2012; the Epoch Times says the museum has worked with seven correctional institutions including Taipei Prison since 2010 and does not mention 2012, so they may not describe the same thing.", pedagogicalInsight:"Taking Palace Museum objects (Along the River, the Cold Food poem) as a starting point and letting correctional-school students reinterpret them in pastel, comics, stickers and other media, and even act as guides, shows “a low-barrier, approachable design built on high-barrier classics”. Note: the reports read like press releases and do not describe how students took part in making.", "why": "Two outlets agree on dates, venue, the partnership and the content, but the pieces read like one press release with no teacher or student quotes; the \"since 2012\" claim appears only in the Commercial Times and differs from the Epoch Times' 2010."},
k37:{name:"Yijia Art Museum (series)",creator:"Graduate Institute of Arts and Humanities Education team, Taipei National University of the Arts; partner: Taipei Honor Home for Veterans; course instructor and curator Wu Dai-rong (the page does not say whether the university is the organizer)",place:"Taipei Honor Home for Veterans (the Home of Righteous Soldiers); creation and exhibition take place in the residents' living space",year:"2019 (the team entered the site in 2014 and a 2022 GPI review calls it eight years of interaction; since 2016 the project has used the name Yijia Art Museum, with a half-day show each International Museum Day; the 2019 show was on May 18)",
summary:"Yi Jia Art Hall is a project in which a team from Taipei National University of the Arts has, since 2014, entered the Taipei Veterans Home (the home of the Korean War anti-communist “righteous soldiers”) and lived alongside them over the long term; from 2016 it has used the name “Yi Jia Art Hall”, turning the soldiers’ living space into a place for making and showing work, with a half-day exhibition each year on International Museum Day. The project website says the idea is to turn the home into an artistic ecomuseum, focusing on the co-creation process rather than finished works, and run alongside an elective course.\n\n2019 marked 65 years since the soldiers came to Taiwan. The curatorial team reorganised the family-history room and took a line from a yellowed document — “How to become a completely free person within 180 days!” — as its theme; resident artists and teachers used “art-narrative practice” to explore how freedom is represented and interpreted and invited participants to think together, going back to the historical documents in the family-history room to ask how the word “freedom” is defined and used.\n\nIn 2019 it was presented in a half-day exhibition on 18 May. A 2022 book review on the Government Publications Network says the soldiers moved from outside spectators to participants in the co-creation, thinking about freedom, nation and home, trauma and views of life and death with themselves as subjects; during the pandemic the planned in-person exhibition was moved online.",
selfDesc:"The project website says the idea is to turn the home into an artistic eco-museum that values the process of making together over finished works, paired with an elective course. In 2019 the curatorial team reorganised the history room around a sentence on yellowed documents, \"How to become a completely free person within 180 days!\"; resident artists and teachers explored how freedom is represented and interpreted and invited participants to think together. The GPI review (Tseng Yi on Wu Dai-rong's book) adds that Wu developed an artist-teacher residency programme encouraging students to make site-specific work; participants include students, artist-teachers, and the veteran residents and administrative staff of the home; it describes the veterans as empowering themselves through art and becoming the creators.",
pedagogicalInsight:"This project treats the teaching process itself as the creative work, and is especially useful for teachers running long workshops. A facilitator can ask: did my questions emerge from participants’ lives, or did I preset the answers? Note: how much say the soldiers had in individual works is not described, so the actual degree of co-creation remains to be checked.",
why:"Confirmed as verified after your review (November 2026). On Nov 3, 2026 a GPI review was added as a third source; it agrees with the team sites on the 2014 start, the International Museum Day shows and the partnership with the home, but it reviews the project leader's own book, so its independence is limited, and there is still no detail on individual veterans' participation."},
k36:{name:"Pan-Austronesian Art Festival (Kaohsiung Museum of Fine Arts, 2021 Summer Exhibition)",creator:"Organized by Kaohsiung Museum of Fine Arts; director Lee Yu-ling as chief curator; New Zealand curatorial advisors Zara Stanhope and Reuben Friend; 23 artists and teams from Taiwan, Australia, New Zealand, Korea, Japan, Pakistan and France; architect Lu Chien-ming for the outdoor park",place:"Galleries of Kaohsiung Museum of Fine Arts, extending to the outdoor park around Neiwei Pond",year:"2021 (Jul 17–Oct 31 per the museum's press release; overseas show in Washington, D.C., May 7–Jun 26, 2022)",
summary:"The Pan-Austronesia Art Festival was the Kaohsiung Museum of Fine Arts’ 2021 summer exhibition, running from 17 July to 31 October according to the museum’s press release, with an overseas show in Washington, D.C. from 7 May to 26 June 2022. The exhibition extends from the galleries into an outdoor park around the Neiwei pond, where a water-system plant ecology restoration is under way.\n\nThe museum turned the show into an international arts festival centred on sea and islands, inviting more than twenty groups of artists to deal with the migration of Austronesian peoples, cultural collisions in the Age of Discovery, the traces left by colonisation and resource extraction, and encounters, collisions and reconciliation between islands. The curatorial team began planning in 2019; its three themes — “From the Known to the Unknown”, “Dark Islands” and “Life Flows On” — correspond to encounter, collision and reconciliation, and the director stressed avoiding a diversity of only “noise” without “harmony”.\n\nThe outdoor park takes drift plants as its target with an “organic landscape” concept, and architect Lu Chien-ming led students of the Indigenous special class to tidy the park and restore plant ecology. Some participating artists represented Taiwan at the Taiwan Pavilion of the Yogyakarta Biennale; in 2022 four groups of Taiwanese artists also went to Washington for “Fluid Borders”.",
selfDesc:"An interview on The News Lens says the three themes From the Known to the Unknown, Dark Islands and Cycles of Life correspond to encounter, collision and reconciliation, and the director stresses avoiding diversity with only \"noise\" and no \"harmony\". The curators began planning in 2019. The outdoor park takes drift-sea plants as its subject with an \"organic landscape\" concept; architect Lu Chien-ming led students of the Indigenous programme to tidy the park and restore plant diversity. Some artists (Laha Mebow, Chang Chih-chung, Jason Chiu and Margot Guillemot) represented Taiwan at the Jogja Biennale; four Taiwanese artists showed \"Fluid Boundaries\" in Washington in 2022.",
pedagogicalInsight:"This is large-museum curation with very weak community participation; the more useful part for educators is its thematic framework — using three sub-themes of encounter, collision and reconciliation to discuss Austronesian migration and colonisation — which can be borrowed to organise a lesson on Austronesian culture. Note: curation-led, not participatory.",
why:"Verified: five sources agree on the organiser, chief curator Li Yu-lin, the 23 artist groups and the theme, and the museum's own opening release confirms the 17 Jul-31 Oct 2021 run and 62 works from 7 countries. Independent criticism is still thin, but the core facts are corroborated across the organiser's release and several reports."},
k35:{name:"Interwoven Stories (Sadiljapan Old House, Tuban)",creator:"Curator tjuai (Chu Lien-hui); curatorial team not named in the report",place:"Sadiljapan old house, Tuban Village, Daren Township",year:"2026 (reported Oct 29, \"from today\"; end date not mentioned)",
summary:"The “Interwoven Stories” exhibition is held in the old house Sadiljapan in Tuban Village, Daren Township, from 1 October to 15 November 2026 (as provided by the user); a report on 29 October says it is on show “from now”.\n\nThe exhibition centres on old objects collected in the old house, including things left by a mother and utensils the family used every day; the curator starts from the household collection to explore the objects’ history and family stories, letting the objects bring out the stories of Paiwan families and the village.\n\nThe curator also discussed cultural contexts such as craft, dress and ritual, helping people of different generations learn about past life. The opening day included a tea gathering, guided tours and performances, and visitors shared how the stories moved them.",
selfDesc:"The report says the exhibits include things left by a mother and tools the family used daily; the curator starts from the household collection to explore the objects' history and family stories, extending to Paiwan craft, clothing, rituals and history, so that people of different generations can learn about past life.",
pedagogicalInsight:"Using “things left by a mother and utensils of everyday family life” in an old house as exhibits lets the objects tell Paiwan family stories themselves; telling stories through objects suits schools well, since one old thing can open a lesson in family history. Note: whether residents took part in curating is not reported, so it leans toward curation.",
why:"Only one source (TITV), with promotional wording; awaiting your review. (Daily expansion, 2026-11-16: searched again for a second independent source but found only a different TITV exhibition and general Tuban travel/culture coverage — none corroborating this 'Interwoven Stories' Sadiljapan old-house show — so it stays pending with no source added.)"},
k32:{name:"2026 Mattauw Land Art Festival: Meandering Zengwen River — the Inner Foothills",creator:"Chief curator Huang Ching-ying; 37 artists and teams from Taiwan, Japan, the Netherlands and elsewhere (41 works); source credited to Tainan City Government Cultural Affairs Bureau",place:"Seven zones: Zuoying Art Center in Madou (main venue), Zengwen Reservoir, Balin in Guantian, Paozailiao in Liujia, Zuozhen Old Street, Zhaoxing and Mizhi in Nanxi",year:"2026 (Sep 5–Dec 6)",
summary:"The 2026 Mattauw Land Art Festival, “Meandering Sway: The Shallow Hills of the Zengwen River”, runs from 5 September to 6 December 2026 across seven zones including the Magoh Sogo Art Centre (main venue), Zengwen Reservoir, Guantian Balin, Liujia Paozailiao, Zuozhen Old Street, and Nanxi Zhaoxing and Mizhi. Officials call it Taiwan’s first land art festival to take a single river’s whole basin as its protagonist with action advocacy at its core.\n\nThe festival takes the Zengwen River’s highly winding course as its image and focuses on the shallow-hill settlements of the middle and upper reaches. Preparation took three years, and nearly half the art projects went directly into the hill settlements: artists took up residence in settlements such as Paozailiao and Zhaoxing, doing fieldwork and interviews over three years, and invited “river-basin guides” to lead the way. For example, singer Hsieh Ming-yu created the song “Yong Yong Ah Huo” with local women of Paozailiao in Liujia after long fieldwork and accompaniment; Tsou hunter Basuya Yagumeng led Yu Hsin-lan and the Flying Squirrel Girls’ team in a flying-squirrel survey.\n\nThe festival also raises public issues such as water resources and the “river-basin sacrifice system”, a “rights of nature” advocacy, and plans an experimental “nature court”.",
selfDesc:"The reports say preparation took three years and nearly half of the art projects went directly into foothill settlements. For example, singer Hsieh Ming-yu wrote the song \"Yong-yong-a Huo\" with local women of Paozailiao after long fieldwork and companionship, and Tsou hunter Basuya Agumang led Yu Hsin-lan and the Flying Squirrel Girls team on a flying squirrel survey. The festival raises \"rights of nature\" advocacy and the \"river-basin sacrifice system\" and plans an experimental \"Nature Court\"; it is described as Taiwan's first land art festival centred on a whole river basin and driven by advocacy.",
pedagogicalInsight:"The festival shows the depth of co-creation that is only possible when artists spend three years in place, and its “river-basin guide” design is a good way to let local people be the guides. Note: how residents took part in most sub-projects is not described in detail.",
why:"Four reports broadly agree on dates, zones, artist count and curators (one is a CNA wire report, one covers the Tainan City Government press conference), but all cover an official event with no independent review, the work count differs (41 vs 42) and the organizer is labelled inconsistently; awaiting your review."},
k33:{name:"Art Heritage Community Story Co-creation: Elder Dance, Hakka Daily Life",creator:"Promoted by Hsinchu Living Aesthetics Center; Taichung-based Chi-Chih Physical Dance Company; residents of Douhuan Community, Toufen, Miaoli",place:"Presentation at the Tongluo Tea Factory of Taiwan Agriculture and Forestry Co., a Ministry of Culture \"Top 100 Cultural Bases\"; community: Douhuan, Toufen",year:"2026 (ROC year 115; presentation Sep 4)",
summary:"Dancing Together, Daily Life in a Hakka Village is a 2026 (ROC year 115) project under the National Hsinchu Living Arts Center’s “Art Domain Inheritance — Community Story Co-creation Programme”, taking plant dyeing craft and Hakka life culture in Douhuan Community, Toufen, as its subject.\n\nThe project began with exchange interviews and story collection, then used art workshops to let Douhuan residents and professional dancers (Extreme Physical Dance Company, founded in 1997) work together, turning family daily life, Hakka village life, plant-dyed works and community memories into a dance piece.\n\nThe results were presented on 4 September at the Tongluo Tea Factory of Taiwan Agriculture and Forestry Co., one of the Ministry of Culture’s “100 Cultural Bases”, with residents and dancers performing on the same stage; the Center says it will keep promoting the programme.",
selfDesc:"The report says the project is the 2026 edition of the \"Art Heritage Community Story Co-creation Project\" by Hsinchu Living Aesthetics Center, taking community plant-dyeing craft and Hakka life as material and weaving plant-dyed works, family daily life and community memory into the choreography; the dance company was founded in 1997. The center says it will continue the project.",
pedagogicalInsight:"Collecting stories through interviews first, then putting residents and professional dancers on the same stage to turn family daily life and plant dyeing into dance, handles Hakka village life through the body — better suited than words to residents who are not used to speaking about themselves. Note: the number and ages of residents and whether they took part in decisions are not reported.",
why:"Only the Hakka News (2026-09-07) source, which reads like a press release; awaiting your review. A 2026-11-15 search for additional independent coverage found none; held as pending. (daily source expansion, 2026-11-15)"},
k34:{name:"Meeting Places: Artist-in-Residence Co-creation (Taitung)",creator:"Organised by the Taitung County Cultural Affairs Dept. and Taitung Art Museum; local executing teams; resident artists and local venues across the years; project observer/critic Lu Pei-yi",place:"Local cultural venues and arts sites across Taitung (Chenggong, Zhiben, Changbin, Tjuwabar, Dawu, etc.)",year:"From 2021 (2021 Return: Rhythm of the Land; 2022 Return: Rhythm of the Sea; 2023 Re-Return; 2024 How to Bond; 2026 Undercurrent)",
summary:"“Encountering Places · Co-creation Residency” is an artist residency and co-creation programme promoted by the Taitung County Government Cultural Affairs Department / Taitung Art Museum since 2021, carried out at local venues and cultural sites across Taitung County (Chenggong, Zhiben, Changbin, Tuban, Dawu and others). Unlike ordinary residencies that take artists out of their usual environment, it stresses artists, local venues, residents and the environment meeting and co-creating as “mutual subjects”, using the process to survey local spaces, channel resources and train local art administrators.\n\nEach year has had a different theme: 2021 “Return: Rhythm of the Land”, 2022 “Return: Rhythm of the Sea”, 2023 “Return Again: Rethinking Landscape” (Tsai Kun-lin’s sound-installation exhibition “Voices of Many” at the Chenggong Indigenous Artefacts Museum is one result of that year), and 2024 “How to Entangle” (venues in the county could apply, and three teams were matched for two-month residencies in Tuban, Changbin and Zhiben).\n\n2026 is “Undercurrent”, as in Juan Chung-kai’s “Veranda” in Dawu. The three 2024 residencies were recorded by the programme’s observer in the ARTouch column “Southern Potential”.",
selfDesc:"An ARTouch Southern-Potential column by Lu Pei-yi (2024-12-06), writing as the project's observer, records the three 2024 'How to Bond' teams (Lai Yu-feng / Zhiben; Luo Yu-chi / Changbin; Chen Yu-chen & Li Pei-lun / Tjuwabar) and traces the 2021-2024 artists and venues; it invokes Wu Mali's 2006 'Tropic of Cancer Environmental Art Action' idea that 'artists become residents, residents become artists', explaining the programme's mutual-subject, process-over-product stance. Official pages of the Cultural Affairs Dept. and Taitung Art Museum, a book-launch page, Liang'an Haobao (2026 'Undercurrent'), and pages by the East Taiwan Research Association and Tjuwabar Time corroborate each year's residencies and showcases.",
pedagogicalInsight:"The programme is itself a methodology of “mutual-subject co-creation”: it deliberately differs from the traditional residency that takes artists out of their environment, and treats local venues as bridges between artists and place. Note: the degree of “co-creation” varies by year and team, so when using the word, check who is actually making.",
why:"Verified: the whole 'Meeting Places: Artist-in-Residence Co-creation' programme (Taitung, from 2021) is corroborated across several independent sources — Lu Pei-yi's ARTouch column (2024-12-06, independent observation/critique), Liang'an Haobao (2026 'Undercurrent') and Storm Media (2023 'Voices of Chenggong') — plus official pages of the Cultural Affairs Dept. and partner bodies. The single 2023 'Voices of Chenggong' show still rests on Storm Media plus the official page; 2024 'How to Bond' and 2026 'Undercurrent' rest on that year's sources. The Art Map piece is marked a Taitung County Government advertisement and is not counted as independent corroboration."},
k01:{name:"Opening Gangshan: Boxes of Memory (Exhibition 2.0)",creator:"USR project team, College of Management, National Sun Yat-sen University; in cooperation with the Kaohsiung Museum of History",place:"Gangshan District (exhibited at the Kaohsiung Museum of History)",year:"2021–2023",
summary:"This is a community art project in Gangshan, Kaohsiung, run by the USR team of the College of Management at National Sun Yat-sen University together with the Kaohsiung Museum of History.\n\nThe team invited Gangshan residents to start from their own memories and each make a “memory box”.\n\nIn 2023, 75 boxes were shown at the Kaohsiung Museum of History together with footage of the making process.",
selfDesc:"The report says the project team and local residents made the boxes together, students inventoried the cultural resources of the old street, and elementary school teachers and pupils were among the creators. The exhibition also gave background on workshops about exploring the old street and discussing its future.",
pedagogicalInsight:"This project shows how to turn the abstract theme of ‘local memory’ into a task anyone can do by hand; the techniques below can go straight into a classroom. Note: residents’ say over the wider curation is not reported, so the depth of co-creation is unconfirmed.",
why:"Verified: besides the 1111 report on the 2.0 (2023) opening, Yam/今傳媒 (2022-06-16) reported the earlier 1.0 edition, corroborating residents making 'memory boxes' from their life stories and the Sun Yat-sen University-led co-creation method; the 1.0 co-organisers differ from the 2.0 (which involved the Museum of History), as noted."},
k02:{name:"Ripples of Memory (Kaohsiung Gas Explosion Memorial Installation)",creator:"Artist Yen Ming-hung and team; organized by the Kaohsiung City Government Bureau of Cultural Affairs",place:"Intersection of Sanduo 2nd Road and Kaixuan 2nd Road (next to Wuquan Elementary School)",year:"2016–2018",
summary:"“Ripples of Memory” is a public art installation commemorating the Kaohsiung 81 gas explosion, located at the intersection of Sanduo 2nd Road and Kaixuan 2nd Road beside Wuquan Elementary School; the project ran from 2016 to 2018.\n\nThe work uses twisted metal pipes and a broken road surface to represent the event, and sets “memory objects” provided by residents into the ground. The selection process included community forums, briefings and in-depth interviews with residents, and residents’ views were built into the jury’s priorities.\n\nSixteen workshops were also held, with nearly 1,000 students from nearby schools taking part. The work opened to the public in early July 2018.",
selfDesc:"The report says the selection process included community forums, briefings and in-depth interviews with residents, and residents' opinions were weighed in the jury's evaluation. Sixteen workshops were also held, with nearly 1,000 students from nearby schools. The work opened to the public in early July 2018.",
pedagogicalInsight:"This case shows how residents’ “memory objects” can be set into an artist-led memorial so that a community leaves personal traces in a public commemoration; the techniques below can be taken into a classroom. Note: how much was resident participation and how much artist-led is not reported.",
why:"Verified: besides Storm Media, ARTouch (Hung Wei-che, 2018-07-09) describes this 'Ripples of Memory' land-art work in detail - the team Yen Ming-hung + Huang Ming-wei Architects, its five parts (Echo of Time, Walking Memory, Ripples, Pavement Landscape, and the participatory 'Overlap Box'), a prism refracting two rainbows daily 9:30-11:30 onto a memorial poem and the names of the 32 victims, and the choice of Wuquan Elementary (a forward command post after the blast); corroborated with Storm, it is upgraded to verified."},
k03:{name:"Big Nose Youth · Dalinpu Memory Transit Project",creator:"Big Nose Youth (a local youth team; founder Cheng Tzu-ying)",place:"Dalinpu",year:"Workshop date not mentioned (reported December 2025)",
summary:"Dalinpu is facing relocation in 2027. A team of third-generation local young people, “Dabi Youth” (which grew out of the “Flowing Dalinpu” project by Zheng Ciying, a student at NSYSU’s arts management graduate institute), uses art and community participation to preserve the settlement’s memory.\n\nIts core project, “Dalinpu Relocation: Memory Transfer Project”, is supported by the Ministry of Education’s Youth Community Participation Action 2.0. Members act as “cultural luggage handlers”, collecting old photos, interviewing residents and riding a “transfer bicycle” around temple courtyards. The team also ran a community workshop in which residents turned past protest banners into screen prints.\n\nThe results include the publication Winds of Dalinpu, a Dalinpu voice map and a themed exhibition that strengthen community identity; the team also records the place in short social-media videos.",
selfDesc:"The report describes the team turning protest symbols into works of local memory, with residents taking part in the silkscreen printing. The background it gives includes disputes over industrial pollution and the relocation policy.",
pedagogicalInsight:"The approach here is to give a role first, reach out actively, then preserve memory in a structured way — well suited to relocation, urban renewal or any place that is disappearing. Note: the timing and size of the screen-printing workshop are not reported.",
why:"Verified: besides PTS (2025) on the community workshop turning protest banners into silkscreen prints, the Liberty Times (2026-11-08) reported the 'Big Nose Youth' memory-relay project in Dalinpu, corroborating the team and its pre-relocation memory-preservation work; the silkscreen workshop detail rests on PTS."},
k04:{name:"Good Times Podcast (Dalinpu)",creator:"Hsu Jung-hung, Wu Yu-mei (a teacher at Fenglin Junior High School) and students",place:"Dalinpu; Fenglin Junior High School",year:"Not mentioned",
summary:"“Rose Time” is a podcast made by students of Fenglin Junior High School in Dalinpu with their teacher, documenting Dalinpu’s food, beliefs and daily life.\n\nThe teacher guided students to interview the village chief and elders, write scripts and draw a community map, and then record the programme.\n\nStudents came to know their hometown anew and developed a sense of belonging; the programme won the Golden Bell Award for a podcast arts and culture programme (the page does not state the year).",
selfDesc:"The report says students came to know their hometown anew and developed a sense of belonging, and that the program won a Golden Bell Award for Podcast Arts and Culture Program (the page does not state the year).",
pedagogicalInsight:"A typical “students as researchers” model: the teacher designs the process of interviews, scripts, community map and recording, and the issue grows out of students’ own fieldwork — a ready template for cross-disciplinary projects. Note: whether students were co-creators or interview helpers is not reported.",
why:"Pending: the 'Good Times' podcast made by a secondary-school teacher and students interviewing elders and village heads is mentioned only by PTS; no second independent source was found, so it is downgraded to pending."},
k05:{name:"Jalan-Jalan: A Special Exhibition on Migrant Human Rights in Kaohsiung and Pingtung",creator:"Kaohsiung Museum of Labor; field research in cooperation with 1095 Studio for History and Culture",place:"Kaohsiung Museum of Labor (content covers four migrant living areas in Kaohsiung and Pingtung)",year:"2021–2022",
summary:"Jalan-Jalan: A Special Exhibition on Migrant Mobility and Rights in Kaohsiung and Pingtung is a special exhibition on the living landscapes of migrant workers and new immigrants in the Kaohsiung–Pingtung area, shown at the Kaohsiung Museum of Labor from 26 December 2021 to 31 December 2022.\n\nField interviews were carried out before the exhibition, and migrant workers and new immigrants were invited to take part: the opening featured a band of Southeast Asian migrant workers, a new-immigrant group shared life stories, and volunteer guides gave tours in Southeast Asian mother tongues.\n\nDuring the exhibition there were Southeast Asian Culture Days, music performances and picture-book storytelling.",
selfDesc:"The report says migrant workers and new immigrants were invited to take part: the opening featured a band of Southeast Asian migrant workers, new-immigrant groups shared life stories, and volunteers gave tours in Southeast Asian languages. The exhibition ran from December 26, 2021 to December 31, 2022.",
pedagogicalInsight:"The exhibition turns migrant workers and new immigrants from “people on display” into “people telling their own stories”. For teachers of multicultural units, the point is to let learners speak in their own language rather than have the mainstream speak for them. Note: the migrants’ role in curatorial decisions is not reported.",
why:"Pending: this 'Jalan-Jalan' exhibition is reported under its name only by NOWnews; no second independent source naming this exhibition was found (nearby results are other Kaohsiung migrant events, not this show), so it is downgraded to pending."},
k06:{name:"Lin Chun-yung Solo Exhibition: Black Surge",creator:"Lin Chun-yung (artist); curator Cheng Sheng-hua",place:"Kaohsiung Museum of Fine Arts",year:"2023",
summary:"“Black Surge” is a 2023 solo exhibition by Kaohsiung artist Lin Chun-yung at the Kaohsiung Museum of Fine Arts. Using symbols such as marine debris, tetrapod breakwaters and the industrial city, it looks back on Taiwan’s marine environment and industrial development.\n\nThe show reflects on Kaohsiung’s experience as an industrial and petrochemical hub, and takes the 2015 sperm whale stranding as the trigger for the marine-debris works.\n\nThirty-six works were shown. The Business Today report does not mention residents or the community taking part.",
selfDesc:"The report says the exhibition reflects on Kaohsiung's experience as an industrial and petrochemical hub, and takes the 2015 sperm whale stranding as the starting point for the marine-debris works. The Business Today report does not mention participation by residents or communities.",
pedagogicalInsight:"This solo show has no participatory element, but works well as material for “looking at the work and discussing transformation”. Note: what it can teach is how to read and borrow an artist’s way of transforming things, not how to run a participatory workshop — it is work-oriented, not process-oriented.",
why:"Two independent reports agree on the exhibition's name and venue. The year is inferred from the publication dates."},
k07:{name:"Zhongzhou Jinyu Festival",creator:"Faculty and students, Graduate Institute of Arts Management and Entrepreneurship, National Sun Yat-sen University; in cooperation with Tu Yi-wen (National Yang Ming Chiao Tung University)",place:"Zhongzhou, Cijin District",year:"From the first edition in 2021 (dates for 2.0 not mentioned)",
summary:"The Zhongzhou Jinyu Festival is a community arts festival in Zhongzhou, Cijin, first held in 2021 (dates of 2.0 not stated). The report mentions background such as pollution from Kaohsiung Port and shipbuilding, relocation, the decline of fishing-port culture and an ageing community.\n\nThe festival shows installations in Zhongzhou together with guided tours, workshops and talks; a community long-term-care centre co-created work, and members of the public took part in a physical dance piece and video documentation.\n\nThe team also compiled local history materials and published the local periodical Jinzhou Bulletin.",
selfDesc:"The report says a community long-term care center took part in making works, residents joined in a dance piece and video documentation, and it mentions background such as pollution from Kaohsiung Port and shipbuilding, relocation, the decline of fishing-port culture and an aging community.",
pedagogicalInsight:"The festival uses a “community arts festival plus local publication” to gather scattered local history into something that can be shown and read, with elders from a care centre joining in; it models how to close a project by compiling oral accounts and images into a publication. Note: residents’ role in curating is not reported.",
why:"Verified: besides the 1111 report, Bo News (Li Chih-wen) independently covered the Zhongzhou Jinyu Festival, corroborating the Sun Yat-sen University arts-management institute as founder, the installations at Zhongzhou on Qijin, the tours/workshops/talks and the Jinzhou journal."},
k08:{name:"Kaohsiung Military Dependents' Village Trilogy",creator:"Hou Shu-tzu (video artist)",place:"Villages in Zuoying; Huangpu New Village, Fengshan",year:"2009–2017",
summary:"The Kaohsiung Military Dependents’ Village Trilogy is a work by an artist who spent about eight years (2009–2017) visiting the new villages of Zuoying and Huangpu New Village in Fengshan, using residents’ oral accounts and images to record life and displacement memories amid the villages’ redevelopment and demolition.\n\nThe report is an excerpt from The Long Day Ends, built around the oral account of one Grandma Liu; the author interviewed her many times and invited her to return to the village.\n\nThe trilogy comprises We Meet Here, The Long Day Ends and Where Is Home?.",
selfDesc:"The report is an excerpt from The Long Day Wanes, built around the oral account of one elderly woman, Grandma Liu, whom the author interviewed several times and invited back to her village. The trilogy comprises We Meet Here, The Long Day Wanes and Where Is Home.",
pedagogicalInsight:"This is an artist’s personal work built over eight years of staying close to the place. Residents are interviewees, not co-creators, but it shows how “long companionship + oral accounts + images” builds credible local memory — through repeated returns and relationships rather than one-off collection. Note: it is work-oriented, not a participatory workshop.",
why:"Verified: besides the Storm book excerpt, the VT Artsalon solo show 'The Long Day Closes' (2015) corroborates Hou Shur-tzy documenting, through images and residents' oral accounts, the lives of military-dependent households in Fongshan's Huangpu Village after they moved out, and the village's demolition, consistent with the 'Kaohsiung Military Village Trilogy' (a different show and outlet)."},
k09:{name:"Mudan Forest–Village–Sea Environmental Art and Design Camp",creator:"Department of Craft and Creative Design, National University of Kaohsiung; co-organized by Mudan Township Office and Mudan Township Community Development Association; in cooperation with Cheng Shiu University",place:"Xuhai, Mudan Township, Pingtung (Mudan Bay section of the Langqiao–Beinan Historic Trail)",year:"2024 (7th edition; the camp began in 2016)",
summary:"The Mudan Forest–Village–Sea Environmental Art and Design Camp is held at Xuhai, Mudan Township, Pingtung (the Mudan Bay section of the Langqiao–Beinan Historic Trail). The camp began in 2016, and 2024 was its 7th edition.\n\nUniversity staff and students worked with village residents to make three installations from driftwood and discarded fishing nets, on themes including ethnic integration and marine debris; resident Pan Kunlin taught students to weave discarded fishing nets.\n\nThe camp also developed an AR application presenting works from past editions, and a Mudan Township Office section chief said it has nurtured more than 15 amateur artists in the village.",
selfDesc:"The report says resident Pan Kun-lin taught students to weave discarded fishing nets, and a Mudan Township Office section chief said the camp has trained more than 15 amateur artists from the tribe.",
pedagogicalInsight:"The role reversal is notable: it is not an artist teaching residents, but a village resident teaching university students to weave discarded fishing nets. For teachers working across cultures or with local knowledge, it shows how “letting local people be the teachers” brings learners into the local context. Note: residents’ role in choosing themes is not reported.",
why:"Pending: the Mudan 'Forest-Village-Sea' environmental art camp has only the 1111 campus-news source; other results are either the same outlet's university news or other Mudan projects, and one Liberty Times piece could not be read, so it is downgraded to pending."},
k10:{name:"Street Museum (first edition: Zhongqin Village, Zhongzheng District)",creator:"Taipei Fine Arts Museum; in cooperation with Zhongqin Village, Zhongzheng District",place:"228 Memorial Museum (results exhibition); Zhongqin Village, Zhongzheng District",year:"2019–2020",
summary:"The Street Stories Museum is a project in which the Taipei Fine Arts Museum worked with residents of Zhongzheng District’s Zhongqin Village; the exhibition ran from 21 December 2019 to 22 March 2020, with results shown at the 228 Memorial Museum.\n\nThe project invited 34 senior residents to collect local memories and create works starting from paintings in the museum’s collection.\n\nThe results were shown together with works from the collection. The report says the project is planned to expand year by year to Taipei’s 12 districts, with goals including elder participation, intergenerational dialogue and local identity.",
selfDesc:"The report says the project plans to expand to Taipei's 12 districts year by year, with goals including participation by older adults, intergenerational dialogue and local identity. The exhibition ran from December 21, 2019 to March 22, 2020.",
pedagogicalInsight:"The project uses a painting from the museum collection as a starting point, giving elders a concrete way in, and then asks them to collect their own memories for making work, which lowers the barrier for non-artists. For teachers working with seniors, it models using an existing artwork to draw out personal memory. Note: the media of residents’ works are not reported.",
why:"Verified: besides Taiwan News, 1% STYLE (LINE TODAY, 2025) also refers to the Taipei Fine Arts Museum's Zhongqin-li edition of 'Street Corner Museum' and its method of using collection paintings to prompt elders' local memories; note that piece dates the Zhongqin-li edition to 2019 (this entry says 2020), so fieldwork and the formal show may fall in different years."},
k11:{name:"Turning Around in the Old City (Street Museum 2024)",creator:"Taipei Fine Arts Museum; artists Hsu Chia-chen, Tsui Kuang-yu and Lung Sze-liang",place:"Zhongshan Hall (border of Zhongzheng and Wanhua districts)",year:"2024–2025 (through March 2, 2025)",
summary:"Turning Around in Chengzhong is a 2024 Street Stories Museum project, on view until 2 March 2025 at Zhongshan Hall (on the boundary of Zhongzheng and Wanhua districts), with the everyday memories of Ximending and Chengzhong Market as its theme.\n\nThe project ran an old-photo card-game workshop and a mobile-phone video workshop, inviting residents and local shop owners to create; the artist took the role of a “counsellor”.\n\nLocal shops, residents and the artist thus took part in creating together.",
selfDesc:"The report says local merchants, residents and artists took part in creating the work, with the artists acting as \"counselors.\"",
pedagogicalInsight:"The artist calls themself a “counsellor” rather than a creator, and that stance is itself a model for educators; low-threshold tools such as an old-photo card game and phone video let residents and shop owners tell their own stories. Both workshop formats can be borrowed directly.",
why:"Verified: besides Islands of Museums, Mirror Media (2025-01-13) independently covered the 2024 'Street Corner Museum: City Turn', corroborating the Taipei Fine Arts Museum as host, the Chengzhong district/market theme and the card-game workshop made from shopkeepers' memory objects; the phone-video workshop detail rests on Islands of Museums."},
k12:{name:"Freedom of Movement: Encountering the Last Scenes of Ankang Public Housing (Xinglong Social Housing Public Art Project)",creator:"Tomorrow Studio; artists Chen Po-yi, Fengjing Yinghua Creative Society, Liu Yi-yin and others",place:"Three vacant units in Ankang Public Housing, Wenshan District",year:"2024 (Mar 8–Apr 21)",
summary:"“Freedom of Movement: Encountering the Last Scenes of Ankang Public Housing” is a public art project for Xinglong social housing. From 8 March to 21 April 2024, before residents moved out, three vacant units in the Ankang public housing in Wenshan District were used for an exhibition.\n\nTomorrow Studio’s “Xinglong Little Living Room” was in residence for more than a year and ran activities such as baking cookies, drawing and small trips; residents took part in the collage for the main visual and contributed personal objects and stories.\n\nThe exhibition combined residents’ calligraphy, restored old photos, plaster hand casts and a documentary to show residents’ different choices about “moving” and “home”.",
selfDesc:"The report says Tomorrow Studio's \"Xinglong Living Room\" had been on site for over a year, holding baking, drawing and small-trip activities. Residents took part in the key-visual collage and contributed personal objects and stories.",
pedagogicalInsight:"The rhythm of this project is “relationships first, making later”: it stayed for over a year, building relationships through baking, drawing and small trips before holding an exhibition. A reminder for rushed workshops that relationships take time. Note: residents’ role in decisions is not reported.",
why:"Verified: besides Islands of Museums, CNA (2024-03-21) reported the 'Freedom to Move' public-art show for the Xinglong social housing, corroborating an exhibition before the Ankang relocation, curation by Tomorrow Studio, and residents' stories shown via the documentary 'Monologue of Ruins'; items such as calligraphy, plaster hand-casts and photo restoration rest on Islands of Museums."},
k13:{name:"We Are Home: Guangci Social Housing Public Art Project",creator:"Participating artists include Hsu Yung-hsu, Chiu Cheng-hung, Tseng Ling-li and Peng Kuan-chieh (the organizer's report does not state this explicitly)",place:"Guangci Social Housing complex, Xinyi District",year:"Launched 2020; results exhibition Jan 29–Feb 10, 2025",
summary:"We Are Home is a public art project at the Guangci social housing estate, launched in 2020, with a results exhibition from 29 January to 10 February 2025 at the Guangci estate in Xinyi District.\n\nThe project builds relationships among residents through long-running series of workshops (private kitchens, book and recipe swaps, social prescriptions and more) and 18 installations; the report lists a private-kitchen project for women’s centre clients, herbal healing and a community garden, and a community flag co-created by residents.\n\nAnother work draws on the dreams told by more than ten residents.",
selfDesc:"The report lists a private-kitchen project for women's center clients, herbal healing and a community garden, a community flag made together by residents, and works drawn from the dreams of more than ten residents told in interviews.",
pedagogicalInsight:"The project uses everyday, ongoing activities such as private kitchens, book and recipe swaps and social prescriptions as the medium, so residents form relationships before there are artworks. For teachers working with communities, it shows an art project can begin with everyday things like eating together and swapping recipes, without talking about making art at first.",
why:"Verified: besides Yahoo/Yam, CNA (2025-01-10) reported the 'We Are Home' public-art results show for the Guangci social housing, corroborating the site, curation by He Lei Art (Wu Hui-chen), 18 installations plus the 'Museum of Migration', over 200 community workshops before the show, and residents' stories as material; specific strands such as the private kitchen, book/recipe swaps and 'social prescriptions' rest on the original report."},
k14:{name:"Sundays Unseen: One-Forty International Migrant Photography Award Exhibition",creator:"National Theater & Concert Hall \"2026 Autumn Arts Festival\" and the One-Forty International Migrant Photography Award; migrant worker photographers from Indonesia, Vietnam, the Philippines and Thailand working in Taiwan",place:"Gate 2, National Theater (21-1 Zhongshan S. Rd., Taipei)",year:"2026 (Sep 20–Nov 29)",
summary:"The Sunday-Only Scenery international migrant-worker photography award has run since 2019; 2026 is its 7th edition. Based on Photovoice theory, it is exhibited at the National Theater and Concert Hall for the first time. The special exhibition is at Gate 2 of the National Theater, from 20 September to 29 November 2026, free, daily 12:00–20:00.\n\nIt shows works by migrant workers in Taiwan who recorded their own lives with phones or cameras; the photographers decide what to shoot and how they want to be understood. The exhibition starts from the question “what if you had only one day off a month”, and entries came from migrant workers from Indonesia, Vietnam, the Philippines and Thailand.\n\nIt presents the 2026 winners and selections from past years in three parts — “Limited Space | Survival Mission”, “Limited Time | Soul Relaxation” and “Limited Self | Becoming Yourself” — with themes of labour, diaspora, identity and memory, and ends with a planned “migrant issues reading list”.",
selfDesc:"The report says the award has run since 2019, 2026 is its seventh edition, it is based on Photovoice theory, and this is its first showing at the National Theater & Concert Hall. The show presents the 2026 winners and selections from past years, with entries from migrant workers from Indonesia, Vietnam, the Philippines and Thailand; it has three sections (Limited Space | Survival Mission, Limited Time | Relaxing the Mind, Limited Self | Becoming Yourself), covers labor, diaspora, identity and memory, and ends with a reading list on migrant-worker issues. Open daily 12:00–20:00.",
pedagogicalInsight:"This is a representative Photovoice case: migrant workers decide what to photograph and how they want to be seen, while the award only provides a frame and one question (what if you had only one day off a month). For teachers who want learners to “hold the voice”, it is the cleanest model: the facilitator poses the question and participants answer for themselves.",
why:"Previously confirmed by human review (October 2026). A LINE TODAY report and Marie Claire both mention the NTCH–One-Forty collaboration, but the dates, venue and edition number still rest on one source; the Vogue and NCAF pages could not be read."},
k15:{name:"\"Cool Symbiosis\" Gender Exhibition",creator:"Museum of National Taipei University of Education; 11 artists and groups including Liu Yu and Lee Mao Huan",place:"Museum of National Taipei University of Education",year:"2023 (Jul 22–Sep 17)",
summary:"“Cool Symbiosis” is a gender-themed exhibition at the MoNTUE (Museum of National Taipei University of Education) from 22 July to 17 September 2023.\n\nEleven groups of artists worked with scientists and other actors, using stories of biodiversity and gender diversity to help visitors understand and accept sexual minorities.\n\nThe report says the show hopes visitors will come to know the many dimensions of biology and gender.",
selfDesc:"The report says the exhibition hopes audiences will come to see the diversity of biology and gender.",
pedagogicalInsight:"This show has no community participation; it is an issue exhibition meant to help visitors understand and accept. But it models using “biodiversity” as an analogy for “gender diversity”, placing a sensitive issue in more neutral scientific language — one way in for teachers discussing gender. Note: it is curation-led, not participatory.",
why:"Verified: besides PTS, Taiwan News reported the MoNTUE show 'Queer-Symbiosis' with 11 artist groups, and the Taiwan Contemporary Art Archive and C-LAB magazine also document it, so the core (MoNTUE, 11 groups, gender/biodiversity themes) is corroborated across sources."},
k16:{name:"ADAM Artists' Laboratory",creator:"Taipei Performing Arts Center (curator River Lin); 2019: 12 artists from 12 countries; 2026: 7 artists from Indonesia, Vietnam, Hong Kong, the Philippines, Australia, Japan and Taiwan",place:"2019: Longshan Temple area in Wanhua and Dadaocheng Theater; 2026: Manila (August residency) and Taipei (October residency and meeting)",year:"2019 (3rd edition), 2026 (9th edition)",
summary:"The Asian Contemporary Performance Network assembly (ADAM) has been an international artist residency and exchange platform run by the Taipei Performing Arts Center since 2017. The 2019 report says its theme was “community (and) art”, concerned with the social turn of contemporary art.\n\nIn 2019 (the 3rd edition), 12 international artists were in residence in Taipei for about four weeks (from 22 July), visiting communities such as LGBTQ people, migrant workers, homeless people and Indigenous peoples; sites included the Longshan Temple area in Wanhua and the Dadaocheng Theatre.\n\nThe 2019 annual meeting ran 15–18 August. In 2026 (the 9th edition) it became a Manila–Taipei two-city residency under the theme “Relations Pending, Art Unfinished”, held in Taipei on 15–18 October around the concept of a “laundry day”, with city walks.",
selfDesc:"The 2019 report says the theme was \"Community (and) Art\", concerning the social turn in contemporary art; the residency began July 22 for four weeks and the annual meeting ran August 15–18. The 2026 official pages say the 9th edition is held every two years (since 2025) with three strands (Artist Lab, New Work Exploration, Exchange & Forum), runs October 15–18, uses the concept of \"Laundry Days\", and includes city walks in Taipei (Chiang Kai-shek Memorial Hall, National Palace Museum, Shung Ye Museum of Formosan Aborigines, Machangding Memorial Park, etc.).",
pedagogicalInsight:"This is an international exchange and residency platform for artists; communities are visited and exchanged with, not co-creators, so its direct value for classroom teaching is limited — it is more an administrative model of how to design a residency and exchange. Note: in 2019 artists and communities visited and exchanged, they did not create together.",
why:"Previously confirmed by human review (October 2026). The 2019 year and third-edition status are corroborated by Taiwan News and a Global Gender report; the 2026 edition is described by Taipei Performing Arts Center and National Performing Arts Center pages, which differ slightly in detail."},
k17:{name:"\"Interwoven\": Co-creating the Museo Aero Solar",creator:"New Taipei City Museum of Art; artist Tomás Saraceno; a community college linking schools and community groups in the Sanying–Tushu area",place:"New Taipei City Museum of Art (Yingge District)",year:"2026 (exhibition 21 Mar–6 Sep; work dated 2023–2026)",
summary:"“Weaving the Universe Together” is a 2026 exhibition at the New Taipei City Art Museum (Yingge), on view 21 March – 6 September, with works dated 2023–2026. “Museum of Solar Flight” is an important extension project of the show, combining art-making, environmental thinking and public participation.\n\nMembers of the public collectively collaged and painted recycled plastic bags to help make a floating sculpture that rises with solar heat. The report says the project has developed since 2007 and been carried out in more than 30 countries, and this is its first time in Taiwan; the work belongs to the artist’s Aerocene project, and the Taiwan version includes works by Taiwanese participants as well as results previously shown in Thailand and Korea.\n\nThe museum also held lift-off experiments, and the work was shown in the “Weaving the Universe Together” exhibition.",
selfDesc:"The report says the project has developed since 2007 and been carried out in more than 30 countries, and that this is its first time in Taiwan. The museum's page calls it an important extension of the exhibition, combining artistic creation, environmental thinking and public participation; exhibition coverage says the work belongs to the artist's Aerocene project, and the Taiwan version includes works by Taiwanese participants and results from earlier showings in Thailand and Korea.",
pedagogicalInsight:"The project uses “open source — everyone makes one big thing that flies” as its draw, with a low threshold and a high sense of achievement. But it is the Taiwan version of an international project and its issue (environmental sustainability) did not grow from local context; in IBAE terms (“from context”) it is a content-first example, useful for contrast and discussion.",
why:"Previously confirmed by human review (October 2026). The newly added museum page, Marie Claire, Yam and the international project page agree on the work's name, exhibition dates, citizen co-creation and the project's 2007 origin; no source describes the Taiwan co-creation process in detail."},
k18:{name:"The Futurists: Living Practices for Future Cities",creator:"Curated by Haobanshe; 9 artists and groups including Wei Chao-yi, Liu Kai-chen, Chang Cheng-chun, Hsu Chia-chen and Wei Theatre",place:"Beitun Social Housing; Wuqi Sanmin Social Housing",year:"2025 (October)",
summary:"Futurists: Living Exercises for Future Cities is public art shown in October 2025 at the Beitun social housing and the Wuqi Sanmin social housing.\n\nResidents provided old photos and life stories, a theatre workshop invited them to talk about “moving house”, and spaces not usually open to the public, such as the rooftop and mailbox areas, were opened.\n\nThe source for this case is a critical essay by the curator, who questions measuring community empowerment by KPIs and asks what public art leaves residents after the project ends.",
selfDesc:"This is a critical essay by a curator. The author questions measuring community empowerment by KPIs and asks what the public art will leave residents after the project ends.",
pedagogicalInsight:"The source is the curator’s own critical essay, which asks the question an educator should ask: once the project ends and the KPIs come down, what does public art leave residents? A reminder for anyone running community projects: do not treat “how many events, how many people” as proof of empowerment.",
why:"Confirmed: besides The Reporter's on-site critique, an official Taichung City (Housing Development Engineering Office) news release (2025-10-18) and the Artemperor exhibition page independently corroborate the core facts — organized by the Taichung City Housing Development Engineering Office, curated and run by Haobanshe, shown at Beitun and Wuqi Sanmin social housing, 17-26 Oct 2025, 9 artists/groups, with artists doing prior in-residence fieldwork — matching The Reporter, so it is upgraded to confirmed. The resident-participation details (old photos and life stories, a theater/script-reading workshop on 'moving house', opening rooftops and mailbox areas) still rest mainly on The Reporter alone. (Daily source expansion, 2026-11-14)"},
k19:{name:"Bu Long Project (Open, and next Art Experiment Field)",creator:"Indigenous Peoples Cultural Foundation (organizer); Taoyuan City Indigenous Peoples Affairs Dept. (partner); KIRI Indigenous Peoples Cultural and Creative Park (co-organizer); artists Ali Istanda (Hu Chia-yu), Siyat Moses (Juan Yuan-min) and maya' a taboeh hayawan (Luo Yuan)",place:"KIRI Indigenous Peoples Cultural and Creative Park, Qingpu (Zhongli and Dayuan districts, Taoyuan)",year:"2026 (official page: 1 Jul–31 Aug; earlier reports: residency Jun–Aug, Taiwan Design Expo in September)",
summary:"Bu-Long Project (Open, and next art lab) is a 2026 residency and event series at the KIRI International Indigenous Cultural and Creative Park in Qingpu, Taoyuan. The official page gives 1 July – 31 August, while earlier reports say a June–August residency; the two may refer to different phases and still need confirming with the organiser.\n\nThree young Indigenous artists were in residence in Qingpu and ran free participatory workshops using local materials such as ponds, temple incense ash and fallen leaves, recalling pond memories lost to development; one artist guided elders at a community health station to turn pond-life experiences into printmaking material.\n\nThe official programme also includes a “Qingpu Sensing Database” city exploration: participants pick up an Exploration Notebook, visit old settlements, ponds and the Laojie River, collect stamps and file them on the 4th floor.",
selfDesc:"The report says visitors could book to create with the artists, and one artist guided elders at a day-care center to turn their pond-side life experiences into printmaking material. The official page frames the programme as re-seeing, sensing and reading Qingpu, covering land memory, urban change and the history of different groups living together; visitors pick up an Exploration Notebook, collect stamps and archive them on the 4th floor, and workshops require registration. Listed workshops are Bu Long Project: Scales Erupting (Hu), Rmdax Memory Developing: Tetra Pak Printmaking (Juan) and ki:ki:im Wasteland Exploration: Body Messages (Luo).",
pedagogicalInsight:"The artist guiding elders to turn “pond-life experience” into printmaking material is a way of turning older people’s everyday memories into creative content; the “Qingpu Sensing Database / Exploration Notebook / stamp-and-file” city-walk design can also be borrowed directly as a walking worksheet.",
why:"Previously confirmed by human review (October 2026). Two newly added official pages agree with earlier reports on the organizer, the three artists, the venue and the workshops; the residency/programme dates differ between sources, and the September exhibition is not confirmed by the new sources."},
k20:{name:"Symbiotic Window Poem: Public Art Co-creation Workshop",creator:"Taoyuan City Government; artist Wu Chien-yi; executed by Youmi Integrated Marketing",place:"Fu'an Park, rear of Taoyuan Railway Station",year:"2026 (workshops Jun 26 and 28, inferred from report dates)",
summary:"Symbiotic Window Poems is a public art co-creation workshop at Fuan Park behind Taoyuan Railway Station, held in 2026 on 26 and 28 June (dates inferred from the report). The area behind the station has long been a gathering place for migrant workers and new immigrants, forming a Southeast Asian commercial area; the workshop takes multiculturalism and migration as its theme.\n\nThe workshop recruited 45 participants to share stories about Taoyuan, the station or “movement”, and asked them to bring food packaging as creative material.\n\nThe outcome is a public artwork using the suitcase as its image.",
selfDesc:"The report says migrant workers and new immigrants have long gathered at the rear of the station, forming a Southeast Asian commercial area, and that the work's themes are multiculturalism, mobility and migration.",
pedagogicalInsight:"Asking participants to “bring a piece of food packaging” as creative material is a clever way to make personal experiences of movement and migration concrete; talking about “movement” through everyday carried objects such as suitcases and packaging is closer to life than talking about immigration policy. Note: whether participants included migrant workers themselves is not reported.",
why:"Pending: the 'Symbiotic Window-Scene Poem' co-creation workshop is reported only by ETtoday (an exact-name search found no second independent source), so it is downgraded to pending. On 2026-11-14 a further search by exhibition name and by artist Wu Chien-yi, Fu'an Park and 'suitcase' still found no second independent source (hits were mostly other works by the artist, not this workshop), so it remains pending. (Daily source expansion, 2026-11-14)"},
k21:{name:"Picture-Book Creation Course for New Immigrants and Migrant Workers (Words, Paint, See)",creator:"National Immigrants' Life Aesthetics Museum (the report elsewhere writes \"National Hsinchu Life Aesthetics Museum\"; the two are inconsistent)",place:"Participants from New Taipei, Taoyuan and Hsinchu; awards held at Beida Park, Hsinchu City",year:"2019",
summary:"The picture-book course for new immigrants and migrant workers, “Talk · Draw · See”, is a 2019 art education course; learners came from New Taipei, Taoyuan and Hsinchu, and the awards ceremony was held at Beida Park in Hsinchu City.\n\nThe course recruited new immigrants and foreign migrant workers from 8 countries, who used picture books to express memories of home and life in Taiwan, on themes including childhood memories, cross-border marriage, hometown scenery and cultural differences.\n\nThe course produced more than 30 works and held an awards ceremony.",
selfDesc:"The report says participants came from 8 countries, and themes included childhood memories, cross-border marriage, hometown scenery and cultural differences.",
pedagogicalInsight:"The course uses picture books as the vehicle for new immigrants and migrant workers to draw their hometowns and their experiences in Taiwan; the barrier is low, yet it can handle private themes such as cross-border marriage and cultural difference. With learners who do not share a language, images are often the best common language. Note: the venue and instructors are not reported.",
why:"Verified: besides Taiwan News (2019), NOWnews (2022) reported that the 'Speak-Draw-See' picture-book project is run by the Ministry of Culture's Hsinchu Living Arts Center since 2019, corroborating the recruitment of new residents and migrant workers, picture books expressing homeland memory and life in Taiwan, and the works and awards (a later year of the same project)."},
k22:{name:"Romantic Route 3 Art Festival",creator:"Hakka Affairs Council; Hakka Village Aesthetics Base (project lead Feng Tien-wei)",place:"Hakka villages along Provincial Highway 3",year:"First edition 2019; second edition planned for 2023",
summary:"The Romantic Route 3 Art Festival is a large arts festival on the theme of Hakka village lifestyle aesthetics along Provincial Highway 3; the first edition was in 2019 and a second was scheduled for 2023.\n\nThe first edition involved more than 70 artists, five counties and cities and about 100 events, and local schoolchildren took part in gathering and making fan-palm fans, blessing brooms and bamboo-and-rattan art.\n\nFollow-up exchange workshops invited community partners to discuss the festival’s imagination and difficulties.",
selfDesc:"The report says local schoolchildren took part in gathering and making (palm-leaf fans, blessing brooms, bamboo and rattan art), and the first edition spanned 5 counties and cities with about 100 events.",
pedagogicalInsight:"In a large arts festival, schoolchildren gathering and making local crafts such as fan-palm fans and blessing brooms is a way of handing Hakka village skills to the next generation. But the balance between artist-led work and children’s participation can differ greatly — a reminder that a big festival does not mean deep participation.",
why:"Verified: besides the NOWnews workshop report, Taiwan News (2019-10-19) covered the festival opening, corroborating the 2019 event across 10 townships on Highway 3, domestic and foreign artists and teams, and the Hakka theme; the artist count varies by source (NOWnews 70+, Taiwan News 50+), as noted."},
k23:{name:"Chenglong Wetlands Environmental Art Festival and Community Art Actions",creator:"Chenglong Community Development Association, Kouhu Township, Yunlin County (2025 organizer); resident artists include Li Kuei-chih, Tung Yu-hao and Chang Kuo-yao",place:"Chenglong Wetlands, Kouhu Township, Yunlin",year:"2022; 2025",
summary:"The Chenglong Wetland Environmental Arts Festival is held at the Chenglong Wetland in Kouhu Township, a wetland formed by land subsidence and seawater intrusion. In 2022 it returned after being suspended for two years, and in 2025 a three-week residency ran from 7 to 27 April.\n\nResidents, volunteers and resident artists co-created installations from local materials such as woven bamboo and driftwood, combined with performances and a market.\n\nIn 2025 the residency and volunteers completed four works together.",
selfDesc:"The report says the 2022 festival returned after a two-year pause; in 2025 the artists were in residence for three weeks, April 7–27, and finished four works with volunteers.",
pedagogicalInsight:"Residents, volunteers and resident artists making installations from woven bamboo and driftwood together is a typical “three-way co-making”; creating environmental art in a wetland flooded by subsidence and seawater intrusion puts the issue under people’s feet — a clear “from place” example.",
why:"Two independent reports document art activities and resident participation at Chenglong Wetlands."},
k24:{name:"Again: Chiayi Rural Art Actions",creator:"Curator Hsiang Chia-hung; in cooperation with community development associations, schools and cultural-history foundations",place:"Townships across Chiayi County (this year, townships in the Beigang River basin)",year:"Since 2022 (the report calls this year the fourth)",
summary:"Again: Chiayi Rural Art Action has run since 2022; the report calls this year its 4th, covering townships across Chiayi County (this year the townships of the Beigang River basin).\n\nArtists made repeated visits to rural Chiayi and co-created 13 works with residents aged 6 to 90, responding to local culture; most works respond to “ethnic groups and migration”, with mentions of Shanglin’s sugar-making memory and migrant workers.\n\nThe works will be shown at the 2026 Taiwan Lantern Festival.",
selfDesc:"The report says most works respond to \"ethnicity and migration,\" and mentions Shanglin's sugar-making memories and foreign migrant workers. The works will be shown at the 2026 Taiwan Lantern Festival.",
pedagogicalInsight:"Creating with residents aged 6 to 90 and responding to local memories of ethnic groups and migration shows what intergenerational co-making can be. But note that the source is a county-government advertorial with only positive claims, so the real depth of resident participation should be discounted.",
why:"Verified: the original Global Views piece was an advertorial and not independent; PTS 'Our Island' (2025-03-19) independently corroborates that the action was curated by Hsiang Chia-hung, with artists visiting Chiayi rural communities and co-creating with elders. The number of works varies by source (Global Views 13, PTS 17), as noted."},
