var TERMS_EN={
"ncaf":{short:"Definition: A foundation established in 1996 under the Culture and Arts Reward and Promotion Act, tasked with fostering a performance and exhibition environment, rewarding arts undertakings and raising the level of the arts; it is Taiwan's main funder of visual art and the sampling frame of the Lu Pei-yi study this platform's new terms draw on.",long:["Per the NCAF official site, the National Culture and Arts Foundation (NCAF) was formally established in January 1996, with the stated mission of 'fostering an environment favourable to arts work, rewarding arts undertakings and raising the level of the arts'; its work, under the Statute for the Establishment of the NCAF, covers guiding and running cultural and arts activities, sponsoring arts undertakings, funding arts workers, and carrying out the tasks set by the arts-reward act.","Its legal basis appears in Chapter 5 of the Culture and Arts Reward and Promotion Act: Article 24(1) provides that 'to guide and run cultural and arts activities and sponsor arts undertakings, the National Culture and Arts Foundation is established', and the Foundation is to award the National Awards for Arts, set the various reward and grant rules, and provide arts information and legal counsel; Article 25 lists the fund's sources as government budget, interest on the fund, donations from public and private bodies or individuals at home and abroad, and other income. (The platform read Chapter 5 of this Act; the 'Statute for the Establishment of the NCAF' cited by the Foundation's site was not separately read, so the duties here follow the former.)","For this platform, NCAF matters as the sampling frame of Lu Pei-yi's study 'Turning to Art/Society': it draws mainly on NCAF's fine-art grant lists (regular grants for creation, exhibition, survey research and publication), its curatorial project grants in visual art, and further on NCAF's 2007-2010 community research projects. The platform's terms 'art/society' and 'author/mediator/de-author' are largely distilled from these funded cases. This entry sits under 'Data and program terms' to explain the funding-body context, and does not tag individual cases."]},
"new-genre-public-art":{short:"Definition: An approach to public art that stresses community participation, people-centredness and process; the term comes from the 1995 book Mapping the Terrain: New Genre Public Art, which gathered art practices from the 1970s on.",long:["Per Lu Pei-yi's study 'Turning to Art/Society', the term New Genre Public Art comes from the 1995 book Mapping the Terrain: New Genre Public Art, which gathered practices from the 1970s onward and argued they already differed from earlier art in basic concept. Lu also cites the critic Suzi Gablik, who called the post-modernist, post-individualist mode of art 'Connective Aesthetics'; the backdrop is the 1990s US context, such as Chicago's 1993 'Culture in Action' event.","Lu lists New Genre Public Art alongside 'artistic intervention', 'community art', 'participatory art' and 'socially engaged art' as several names in Taiwan, from the late 1990s on, for one and the same wave of practice; together they stress publicness, participation, relationality, collaboration and process, and do not necessarily produce object-works or exhibitions.","The platform tags this term only where a source itself uses it; for finer distinctions see Participatory Art, Socially engaged art and Community art. This entry follows Lu Pei-yi's research project; the book title and names are as given there.","Li Kuei-pi's essay 'Socially Engaged Art' adds that Suzanne Lacy proposed a 'concentric circles' model of participation, distinguishing participants and audiences by depth of involvement; the essay places New Genre Public Art alongside Happenings, Fluxus, the Situationist International and British community art."]},
"relational-aesthetics":{short:"Definition: A concept proposed by the French critic Nicolas Bourriaud in 1998, treating works that 'build a relationship with the audience' as a distinct category of art and turning non-art social behaviour into a form of creation.",long:["Per Lu Pei-yi's study, the French critic Nicolas Bourriaud, through exhibitions and writing in the mid-1990s and his 1998 book Relational Aesthetics, set off this wave of practice. Such works, which build a relationship with the audience, are treated as a distinct category of art; the governing mood is a 'shared feast', 'everyone join in', turning non-art social behaviour into a form of creation, with the participation of 'people' making social behaviour flicker with meaning.","Lu places relational aesthetics in the European lineage of socially engaged art, alongside the history traced by the British critic and scholar Claire Bishop, who takes this imagining and experiment on 'art and society' back to 1920s modernism (Futurism, Dada) and to the Happenings, Fluxus and Situationist International of the late 1960s and 1970s.","This entry follows Lu Pei-yi's research project; the platform has not read Bourriaud's or Bishop's originals directly, and relays the concepts as given there.","Pablo Helguera, in Education for Socially Engaged Art, also treats 'relational aesthetics' as a forerunner of the later term 'social practice': unlike 'social practice', which drops the word 'art', 'relational aesthetics' kept the word 'aesthetics' at its origin."]},
"artist-roles":{short:"Definition: Lu Pei-yi's three roles for the artist's position in socially engaged art — the artist as subject ('authorship'), as a transforming interface ('mediator'), and stepping back ('de-author').",long:["In 'Turning to Art/Society', Lu Pei-yi argues that after 2000 the artist's role in Taiwan's socially engaged art can be divided into three: the artist as subject (authorship), the artist as a transforming interface (mediator), and the artist stepping back (de-author). This division matches her other claim — the turn from 'art \u2194 society' to 'art/society'.","'Authorship' means the artist, with a sharp eye, produces a distanced critique of society at large. 'Mediator' means the artist ingeniously converts things from within the system's mechanisms, becoming an exchange platform and using win-win strategies to broker cooperation between parties of different fields or positions, while still asserting an artist identity and relying on and appropriating the art apparatus; Lu cites Chou Yu-cheng and Huang Po-chih (e.g. Chou's TOA Lighting and Hong's Paint, 2011, which turn sponsors' donated lamps and paint into museum resources as a 'feedback' mechanism). The curator Amy Cheng likewise calls artistic creation 'a kind of pioneering mediation, with the artist as a mediator'. 'De-author' means the artist recedes into the background.","This entry follows Lu Pei-yi's research project; the artists cited (Chou Yu-cheng, Huang Po-chih and others) are not yet individually included as platform cases, and will be added after case-by-case verification."]},
"art-society-turn":{short:"Definition: A conceptual shift Lu Pei-yi proposes — the relation of art and society moves from 'art \u2194 society', which treats the two as separate and in exchange, to 'art/society', which sees art as part of the inside of society.",long:["Lu Pei-yi holds that after 2000 Taiwan's socially engaged art enlarged its imagining of 'art and society', turning from 'art \u2194 society' to 'art/society'. The former treats art and society as two separate domains that then exchange; the latter holds that art is not outside society but within it.","She cites Huang Sun-quan's reply in his Artco column: 'whether we care about society, or how, is a false question — no one can be outside society', arguing that to presuppose a divide between society and art is merely rhetoric masking powerlessness. Lu also sketches the axis through Taiwan's changing vocabulary: 'art goes to the countryside' in the early 1990s, 'intervention' in the late 1990s, 'participation' after 2000, up to the 2006 Tropic of Cancer Environmental Art Action asking how to connect with residents of remote communities.","This entry follows Lu Pei-yi's research project; the platform has not read Huang Sun-quan's column directly, and relays it as given there."]},
"servo-motor":{short:"Definition: A metaphor the critic Chen Tai-song uses for the artist's social role — the artist as operator of a 'device' that intervenes in the workings of the social system, so as to create new social relations.",long:["Per Lu Pei-yi's study, at a 2010 Taishin forum Chen Tai-song cast the artist as 'society's go-between', asking 'how does the artist engage society through creative practice?', and saw the artist as the operator of a 'Servo Motor'.","'Servo Motor' originally names a servomotor; it is extended here to a device that intervenes in the workings of the social system, with the artist as the one who operates it and can thereby create new social relations. The metaphor echoes Lu's notion of the 'mediator', both placing the artist inside society as an operator who brings about change.","This entry follows Lu Pei-yi's research project; Chen Tai-song's formulation comes from the feature 'The Artist: Society's Go-Between' (Artco, 2010), which the platform has not read directly, relayed here as given by Lu."]},
"sensory-field":{short:"Definition: A phrase by the artist Chen Chieh-jen that takes 'the impossible' as the starting point of imagination, creation and action, used to ask how an artist within society differs from everyone else in it.",long:["Discussing 'no one can be outside society' and art's place within society, Lu Pei-yi cites the 'field of the sensible' mentioned by the artist Chen Chieh-jen: 'the impossible is precisely the beginning of imagination and creation, and the beginning of action and practice'.","The phrase answers a question: if no one can stand outside society, how does an artist within it differ from everyone else? The 'field of the sensible' flips the seemingly 'impossible' into a starting point for imagination and action, echoing socially engaged art's stress on process, relationship and intervening in reality.","This entry follows Lu Pei-yi's research project; the source of Chen Chieh-jen's original wording was not read directly, and it is relayed as given there."]},
"homeless":{short:"People sleeping rough or without stable housing. Current law mostly uses the word youmin (vagrants); civil-society groups campaign to rename them wujiazhe (homeless people), a wider term. Taiwan still has no dedicated law defining the group.",long:["On terminology, CNA (2024-01-20) notes that homeless person (wujiazhe), street friend (jieyou), cold-and-poor (hanshi) and urban wanderer are all synonyms for youmin (vagrant). Government and current statutes (the Social Assistance Act and local vagrant shelter-and-guidance ordinances) mostly keep the word youmin; civil-society groups such as Homeless Taiwan (Mangcao Xin) campaign to rename them wujiazhe (homeless people), to remove stigma and widen the definition beyond those literally sleeping on the street.", "Per Yam News (2026-06-17), Wang Jin-wei of Homeless Taiwan outlined a draft Homeless Rights Act under discussion that would widen homeless to five groups: people sleeping on the street or in public places; people living in places unfit for habitation; people housed in shelters; people who will be forced to leave within 14 days with no alternative; and people forced to flee domestic or other violence with no alternative — also covering the housing-insecure who long depend on friends or relatives or move constantly. The report stresses the causes are not merely individual: abused women\u2019s hidden homelessness, rental-market discrimination, uneven shelter resources between cities and counties, and long social-housing waits. Huang Ke-xian (NTU sociology) argues Taiwan has long treated homelessness as a welfare problem rather than a housing one.", "Among the platform\u2019s cases, Poor People\u2019s Taipei (K65), run by the Poverty Solidarity alliance since 2017, lets homeless people and others with experience of poverty speak of their own Taipei as creators; A Wanhua Walk for Ordinary People (K63) includes Homeless Taiwan\u2019s cardboard-box creations.", "A caveat: Taiwan still has no dedicated law defining homeless; the five-group draft above is at the advocacy stage (the two-covenants review once asked the government to pass a dedicated act within a year). Official counts of registered vagrants from the Ministry of Health and Welfare or the counties were not obtained from a readable official page this time, and are not included."]},
"transitional-justice":{short:"The authoritarian period runs from 15 Aug 1945 to 6 Nov 1992; transitional justice is the post-democratization work of redressing the state\u2019s past large-scale human-rights violations. White Terror is the common name for the political persecution of that era.",long:["Per the Executive Yuan Transitional Justice Board\u2019s Q&A (citing Article 3(1) of the Act on Promoting Transitional Justice), the authoritarian period runs from 15 Aug 1945 to 6 Nov 1992 — the day before martial law was lifted in Kinmen, Matsu and the Dongsha and Nansha areas. Transitional justice, per the Executive Yuan\u2019s human-rights site (citing the UN), is a state\u2019s acknowledgement and redress, as it ends authoritarian rule and moves toward democracy and peace, of past large-scale human-rights injustices; recent UN reports set out five pillars: truth, justice, reparation, guarantees of non-recurrence, and memorialization.", "Under the Act the government divides the work among agencies: opening political archives (National Development Council), dealing with authoritarian symbols (Ministry of the Interior), preserving sites of injustice (Ministry of Culture), redressing judicial and administrative wrongs (Ministry of Justice), healing the trauma of victims and their families (Ministry of Health and Welfare), transitional-justice education (Ministry of Education), and investigating and handling ill-gotten party assets (Ill-gotten Party Assets Settlement Committee). A site of injustice, per Article 5(2), is a place where the rulers committed large-scale human-rights violations during the authoritarian period.", "White Terror is the common name for the political persecution of that authoritarian era — the arrest, trial, imprisonment and execution of political prisoners and dissidents; it is the platform\u2019s shorthand, not a legal term. Green Island is one of the best-known sites of injustice, home to the White Terror Green Island Memorial Park (run by the National Human Rights Museum under the Ministry of Culture). Among the platform\u2019s cases, Memory on the Margins — the TNUA special exhibition at the 2020 Green Island Human Rights Art Festival (K64) is a collaboration between TNUA and the National Human Rights Museum, in which students first learn the White Terror and transitional-justice context through a memory-politics-and-artistic-intervention course, then create on-site at the Green Island memorial park.", "A caveat: the dates of the authoritarian period and the agency responsibilities here are drawn from two Executive Yuan official pages; the full article-by-article text of the Act on Promoting Transitional Justice was not separately read this time, so please refer to the current text in the national Laws & Regulations Database."]},
"participatory-art":{short:"Definition: Art in which the audience's or public's intervention and interaction themselves constitute the work, turning viewers from onlookers into the artist's collaborators.",long:["Per Cheng Lin-chia in Modern Art no.177, Participatory Art refers to art formed through public intervention and interaction. The critic Lori Waxman argues that once a work brings in audience participation, the audience are no longer onlookers but the artist's collaborators. The article takes Rirkrit Tiravanija's cooking-and-sharing work at the 1993 Venice Biennale (Aperto 93), which breaks distance and invites viewers in, as a signature example.","Its backdrop is a shift in the contemporary-art question from what is art to where is art: art moves out of the museum white cube into the space of life, the maker shifts from artist to an audience community, and the work becomes a participable event; the subject of art enters intersubjectivity, drawing social, cultural, gender and community issues into itself. Its lineage runs from Dada and Duchamp dissolving the line between art and life to Joseph Beuys's social sculpture and everyone-is-an-artist; in Taiwan it is tied to the 2002 revision of the Culture and Arts Reward Act, public-art commissioning and the promotion of citizen aesthetics.","It overlaps heavily with socially engaged art, community art, New Genre Public Art and Conversation Pieces; most of the platform cases with resident co-creation can be read as its practice. The article also warns of two risks: people may become mere helpers finishing the artist's work, or fall into participation for participation's sake - over-stressing formal interaction can push people back into a passive, receiving role, an interpassive paradox between art and viewer. This entry follows that article."]},
"peoples-theatre":{short:"Definition: A participatory theatre approach descended from Brazil's Augusto Boal that breaks the line between stage and audience and turns people into actors.",long:["Per Yu Shan-lu in Aesthetic Education no.188, the Theatre of the Oppressed was developed by Brazil's Augusto Boal (1931-2009), who called for tearing down three walls - between stage and auditorium, between dramatic scene and real life, and between artist and non-artist - so that everyone can use the power of theatre and become the master of their own life. Its best-known form, Forum Theatre, turns social and political issues into a play in which spectators come on stage to rewrite the plot and rehearse solutions together. Boal's Theatre of the Oppressed has influenced the world since the 1970s.","In Taiwan this lineage is usually called People's Theatre. The same article notes Chung Chiao as a People's Theatre practitioner who, from the mid-1990s, focused on migrant workers, global capital and social reform and worked with Asian People's Theatre groups (Chung is the artistic director of Assignment Theatre). Among the platform's cases, Shigang Mama Theatre (K51) was mentored into being by Assignment Theatre through People's Theatre workshops after the 921 earthquake. People's Theatre is close to but distinct from community theatre: community theatre centres on using theatre to bond a specific community, while People's Theatre stresses starting from conditions of oppression and using drama as collective action and empowerment. This entry follows Aesthetic Education no.188."]},
"coming-of-age":{short:"Tainan's distinctive coming-of-age rite: at sixteen, youths give thanks to the Seven Goddesses, marking adulthood.",long:["Per CNA, 'doing sixteen' is a coming-of-age rite distinctive to the old city of Tainan, handed down from the Qing-era Wutiaogang port district: child workers there earned half an adult's wage and could draw a full wage only at sixteen, so families would hold a banquet for the foreman and relatives. At the rite sixteen-year-olds give thanks to the Seven Goddesses (Qiniangma); the main temples are Kailong Temple and Linshui Furen Temple, with the rite mostly held at Kailong Temple, and the city government later grew it into a city-wide event.","In the platform's cases, the Sixteen Coming-of-Age Youth Arts Festival (K50) turns this local rite into an annual summer youth arts festival and collective-creation theatre. This entry follows CNA."]},
"shetou":{short:"In Daxi's deity-procession festival, performance troupes that residents form by trade or locality, each with its own art-array style.",long:["The Daxi Daxi official site explains that a 'shetou' is a self-organised procession troupe, often formed by shared trade or locality, so each troupe's art-array has its own style; examples tied to occupations include the ox-plough, ink-line and plasterer-boy troupes, and the festival also features lead banners, dragon and lion dances, child figures, beiguan music and the shen-jiang generals.","Among the platform's cases, Daxi Daxi (K48) centres on the birthday procession of Lord Guan at Puji Temple, with shetou, temple staff and residents as its core; the 2026 edition had 32 shetou. The shetou are key to reading this case's 'resident participation' — the unit of participation is not the individual but an existing local group."]},
"site-specific":{short:"Art made for one particular place and inseparable from it; move it elsewhere and the meaning changes.",long:["ArtLex defines site-specific art as \"a type of artistic intervention specifically conceived for a precise location and that interacts with it\", its meaning tied to that place. The site can be urban, rural, or inside a museum or gallery, and the term covers land art (e.g. Smithson's Spiral Jetty), installations made for a gallery (e.g. Turrell, Flavin) and public commissions (e.g. Serra's Tilted Arc). So site-specific work does not require a historical or military setting.","Among the platform's cases, the Veterans' Home art museum (K37), Matsu International Art Island (K46), Making the Village Together (K44) and Second Village Opens (K45) all treat a particular site as an inseparable part of the work. The teaching method 'Working inside historical sites and military remains' is one educational application of site-specificity to memory-laden places, not a separate art form. This entry follows ArtLex."]},
"battlefield-admin":{short:"The military-rule system imposed on Kinmen and Matsu during the Cold War, under which the military ran civil administration; lifted in 1992.",long:["According to The News Lens, Kinmen entered the battlefield-administration system in 1956, and military rule over Kinmen and Matsu was lifted on 7 November 1992; during the controlled period ordinary people could hardly travel freely to the islands, and entry controls were abolished only after the 1994 amendment of the relevant act.","Under battlefield administration the military ran local civil affairs and residents' lives were considerably restricted. The general definition here is the platform's summary, not quoted from statute. Matsu International Art Island (K46) is a case of reopening once-sealed strongpoints, bunkers and bomb shelters as spaces for creation after military rule ended, addressing everyday memory hidden during that period."]},
"eastern-min":{short:"The local language of Matsu, a form of Eastern Min; now part of the national mother-tongue curriculum.",long:["The National Academy for Educational Research's course handbook for Eastern Min shows it has been incorporated into the mother-tongue strand of the 12-year basic-education curriculum, in effect from the 2022 school year. This reflects an institutionalised language revival for Eastern Min (the Matsu dialect).","One of the core issues of Matsu International Art Island (K46) is Eastern Min culture and language revival amid depopulation; reports note the project worked with local groups such as the Matsu Youth Development Association. The definition here is the platform's summary; the curriculum information follows the NAER handbook."]},
"issue-art":{short:"Definition: Art or projects defined by, and starting from, a specific social issue rather than by style or medium.",long:["On this platform, issue-based art means works or projects that begin with a concrete social issue, such as environment, village relocation, migrant workers or social housing, rather than being classified by style or medium. It includes projects with residents' participation as well as individual works on an issue.","This is a working definition adopted by the platform to collect cases. In the art-education literature the English term 'issues-based art education' has an established definition (see below), though the Chinese label is looser as a general term. A closely related term often used in Taiwanese scholarship is \"art intervention.\" One study notes that its use rests on vague consensus and is not quite the same as socially engaged art.","In art education this approach has a firmer scholarly basis. Deborah Smith-Shank, in the International Journal of Arts Education (2011), describes issue-based art education as an interdisciplinary method: the teacher first raises an important social issue familiar to students (ecology, peace, nuclear power - or, for younger pupils, why breakfast matters or why toys are gendered), then lets students investigate it themselves through many routes such as geography, history and science - there is no preset procedure, and the process itself is how they learn to make, discuss and critique the world. She argues for grounding it in material culture: breaking down the hierarchy between art and craft, high and low, and having students decode and encode the objects around them from their own geography, gender and class. It foregrounds identity and the often-ignored voices of women and the marginalized, asking: why is this important, who says so, where are those voices, and whose interests it serves. It is rich but risky - the teacher does not hold all the answers, but inquires alongside the students.","In the international art-education literature the approach is well defined. Atkinson (2004) calls issues-based art education 'a form of pedagogy and practice in which pupils explore social, cultural, and personal issues through art action', a strand of postmodern art education that shifts emphasis from form to content tied to contemporary life. Li (2018), in a middle-school class on racial issues, models a concrete sequence: open with contemporary or activist artwork; ask open questions (what do you see? why did the artist draw this, or choose this color or font size?) instead of giving answers early; let students make their own activist posters rather than copying the artists; and close with a gallery walk, sticky-note peer comments and sharing of the making process, reminding everyone to respect differing views."]},
"sea":{short:"Definition: Art practice that treats the real participation of people and communities as part of the work, through collaboration and interaction, where process often matters as much as the result.",long:["Tate's art terms entry says this kind of practice is collaborative, often participatory, and involves people as the medium or material of the work. Any art form that involves discussion, collaboration or social interaction with people and communities can fall under it. Making together can matter as much as the work itself, and artists often need to be embedded in a community for a long time.","In Taiwan, one study describes it as a trend since the late 1990s, resonating with post-martial-law local identity and community building. Another study cautions that the common term \"art intervention\" is not quite the same: socially engaged art puts more emphasis on discussion and interaction between people and communities.","In art education, socially engaged art has also grown into a teaching approach. Chung and Li (2020), citing Schlemmer and colleagues, describe socially engaged art activities as ones that 'stretch beyond the production of aesthetically pleasing art objects to foster a dialog that integrates artistic practices, pedagogical processes, and creative possibilities in pursuit of a more equitable world'; it is often paired with 'social justice art education', which encourages students to start from their own identities and experiences, investigate unjust social conditions and imagine a fairer society through art. Their article has elementary students learn about homelessness through the street artist Skid Robot's work and then 'draw a home' for homeless people through printmaking.","In Education for Socially Engaged Art (Chinese ed. trans. Wu Dai-Rong and Su Yao-Hua, TNUA, 2018), Chapter 1 'Definition', Pablo Helguera offers a 'provisional definition': all art is made to communicate and is therefore 'social', but the key to socially engaged art is actual 'social intercourse'. He distinguishes 'symbolic' from 'actual' practice - socially engaged art rests on actual (not imagined or assumed) social action - and draws on Jurgen Habermas's communicative action (The Theory of Communicative Action, 1981); he also lists relational aesthetics, community art, collaborative art, participatory art, dialogic art and public art as several names for this wave of practice."]},
"community-art":{short:"Definition: Art activities carried out within a particular community, interacting with or made together with its residents.",long:["Tate describes community art as art activity based in a community setting and designed to interact or engage with the community. It lists it as a concept related to, but not the same as, socially engaged practice.","In Taiwan, community art is often mentioned together with \"community building,\" a policy promoted by the Council for Cultural Affairs from 1994 that hopes residents will solve everyday problems together and strengthen ties, with culture and art playing an important role. The platform labels projects whose main participants are community residents as community art."]},
"public-art":{short:"Definition: Art placed in public space for the public; in Taiwan, public buildings and major public works are required by law to commission it.",long:["Taiwan's public art has a legal basis. Article 15 of the Act for the Development of Cultural and Artistic Activities says the agencies that build public buildings and major public works shall carry out public art, and spend no less than one percent of the construction cost on it (per the version amended in 2021).","Under the Regulations for Public Art Installation, an installation plan must include a public participation plan, and open selection may be used. More broadly, Tate simply describes public art as art in the public realm, so not all art in public space falls under this law."]},
"art-ed":{short:"Definition: Education that cultivates aesthetic sense, expression and understanding through learning and making art, often in schools or communities.",long:["The Ministry of Education more often uses \"aesthetic education\" and describes it as practice that cultivates aesthetic literacy, guiding learners to notice, explore, feel, know and practice beauty. The plan does not define \"arts education\" on its own, but quotes a 2019 declaration of the World Alliance for Arts Education that arts education is an important pillar for sustainable cultural development.","On this platform, projects whose main participants are students or learners and whose purpose includes learning and aesthetic development are labeled arts education, such as Guantian Has Monsters with junior high students and the Good Times podcast."]},
"pedagogical-art":{short:"Definition: An art project that treats teaching and the educational process itself as its medium and form.",long:["Among the platform's cases, Yijia Art Museum is an example. A 2022 review on the GPI government publications site calls Wu Dai-rong's book When Teaching Becomes Form the story of \"an educational art project\"; it says the project is a partnership between the Graduate Institute of Arts and Humanities Education at Taipei National University of the Arts and the Taipei Honor Home for Veterans, with participants including enrolled students, artist-teachers, and the veteran residents and administrative staff of the home. The team's own website says it is a teaching-and-creating project tied to an elective course.","There are comparable discussions internationally. The announcement of Curating and the Educational Turn, edited by Paul O'Neill and Mick Wilson, describes the recent incorporation of pedagogy into art and curatorial practice as art's paradigmatic re-orientation towards the educational. The description of Claire Bishop's Artificial Hells says the book ends with long-term educational projects by contemporary artists, citing Thomas Hirschhorn, Tania Bruguera, Pawel Althamer and Paul Chan.","Platform note: no Chinese or English source was found that formally defines this term or \"pedagogical art project\"; the entry is an editorial summary, and the English is the platform's own rendering, not a phrase used verbatim by a source. The distinction from arts education is also the platform's judgment: arts education aims at learning and cultivating aesthetic sensibility, while a pedagogical art project treats the teaching process as part of the work; in practice they often overlap, and Yijia Art Museum is both a course and a creative project."]},
"curation":{short:"Definition: The work of planning an exhibition - setting its theme, selecting works and arranging how they are interpreted and shown.",long:["An ART.ZIP article notes that \"curator\" comes from the Latin cura, meaning care, and later came to mean the person who looks after collections, researches and plans exhibitions. In contemporary art, a curator's work includes planning exhibitions, managing budgets and schedules, negotiating loans, research and writing, and curators have been likened to \"translators\" between the art world and the public.","The platform labels projects presented as exhibitions and planned by a curatorial team as \"curation & exhibitions.\" Guantian Has Monsters is one example: the Liberty Times calls it a curated show planned by a team from the art history department at Tainan National University of the Arts."]},
"festival":{short:"Definition: An arts event that concentrates performances, workshops and activities within a set period, often staged in a particular place.",long:["One Taiwanese study notes that local art festivals keep letting participants rediscover the people and environment of a place and rebuild its cultural history. Another thesis discusses arts festivals together with cultural exchange and arts education.","The platform groups festivals with residencies because the two often appear together in cases, for example the Romantic Route 3 Art Festival and the Chenglong Wetlands Environmental Art Festival."]},
"residency":{short:"Definition: An arrangement in which an artist stays in a place for a period to research and create there.",long:["A residency has an artist stay in a place for a period to research and create. In the Goethe-Institut Taipei program, for example, artists can reside for up to three months to do artistic research, create new work and foster exchange between the two cities.","In issue-based projects, residencies often give artists time to get to know a place and its residents before creating. Cases the platform labels this way include the Bu Long Project (three young Indigenous artists in residence in Qingpu) and the ADAM Artists' Laboratory."]},
"co-creation":{short:"Artists and participants decide on and complete the work together, rather than the artist creating alone.",long:["Co-creation means the work is conceived and made by the artist and participants together, sometimes with a shared say in direction. The degree varies a lot: in some projects residents merely provide objects or stories, in others they take part in decisions.","The platform reminds readers that a report saying \"residents took part\" does not necessarily mean \"shared decision-making.\" That is why some case notes say the residents' role in decisions is not stated in the report."]},
"fieldwork":{short:"Going to the site and gathering data directly through observation, interviews and similar means.",long:["Fieldwork is the process of observing and collecting data about people, cultures and natural environments in real settings, rather than in a lab or classroom.","The platform's planned in-depth reporting is based on field interviews, recording how a project formed, who collaborated and what difficulties arose. Some cases also did field research before the show, such as the Jalan-Jalan special exhibition."]},
"oral-history":{short:"Asking people to tell their own experiences and recording them, so ordinary people's memories become historical material.",long:["Oral history is a research method in history and the social sciences. An interviewer and a narrator usually sit down to talk, and the narrator's life story or memory of an event is recorded and preserved. It is people-centered, letting groups less often written about, such as Indigenous peoples, women, migrants and workers, tell their own pasts.","Many cases use residents' spoken accounts as material, for example Hou Shu-tzu's Kaohsiung Military Dependents' Village Trilogy, built around Grandma Liu's account, and the Guangci social housing works drawn from residents' dreams told in interviews."]},
"photovoice":{short:"A method where participants photograph their own lives, then discuss and speak out together.",long:["Photovoice is a participatory qualitative research method formally proposed by Caroline Wang and Mary Ann Burris in 1997. Participants photograph their lives around a theme, choose photos and write captions through group discussion, and present results as an exhibition or report. The aim is to let communities record and reflect on their strengths and concerns and convey them to policy makers.","Per the report, the Sundays Unseen migrant photography award is based on Photovoice theory; the photographers decide what to shoot and how they want outsiders to understand them."]},
"lumbung":{short:"An Indonesian concept: a community pools its harvest and distributes it by shared decision.",long:["Lumbung literally means \"rice barn,\" from the collective buildings of Indonesian villages where a community stores its harvest and distributes it by commonly agreed standards as a shared resource for the future. documenta fifteen, whose artistic direction was held by the Indonesian collective ruangrupa, took this as its starting point; its core principles include collectivity, resource accumulation and fair distribution.","The report on Damp Palimpsest (Keelung) says the team used the Lumbung approach, sharing local cultural material and field experience with the creators."]},
"art-to-village":{short:"Bringing art activities to townships and rural areas. \"Yishu xiaxiang\" is common in county-government touring programmes; \"Yishu jinxiang\" is the name of a project at Tainan National University of the Arts.",long:["\"Yishu xiaxiang\" (art to the countryside) is still used in local-government touring programmes. For example, Miaoli County Government has run it since the 2019 school year, mainly with students and cross-school cooperation; in 2026 the first session was held at Yuanli Elementary School, with teachers and students from 11 schools performing and the community and parents invited (China Times report). The National Culture and Arts Foundation's grant archive also lists projects named \"Yishu xiaxiang\"; for example, in 2019 (ROC year 108) Taiwan Ballet Company gave demonstration lessons and performances at several elementary and junior high schools in Taitung County, aiming to narrow the urban–rural arts gap and to show that ballet need not be seen only in a theatre. Taitung County Government's Cultural Affairs Department also runs a series called \"Yishu xiaxiang\", including courtyard sharing sessions \"Yi Qi Lai Wo Jia\", performing-arts tours and a mobile art museum; its director says the aim is to realize the arts-equity policy of the county magistrate, narrow the urban–rural cultural gap and give local groups a stage (a 2022 sponsored feature on Commonwealth Magazine's Smile Taiwan, marked at the end \"Taitung County Government advertisement\", i.e. an advertorial from the county's viewpoint, not an independent source).","\"Yishu jinxiang\" (Art Goes to the Countryside) has so far been found only as a project name, not a general term. According to the Tainan National University of the Arts e-newsletter, it is part of the \"Innovation and Reversal of Good Art in Old Rural Areas\" project, under the \"social responsibility\" strand of the Ministry of Education's Higher Education Sprout Project, taught by Hsu Yuan-ta of the art history department. In Guantian Has Monsters, university students led Guantian Junior High students to learn the pond legends and draw characters, which were then placed in an exhibition.","Note from the platform: none of the sources consulted gives a formal definition of \"xiaxiang\" or explains how it differs from \"jinxiang\" (the Taitung department's account only states the rationale of its own programme); which is more common and whether they carry different connotations cannot be confirmed from sources, so no conclusion is drawn here. Scholarship more often uses \"art intervention\"; Chang Ching-wen notes that Taiwan's \"intervention\" is not completely equivalent to socially engaged practice."]},
"outreach":{short:"Bringing art to more of the general public and widening chances to encounter it. Common in Taiwan's laws and funding, but none of the laws found defines it separately.",long:["\"Promotion\" (tuiguang) is a common word in Taiwan's laws. The Act for the Development of Cultural and Artistic Activities lists the \"creation, presentation and promotion\" of culture and the arts as part of its scope and lets the competent authorities reward or subsidise \"creation, development and promotion\"; the text uses the word without defining it (version amended in 2021). The Ministry of Education's Regulations on Arts Promotion Education in Schools, Article 2, says schools may run arts promotion education for the public \"to broaden the audience for art and raise artistic literacy\"; this is the closest statement of purpose found, but it is not a definition either.","In policy the word mostly means getting works or companies in front of audiences. For example, the Ministry of Culture's 2024 \"Art into Schools\" subsidy lets arts groups apply to enter schools; PTS News describes this as promotion and notes that groups want the funding to continue so promotion and transmission last. The report gives no definition.","Platform note: no source explains how arts outreach differs from arts education or \"art to the countryside,\" and in practice they overlap (Taiwan Ballet's project title, for instance, contains both 'art to the countryside' and 'arts promotion'). The following is only the platform's working distinction, not a claim from the sources: outreach stresses letting more people encounter works, while participatory art stresses residents taking part in making them. Readers should judge whether it fits."]},
"land-art":{short:"An art festival that sets works in the countryside and local life and works with residents over the long term.",long:["The best-known example is Japan's Echigo-Tsumari Art Triennale, planned by artistic director Fram Kitagawa since 2000 and held every three years. Many works are made on site, and some artists use disused schools and empty houses. Kitagawa hoped art could bring energy to forgotten villages, so he has long communicated with residents.","Note that \"land art festival\" is not quite the same as the English term land art; this entry means the former. One case in the directory uses this term directly: the 2026 Mattauw Land Art Season in Guantian, Tainan (K32), currently marked as pending verification."]},
"empowerment":{short:"Helping people or communities gradually gain the ability to raise and solve problems themselves.",long:["One study explains empowerment as a community gradually gaining the ability to solve or improve its own environmental problems through a complete support system and process. At the community level, it stresses communities proposing and handling things themselves rather than being directed from above.","Whether empowerment is truly achieved is hard to measure. The Futurists review, for example, questions whether measuring community empowerment by KPIs is appropriate."]},
"social-housing":{short:"Housing built by government or with government incentives, for rent only.",long:["Under Article 3, item 2 of the Housing Act, social housing means \"housing and necessary ancillary facilities built by the government or by private parties with incentives, solely for rent\" (version amended March 4, 2026).","Social housing is often a site for issue-based art because residents come from different backgrounds and need to build relationships. Guangci Social Housing and The Futurists (Taichung social housing) in the directory both took place in social housing."]},
"public-housing":{short:"Housing the government built for low-income households; Taipei's Ankang is the largest in Taiwan.",long:["According to The Reporter's long feature, pingzhai is housing the government built for low-income households. Taipei's Ankang public housing was built in 1975 with 1,020 units, the largest such estate in Taiwan; in the same year it also housed a group of Vietnamese refugees.","The report also describes long-standing stigma, with residents sometimes reluctant to say where they live. In 2012–2013 the city settled on a plan to rebuild it in three phases as Xinglong Public Housing. \"Freedom of Movement\" was an exhibition held before residents moved out."]},
"juancun":{short:"Neighborhoods where military personnel and their families lived; many old ones have been rebuilt under a special act.",long:["Article 1 of the Act for Rebuilding Old Military Dependents' Villages states its purposes, including speeding up the renewal of old villages, building housing for original residents and low- and middle-income households, and \"preserving military dependents' village culture\" (2007 amendment gazette). So these villages are both old neighborhoods to be rebuilt and a culture seen as worth preserving.","The basic definition here is an editorial summary, not a quoted legal definition. Hou Shu-tzu's Kaohsiung trilogy (K08) uses residents' oral accounts to record life and memories of displacement during rebuilding and demolition, while Making the Village Together (K44) and Second Village Opens (K45) turn village remains into spaces for creation and performance."]},
"veterans":{short:"A common term for retired and discharged military personnel; policy is handled by the Veterans Affairs Council, and public discussion often turns to elder care and identity.",long:["The Veterans Affairs Council's 2020 administrative plan divides services for veterans into study, employment, medical care, residential and elder care, and welfare outreach; the people it names for outreach include elderly, living-alone and disadvantaged veterans and survivors, and it promotes long-term care and dementia beds in veterans' homes. It plans to house 36,015 veterans on fully public-funded residential care and also mentions 193,108 people receiving retirement pay or living allowances; the two figures cover different groups and cannot be added, and the document does not give the total number of veterans.","On identity, a research report by Liao Yuan-hao at National Chengchi University approaches it through law; its abstract says veterans from China went through changing identities, from \"temporary residents to rooted settlers\" and \"from outsiders to nationals\", and the English abstract notes that some felt treated like aliens amid localization and de-sinicization. Only the abstract was read; the report body could not be confirmed.","Platform note: \"rongmin\" here is an editorial term without a quoted legal definition; the platform also does not treat it as a single issue but as a group, with related cases tagged under the issue \"Identity & historical memory,\" such as Yijia Art Museum."]},
"ecomuseum":{short:"An interdisciplinary museum that presents the history and heritage of a particular community or region in the context of its society, culture and natural environment.",long:["The Academia Sinica AAT-Taiwan thesaurus describes the term as \"interdisciplinary museums that present the history and heritage of a particular community or region in the context of its society, culture, and natural environment.\" Its sources include Taiwan's National Academy for Educational Research terminology bank.","Among the platform's cases, the Yijia Art Museum project envisions turning the veterans' home into a \"conceptual ecomuseum\", and the GPI review says the project turns the Taipei Honor Home for Veterans into such a space on International Museum Day each year. The cases' sources do not explain the term; the definition above was found separately by the platform, and readers should judge whether Yijia fully fits it."]},
"installation":{short:"Large-scale, mixed-media work, often made for a specific place or time, in which the whole space is the work.",long:["Tate's art terms describe installation art as \"large-scale, mixed-media constructions, often designed for a specific place or for a temporary period of time.\" Tate adds that it is a complete unified experience rather than a display of separate artworks, and that such works are sometimes called \"environments.\"","In the platform's \"art form\" filter, installation is one of the most common forms; cases are mostly made in community or public spaces or galleries from found objects, recycled materials or objects residents provide. Here it is only a form label and does not mean residents took part in making the work."]},
"sound-art":{short:"Art that uses sound as both its medium and its subject.",long:["Tate's art terms define sound art as \"Art which uses sound both as its medium (what it is made out of) and as its subject (what it is about).\" Tate traces it back to Luigi Russolo's \"noise machines\" in the early twentieth century and John Cage's 4'33'' in 1952.","In the platform's cases, sound is mostly combined with fieldwork, oral interviews or landscape, for example Voices and Elephants, which turns sound recording and a pipe-based sound installation into a portrait of Chenggong's coast and harbour. Here \"sound\" is a form label; not every case fits what Tate calls sound art."]},
"aerocene":{short:"A project started by artist Tomás Saraceno, centred on floating sculptures that do not rely on helium, batteries or solar panels.",long:["An MIT Arts feature describes Aerocene's works as \"emission-free floating sculptures,\" made of silver and transparent Mylar and designed to travel around the earth without helium, batteries or solar panels, gliding on wind currents and kept afloat by solar and infrared radiation. The initiator is artist Tomás Saraceno, with collaborators including an MIT meteorologist and a researcher; in August 2015 the team tested in the Solomon Islands, and in December the work was shown during the COP21 climate summit in Paris.","In Taiwan, Co-Weaving Universe (K17) is the local version of this project. K17's sources say the work belongs to the artist's Aerocene project and that the Taiwan version includes works by Taiwanese participants. The MIT feature does not say whether the project is open source, so the platform does not state it."]},
"cultural-equity":{short:"Guaranteeing everyone equal participation in culture, without differences by status, region, age or other conditions.",long:["Article 1 of the Ministry of Culture's guidelines on subsidies for promoting cultural equity states its purpose as promoting and guaranteeing equal cultural participation and access, \"ensuring people are not treated differently because of particular status, social or gender position, physical or mental condition, age, region, ethnicity or other conditions.\" This is the closest thing to a definition; the guidelines themselves do not define the term separately.","The term also appears around \"art to the countryside\": for example, Taitung County's Cultural Affairs Department says its activities put into practice the county magistrate's \"equal access to arts and culture\" and narrow the urban-rural gap, but that source is a county-government advertorial. The guidelines file is a PDF reposted on a Taichung City Government site, not on the Ministry's own."]},
"quake921":{short:"The major earthquake that struck central Taiwan on September 21, 1999.",long:["The 921 Earthquake Museum of Taiwan's introduction, run by the National Museum of Natural Science, says the earthquake occurred at 1:47 a.m. on September 21, 1999, with Richter magnitude 7.3, killing over 2,400 people and collapsing tens of thousands of buildings. The historical-image platform of the Ministry of Agriculture's Rural Development and Soil and Water Conservation Agency adds that the epicentre was in Jiji, Nantou (hence \"Jiji earthquake\"), caused by rupture of the Chelungpu fault and lasting about 102 seconds, with 2,454 dead, 29 missing and over 10,000 injured, and 51,711 buildings fully and 53,768 partly collapsed (these figures are that platform's compilation from Wikipedia and reconstruction plans, not original official statistics).","Among the platform's cases, \"Hua, 25\" Puli exhibition (K30) invites painters back to the quake-hit area of Puli on the 25th anniversary, and Shigang Mama Theatre (K51) is a community troupe of quake-affected Hakka women, mentored by Assignment Theatre through post-921 People's Theatre workshops in Shigang and Dongshi and still active today."]},
"gas-explosion":{short:"The chain of gas explosions in Kaohsiung on the night of July 31, 2014, caused by a propylene leak.",long:["A 2024 PTS News retrospective says the incident happened on the night of July 31, 2014, when a leak of the petrochemical feedstock propylene caused explosions in Kaohsiung, killing 32 people and injuring 321, with over 3,140 people affected. It also notes that Kaohsiung passed an ordinance on managing existing industry in 2015 and that, by 2024, the number of pipelines had fallen from 89 before the explosions to 71.","The platform has only this one readable source so far. The name \"81 explosions\" comes from the report on Ripples of Memory (K02); the PTS report does not use it."]},
"cultural-health-station":{short:"Elder-care and cultural-transmission sites promoted by the Council of Indigenous Peoples in tribal areas and urban Indigenous settlements.",long:["The Executive Yuan's 2020 note says the Council of Indigenous Peoples, under the Indigenous chapter of the Long-term Care 10-Year Plan 2.0, promotes cultural health stations in Indigenous areas and urban Indigenous settlements on a model of \"our people caring for our people\" and adapting to each tribe and place. It describes the stations as places that care for elders and also where children, young people and care workers learn their languages and traditional culture.","New Taipei City's Indigenous Peoples Bureau's 2019 implementation plan adds that from 2018 the former \"Indigenous elders' day care stations\" were renamed Indigenous cultural health stations; services target Indigenous elders aged 55 and over who are healthy, sub-healthy or frail, plus mildly disabled elders, and include home visits, shared meals and health promotion activities.","Among the platform's cases, Mend the Dragon (K19) has an artist guiding elders at a cultural health station to turn pond-life experience into printmaking material. This entry only explains what the stations are and does not assess their effectiveness."]},
"social-prescribing":{short:"Health workers refer people to community resources such as arts, gardening, exercise and shared meals to improve physical and mental health.",long:["A 2025 Business Today report says social prescribing \"aims, through community activities, life support and resource linking, to meet the real needs of personalised care and thereby promote public health and wellbeing,\" and describes Britain's more than 30 years of practice; it also notes that under Taiwan's National Health Insurance, doctors are not authorised to write social prescriptions.","A report on a Chung Cheng University USR seminar (1111 News, 2025) describes the idea as \"emphasising non-drug, social support resources to promote physical and mental health,\" with referrals to resources such as arts activities, gardening, exercise, volunteering or shared-meal sites, and says it originated in Britain.","Among the platform's cases, the workshop list of the Guangci social housing project (K13) includes \"social prescription notes.\" The report does not say whether it is the concept described here, so they cannot simply be equated; both sources above are also news reports rather than official definitions."]},
"romantic-route3":{short:"A programme begun in 2017 for infrastructure and cultural activities in Hakka areas, which also runs the Romantic Route 3 Art Festival.",long:["A 2023 Executive Yuan press release says that after taking office President Tsai Ing-wen launched the \"Romantic Route 3 programme\" in 2017 with NT$2 billion over four years; it built infrastructure in \"Route 3, the Liudui area, Route 9 and other areas,\" followed by the \"Hakka Village 369 Happiness programme\" (NT$2.5 billion budgeted in 2020). The policy goal is to promote Hakka cultural activities with new concepts and redefine Hakka tradition. The same release says that year's art festival ran from June 24 to August 27, 2023, using land art and Hakka food to drive Hakka-village tourism and local revitalisation.","Among the platform's cases, the Romantic Route 3 Art Festival (K22) is part of this programme. The Executive Yuan release is the only source so far; it does not describe the extent of Route 3 itself or the counties it covers, and the platform does not add that."]},
"solo-artist":{short:"Definition: Work conceived and made by an artist alone, without resident co-creation (the platform's category, used as a contrast to participatory practice).",long:["This is the platform's own classification, not an academic or official definition. Cases whose main source describes the artist as the creator, with no resident co-creation, are tagged this way, e.g. Lin Chun-yung's solo show Black Surge and Hou Shu-tzu's Kaohsiung Military Dependents' Village Trilogy.", "The tag does not mean the work is unrelated to social issues: both examples deal with the environment or local memory, but residents are subjects or interviewees, not co-creators. The tag follows what the case sources say; a source silent on participation does not prove there was none."]},
"participation-ladder":{short:"Definition: A concept describing how much residents actually take part in a project, from being informed or consulted to sharing decisions; Arnstein's 'ladder of participation' is the most-cited model.",long:["Sherry Arnstein's 1969 article \"A Ladder of Citizen Participation\" (Journal of the American Planning Association 35(4)) proposes eight rungs: 1 manipulation and 2 therapy (nonparticipation); 3 informing, 4 consultation and 5 placation (tokenism); 6 partnership, 7 delegated power and 8 citizen control (citizen power).", "Cases often say \"resident participation\" without saying at which rung. The platform therefore does not assign rungs to cases; \"how residents took part\" follows each source's wording. The ladder was written about urban planning and public decisions, so applying it to art projects is the platform's analogy. This entry draws on a summary reproduced on a local-government site, not the 1969 original."]},
"art-intervention":{short:"Definition: A common term in Taiwanese contemporary art for art entering society, space or community; scholars note its usage is inconsistent.",long:["Chang Ching-wen's 2020 article in Tsing Hua Journal of Art Research says that since the mid-1990s Taiwan has seen a lot of writing on \"artistic intervention\", but the word rests on a vague consensus and is not quite the same as socially engaged art, which stresses dialogue between people and communities. It links the concept to post-martial-law democratization, high capitalization and cultural policies such as community empowerment.", "Tung Wei-hsiu's 2013 article places it in an international context, from 1960s conceptual art and Beuys's social sculpture. Only the abstracts of both papers were read.", "The platform therefore prefers more specific terms such as community art or socially engaged art, keeping \"intervention\" only where a source uses it."]},
"community-building":{short:"Definition: A policy approach promoted by Taiwan's Council for Cultural Affairs since 1994, building community by having residents solve shared problems together and strengthen ties; often the backdrop to community art.",long:["A 2017 CommonWealth Crossing report says community building was a Council for Cultural Affairs policy from 1994, hoping residents would solve everyday problems together and strengthen ties, with culture and art playing an important role. This is the report's description; the original policy text was not read.", "Chang Ching-wen's paper also says such cultural policies strongly shaped \"artistic intervention\" in Taiwan. The platform treats the term as background and does not tag cases with it."]},
"aesthetic-ed":{short:"Definition: A Ministry of Education policy term for education that cultivates aesthetic literacy, guiding learners to notice, explore, feel, know and practice beauty.",long:["The Ministry of Education's Aesthetic Education Medium- and Long-term Plan, Phase 3 (2024\u20132028) describes aesthetic education as the practice of cultivating aesthetic literacy (as reposted by a school website).", "It is often used alongside \"arts education\" but the scope differs: the policy speaks of aesthetic literacy, while the platform's arts-education tag looks at whether learners are the main participants and learning is the aim; see the arts education entry."]},
"indigenous":{short:"A legal term defined by Taiwan's Indigenous Peoples Basic Law; the platform's \"Indigenous culture\" issue marks related cases.",long:["Article 2 of the Indigenous Peoples Basic Law defines Indigenous peoples as traditional peoples existing in Taiwan within the state's jurisdiction, listing the Amis, Atayal, Paiwan, Bunun, Puyuma, Rukai, Tsou, Saisiyat, Yami, Thao, Kavalan, Truku and others recognised by the Executive Yuan; a \"tribe\" is a group of Indigenous people living together by traditional norms in an Indigenous area and approved by the central authority. The text read is a version reproduced by the Taipei City legal database, showing a last amendment of 20 June 2018; check the current text on the national database, as the platform did not compare for later changes.", "The platform's \"Indigenous culture\" issue tag follows whether a source discusses Indigenous culture, language, land or participation; it is not a determination of legal status. Names of peoples and tribes follow each source."]},
"hakka":{short:"The Hakka Basic Act defines a Hakka person as one with Hakka ancestry or origin who identifies as Hakka; \"kezhuang\" (Hakka village) is common usage the law does not define.",long:["Article 2 of the Hakka Basic Act defines a Hakka person as one \"with Hakka blood or Hakka origin who self-identifies as Hakka\". It also defines Hakka ethnic group, Hakka language, population and affairs; \"Hakka cultural priority development areas\" appear in Articles 4, 8, 9 and 12 but are not defined in Article 2. The text read is a version reproduced by the Taipei City legal database (last amendment shown: 31 January 2018); check the current text.", "\"Kezhuang\" is everyday usage with no legal definition found; in cases it usually means settlements where Hakka people live, e.g. Romantic Route 3 and Elder Dance, Hakka Daily Life. Whether a place is called kezhuang follows the case source."]},
"austronesian":{short:"A linguistic grouping to which Taiwan's Indigenous peoples are said to belong; the platform has only a brief explanation, no in-depth scholarly source.",long:["A Taipei City Government radio page says Taiwan's Indigenous peoples were settled before Han migration in the 17th century, belong to the Austronesian peoples; mainland groups speak Formosan languages of the Austronesian family, while the Tao of Orchid Island speak a Batanic language of the Malayo-Polynesian branch. The page gives no author, programme name or date, so it is supporting information only.", "Scholars debate Austronesian origins and dispersal, e.g. Academia Sinica researchers on Neolithic interaction across the Taiwan Strait. The platform read only titles and bibliographic details, so it relays no scholarly conclusions.", "Among cases, the Pan-Nan-Dao art festival (K36) touches this theme; follow the case source and curators for their claims."]},
"rights-nature":{short:"Rights considered universal and inalienable, not dependent on any particular government or law, as opposed to legal rights bestowed by a legal system.",long:["The lead of the English Wikipedia article \"Natural rights and legal rights\" says some philosophers distinguish two types of rights: natural rights are those not dependent on the laws or customs of any particular culture or government, and so are universal, fundamental and inalienable; legal rights are bestowed by a given legal system and can be modified, repealed or restrained by human laws (Wikipedia is collaboratively edited and used here only as a general reference).","Among the platform's cases, reports on the 2026 Mattauw Land Art Festival (K32) use the phrase: a Commercial Times article says the exhibition at the Cigang Art Center covers themes from \"watershed protection and rights of nature to the boundary between water and people\", and the 2026 festival's official site lists a \"natural rights initiative\" strand and a \"Rights of Nature Court\" (with a school-outreach session). Neither the reports nor the site says which philosophical sense is meant or defines the initiative, so the platform does not define it for them."]},
"marine-debris":{short:"Human-made waste drifting, sinking or accumulating in the sea and on coasts; \"haifei\" is the common Taiwanese shorthand and a frequent material in environmental art.",long:["The InforMEA glossary describes marine debris as persistent synthetic materials that may float, sink or remain in suspension and may interfere with legitimate uses of the sea; UNEP adds that most marine litter degrades slowly, so continuous large inputs gradually build up in marine and coastal environments. This is an international English definition; the platform could not read an official definition page from Taiwan's Ocean Conservation Administration.", "Among cases, Lin Chun-yung's Black Surge draws on marine debris and was prompted by the 2015 sperm whale stranding; the background to the Zhongzhou Jinyu Festival also mentions marine debris and pollution."]},
"press-release":{short:"Text prepared by an organiser or implementer for the media; when several reports use near-identical wording, they often reproduce one press release.",long:["This is a platform editorial note with no definitional source. When judging \"verified\", the platform treats reports with near-identical wording as one source, not independent ones, e.g. the three reports for K32.", "This is a platform rule, not a judgement that the reports are unreliable: a press release may be accurate, but it cannot corroborate itself. Compare the advertorial entry: a press release is supplied text, an advertorial is paid content."]},
"community-theatre":{short:"Definition: A form of theatre taken part in by residents themselves, developed through collective improvisation and not aimed at professional performance.",long:["Lai Shu-ya (Taiwan Centre for Applied Theatre) writes in Arts Education no. 188 that Taiwan’s ‘community theatre’ used a more neutral name to carry the Theatre of the Oppressed (from Brazil’s Augusto Boal), avoiding the pushback that words like ‘oppressed’ or ‘reform’ provoked; workshops do not teach performance but guide people to express their own stories and issues in dialogue, unlike theatre focused on a finished professional production.","Among the platform’s cases, Ren Theatre’s Fangyuan community theatre (K41) uses fieldwork and collective improvisation so local non-professionals turn fishing-village life into theatre."]},
"relocation":{short:"Residents of a whole settlement move together to another place because of development or policy.",long:["Take Dalinpu in Kaohsiung. According to CNA in August 2026, the relocation and resettlement plan was negotiated by the Ministry of Economic Affairs and the Kaohsiung city government and approved by the Executive Yuan. Briefings on negotiated land purchase began in April 2026; by the end of July more than 2,500 owners had signed consent forms; public works at the resettlement site began first, with lottery allocation and compensation payments expected to start in 2027.","The general definition of relocation here is an editorial summary. The Dalinpu cases all touch this process, including Big Nose Youth's silkscreen workshop and the Good Times podcast. The report does not state why the relocation is happening."]},
"urban-renewal":{short:"Rebuilding, renovating or maintaining old areas within urban plan areas, as set by law.",long:["Article 3 of the Urban Renewal Act defines urban renewal as carrying out reconstruction, rehabilitation or maintenance measures within an urban plan area under the procedures of the Act. Article 1 states the aims: promote planned redevelopment of urban land, revive urban functions, improve living environment and landscape, and advance the public interest (version amended Nov 13, 2024).","The platform's \"urban development\" issue tag is broader than urban renewal and also covers old streets and settlements changing under development pressure."]},
"new-immigrants":{short:"People who have settled in Taiwan through marriage or migration, such as foreign and mainland-Chinese spouses; their children are called the second generation.",long:["The National Immigration Agency's Zhanxin Plan document covers new immigrants and their second-generation children, and says new immigrants number over 510,000 and their children over 360,000 (2016 data; no reference date given). It does not clearly define \"new immigrants,\" but from its content the group includes foreign and mainland-Chinese spouses.","In the platform's cases new immigrants often appear with migrant workers, as in the Jalan-Jalan special exhibition and the picture-book course for new immigrants and migrant workers."]},
"migrant-workers":{short:"Foreign workers who come to Taiwan for industrial or caregiving work; official statistics split them into industrial and social-welfare categories.",long:["The Ministry of Labor splits foreign workers into industrial and social-welfare migrant workers. At the end of 2020 the total was about 709,000: 457,000 industrial and 252,000 social-welfare; by nationality, Indonesians were the largest group (263,000), followed by Vietnamese (237,000). These are 2020 figures, and the situation today differs.","The platform has several cases with migrant workers as participants, such as Sundays Unseen (the migrant photography award) and Symbiotic Window Poem (Taoyuan's rear station)."]},
"local-memory":{short:"Residents' shared recollections of a place: its scenes, stories and ways of life.",long:["Local memory means residents' shared recollections of where they live, including the look of old streets, vanished buildings, habits and stories. Many projects start by collecting or recreating these memories, such as Gangshan residents making memory boxes and the Street Museum asking elders to collect recollections.","This is the platform's most commonly used issue tag. It is an editorial term with no single scholarly source; common methods include oral history and fieldwork."]},
"ponds":{short:"Ponds once used to store water for irrigation; especially numerous in Taoyuan and Guantian, Tainan.",long:["Ponds (pitang) were used for agricultural irrigation. According to PTS News, Taoyuan is known as the \"land of a thousand ponds\": records mention over 8,800, but a century later only about 2,800 remain, and after the Shimen Reservoir was built most lost their irrigation function. Some became ecological parks that also detain floodwater, though a researcher questions excessive concreting.","The Tainan National University of the Arts e-newsletter notes that Guantian's ponds serve irrigation, disaster-prevention and aquaculture functions. Guantian Has Monsters and the Bu Long Project both take ponds as a theme."]},
"advertorial":{short:"An article in a medium paid for or supplied by an advertiser; it should be distinguished from ordinary news.",long:["A News Lens explanation says sponsored articles are supplied by the vendor or planned by the business side, labeled \"advertorial\" and \"Sponsor Content,\" and are unrelated to the editorial staff. That is one outlet's practice; labeling differs across media.","The platform flags in case notes when a source is an advertorial or advertisement, because such articles have a different standing from ordinary news. Current examples are Again: Chiayi Rural Art Actions (advertorial) and Art Moving Communities (advertisement)."]},
"usr":{short:"Government programs encouraging universities to bring teachers and students into communities to tackle local problems; USR is run by the Ministry of Education (part of the Higher Education Sprout Project), alongside the National Science and Technology Council's Humanities Innovation and Social Practice (HISP).",long:["The Ministry of Education's University Social Responsibility (USR) program began as a pilot in 2017 and launched its first phase in 2018, with teachers and students stationed in communities to survey local conditions and devise solutions with social groups and residents. Per the USR Office's results e-book, the first phase (2018–2019) had 114 institutions and 220 projects, the second (2020–2022) about 93 institutions and 204 projects, and the third (2023–2024) 113 institutions and 251 projects, increasingly aligned with the UN SDGs and campus governance.","USR runs in step with the Ministry's Higher Education Sprout Project and is usually placed under the Project's \"social responsibility\" strand. Among the platform's cases, the Gangshan memory boxes (K01) are run by the USR team at National Sun Yat-sen University's College of Management; Guantian Has Monsters (K31) belongs to TNNUA's USR project in Guantian (run by the Art History Department, co-hosted with Guantian Junior High), which the university e-newsletter and Liberty Times describe under the Sprout Project's social-responsibility strand. Yijia Art Museum (K37) appears in TNUA's Sprout-Project \"social responsibility\" results, but per the office's page it is a campus-level supported item funded from the main grant, not a formal USR sub-project, so the platform does not list it as a USR case.","A kindred but differently-administered program is the National Science and Technology Council (formerly Ministry of Science and Technology) Humanities Innovation and Social Practice (HISP) program, running since around 2013, which links humanities and social-science research to localities and responds to regional social change through its \"SOWROW\" platform (hisp.ntu.edu.tw). Among the cases, the Damp Palimpsest neighbourhood art action (K29) is run by National Taiwan Ocean University's HISP project — close in spirit to USR, but under the NSTC system, not the Ministry of Education's USR."]}
,"place-activation":{"short":"Definition: art work that takes a place, or an idle or abandoned space, as its object — from fieldwork and documentation, to individual creation on site, to using curation to re-organise and reactivate the space.","long":["This is a working concept the platform uses to gather a set of related practices. It sits next to ‘curation’, ‘site-specific art’ and ‘community building’: the difference is that it takes ‘a place / an idle space’ as its unit, stringing survey, commissioning or co-creation, and display into one line, so that the space itself is seen anew and, ideally, keeps being used after the project ends.","Note that the cases placed under this concept sit at different points on a spectrum: some survey and archive idle spaces (e.g. k70, a sampling survey of Taiwan’s ‘mosquito halls’ — unused public facilities); some are an artist’s individual creation in ruins (e.g. k71, The Ruin Image Crystal Project); and only some are place-based curation and activation in the strict sense (e.g. k78, Xingbinshan reactivating old buildings and the port town of Zhengbin through CIR and curation). When citing, keep these apart: documentation, individual creation and co-creative activation are different degrees of intervention and should not all be called ‘activation’.","It also differs from the method card ‘working inside historical sites and military remains (site)’: that is about making one work in a single place, whereas this is about using curation to organise and reactivate a whole space or locality."]}};

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
function arr(v){return Array.isArray(v)?v:[v];}
function ydisp(c){return lang==="en"?c.yde:c.yd;}
function ycmp(a,b,dir){
  var x=(dir==="asc"?(a.yk0||a.yk):a.yk)||0,y=(dir==="asc"?(b.yk0||b.yk):b.yk)||0;
  if(!x&&!y)return a.id<b.id?-1:1;
  if(!x)return 1;if(!y)return -1;
  if(x!==y)return dir==="asc"?x-y:y-x;
  return a.id<b.id?-1:1;
}
function tx(s){return (lang==="en"&&D[s]!==undefined)?D[s]:s;}
function jn(a){return a.map(function(x){return esc(tx(x));}).join(lang==="en"?", ":"、");}
function distinctCities(){var m={};CASES.forEach(function(c){arr(c.city).forEach(function(x){m[x]=1;});});return Object.keys(m).length;}
function statusClass(s){return s==="已查證"?"s-ok":(s==="待查證"?"s-warn":"s-stale");}
function hay(c){
  var parts=[c.name,c.en,c.creator,c.city,c.place,c.summary].concat(arr(c.practice),c.issue,c.form,c.audience,PRACTICE_ALIAS[arr(c.practice)[0]]||[],[].concat(c.issue,c.form,c.audience,arr(c.city),arr(c.practice)).map(function(x){return D[x]||"";}),CASE_EN[c.id]?[CASE_EN[c.id].name,CASE_EN[c.id].summary,CASE_EN[c.id].creator,CASE_EN[c.id].place]:[]);
  return parts.join(" ").toLowerCase();
}
var HAY={};CASES.forEach(function(c){HAY[c.id]=hay(c);});

var state={q:"",sel:{},ydir:"desc"};
DIMS.forEach(function(d){state.sel[d.key]=new Set();});

function relatedTerms(q){
  var ql=q.toLowerCase();if(ql.length<2)return [];
  var out=[];
  SYN.forEach(function(g){
    var hit=g.some(function(t){var tl=t.toLowerCase();return tl===ql||tl.indexOf(ql)>-1;});
    if(hit){g.forEach(function(t){var tl=t.toLowerCase();if(tl.indexOf(ql)===-1&&out.indexOf(t)===-1)out.push(t);});}
  });
  return out;
}
function filterCases(){
  var q=state.q.trim().toLowerCase();var rel=q?relatedTerms(state.q.trim()):[];
  var res=[];
  CASES.forEach(function(c){
    for(var i=0;i<DIMS.length;i++){
      var d=DIMS[i],s=state.sel[d.key];
      if(!s.size)continue;
      if(d.series){var ok=false;s.forEach(function(sid){var sx=SERIES_BY[sid];if(sx&&seriesAll(sx).indexOf(c.id)>-1)ok=true;});if(!ok)return;}
      else{var vals=arr(c[d.key]);if(!vals.some(function(v){return s.has(v);}))return;}
    }
    var type="all";
    if(q){
      if(HAY[c.id].indexOf(q)>-1)type="direct";
      else if(rel.some(function(t){return HAY[c.id].indexOf(t.toLowerCase())>-1;}))type="related";
      else return;
    }
    res.push({c:c,type:type});
  });
  res.sort(function(a,b){var o={direct:0,all:0,related:1};return o[a.type]-o[b.type]||ycmp(a.c,b.c,state.ydir);});
  return {list:res,rel:rel};
}
