k25:{name:"Penghu Drifting Art Museum (Youth Patrol Beach Cleanup)",creator:"Youth patrol led by Tang Tsai-ling (studio founder); resident artist Tai Shuo-yi",place:"\"Drifting Art Museum\" at the Houliao Visitor Center",year:"2025",
summary:"Penghu Drifting Art Museum is the “Drifting Art Museum” at the Houliao Visitor Centre in Penghu in 2025, grown out of a youth patrol team’s beach cleanups.\n\nBeach cleaning has gradually become a way for residents to show love for their home, and the team has done environmental education for about 10 years; after cleanups, the youth patrol turns marine debris into installations.\n\nThe works are placed in the Houliao Visitor Centre to make visitors think about ocean waste. The report does not say whether residents took part in making the works.",
selfDesc:"The report says beach cleaning has gradually become a way residents show love for their home, and the team has done environmental education for about 10 years. It does not say whether residents took part in making the works.",
pedagogicalInsight:"Turning marine debris picked up on beach cleanups directly into exhibits merges environmental action and making, so visitors see where rubbish comes from. For environmental-education teachers, it models a full cycle of action, collection, remaking and display. Note: whether residents took part in making the works is not reported.",
why:"Verified: besides PTS, the Commercial Times (2025-08-25) corroborates the Houliao 'Drift Museum', kayak beach-cleaning collecting marine debris, and the debris remade into art; however it centres on the artist Tang Tang (Sea Drift Lab) with the Penghu scenic-area administration, not the 'youth patrol', so the two may be different participants or editions of the same 'Drift Museum', and which group did the cleanup is unresolved."},
k26:{name:"Art Moving Communities (Kinmen and Penghu)",creator:"National Tainan Living Art Center (Ministry of Culture); co-organized with the Kinmen and Penghu county cultural bureaus; project lead Wu Mali",place:"Kinmen: Gugang, Hudong; Penghu: Dachi, Houliao, Dingwan, Hudong, Jiangjun and other communities",year:"2025 (ROC year 114)",
summary:"Art Turning Communities is a 2025 (ROC year 114) programme in which artists took up residence in communities in Kinmen (Gugang, Hudong) and Penghu (Dachi, Houliao, Dingwan, Hudong, Jiangjun and others). The report says the programme emphasises the community as its main body and has run in seven southern counties and cities for five years.\n\nArtists worked with residents: planning a performance with a paper-craft master, firing pottery with residents, and interviewing elders to preserve folk songs.\n\nThe exact residency sites and dates of each artist are not reported.",
selfDesc:"The report says the program puts the community at the center and has run for 5 years across seven counties and cities in the south.",
pedagogicalInsight:"Working with local practitioners such as a paper-craft master, potters and folk-song elders, rather than parachuting contemporary art into a community, respects local skills; for teachers working on local culture, the point is to find the community’s masters first. Note: the source is an advertorial in the Ministry of Culture’s name and leans toward the official account.",
why:"Confirmed (core): besides the Ministry of Culture advertorial, an independent CNA staff report (2025-06-03, news/acul) corroborates this case's core — the 'Art Moving Communities' program run by the Ministry of Culture's National Tainan Living Art Center, a 2025 (ROC 114) residency at the county-designated historic 'Dong Yun-yao Mansion' in Gugang, Kinmen, with artists (Lin Huang-di and Chen Hsin-cheng) working with residents (collecting and illustrating residents' life stories, borrowing household objects such as electric fans) — agreeing with the advertorial on the program, organizer, year, and Kinmen community residency with resident collaboration, so it is upgraded to confirmed. However, the specific examples listed here (co-planning a performance with a paper-craft master, firing pottery with residents, interviewing elders to preserve folk songs), the Penghu communities and project lead Wu Mali still rest on the single advertorial source. (Daily source expansion, 2026-11-14)"},
k27:{name:"Hualien Jump Wave Arts Festival: \"Planet Burst\"",creator:"Organizer not stated in the report; artists include Iyo Kacaw, Chang Pu-teng, Tu Wei-cheng and Chen Cheng-tao",place:"Hualien County Stone Sculpture Museum; Tongli tribe",year:"2024",
summary:"Hualien Jump Wave Art Festival “Planet Burst” is a 2024 exhibition at the Hualien Stone Sculpture Museum and Tongli Village, themed on the Hualien earthquake and exploring how people live with earthquakes and heal.\n\nTu Wei-cheng invited residents to bring post-quake objects for rubbing, and Chen Cheng-tao worked with adults and children of the village to assemble post-quake mountain views from Lego.\n\nIncome from showing the Lego works will be donated to rebuild the local church.",
selfDesc:"The report says the exhibition explores how people live with earthquakes and heal, and income from showing the LEGO works will be donated to rebuild a local church.",
pedagogicalInsight:"“Bring an object from after the quake to rub” and “build post-quake mountains from Lego” turn earthquake trauma into something to make; letting children handle disaster with Lego is a very practical healing design. For teachers dealing with trauma, it shows using concrete objects and play media instead of talking about the disaster directly. Note: how residents decided the content of works is not reported.",
why:"Verified: besides PTS, CNA (2024-10-22) reported the 3rd PALAFANG Hualien Jumping Wave Art Festival 'Planet Burst Observatory', corroborating the Hualien County Cultural Affairs Bureau as host, the 0403-earthquake theme and Tu Wei-cheng's 'Earthquake Museum'; the details 'Tu having residents make rubbings from post-quake objects' and 'Chen Cheng-tao building a Lego post-quake landscape' rest on PTS (CNA does not mention them)."},
k28:{name:"Meeting of Styles (Graffiti in Gouzaiwei, Hualien)",creator:"Invited by Hualien City Office; MOS Hualien lead Huang Hung-shun; over a hundred graffiti artists",place:"Gouzaiwei, Hualien City",year:"2024 (two days from October 19)",
summary:"Meeting of Styles is a two-day graffiti event starting on 19 October 2024 in the old quarter of Gouziwei, Hualien City.\n\nHundreds of graffiti artists painted about 50 wall works; the township office coordinated residents to provide old walls and roller shutters, and many works took the walls that collapsed in the earthquake as their subject.\n\nThe organiser hopes the works will help people remember the earthquake and restore confidence, and the mayor hopes the old quarter will become a street-culture landmark for young people.",
selfDesc:"The report says the lead hopes the works help people remember the earthquake and restore confidence, and the mayor hopes the old district will become a landmark of youth street culture.",
pedagogicalInsight:"Residents mainly lent their walls rather than co-creating, so participation is shallow; but “taking the walls that collapsed in the quake as subject” turns traces of disaster directly into a place for making — an example of landscape combined with trauma. Its direct reference value for educators is limited; it is closer to a city-regeneration or tourism case.",
why:"Verified: besides PTS, LiFTED (2024-10-22) corroborates the 2024 Hualien Meeting of Styles, over 50 walls turned into graffiti, and the magnitude-7.2 Hualien earthquake as backdrop; the details 'Goujhaiwei old district', 'the district office arranging residents' walls and shutters' and 'using collapsed post-quake walls as subject' rest on PTS (LiFTED gives no location detail)."},
k29:{name:"Damp Palimpsest: Neighborhood Art Action",creator:"Humanities Innovation and Social Practice Program (HISP), National Taiwan Ocean University; Arts Commission at Sunrise First Sight Cafe; young creators",place:"Public spaces of Zhishan Building, Ren'ai District; First Sight Cafe",year:"2026 (Aug 22–Sep 20)",
summary:"Damp Palimpsest is a neighbourhood art action held from 22 August to 20 September 2026 in the public spaces of the Zhishan Building in Ren’ai District, Keelung, and at Chujian Café.\n\nYoung creators went to the Kanzaiding and consignment-shop (weituohang) districts to gather material; the team used the Lumbung (shared rice barn) method, sharing local cultural materials and fieldwork experience with the creators, and coordinated the space with the building’s management committee.\n\nThe works were shown in a community gallery converted from the building’s public space, depicting the sewing trade, fish market and railway memories of Keelung’s old town.",
selfDesc:"The report says the team used the Lumbung (shared rice barn) approach, sharing local cultural materials and field experience with the creators, and coordinated the space with the building's management committee.",
pedagogicalInsight:"The team used the Lumbung (shared rice barn) method to share fieldwork materials with creators; this “share first, then create separately” model is a mechanism teachers leading group projects can borrow. Note: residents were mainly people the creators drew material from, and the degree of co-creation is not reported.",
why:"Verified: besides the 1111 report, the China Daily News (Chinese News Cloud, reporter Yang Yao-hua, 2026-08-25, republished on Yahoo) independently covers the 'Damp Palimpsest' action, confirming that NTOU's HISP program and the Sunrise First Sight Cafe's 'Arts Commission' jointly launched it, that young creators gathered material in the Kanzaiding and pawnshop district, and that it ran in the 'community gallery' in Zhishan Building and the cafe through Sep 20 — upgraded to verified. (daily source expansion, 2026-11-15)"},
k31:{name:"Guantian Has Monsters!!! The Ponds and Legends of Guantian (Art Goes to the Countryside)",creator:"Department of Art History, Tainan National University of the Arts (advisor Hsu Yuan-ta); in cooperation with teachers and students of Guantian Junior High School",place:"Guantian Junior High School, Guantian District (art space on the 2nd floor of the school store; the venue is stated only by the Liberty Times)",year:"2023–2024",
summary:"There Are Monsters in Guantian!!! The Ponds and Legends of Guantian is a 2023–2024 art-to-village project by a team from the Department of Art History at the Tainan National University of the Arts at Guantian Junior High School in Guantian District, under the Ministry of Education’s Higher Education Sprout Project theme of fulfilling social responsibility; the venue is the art space on the 2nd floor of the school shop.\n\nThe team led Guantian Junior High students, first using drama classes to get to know the monster legends of the Guantian ponds, then drawing characters such as the snail spirit, loach spirit, black dog blood and Qing soldiers and placing them in a Guantian scene hand-drawn by the university team.\n\nThe results were turned into an exhibition. The content covers the ponds’ irrigation and flood-control functions and the relation between legends and hydrology and geography, aiming to help students and locals rediscover fading local legends and to give rural students aesthetic education.",
selfDesc:"The reports say the project falls under the Ministry of Education's Higher Education Sprout Project, \"social responsibility\" strand. It covers the ponds' irrigation and flood-prevention functions and the relation between the legends and local hydrology and geography, aiming to help students and locals rediscover fading local legends and to give rural students aesthetic education.",
pedagogicalInsight:"Using a drama class to let students “enter” the monster legends of the Guantian ponds, then drawing characters and placing them in a shared scene for an exhibition, turns almost-forgotten local legends into students’ own creations — a good mix of local knowledge and aesthetic education that can serve directly as a template for local-culture courses.",
why:"Three reports (including the university's own e-newsletter) agree on the project name, partners and content; the exhibition dates are reported inconsistently."},
k30:{name:"\"Painting, 25\": Puli After the 921 Earthquake",creator:"New Homeland Cultural and Educational Foundation; 11 artists including Chu Chi-chu, Sun Shao-ying and Liao Chiu-yueh",place:"Puli (originals at the Paper Dome 'Flow' gallery; outdoor reproductions at the Puli administrative park and Jiji station plaza)",year:"2024 (press event Sep 12; through Sep 30)",
summary:"“Draw, 25” is a Puli exhibition marking the 25th anniversary of the 921 earthquake, with a press conference on 12 September 2024 and the show running to 30 September; it was organised by the New Homeland Foundation with Ministry of Culture support in planning.\n\nEleven painters returned to the quake-hit area of Puli to work, using paintings to show the contrast between old and new landscapes, alongside an older painter’s post-quake sketches.\n\nThe originals were shown at the “Flow” gallery of the Paper Dome, with outdoor reproductions at the Puli Joint Administrative Park and the plaza in front of Jiji Railway Station.",
selfDesc:"The report says the New Homeland Cultural and Educational Foundation organized the project, with planning supported by the Ministry of Culture.",
pedagogicalInsight:"Painters returned to the disaster area to work on site and compare old and new landscapes, with no resident co-creation; but “going back and painting 25 years of change” models talking about a place through time depth (after the quake vs now), a method reference for courses on place change. Note: this is work- and curation-oriented.",
why:"Verified: besides CNA (2024-09-12), TDN Taiwan Life News (reporter Fan Hung-kun, 2024-09-14) independently covers the show, confirming the New Homeland Foundation as organizer, Ministry of Culture support, and 11 artists returning to quake-hit Puli to paint 25 years of change at the Paper Dome; the foundation's official page lists all 11 painters, the Paper Dome 'Flow' gallery, the Sep 12 press event and the run through Sep 30. Upgraded to verified. (daily source expansion, 2026-11-15)"}
,"k79":{"name":"Libera Work-Gang: The Galaxy of Discipline — A Research-Creation Project on the Post-war Mainlander ‘Diaspora’ and ‘Suppression’","creator":"Libera Work-Gang (project lead: Lin Chuan-kai; lead creator: Hung Wei-ling; collaborators incl. Hsin Pei-yi, Li Chia-hung)","place":"Taiwan Contemporary Culture Lab (C-LAB), former Air Force Command Headquarters, Taipei","year":"2019 (group founded 2018)","summary":"A residency-based investigation and creation project carried out in 2019 at the Taiwan Contemporary Culture Lab (C-LAB), proposed by the Libera Work-Gang. Founded in 2018, the group brings together artists, researchers and popular-education workers; the project lead is White Terror historian Lin Chuan-kai and the lead creator is image-maker Hung Wei-ling.\n\nThe project focuses on the situation of post-war ‘Mainlander’ political prisoners. The team notes that about forty percent of White Terror victims were Mainlanders, many of them in the military — at once victims of the authoritarian system and people whose identity is often flattened or used as a political tool. Taking three threads — air force, army and navy — it investigates the spaces, archives and memories of interrogation and imprisonment.\n\nTreating the former Air Force Command Headquarters (the site of C-LAB) as a field, the team used old photographs and the oral accounts of people who had worked there to search for spaces where political prisoners may have been interrogated and held, and produced three moving-image works — The One Who Writes, The One Who Bears Guilt, and Landscape in the Mist — corresponding to the three threads.\n\nAlongside the artworks, the team ran an intensive public programme: reading groups, many themed talks, and a workshop, led by a performance practitioner, in which participants experienced ‘the disciplined body’. It was among the most active residency teams of its cohort, with the largest audiences.","selfDesc":"In the group’s own words, the spirit of ‘libera’ (安魂, requiem) is to attend to the resisters who vanished during the Martial Law period — to bring their figures back into the present, and to help people today recover the strength to enter public life. Its method is to re-read ‘Mainlanders’ in a de-ethnicised way, using intensive lectures, reading groups and film screenings to foreground differences of class, ethnicity, culture and wartime experience, and to explore the varied self-identifications of the diaspora. (This paragraph is the team’s / C-LAB’s self-description; the body text relies on independent sources for facts.)","editNote":"","pedagogicalInsight":"This case shows how a heavy, abstract history can be turned into something people can investigate and take part in. A few transferable moves: treat a building still in use (the former Air Force HQ) as a field, using old photos and elders’ accounts to ‘excavate’ spaces that can no longer be seen; split a sprawling history into three threads; and use reading groups, talks and a body workshop to turn the audience into co-investigators. A caution: projects like this handle the trauma and dignity of real victims, so keep ‘the team’s own account’ and ‘independent historical sources’ apart, and stay mindful of survivors and their families.","why":"Confirmed: the official C-LAB CREATORS 2019 page records that the Libera Work-Gang was founded in 2018 and investigates the former Air Force HQ and the army/navy/air-force history of the White Terror from 1949–1987 archives; the CLABO review (Hsieh Chen-yi, 2020) details the three films and the public programme; the TFAM 2020 Taipei Biennial participant page, Lin Chuan-kai’s university page and the Taiwan Sociological Association bulletin independently corroborate the project lead’s identity, research theme and the team’s collaboration. Several sources of different kinds and from different bodies corroborate one another, so it is marked verified."}};

  if(side==="C"||side==="I")return '<g class="mlab c" data-key="'+k+'"><rect class="mpill" x="'+(ax-w/2)+'" y="'+(ay-h/2)+'" width="'+w+'" height="'+h+'" rx="12"/><text class="mtxt" x="'+ax+'" y="'+(ay+6)+'" text-anchor="middle">'+t+'</text></g>';
  if(side==="W")bx=ax-26-w/2;else if(side==="E")bx=ax+26+w/2;else by=ay-26;
  var lx=side==="W"?bx+w/2:side==="E"?bx-w/2:bx,ly=side==="N"?by+h/2:by;
  return '<g class="mlab" data-key="'+k+'"><line class="mline" x1="'+ax+'" y1="'+ay+'" x2="'+lx+'" y2="'+ly+'"/><circle class="mdot" cx="'+ax+'" cy="'+ay+'" r="2.6"/>'+
    '<rect class="mpill" x="'+(bx-w/2)+'" y="'+(by-h/2)+'" width="'+w+'" height="'+h+'" rx="12"/>'+
    '<text class="mtxt" x="'+bx+'" y="'+(by+6)+'" text-anchor="middle">'+t+'</text></g>';
}

  function grp(k,inner,extra){
    var n=cnt[k]||0;
    return '<g class="cty l'+mlvl(n)+(mapSel===k?' sel':'')+'" data-key="'+k+'" tabindex="0" role="button" aria-label="'+esc(mapAria(k,n))+'">'+inner+(extra||'')+'</g>';
  }
  var svg='<g transform="translate(50 24)">'+order.map(function(k){
    var inner=groups[k].map(function(r){return '<path d="'+r.d+'"/>';}).join("");
    var extra=k==="澎湖"?'<circle class="hit" cx="'+MAPANCH["澎湖"][3]+'" cy="'+MAPANCH["澎湖"][4]+'" r="18"/>':'';
    return grp(k,inner,extra);
  }).join("")+'</g>';
  function inset(k,paths,y,label){
    var n=cnt[k]||0;
    return '<g transform="translate(8 '+y+')"><rect class="ibox" width="86" height="60" rx="6"/>'+
      grp(k,paths.map(function(d){return '<path d="'+d+'"/>';}).join(""),'<rect class="hit" width="86" height="60" rx="6"/>')+
      '<text class="ilab" x="0" y="76">'+esc(label)+'</text></g>';
  }
  svg+=inset("連江",MAPD.mat,8,L("連江縣（馬祖）","Lienchiang (Matsu)"))+inset("金門",MAPD.kin,96,L("金門縣","Kinmen"));
  var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]||(a<b?-1:1);});
  var chips=ks.map(function(k){return '<button type="button" class="mchip'+(mapSel===k?' sel':'')+'" data-key="'+k+'">'+esc(cname(k))+' <b>'+cnt[k]+'</b></button>';}).join("");
  return '<section class="block" id="mapblock"><div class="sec-head"><h2>'+L("案例地圖","Case map")+'</h2><p>'+L("顏色依各縣市案例數量的排名以分位數分五段（相同數量的縣市同色），越深代表越多。點選縣市，右側會列出該縣市的所有案例。","Colour is split into five bands by quantiles of the counties' case counts (counties with the same count share a colour); darker means more. Select a county to list all its cases.")+'</p></div>'+
   '<div class="mapwrap"><div class="mapcol"><svg class="twmap" viewBox="0 0 440 460" role="group" aria-label="'+L("台灣各縣市案例數量地圖","Map of case counts by county in Taiwan")+'">'+svg+'</svg>'+
   
   '<div class="mchips">'+chips+'</div>'+

   '<div class="maplist" id="maplist" aria-live="polite"></div></div></section>';
}
function renderMapList(){

    (n?'<button type="button" class="filterbtn" data-dim="city" data-val="'+esc(mapSel)+'">'+L("在案例資料庫中開啟","Open in directory")+'</button>':'')+'</div>';
  box.innerHTML=head+(n?'<div class="cards">'+list.map(function(c){return cardHtml({c:c,type:"all"});}).join("")+'</div>':'<div class="empty">'+(lang==="en"?'No cases collected yet for '+esc(cname(mapSel))+'.':'目前還沒有收錄「'+esc(mapSel)+'」的案例。')+'</div>');
}
function pickCounty(k,scroll){
  mapSel=k;
  var els=document.querySelectorAll("#mapblock .cty,#mapblock .mchip");
  for(var i=0;i<els.length;i++)els[i].classList.toggle("sel",els[i].dataset.key===k);
  mapLabels(null);renderMapList();applyLang();
  if(scroll){try{if(!window.matchMedia("(min-width:861px)").matches)document.getElementById("maplist").scrollIntoView({behavior:"smooth",block:"start"});}catch(e){}}
}
function bindMap(){
  setTimeout(function(){mapLabels(null);},0);
  var blk=document.getElementById("mapblock");if(!blk)return;
  var NS="http://www.w3.org/2000/svg",ov=null,cur=null;
  function hideHov(){if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);ov=null;cur=null;mapLabels(null);}
  function showHov(g){
    if(g===cur)return;hideHov();cur=g;mapLabels(g.dataset.key);
    var parent=g.parentNode,bb;try{bb=g.getBBox();}catch(e){return;}
    var dim=Math.max(bb.width,bb.height)||1,sc=Math.min(1.3,Math.max(1.06,1+10/dim));
    ov=document.createElementNS(NS,"g");
    ov.setAttribute("class",g.getAttribute("class").replace(/\bsel\b/,"")+" hov");
    ov.setAttribute("pointer-events","none");ov.setAttribute("aria-hidden","true");
    ov.style.setProperty("--s",sc.toFixed(3));
    var ps=g.querySelectorAll("path");for(var i=0;i<ps.length;i++)ov.appendChild(ps[i].cloneNode(true));
    var labs=null,ch=parent.children;for(var j=0;j<ch.length;j++){var cl=ch[j].getAttribute&&ch[j].getAttribute("class");if(cl&&/\bmlabs?\b/.test(cl)){labs=ch[j];break;}}
    parent.insertBefore(ov,labs);
  }
  var mapcol=blk.querySelector(".mapcol"),tip=null;
  if(mapcol){tip=document.createElement("div");tip.className="maptip";tip.hidden=true;mapcol.appendChild(tip);}
  function showTip(g,e){
    if(!tip||!mapcol)return;
    var k=g.dataset.key,n=cityCount()[k]||0;
    tip.textContent=mapAria(k,n);tip.hidden=false;
    var side=(MAPANCH[k]&&MAPANCH[k][0])||"W",right=(side==="E"||side==="I");
    var rect=mapcol.getBoundingClientRect(),x,y;
    if(e&&e.clientX!=null){x=e.clientX-rect.left;y=e.clientY-rect.top;}
    else{var bb=g.getBoundingClientRect();x=bb.left+bb.width/2-rect.left;y=bb.top+bb.height/2-rect.top;}
    var tw=tip.offsetWidth,th=tip.offsetHeight,gap=14;
    var left=right?x+gap:x-gap-tw;
    if(left<2)left=2;if(left+tw>rect.width-2)left=rect.width-2-tw;
    var top=y-th/2;if(top<2)top=2;if(top+th>rect.height-2)top=rect.height-2-th;
    tip.style.left=left+"px";tip.style.top=top+"px";
  }
  function hideTip(){if(tip)tip.hidden=true;}
  var svg=blk.querySelector(".twmap");
  if(svg){
    svg.addEventListener("mouseover",function(e){var g=e.target.closest&&e.target.closest(".cty");if(g&&svg.contains(g)){showHov(g);showTip(g,e);}else{hideHov();hideTip();}});
    svg.addEventListener("mousemove",function(e){var g=e.target.closest&&e.target.closest(".cty");if(g&&svg.contains(g))showTip(g,e);});
    svg.addEventListener("mouseleave",function(){hideHov();hideTip();});
    svg.addEventListener("focusin",function(e){var g=e.target.closest&&e.target.closest(".cty");if(g){showHov(g);showTip(g,null);}});
    svg.addEventListener("focusout",function(){hideHov();hideTip();});
  }
  blk.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".cty,.mchip");if(t&&blk.contains(t))pickCounty(t.dataset.key,true);});
  blk.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target.closest&&e.target.closest(".cty");if(t){e.preventDefault();pickCounty(t.dataset.key,true);}});
  renderMapList();
}

{id:"s1",title:"誰來決定哪些記憶被放進影片",dek:"一群長輩在社區據點學拍片，把搬遷前的街區留在手機裡。",tags:["地方記憶","都市發展"],
 story:[

{id:"s2",title:"週日，他們把一週的話說給觀眾聽",dek:"週日休假的移工與劇場工作者，把工作與生活經驗編成短劇。",tags:["移民","勞動與人權"],

"誰來決定哪些記憶被放進影片":"Who decides which memories go into the film","一群長輩在社區據點學拍片，把搬遷前的街區留在手機裡。":"A group of elders learn to shoot video at a community hub, keeping the pre-demolition streets in their phones.","街屋一戶一戶搬走之後，據點的社工發現，長輩聊起舊事時總是說得很熱鬧，可是講完就散了，沒有地方留下來。影像小組在據點借了一間小教室，每週三下午開課，第一堂課只有一個要求：帶一張舊照片來。":"After the shophouses emptied one household at a time, the hub's social worker noticed that elders spoke vividly about the old days, but once they finished the talk scattered and nothing was kept. The video group borrowed a small classroom at the hub, meeting on Wednesday afternoons; the first class had one requirement: bring an old photograph.","阿霞帶來一張碼頭邊的合照。照片裡的雜貨店早就拆了，她叫不出店名，卻記得每個人站的位置。小組把照片掃描後投在牆上，請她一個一個講。講到第三個人，她停了一下，說這個人後來搬去外地，再也沒有聯絡。":"A-hsia brought a group photo taken by the wharf. The grocery store in it was long demolished; she could not name it but remembered where everyone stood. The group scanned the photo and projected it on the wall, asking her to go person by person. At the third person she paused, and said this one later moved away and was never in touch again.","課程後半段，每位學員用手機拍一段短片，剪接由自己決定，小組只示範軟體怎麼用。六支片子在據點放映那天，有人看到一半走出去，說需要一點時間。回來的時候，他問可不可以再放一次。":"In the second half of the course each learner shot a short video on a phone, deciding the editing themselves while the group only demonstrated the software. On the day the six films screened at the hub, one person walked out halfway, saying he needed a moment. When he came back, he asked if it could be played once more.","影像小組召集人":"Video group convener","為什麼從照片開始？":"Why start from photographs?","照片是最不需要解釋的東西。長輩不用先學會『創作』這個詞，只要說這是誰、站在哪裡，故事自己就會出來。":"A photo is the thing that needs the least explanation. Elders don't have to learn the word 'creation' first; they just say who this is and where they stood, and the story comes out on its own.","剪接的時候意見不同怎麼辦？":"What do you do when you disagree over the editing?","有一支片子，我覺得某段太長，建議剪掉。作者說不要，那段是他太太的聲音。我就閉嘴了。後來放映時，那一段是全場最安靜的。":"On one film I thought a passage ran too long and suggested cutting it. The maker refused — that part was his wife's voice. I shut up. At the screening, that passage was the quietest moment in the room.","參與者阿霞":"Participant A-hsia","一開始為什麼願意來？":"Why were you willing to come at first?","社工說有地方可以聊天，我就來了。聽說要學拍片，我以為很難，結果第一天只是看照片。":"The social worker said there was a place to chat, so I came. When I heard we'd learn to shoot video I thought it would be hard, but the first day was just looking at photos.","看到自己的片子在牆上放，是什麼感覺？":"How did it feel to see your own film on the wall?","很怪。我平常不會看自己，那天看了好幾次。有人說拍得好，我說不是我拍得好，是那個地方本來就很好。":"Strange. I don't usually look at myself, but that day I watched several times. Someone said it was well shot; I said it wasn't me shooting well, that place was just good to begin with.","參與者老陳":"Participant Old Chen","你有什麼擔心嗎？":"Did you have any worries?","我怕片子放到網路上，鄰居會知道補償的事。所以我只同意在據點放。他們有再問我一次，我才放心。":"I was afraid that if the film went online, neighbours would learn about the compensation. So I only agreed to show it at the hub. They asked me once more, and then I felt safe.","週日，他們把一週的話說給觀眾聽":"On Sunday, they tell the audience a week's worth of words","週日休假的移工與劇場工作者，把工作與生活經驗編成短劇。":"Migrant workers off on Sunday and theatre workers turn their work and life experiences into short plays.","每個週日下午，車站旁的一間排練室會坐滿人。有人剛下夜班，有人從很遠的縣市搭車過來。他們脫了外套，圍成一圈，先玩二十分鐘的遊戲，再開始講這一週發生的事。":"Every Sunday afternoon a rehearsal room by the station fills up. Some have just come off a night shift, some have travelled from far-off counties. They take off their coats, form a circle, play games for twenty minutes, then start telling what happened this week.","劇團的導演不寫劇本。她請大家把想講的事寫成三句話，再從裡面挑一句，變成一場戲。有一場戲只有一個動作：一個人不停地把雨傘撐開、收起，旁邊的人輪流問他『還要再等嗎』。":"The company's director writes no script. She asks everyone to put what they want to say into three sentences, then pick one and turn it into a scene. One scene had a single action: a person opening and closing an umbrella over and over, while the others took turns asking him, 'Still waiting?'","演出在廣場邊的空地。台下有路過的人，有朋友，也有雇主派來的司機。最後一場謝幕時，沒有人鞠躬，他們只是站著，看著觀眾，直到有人先鼓掌。":"The performance was on open ground beside the plaza. In the audience were passers-by, friends, and a driver sent by an employer. At the final curtain no one bowed; they just stood, looking at the audience, until someone began to clap.","劇團導演":"Theatre director","你怎麼決定演什麼？":"How do you decide what to perform?","我不決定。我只負責問問題，例如『這句話如果是一個動作，會是什麼』。答案都在他們身上。":"I don't. I only ask questions, like 'if this sentence were an action, what would it be?' The answers are all in them.","有沒有遇過不想公開的事？":"Has anyone had something they didn't want made public?","有。有些事他們說完就想收回去。我們的規則是，說在排練室裡的話，沒有人同意就不會演出來。":"Yes. Some things they want to take back after saying them. Our rule is that what's said in the rehearsal room is never performed without consent.","參與者小安":"Participant Xiao-an","為什麼週日還要花時間來排練？":"Why spend your Sunday rehearsing?","週日是我唯一可以說話說很久的日子。平常說的都是工作上的句子。":"Sunday is the only day I can talk at length. The rest of the week I only speak work sentences.","演出之後有什麼改變？":"Did anything change after the performance?","有一個路人跟我說，他以前以為我們都不太說話。我說我們很會說，只是你沒有聽到。":"A passer-by told me he used to think we didn't talk much. I said we talk plenty — you just hadn't heard it.","沿著一條看不見的水走":"Walking along an unseen stream","一條被加蓋的舊水圳，成了孩子與居民一起行走的路線。":"An old covered-over irrigation channel becomes a route children and residents walk together.","水圳在六十年前被蓋住了，現在上面是停車格和騎樓。要找到它，得看地圖，也得看房子的方向。老一輩的人說，下雨的時候，某幾個轉角的地面會先濕。":"The channel was covered over sixty years ago; above it now are parking spaces and arcades. To find it you have to read a map, and also read the way the houses face. The older generation say that when it rains, the ground at certain corners goes wet first.","行走團第一次帶小學生走這條路線，沒有講解，只發一張空白地圖。孩子們沿路用腳步、粉筆和聲音標記他們覺得水應該經過的地方。走到一半，有個孩子蹲下來，把耳朵貼在地上，說聽到了。":"The first time the walking group led primary-school pupils along the route, there was no explanation — just a blank map each. Along the way the children marked, with footsteps, chalk and sound, where they thought the water should pass. Halfway, one child crouched, put an ear to the ground, and said they could hear it.","後來學校把這些地圖貼在走廊上，居民路過時會停下來看。有位阿公指著其中一張，說他小時候在這裡抓過魚，只是這次，他終於知道孩子畫的轉彎是對的。":"Later the school put these maps up along the corridor, and residents passing by would stop to look. One grandfather pointed at one of them and said he had caught fish here as a child — only this time he finally knew the children's drawn turn was right.","行走團成員":"Walking-group member","為什麼不先告訴孩子水圳在哪裡？":"Why not tell the children where the channel is first?","答案先給了，他們就只是在確認。我們想要的是他們自己找，找錯也沒關係。":"Give the answer first and they're only confirming it. We want them to find it themselves — getting it wrong is fine too.","最難的地方是什麼？":"What was the hardest part?","馬路。很多路段要穿越車流，我們得拜託家長志工一起顧。這比藝術本身還花時間。":"The roads. Many stretches cross traffic, so we had to ask parent volunteers to help watch. That took more time than the art itself.","小學老師":"Primary-school teacher","孩子有什麼反應？":"How did the children react?","他們開始注意地上的東西，排水孔、地磚的縫。回家還會問爸媽『這裡以前是不是有水』。":"They started noticing things on the ground — drains, the gaps between tiles. At home they'd even ask their parents, 'was there water here before?'","社區阿公":"Community grandfather","看到孩子畫的地圖，你想到什麼？":"What did the children's maps make you think of?","想到以前。我說不出來，就指給他們看。他們聽得很認真，我就講了很久。":"The old days. I couldn't put it into words, so I pointed it out to them. They listened so earnestly that I talked for a long time.","把一輩子的路線縫成一塊布":"Stitching a lifetime's routes into one cloth","長者用針線記下年輕時的工作與搬家路線，拼成共同的布地圖。":"Elders record the work and moving routes of their youth in needle and thread, piecing together a shared cloth map.","據點的角落有一張大長桌，桌上永遠有幾團線。每週二上午，十來位阿嬤會到這裡，不是來學刺繡，而是來『補東西』。老師說，補東西是她們最熟的事，所以那就從補開始。":"In a corner of the hub is a big long table, always with a few balls of thread on it. Every Tuesday morning a dozen or so grandmothers come — not to learn embroidery, but to 'mend things'. The teacher says mending is what they know best, so it starts from mending.","有一天，老師請大家用線畫出自己年輕時走過的路。有人從工廠走到宿舍，有人從娘家走到夫家，有人一輩子只在三條街之間來回。針腳一歪，大家就笑，說這條路本來就不直。":"One day the teacher asked everyone to draw, in thread, the routes they walked in their youth. One went from the factory to the dormitory, one from her parents' home to her husband's, one spent a lifetime going back and forth among three streets. When a stitch went crooked, everyone laughed and said the road was never straight to begin with.","六十幾塊小布被縫在一起，成了一張大地圖。展出那天，一位阿嬤站在自己那一塊前面，沒有說話。旁邊的人問她在看什麼，她說，我在看我走過的路，原來這麼小，又這麼長。":"Sixty-odd small cloths were sewn together into one big map. On opening day a grandmother stood before her own piece, saying nothing. Asked what she was looking at, she said: I'm looking at the road I walked — so small, it turns out, and so long.","課程老師":"Course teacher","為什麼從『補』開始？":"Why start from 'mending'?","她們不覺得自己會創作，但補東西做了五十年。我只是請她們把同樣的手，用在另一件事上。":"They don't think they can create, but they've mended things for fifty years. I just asked them to use the same hands on something else.","有沒有遇到不想講的事？":"Was there anything they didn't want to talk about?","有。有人縫到一半，線就停了。我們不問，等她自己想繼續。":"Yes. Someone stopped mid-stitch and the thread just stopped. We don't ask; we wait until she wants to continue.","參與者阿嬤":"Participant grandmother","你縫的是哪一段路？":"Which stretch of road did you stitch?","從工廠走回宿舍的那條。每天天黑才走，很怕。我縫得很細，因為走了很多次。":"The one from the factory back to the dormitory. I walked it only after dark, very scared. I stitched it finely, because I walked it so many times.","看到自己的布被掛起來，你覺得呢？":"How did you feel seeing your cloth hung up?","我以前做的東西都是別人在用，這次是第一次，是給別人看的。":"What I made before was always for others to use; this is the first time it's for others to look at.",

    var o=WALKED.has(n)?WALKED.get(n):n.nodeValue;
    var key=o.trim();if(!key)return;
    if(lang==="en"&&D[key]!==undefined){
      WALKED.set(n,o);
      var lead=o.match(/^\s*/)[0],trail=o.match(/\s*$/)[0];
      n.nodeValue=lead+D[key]+trail;
    }else if(WALKED.has(n)){n.nodeValue=WALKED.get(n);}

      var el=els[i],store="data-zh-"+a;
      var o=el.hasAttribute(store)?el.getAttribute(store):el.getAttribute(a);
      if(o===null)continue;
      if(lang==="en"&&D[o]!==undefined){el.setAttribute(store,o);el.setAttribute(a,D[o]);}
      else if(el.hasAttribute(store)){el.setAttribute(a,o);}
    }

var TERMS=[{"id":"issue-art","g":"A","zh":"議題本位藝術","en":"Issue-based art","short":"定義：以一個具體的社會議題為出發點與核心的藝術創作或計畫，用議題（而非風格或媒材）來界定作品。","long":["在這個平台裡，議題本位藝術指創作或計畫從具體的社會議題出發，例如環境、遷村、移工、社宅，而不只是用風格或媒材來分類。它包含居民一起參與的計畫，也包含以議題為題材的個人創作。","這是平台為了收錄案例而採用的工作定義。英文的 issues-based art education 在藝術教育領域已有成熟定義（見下段），但中文「議題本位藝術」當作泛稱時較鬆散；台灣學界常用的相近說法是「藝術介入」。有研究指出，這個中文詞的使用多建立在模糊的共識上，也和社會參與式藝術不完全相同。","在藝術教育的學理上，這個取向有更明確的根基。戴博拉·史密斯（Deborah Smith-Shank）在《國際藝術教育學刊》（2011）指出，『議題本位的藝術教育』是一種跨領域教學法：教師先帶出一個學生熟悉的重要社會議題（如生態、和平、核能，對年幼學生也可以是『早餐為何重要』或『玩具為何分男女』），再讓學生自己透過地理、歷史、科學等多元途徑調查——研究沒有預設程序，過程本身就是學會創作、談論與批判世界的方式。她主張以『物質文化』（material culture）為基礎：打破藝術與工藝、高雅與通俗的階級，讓學生從自身的地理、性別、社經位置出發，學會『解碼與編碼』身邊的物件。這條路特別重視認同，以及常被忽略的弱勢與女性聲音，核心提問是：『為何這重要？誰說它重要？弱勢與女性的聲音在哪？這滿足了誰的利益？』它內容豐富卻也有風險——教師不一定握有所有答案，而是與學生協同探究。","在國際藝術教育文獻裡，這個取向有明確的定義與操作方式。Atkinson（2004）把議題本位藝術教育界定為『一種教學法與實踐，學生透過藝術行動探索社會、文化與個人議題』，屬後現代藝術教育，把焦點從形式移向與當代生活相關的內容。Li（2018）以一堂談種族議題的中學藝術課示範了具體流程：先用當代／行動主義作品引發討論，提問時多用開放問題（你看到什麼？藝術家為何這樣畫、為何選這個顏色或字級？）而不急著給答案；接著讓學生以自己的方式創作行動海報、而非照抄藝術家；最後以『藝廊漫步＋便利貼互評＋分享創作過程』收尾，並提醒彼此尊重不同觀點。"],"ed":true,"src":["zhang","smithshank","li2018"],"cases":["k01","k02","k03","k04","k13","k14","k20","k21","k27","k31","k37","k38","k39","k57","k58","k05","k40","k49","k78"],"rel":["sea","community-art","art-ed"]},{"id":"sea","g":"A","zh":"社會參與式藝術","en":"Socially engaged art","short":"定義：把人與社群的實際參與納為創作一部分、以協作與互動為方法的藝術實踐，過程往往與成品同等重要。","long":["Tate 的藝術名詞表說明，這類實踐具有協作性，常帶有參與性，並把「人」當作作品的媒材。任何涉及人與社群進行討論、合作或社交互動的藝術形式都可以納入。共同創作的過程有時和作品本身一樣重要，藝術家也常需要長時間融入社群。","在台灣，有研究指出這類實踐是 1990 年代後期以來的趨勢，與後解嚴時期的在地認同、社區總體營造相呼應。另一篇研究提醒，常見的「藝術介入」一詞與它不完全相同，社會參與式藝術更強調人與社群之間的討論與互動。","在藝術教育的脈絡裡，社會參與式藝術也發展成一套取向。Chung 與 Li（2020）引用 Schlemmer 等人的定義，指社會參與式的藝術活動『超越製作賞心悅目的作品，轉而促成一種整合藝術實踐、教學歷程與創造可能、以追求更公平世界的對話』；它常與『社會正義藝術教育』（social justice art education）並提——鼓勵學生從自身的身分與經驗出發，調查不公義的社會處境、以創作想像更公平的社會。該文以小學生透過街頭藝術家 Skid Robot 的作品認識無家者議題、再以版畫為無家者『畫一個家』為例。","Pablo Helguera 在《社會參與藝術的十個關鍵概念》（吳岱融、蘇瑤華譯，北藝大，2018）第一章「定義」提出一個「暫時性的定義」：所有藝術都是為與他人溝通而造、因此都是「社會的」，但社會參與藝術的關鍵在於真實的「社會交往」（social intercourse）。他區分「象徵的」（symbolic）與「真實的」（actual）實踐——社會參與藝術建立在真實（而非想像或假定）的社會行動之上，並援引哈伯馬斯（Jürgen Habermas）《溝通行動理論》（1981）的「溝通行動」為據；他也把「關係美學」「社區藝術」「合作式藝術」「參與式藝術」「對話式藝術」「公共藝術」列為這一波實踐的多個別名。"],"src":["tate","dong","zhang","chungli2020","lupy","helguera","likueipi"],"cases":["k79","k13","k14","k12","k20","k37","k34","k57","k17","k40","k49","k51","k60","k61","k63","k65","k78","k66","k68","k67","k70","k75","k76","k77"],"rel":["community-art","co-creation","issue-art"],"filter":["practice","社會參與式藝術"]},{"id":"community-art","g":"A","zh":"社區藝術","en":"Community art","short":"定義：在特定社區中進行、與居民互動或共同完成的藝術活動。","long":["Tate 把社群藝術（community art）描述為在社群環境中進行、強調與社群互動或對話的藝術活動。它被列為社會參與式實踐的相關概念，但不是同一個詞。","在台灣，社區藝術常和「社區營造」一起被提起。社區營造是文建會自 1994 年推行的政策，期望居民共同解決生活問題、加強彼此連結，文化與藝術在其中扮演重要角色。平台把以社區居民為主要參與者的計畫標為社區藝術。"],"src":["tate","crossing","liao135"],"cases":["k01","k07","k23","k10","k33","k03","k52","k54","k09","k11","k25","k26","k29","k41","k46","k48","k49","k51","k58","k61","k62","k78","k72","k76","k77"],"rel":["sea","empowerment"],"filter":["practice","社區藝術"]},{"id":"public-art","g":"A","zh":"公共藝術","en":"Public art","short":"定義：設置於公共空間、供公眾接觸的藝術；在台灣，公有建築與重大公共工程依法須辦理。","long":["台灣的公共藝術有法律依據。文化藝術獎助及促進條例第 15 條規定，公有建築物及重大公共工程的興辦機關應辦理公共藝術，營造美學環境，辦理經費不得少於造價的百分之一（以民國 110 年修正版本為準）。","依公共藝術設置辦法，設置計畫要包含民眾參與計畫，也可以採公開徵選。廣義上，Tate 把公共藝術簡單描述為位於公共領域的藝術，所以不是所有公共空間的藝術都受這個法規管理。"],"src":["law15","pa","tate","leeyh"],"cases":["k02","k13","k20","k28","k52","k12","k18","k24","k44","k63"],"rel":["sea","curation"],"filter":["practice","公共藝術"]},{"id":"art-ed","g":"A","zh":"藝術教育","en":"Arts education","short":"定義：透過藝術的學習與創作培養美感、表達與理解能力的教育，常在學校或社區進行。","long":["教育部在政策上較常用「美感教育」，並說明它是培育美感素養的實踐，引導學習者覺察、探索、感受、認識並實踐美。該計畫文件沒有單獨定義「藝術教育」，但引用 2019 年世界藝術教育聯盟的宣言，認為藝術教育是促進社會文化永續發展的重要支柱。","平台裡，以學生或學習者為主要參與者、並以學習和美感培養為目的的計畫，會標為藝術教育，例如國中生參與的官田有妖怪、玫好時光。"],"src":["moe","liao135"],"cases":["k31","k04","k21","k09","k37","k38","k39","k59","k43","k50","k64","k78","k66","k68","k67","k76"],"rel":["art-to-village","outreach","pedagogical-art","usr"],"filter":["practice","藝術教育"]},{"id":"pedagogical-art","g":"A","zh":"教育性藝術計畫","en":"Pedagogical art project","short":"定義：把教學與教育過程本身當作創作媒介與作品形式的藝術計畫。","long":["在平台的案例中，義家藝館是例子。GPI 政府出版品資訊網 2022 年的書評，把吳岱融的《當教學成為形式》稱為「一個教育性藝術計畫的生成與反響」，書評說這個計畫由北藝大藝教所與臺北榮譽國民之家合作，參與者包括修課學生、藝術家教師與榮家的義士居民及行政團隊；計畫團隊網站也寫明這是搭配選修課程的教學暨創作計畫。","國際上有相近的討論。Paul O'Neill 與 Mick Wilson 編的《Curating and the Educational Turn》出版公告，把近年將教學法納入藝術與策展實踐的現象，描述為藝術朝向教育的典範性轉向。Claire Bishop《Artificial Hells》的書籍介紹也說，全書最後討論當代藝術家的長期教育計畫，並舉 Thomas Hirschhorn、Tania Bruguera、Pawel Althamer 與 Paul Chan 為例。","平台提醒：沒有查到中文或英文來源，為「教育性藝術計畫」或 pedagogical art project 給出正式定義；這個詞是編輯整理，英文也是平台的對應譯名，沒有來源逐字使用。它和「藝術教育」的區分也是平台的判斷：藝術教育以學習與美感培養為目的，教育性藝術計畫則把教學過程當作作品的一部分；兩者在實務上常重疊，義家藝館既是課程也是創作。"],"ed":true,"src":["gpi","eduturn","bishop"],"cases":["k37"],"rel":["art-ed","sea","co-creation"]},{"id":"curation","g":"A","zh":"策展","en":"Curation","short":"定義：規劃一檔展覽的工作：訂定主題、挑選作品、安排詮釋與呈現方式。","long":["ART.ZIP 的文章指出，curator 一詞源自拉丁語 cura，原意是照料與保管，後來才指負責藏品保管、研究並策劃展覽的人。當代藝術裡，策展人的工作包括展覽策劃、預算與日程管理、借展洽談、研究與寫作，並被比喻為連結藝術界與大眾的「翻譯」。","平台把以展覽形式呈現、由策展團隊規劃的計畫標為「策展與展覽」。官田有妖怪就是一例，自由時報稱之為「策展」，由南藝大藝術史系團隊規劃。"],"src":["artzip","ltn","lu167"],"cases":["k79","k31","k10","k15","k18","k35","k36","k55","k57","k59","k05","k17","k30","k39","k45","k46","k47","k64","k65","k78"],"rel":["public-art","festival"],"filter":["practice","策展與展覽"]},{"id":"festival","g":"A","zh":"藝術節與藝術祭","en":"Arts festivals","short":"定義：在特定期間、多以某個地方為舞台，集中展演、工作坊與活動的藝術活動。","long":["一項台灣研究指出，各地藝術祭持續讓參與者重新感受地方的人文與環境，並重新建構地方文化的歷史脈絡。另一篇論文把藝術節與文化交流、藝術教育連結在一起討論。","平台把藝術節和駐村放在同一類，因為案例中兩者常一起出現，例如浪漫台三線藝術季、成龍濕地環境藝術節。"],"src":["dong","liu"],"cases":["k22","k23","k27","k07","k32","k34","k53","k54","k56","k58","k16","k19","k41","k42","k45","k46","k47","k48","k49","k50","k62","k78","k79"],"rel":["residency","land-art"],"filter":["practice","藝術節與駐村"]},{"id":"residency","g":"A","zh":"駐村","en":"Artist residency","short":"定義：藝術家在一段期間內進駐某地、就地進行研究與創作的機制。","long":["駐村指藝術家在一段期間內進駐某個地方，進行藝術研究與創作。以歌德學院（台北）的駐村計畫為例，藝術家可以駐村最多三個月，目的是進行藝術研究、創作新作品，並促成兩地的交流。","在議題本位的計畫裡，駐村常讓藝術家有時間認識地方與居民，再創作。平台標為駐村的案例，像補龍計畫（三位原住民青年藝術家駐村青埔）、亞當計畫。"],"ed":true,"src":["goethe","huangjc"],"cases":["k79","k19","k16","k23","k34","k56","k22","k27","k32","k41","k42","k45","k46","k47","k48","k49","k50","k53","k54","k58","k62","k78"],"rel":["festival","fieldwork"],"filter":["practice","藝術節與駐村"]},{"id":"co-creation","g":"B","zh":"共創／共同創作","en":"Co-creation","short":"藝術家與參與者一起決定並完成作品，而不是單方面創作。","long":["共創指作品由藝術家和參與者共同發想、製作，甚至共同決定方向。參與的程度可以差很多：有的只是請居民提供物件或故事，有的讓居民參與決策。","平台提醒，報導寫「居民參與」不一定等於「共同決策」。這也是為什麼部分案例的備註會寫「居民在決策上的角色，報導沒有說明」。"],"ed":true,"src":[],"cases":["k17","k01","k20","k13","k37","k34","k54","k57","k09","k23","k41","k61","k65","k78"],"rel":["sea","community-art"]},{"id":"fieldwork","g":"B","zh":"田野調查","en":"Fieldwork","short":"走進現場，用觀察、訪談等方式直接蒐集資料。","long":["田野調查是在真實的生活環境中，而不是在實驗室或教室裡，觀察並蒐集人、文化與自然環境資料的過程。","平台的深度報導構想以田野訪談為基礎，記錄計畫的形成、合作與遭遇的困難。部分案例的展前也做過田野訪調，例如 Jalan-Jalan 移路相伴特展。"],"src":["ccbc"],"cases":["k79","k05","k29","k16","k32","k34","k37","k59","k41","k42","k47","k08","k78"],"rel":["oral-history","residency"]},{"id":"oral-history","g":"B","zh":"口述歷史","en":"Oral history","short":"請人講述親身經歷並記錄保存，讓一般人的記憶成為歷史資料。","long":["口述歷史是一種歷史與社會科學的研究方法，通常由訪談者和敘述者坐下來交談，記錄並保存對方的生命故事，或某個事件、某段人生的記憶。它以人為中心，讓原住民、婦女、移民、勞動者等較少被書寫的群體也能講述自己的過去。","許多案例以居民口述為素材，例如侯淑姿以劉奶奶的口述為主軸的高雄眷村三部曲，以及廣慈社宅取材自居民口述的夢想。"],"src":["ohc"],"cases":["k79","k08","k13","k10","k03","k59","k04","k26","k54","k07","k61","k78"],"rel":["local-memory","fieldwork"]},{"id":"photovoice","g":"B","zh":"影像發聲","en":"Photovoice","short":"讓參與者用拍照記錄自己的生活，再一起討論並對外發聲的方法。","long":["Photovoice 是一種參與式質性研究方法，由 Caroline Wang 與 Mary Ann Burris 於 1997 年正式提出。參與者針對主題拍攝自己的生活，再以團體討論挑選照片、寫說明，最後以展覽或報告呈現，目的是讓社群記錄並反思自身的優勢與關切，並把成果傳達給政策制定者。","週日限定風景移工國際攝影獎以 Photovoice 理論為基礎；由拍攝者決定拍什麼、希望外界怎麼認識自己。"],"src":["casrai"],"cases":["k14"],"rel":["sea","migrant-workers"]},{"id":"lumbung","g":"B","zh":"Lumbung（共享穀倉）","en":"Lumbung","short":"源自印尼的概念：社群把收成集中保存，再依共同決定分配。","long":["lumbung 直譯為「穀倉」，源自印尼農村的集體建築形式：社群把收成集中儲存，依共同決定的標準分配，作為未來的共同資源。documenta fifteen 由印尼集體 ruangrupa 擔任藝術總監，以此為實踐起點，核心原則包括集體性、資源累積與公平分配。","潮濕的複寫本（基隆）採 Lumbung 的方法，把地方文化資料與田野經驗分享給創作者。"],"src":["doc15"],"cases":["k29"],"rel":["co-creation","fieldwork"]},{"id":"art-to-village","g":"B","zh":"藝術下鄉／藝術進鄉","en":"Art to the countryside","short":"把藝術活動帶到鄉鎮與偏鄉。「藝術下鄉」常見於縣市政府的巡迴展演，「藝術進鄉」是南藝大一項計畫的名稱。","long":["「藝術下鄉」在地方政府的巡迴展演中仍在使用。例如苗栗縣政府自 108 學年度起辦理「藝術下鄉」，以學生為主、跨校合作，2026 年首場在苑裡國小舉行，有 11 所學校師生演出，也邀請社區與家長參與（中時新聞網報導）。國藝會補助成果檔案庫也有以「藝術下鄉」為名的計畫，例如台灣芭蕾舞團 108 年（2019）在台東縣多所國中小進行示範教學與演出，目標是縮短城鄉的藝文差距，並讓民眾知道芭蕾不一定要進劇院才能欣賞。臺東縣政府文化處也以「藝術下鄉」為名辦理系列活動，包括在民宅庭院舉辦的「藝起來我家」、「表演藝術下鄉」與「行動美術館」等；文化處長說明，這是為落實縣長提倡的藝文平權、拉近城鄉文化距離，並提供在地藝文團隊表演平台（天下雜誌微笑台灣 2022 年的贊助內容，文末標示「臺東縣政府 廣告」，屬縣府觀點的廣編稿，不能當作獨立來源）。","「藝術進鄉」目前只查到是計畫名稱，不是通用詞。依南藝大電子報，它是《藝務新貌：老舊偏鄉好藝術之創新與翻轉計畫》的一部分，隸屬教育部高教深耕計畫「善盡社會責任」主軸，由藝術史學系許遠達老師授課。在官田有妖怪中，大學生帶官田國中生認識埤塘傳說、繪製角色，再放進展覽。","平台提醒：本次查閱的來源都沒有給出「藝術下鄉」的正式定義，也沒有說明它和「藝術進鄉」的差別（臺東縣文化處的說法只交代該縣活動的理念）；兩個詞哪個更常用、語感是否不同，目前沒有來源可證實，這裡不下結論。學界較常用的是「藝術介入」，張晴文指出台灣所說的「介入」不完全等同於社會參與式藝術。"],"ed":true,"src":["miaoli","ncafroc","taitung","epaper","ltn","zhang"],"cases":["k31","k34","k24"],"rel":["art-ed","outreach","cultural-equity","usr","ponds","sea","advertorial"]},{"id":"outreach","g":"B","zh":"藝術推廣","en":"Arts outreach","short":"把藝術帶給更多一般民眾，增加接觸與欣賞的機會。在台灣的法規與補助中常見，但查到的法規都沒有單獨給出定義。","long":["「推廣」在台灣的法規裡是常見用語。文化藝術獎助及促進條例把文化藝術的「創作、展演及推廣」並列為事務範圍，並規定主管機關得獎勵或補助「創作、發展及推廣」；條文只使用這個詞，沒有另行定義（民國 110 年修正版本）。教育部的各級學校藝術推廣教育實施辦法第 2 條則說明學校得「為普及藝術欣賞人口，提升藝術素養，得對社會大眾辦理各類藝術推廣教育」，這是查到最接近目的說明的條文，但同樣不是定義。","政策上的用法大多指「把作品或團隊送到觀眾面前」。例如 2024 年文化部的「藝術入校」補助，讓藝文團體申請進入學校，公視報導用「推廣」描述這件事，也提到團體希望補助能持續，推廣與傳承才有長久的效果；報導沒有給出定義。","平台提醒：沒有來源說明「藝術推廣」與「藝術教育」或「藝術下鄉」有何不同，三者在實務上常重疊（例如台灣芭蕾舞團的計畫名稱就同時含有「藝術下鄉」與「藝術推廣」）。以下只是平台的工作區分，不是來源的說法：推廣偏重讓更多人接觸作品，參與式藝術偏重居民參與創作的過程。這個區分是否適用，請讀者自行判斷。"],"ed":true,"src":["ctl","edact","pts","ncafroc"],"cases":[],"rel":["art-ed","art-to-village","sea","festival"]},{"id":"land-art","g":"B","zh":"大地藝術祭","en":"Land art festival","short":"把作品設置在鄉野與地方生活裡，並與居民長期合作的藝術祭。","long":["最常被提起的是日本的越後妻有大地藝術祭，由藝術總監北川富朗於 2000 年起策劃，每三年舉辦一次。作品多為現地製作，也有藝術家利用廢校、空屋等閒置空間創作。北川希望藝術為被遺忘的村落注入活力，因此長年與居民溝通互動。","注意，「大地藝術祭」與英文 land art（大地藝術）不完全相同，這裡指的是前者。目前案例庫中有一例直接使用此詞：2026 年台南官田的「Mattauw 大地藝術季」（K32），目前標為待查證。"],"src":["land"],"cases":["k32"],"rel":["festival","residency"]},{"id":"empowerment","g":"B","zh":"培力（賦權）","en":"Empowerment","short":"讓人或社區逐步有能力自己提出問題、解決問題。","long":["一篇研究把培力（empowerment）說明為：社區透過完整的支援系統與培力過程，逐步具備自行解決或改善所處環境問題的能力。在社區層次上，它強調社區主動提案、自主處理，而不是由上而下主導。","培力是否真的達成，是不容易衡量的問題。例如未來學家那篇評論就質疑，以 KPI 衡量社群培力是否恰當。"],"src":["lin"],"cases":["k18","k26","k34","k37","k51","k14","k78"],"rel":["community-art","sea"]},{"id":"social-housing","g":"C","zh":"社會住宅（社宅）","en":"Social housing","short":"政府興辦或獎勵民間興辦、專供出租的住宅。","long":["依住宅法第 3 條第 2 款，社會住宅指「由政府興辦或獎勵民間興辦，專供出租之用之住宅及其必要附屬設施」（民國 115 年 3 月 4 日修正版本）。","社宅常是議題本位藝術的場域，因為住戶來自不同背景，需要建立彼此的關係。平台裡的廣慈社宅、未來學家（台中社宅）都在社宅進行。"],"src":["housing"],"cases":["k13","k18","k12","k49","k63","k65","k77"],"rel":["public-housing","public-art"],"filter":["issue","社宅與居住"]},{"id":"public-housing","g":"C","zh":"平宅（平價住宅）","en":"Public housing (pingzhai)","short":"政府為低收入戶興建的住宅，台北安康平宅是全國規模最大的一處。","long":["平宅是政府為低收入戶興建的住宅。台北的安康平宅於 1975 年興建，共 1,020 戶，是全國規模最大的平價住宅；同年也安置了一批越南難僑。","報導也寫到平宅長期被汙名化，居民有時不願對外說出住址。2012 至 2013 年間，市府確立分三期改建為「興隆公共住宅」的方案。安康平宅「移動的自由」就是在居民搬遷前辦的展覽。"],"src":["ankang"],"cases":["k12"],"rel":["social-housing","local-memory"]},{"id":"homeless","g":"C","zh":"無家者／遊民","en":"Homeless people / street people","short":"泛指露宿街頭或沒有穩定住所的人；現行法規多用「遊民」，民間團體倡議正名為涵蓋更廣的「無家者」。台灣目前尚無專法明確定義。","long":["用詞上，中央社（2024-01-20）整理：『無家者、街友、寒士、城市流浪者都是遊民的代名詞』。政府與現行法規（如社會救助法、各地方《遊民安置輔導自治條例》）多沿用『遊民』；芒草心慈善協會等民間團體則倡議正名為『無家者』，以去除污名、並把定義擴大到不只露宿街頭的人。","依蕃薯藤 yam 新聞（2026-06-17）報導，芒草心專員王今暐說明研議中的《無家者專法》草案，擬把『無家者』擴大為五類：露宿街頭或公共場所者、居住於不宜人居住所者、安置於收容場所者、14 天內將被迫遷離而無替代方案者、因家暴等被迫逃離而無替代方案者，並涵蓋長期借住親友、頻繁更換暫住地的『居無定所者』。報導也指出致因不只是個人因素：受暴婦女的『隱性無家』、租屋市場歧視、安置資源城鄉落差、社會住宅等待過長等；台大社會系黃克先認為，台灣長期把無家者當成社福問題、而非住宅問題。","平台案例中，《貧窮人的台北》（K65）由向貧窮者學習行動聯盟自 2017 年起推動，讓無家者等貧窮經驗者以『創作者』身分訴說自己眼中的台北；給平凡人的萬華散策（K63）則有芒草心以無家者的紙箱創作參與。","要提醒的是：台灣目前尚無專法明確定義『無家者』，上述草案五類仍在立法倡議階段（國際人權兩公約審查曾要求政府於一年內制定專法）；衛福部或各縣市列冊遊民的正式人數統計，平台本次未取得可讀取的官方頁面，未列入。"],"ed":true,"src":["cnaHomeless","yamHomeless"],"cases":["k65","k63"],"rel":["public-housing","social-housing","migrant-workers"]},{"id":"juancun","g":"C","zh":"眷村","en":"Military dependents' village","short":"國軍及眷屬聚居的社區；許多老舊眷村已依條例改建，近年也以文化保存與活化的形式被重新看見。","long":["國軍老舊眷村改建條例第 1 條說明，立法目的包括加速更新國軍老舊眷村、興建住宅照顧原眷戶及中低收入戶，以及「保存眷村文化」（民國 96 年修正公報）。可見眷村同時是被改建的老舊社區，也被視為需要保存的文化。","眷村的基本定義在這裡是編輯整理，沒有直接引用定義條文。平台案例中，侯淑姿《高雄眷村三部曲》（K08）以居民口述記錄眷村改建與拆遷中的生活與離散記憶，眾人成莊（K44）、二村開門（K45）則把眷村遺構轉化為創作與展演空間。"],"ed":true,"src":["juan"],"cases":["k08","k44","k45"],"rel":["relocation","oral-history","veterans","local-memory"],"filter":["issue","身分與歷史記憶"]},{"id":"veterans","g":"C","zh":"榮民","en":"Veterans (rongmin)","short":"國軍退除役官兵的通稱；政策上由退輔會輔導，社會討論常談到老年照顧與身分認同。","long":["國軍退除役官兵輔導委員會的 109 年度施政計畫，把對榮民的服務分為就學、就業、就醫、就養與安養照顧、服務關懷等面向，其中關懷對象包括年長、獨居及弱勢榮民與遺眷，並推動榮家的長照服務與失智床位。計畫寫到預計安置公費就養榮民 3 萬 6,015 人，另有 19 萬 3,108 人支領退休俸或生活補助費；這兩個數字的對象不同，不能相加，文件也沒有列出榮民總人數。","在身分認同方面，政大廖元豪的國科會研究以法制切入，摘要指來自中國的榮民經歷不同時期的身分轉換，從「暫居到生根」、從「外人到國民」，英文摘要也提到部分榮民因本土化與去中國化的趨勢，感到自己被當成外人。這裡只讀到摘要，報告正文無法確認。","平台提醒：「榮民」在這裡是編輯整理的名詞，沒有引用定義條文；平台也不把它當成單一議題，而是身分群體，相關案例標在「身分與歷史記憶」議題下，例如義家藝館。"],"ed":true,"src":["vac","liao"],"cases":["k37","k49"],"rel":["juancun","local-memory","oral-history"],"filter":["issue","身分與歷史記憶"]},{"id":"ecomuseum","g":"B","zh":"生態博物館","en":"Ecomuseum","short":"在特定群落或地區的社會、文化與自然環境脈絡中，呈現當地歷史與傳統的跨領域博物館。","long":["中央研究院 AAT-Taiwan 藝術與建築索引典對這個詞的說明是：「在某特定群落或地區之社會、文化，和自然環境的背景脈絡中，呈現其歷史與傳統的跨領域博物館。」詞條的來源包括國家教育研究院樂詞網等。","平台的案例中，義家藝館的計畫構想把榮民之家轉化為「概念性生態博物館」；GPI 書評寫到計畫每年在國際博物館日將臺北榮譽國民之家轉化為這樣的空間。案例的來源沒有解釋這個詞，上面的定義是平台另外查到的，義家藝館是否完全符合這個定義，請讀者自行判斷。"],"ed":true,"src":["aatEco","gpi"],"cases":["k37"],"rel":["residency","local-memory","pedagogical-art"]},{"id":"installation","g":"B","zh":"裝置（裝置藝術）","en":"Installation art","short":"大型、混合媒材的作品，常為特定地點或短暫時間而作，整個空間就是作品。","long":["Tate 的藝術名詞表把裝置藝術描述為「large-scale, mixed-media constructions, often designed for a specific place or for a temporary period of time」，也就是大型、混合媒材、常為特定地點或限定時間而作的作品。Tate 還說，它是一個完整統一的體驗，而不是一組獨立作品的陳列，作品有時也被稱為「環境」。","平台的「藝術形式」篩選裡，「裝置」是最常見的形式之一，案例多半是在社區空間、公共空間或展間裡，用現成物、回收材料或居民提供的物件做成。「裝置」在這裡只是形式標籤，不代表作品有居民參與。"],"ed":true,"src":["tateInst"],"cases":["k02","k13","k17","k23","k34","k52","k56","k57","k58","k01","k06","k07","k09","k12","k18","k19","k20","k22","k24","k25","k26","k27","k29","k36","k42","k45","k46","k48","k49","k60","k62","k63","k65","k66","k68","k74","k75","k77"],"casesLabel":"部分標為「裝置」的案例（完整清單請用下方篩選）","rel":["sound-art","public-art"],"filter":["form","裝置"]},{"id":"sound-art","g":"B","zh":"聲音（聲音藝術）","en":"Sound art","short":"把聲音同時當作媒材和主題的藝術。","long":["Tate 的藝術名詞表把聲音藝術定義為「Art which uses sound both as its medium (what it is made out of) and as its subject (what it is about)」，也就是聲音既是創作的材料，也是作品談的內容。Tate 並追溯到 20 世紀初未來主義者 Luigi Russolo 的「noise machines」，以及 John Cage 1952 年的《4'33''》。","平台的案例裡，聲音多半和田野採集、口述訪談或地景結合，例如《眾聲象》以聲音採集和水管聲音裝置呈現成功鎮的海岸與港口。「聲音」在這裡是形式標籤，不是每個案例都符合 Tate 所說的「聲音藝術」。"],"ed":true,"src":["tateSound"],"cases":["k34","k32","k13","k26","k29","k04","k16","k18","k27","k40","k44","k45","k47","k48"],"casesLabel":"部分標為「聲音」的案例（完整清單請用下方篩選）","rel":["installation","fieldwork"],"filter":["form","聲音"]},{"id":"aerocene","g":"B","zh":"大氣世（Aerocene）","en":"Aerocene","short":"藝術家 Tomás Saraceno 發起的計畫，以不依賴氦氣、電池或太陽能板的漂浮雕塑為核心。","long":["MIT Arts 的專文說明，Aerocene 的作品是「emission-free floating sculptures」，以銀色與透明 Mylar 製成，設計成不靠氦氣、電池或太陽能板環繞地球，借風滑行，並由太陽與紅外線輻射維持浮力。發起人是藝術家 Tomás Saraceno，合作者包括 MIT 的氣象學家與研究員；2015 年 8 月團隊在索羅門群島測試，12 月作品在巴黎 COP21 氣候峰會期間展出。","在台灣，共織宇宙（K17）是這個計畫的本地版本。K17 的來源指出，作品屬藝術家「大氣世」計畫，台灣版本包含台灣民眾的作品。MIT 的專文沒有提到計畫是否開源，所以平台不寫這一點。"],"ed":true,"src":["mitAero"],"cases":["k17"],"rel":["sea","co-creation"]},{"id":"cultural-equity","g":"C","zh":"文化平權（藝文平權）","en":"Cultural equity","short":"保障人人平等參與文化的權利，不因身分、地域、年齡等條件而有差異。","long":["文化部的《推廣文化平權補助作業要點》第一點寫明目的是「推動、保障公眾平等之文化參與及文化近用權，且確保國人不因特定身分、社會性/別、身心狀況、年齡、地域、族群及其他條件等原因產生差異」。這是最接近定義的條文，要點本身沒有另外下定義。","「藝術下鄉」的相關說法也會用到這個詞，例如臺東縣政府文化處說明，活動是為落實縣長提倡的藝文平權、拉近城鄉文化距離，但那份來源是縣府廣編稿。要點檔案是台中市政府網站轉載的 PDF，不是文化部原站。"],"ed":true,"src":["ceq","taitung"],"cases":[],"rel":["art-to-village","outreach"]},{"id":"quake921","g":"C","zh":"九二一地震","en":"921 earthquake","short":"1999 年 9 月 21 日發生在台灣中部的大地震。","long":["國立自然科學博物館的 921 地震教育園區簡介寫道，地震發生在 1999 年 9 月 21 日凌晨 1 點 47 分，芮氏規模達到 7.3，造成 2400 多人死亡，上萬棟房屋倒塌。農業部農村發展及水土保持署的歷史影像平台另補充：震央在南投縣集集鎮（故又稱「集集大地震」），肇因為車籠埔斷層錯動，地震持續約 102 秒；死亡 2454 人、失蹤 29 人、受傷超過 1 萬人，房屋全倒 51,711 棟、半倒 53,768 棟（該頁數據為平台改寫自維基百科與重建計畫的整理，非原始官方統計）。","平台的案例中，「畫，25」九二一震後埔里展（K30）在地震 25 週年時，邀畫家回到埔里受災地創作；石岡媽媽劇團（K51）則是 921 後差事劇團在石岡、東勢災區辦民眾戲劇工作坊，由受災的客家婦女組成、延續至今的社區劇團。"],"src":["nmns921","ardswc921"],"cases":["k30","k51"],"rel":["local-memory"]},{"id":"gas-explosion","g":"C","zh":"高雄氣爆（81 氣爆）","en":"Kaohsiung gas explosions","short":"2014 年 7 月 31 日深夜，高雄因丙烯外洩發生的連環氣爆。","long":["公視新聞網 2024 年的回顧報導寫道，事故發生在 2014 年 7 月 31 日深夜，高雄市因石化原料丙烯外洩引發氣爆，造成 32 人死亡、321 人輕重傷，共 3140 多人受災。報導還提到，高雄市在 2015 年通過《高雄市既有工業管理自治條例》，2024 年管線數量從氣爆前的 89 條降到 71 條。","平台目前只讀到這一個可讀的來源。「81 氣爆」的稱法來自「記憶的漣漪」（K02）的報導，這份公視報導沒有使用這個說法。"],"src":["pts81"],"cases":["k02"],"rel":["local-memory","public-art"]},{"id":"cultural-health-station","g":"C","zh":"原住民族文化健康站（文健站）","en":"Indigenous Cultural Health Station","short":"原住民族委員會在部落與都會原住民聚落推動的長者照顧與文化傳承據點。","long":["行政院 2020 年的說明指出，原住民族委員會依據長期照顧十年計畫 2.0 的原住民族專章，以「族人照顧族人」、「因族因地制宜」的模式，在原住民族地區及都會原住民族聚落推動文健站。頁面稱文健站不只照顧長者，也是幼兒、青年及照服員學習族語和傳統文化的據點。","新北市原住民族行政局 2019 年的實施計畫補充：107 年起，原「原住民老人日間關懷站」更名為原住民文化健康站；服務對象是 55 歲以上健康、亞健康、衰弱的原住民長者及輕度失能長者，服務含到宅關懷、共餐、健康促進活動等。","平台的案例中，補龍計畫（K19）有一位藝術家引導文健站的長者，把埤塘生活經驗轉為版畫素材。這個詞條只說明文健站是什麼，不代表平台評價它的成效。"],"src":["eyWjz","ntpcWjz"],"cases":["k19"],"rel":["local-memory","community-art"]},{"id":"social-prescribing","g":"C","zh":"社會處方（社會處方箋）","en":"Social prescribing","short":"由醫療人員把人轉介到藝文、園藝、運動、共餐等社區資源，以促進身心健康。","long":["社會處方「旨在透過社區活動、生活支持及資源連結，有效提供個人化照護的實際需求，進而促進公眾健康與福祉」；此概念源自英國、已推行逾 30 年，在台灣全民健保制度下，醫師並未被授權開立「社會處方（箋）」。","中正大學 USR 研討會的報導（1111 新聞，2025 年）把這個理念描述為「強調以非藥物性、社會性支持資源促進身心健康」，轉介的資源包括藝文活動、園藝、運動、志工服務或共餐據點，並說這個理念起源於英國。","平台的案例中，廣慈社宅（K13）的工作坊名單裡有「社會處方箋」。報導沒有說明它是否就是這裡所說的概念，所以不能直接等同；以上兩篇來源也都是報導，不是官方定義。"],"ed":true,"src":["btTday","usr1111"],"cases":["k13"],"rel":["community-art","empowerment"]},{"id":"romantic-route3","g":"C","zh":"浪漫台三線","en":"Romantic Route 3","short":"2017 年起推動的客庄地區建設與文化活動計畫，並辦有浪漫台三線藝術季。","long":["行政院 2023 年的新聞稿寫道，蔡英文總統上任後，於 2017 年推動「浪漫台三線計畫」，以 4 年 20 億元推動；計畫在「台三線、六堆、台九線等地區」做基礎建設，之後接續「客庄 369 幸福計畫」（2020 年編列 25 億元）。政策目標是用新的概念推動客家文化活動，重新定義客家傳統。同一份新聞稿提到，當年的藝術季於 2023 年 6 月 24 日至 8 月 27 日舉行，以地景藝術與客家美食帶動客庄旅遊與地方創生。","平台的案例中，浪漫台三線藝術季（K22）是這個計畫的一部分。目前只有行政院這一份來源，頁面沒有說明台三線這條路本身的範圍與涵蓋縣市，平台也不另外補充。"],"ed":true,"src":["eyRom"],"cases":["k22"],"rel":["local-memory","festival"]},{"id":"solo-artist","g":"A","zh":"藝術家個人創作","en":"Individual artist's work","short":"定義：由藝術家獨立構思與完成、不以居民共同創作為前提的作品（平台用以與參與式實踐對照的分類）。","long":["這是平台自己的工作分類，不是學術或官方定義。平台把以藝術家個人創作為主、居民或社區沒有共同創作的案例標為「藝術家個人創作」，例如林純用個展《黑湧》與侯淑姿的《高雄眷村三部曲》。","這個標籤不代表作品與社會議題無關：兩個例子都處理環境或地方記憶，只是居民的角色是被描寫或被訪談的對象，不是共同創作者。平台收錄這類案例，是為了讓讀者能與參與式案例對照；標籤依案例來源的描述判斷，來源沒寫到居民參與，不等於實際上沒有。"],"ed":true,"src":[],"cases":["k06","k08","k55","k69","k70","k71","k72","k73","k74","k75"],"rel":["sea","co-creation","community-art"],"filter":["practice","藝術家個人創作"],"casesLabel":"標示為「藝術家個人創作」的案例（可用下方篩選看完整清單）"},{"id":"participation-ladder","g":"A","zh":"居民參與（參與的層次）","en":"Resident participation (levels of participation)","short":"定義：描述居民在計畫中參與程度高低的概念；從被告知、被諮詢到共同決定，Arnstein 的「參與階梯」是最常被引用的分類。","long":["Sherry Arnstein 在 1969 年的〈A Ladder of Citizen Participation〉（《Journal of the American Planning Association》第 35 卷第 4 期）提出八級階梯：1 操弄（manipulation）、2 治療（therapy）屬於「非參與」；3 告知（informing）、4 諮詢（consultation）、5 安撫（placation）屬於「形式參與」；6 夥伴關係（partnership）、7 權力授與（delegated power）、8 市民控制（citizen control）屬於「市民權力」。","平台的案例常寫「居民參與」，但來源很少說明參與到哪一級：是被訪談、參加工作坊，還是參與決定？所以平台沒有替案例套用這個階梯，案例頁的「居民如何參與」是照來源原文整理。這個階梯原本討論的是都市規劃與公共決策，延伸到藝術計畫是平台的類比，並非原文用法；本詞條讀到的是一份地方政府網站轉載的階梯摘要，不是 1969 年原文。"],"ed":true,"src":["arnstein"],"cases":[],"rel":["co-creation","empowerment","community-art"]},{"id":"art-intervention","g":"A","zh":"藝術介入","en":"Artistic intervention (yishu jieru)","short":"定義：台灣當代藝術常用語，指藝術進入社會、空間或社區的行動；其用法在學界並不一致。","long":["張晴文 2020 年在《清華藝術學報》的論文〈「藝術介入」的意涵與在地脈絡〉指出，1990 年代中期起台灣出現大量「藝術介入」的論述，但「介入」一詞多建立在模糊的共識上，與強調人和社區對話互動的社會參與式藝術並不完全等同。論文認為這個概念與解嚴後的民主化、高度資本主義化的社會條件有關，社區營造等文化政策也有強烈影響。","董維琇 2013 年的論文〈藝術介入社群〉則把它放在國際脈絡，從 1960 年代觀念藝術與 Beuys 的社會雕塑談起，討論藝術家走進社群的創作實踐。兩篇都只讀到摘要，全文沒有讀到。","因此平台在案例描述裡盡量使用較具體的說法，如「社區藝術」「社會參與式藝術」，只有來源本身用「藝術介入」時才保留。"],"src":["zhang","dong","lupy"],"cases":[],"rel":["sea","community-art","community-building"]},{"id":"community-building","g":"A","zh":"社區營造","en":"Community empowerment / community building (shequ yingzao)","short":"定義：文建會自 1994 年推行的政策取向，透過居民共同解決生活問題、強化彼此連結來經營社區，常是社區藝術的背景。","long":["換日線 2017 年的報導說明，社區營造是文建會自 1994 年推行的政策，期望居民共同解決生活問題、加強彼此連結，文化與藝術在其中扮演重要角色。這是報導對政策的描述，平台沒有讀到文建會當年的政策原文。","張晴文的論文也指出，社區營造等文化政策對台灣「藝術介入」的形成有強烈影響。平台因此把它當作理解社區藝術與藝術介入的背景，不單獨為案例標記這個詞。"],"src":["crossing","zhang","wang61","lupy"],"cases":["k78"],"rel":["community-art","art-intervention","empowerment"]},{"id":"aesthetic-ed","g":"A","zh":"美感教育","en":"Aesthetic education (meigan jiaoyu)","short":"定義：教育部政策用語，指培育美感素養、引導學習者覺察、探索、感受、認識並實踐美的教育。","long":["教育部《美感教育中長程計畫第三期五年計畫（113–117 年）》說明，美感教育是培育美感素養的實踐，引導學習者覺察、探索、感受、認識並實踐美（此為該計畫文件的描述，由學校網站轉載）。","它與「藝術教育」常被並用但範圍不同：政策文件談的是美感素養，平台的「藝術教育」標籤則看案例是否以學習者為主要參與者、以學習為目的，詳見藝術教育詞條。"],"src":["moe","chen25"],"cases":[],"rel":["art-ed","art-to-village","pedagogical-art"]},{"id":"indigenous","g":"C","zh":"原住民族（含部落）","en":"Indigenous peoples (including tribes/communities)","short":"台灣法律上的用語，由原住民族基本法定義；平台的「原住民族文化」議題指涉相關案例。","long":["《原住民族基本法》第 2 條定義：原住民族是「既存於臺灣而為國家管轄內之傳統民族」，包括阿美族、泰雅族、排灣族、布農族、卑南族、魯凱族、鄒族、賽夏族、雅美族、邵族、噶瑪蘭族、太魯閣族及其他經行政院核定者；「部落」是原住民於原住民族地區一定區域內，依傳統規範共同生活結合而成、經中央主管機關核定的團體（本詞條讀的是臺北市法規查詢系統轉載的版本，法規頁面標示最近修正日期為民國 107 年 6 月 20 日；請以全國法規資料庫現行條文為準，平台沒有逐條比對是否有更新）。","平台的「原住民族文化」議題，是依案例來源有沒有談到原住民族的文化、語言、土地或族人參與來標示，不是法定身分的認定。案例的族群、部落名稱請以來源為準。"],"src":["indigLaw"],"cases":["k09","k19","k27","k35","k36","k42","k34","k55","k57","k59","k61","k77"],"rel":["local-memory","fieldwork"],"filter":["issue","原住民族文化"]},{"id":"hakka","g":"C","zh":"客庄／客家","en":"Hakka villages / Hakka (kezhuang)","short":"客家基本法定義客家人：具客家血緣或淵源且自我認同；「客庄」是常用語，法條沒有定義。","long":["《客家基本法》第 2 條定義「客家人」為「具有客家血緣或客家淵源，且自我認同為客家人者」。這一條還定義了客家族群、客語、客家人口、客家事務；「客家文化重點發展區」出現在第 4、8、9、12 條，條文沒有在第 2 條另行定義（本詞條讀的是臺北市法規查詢系統轉載的版本，標示最近修正日期為民國 107 年 1 月 31 日，請以現行條文為準）。","「客庄」是一般用語，平台沒有找到法定定義，在案例中通常指客家人聚居的聚落，例如浪漫台三線與《藝耆共舞．客庄日常》；是否把某地稱作客庄，以案例來源的用語為準。"],"src":["hakkaLaw"],"cases":["k22","k33","k51","k61"],"rel":["romantic-route3","local-memory"],"filter":["issue","客家文化"]},{"id":"austronesian","g":"C","zh":"南島語族","en":"Austronesian peoples","short":"語言學上的分類：臺灣官方認定的 16 個原住民族都屬於南島語族，但他們只是整個南島語族的一部分；臺灣是南島語族分布的最北界，也被認為可能是其早期的擴散起點（仍有爭議）。","long":["南島語族（Austronesian）是世界上分布最廣的語系之一，北起臺灣、南至紐西蘭、東至復活節島、西至馬達加斯加，使用人口近 4 億（國家地理 2016 報導作 3.8 億）；南島語言約在 5,000 年前有共同起源，之後隨人群遷徙向南擴散、逐漸分化（依原住民族委員會「南島語族族群簡介」與中研院研之有物整理）。臺灣是南島語族分布的最北界，官方認定的原住民族共 16 族，每族都有自己的語言。","臺灣在南島語族中的地位很特殊：依中研院語言學者張永利（研之有物，2023）的整理，在南島語族 10 個主要語言分支中，臺灣南島語就佔了 9 個（引 Blust 1999），其語言多樣性與存古性『為世界少見』，臺灣南島語至少有 5,000 年歷史。這支撐了語言學界的『出臺灣說』（Out of Taiwan）——認為臺灣可能是南島語族早期的祖居地或語言分化中心，約在 4,000–5,000 年前隨人群外移擴散。要提醒的是：此說以『可能』表述、並非定論，近年也有基因研究（如英國 Richards 團隊，國家地理 2016 報導）提出質疑，人類學者許木柱也指出『臺灣原鄉論』在臺灣已帶有政治正確的爭議性。","要分清的是：臺灣的原住民族雖然都屬於南島語族，卻只是整個南島語族的一部分——南島語族還包括菲律賓、印尼、馬來西亞、馬達加斯加與太平洋島嶼的眾多族群。國立自然科學博物館『臺灣南島語族文化』常設展即以『臺灣南島人從哪裡來？又往哪裡去？』為題，連結臺灣與大洋洲。","平台的案例中，泛‧南‧島藝術祭（K36）以南島語族與臺灣原住民族文化為主題；相關說法仍請以案例來源與策展單位的說明為準。"],"ed":true,"src":["sinicaAust","cipAust","nmnsAust","natgeoAust","tsang"],"cases":["k36"],"rel":["indigenous"]},{"id":"rights-nature","g":"C","zh":"自然權利","en":"Natural rights","short":"不依賴特定政府或法律、被認為普遍且不可剝奪的權利，與由法律體系賦予的法定權利相對。","long":["英文維基百科〈Natural rights and legal rights〉的導言說，有些哲學家區分兩種權利：自然權利是不依賴任何特定文化或政府的法律與習俗、因此普遍、基本且不可剝奪的權利；法定權利則是由特定法律體系賦予，可以被法律修改、廢止或限制（維基百科為協作編輯的百科，僅作一般定義參考）。","在平台的案例中，2026 Mattauw 大地藝術季（K32）的報導用到這個詞：工商時報寫到總爺藝文中心的展覽，主題涵蓋「流域保護、自然權利到水與人的邊界」；2026 年版官網也列出「自然權利倡議」單元與「自然法庭（Rights of Nature Court）」活動（含「自然法庭入校園」）。這些報導沒有說明這裡的「自然權利」是哪一種意思，倡議的具體內容也沒有寫，平台不替它下定義。"],"ed":true,"src":["wikiNR","ctee","mattauw26"],"cases":["k32"],"rel":["land-art","sea"]},{"id":"marine-debris","g":"C","zh":"海廢（海洋廢棄物）","en":"Marine debris / marine litter","short":"漂流、沉積或堆積在海洋與海岸的人為廢棄物；台灣常簡稱海廢，作為環境類藝術的常見素材。","long":["海廢（marine debris）一般指可能漂浮、下沉或懸浮、並可能妨礙海洋正當使用的持久性合成材料；多數海洋垃圾分解很慢，持續大量輸入會在海洋與海岸環境逐漸累積。這是依國際文件（UNEP／InforMEA 詞彙表）的英文定義整理，平台沒有找到台灣主管機關（海洋委員會海洋保育署）的正式定義頁面可以讀取。","「海廢」是台灣常見的簡稱。平台案例中，林純用《黑湧》以海廢、消波塊等符號創作，並以 2015 年抹香鯨擱淺事件為契機；中洲津餘祭的背景也提到海廢與污染。"],"src":["informea"],"cases":["k06","k07","k09","k25","k58","k46"],"rel":["installation","local-memory"]},{"id":"press-release","g":"D","zh":"新聞稿","en":"Press release","short":"由主辦或執行單位撰寫、提供給媒體的稿件；多篇報導用語相近時，常是同一份新聞稿的轉載。","long":["這是平台的編輯說明，沒有引用定義來源。平台在判斷案例的「已查證」時，把用語高度相近、疑似同源的報導視為同一份來源，不算獨立來源，例如 K32 的三篇報導。","這個判斷是平台的規則，不代表報導不可信：新聞稿本身可能是正確的，但無法互相印證。可參考「業配文」詞條，兩者性質不同：新聞稿是單位提供稿件，業配文則是付費內容。"],"ed":true,"src":[],"cases":["k32"],"rel":["advertorial"]},{"id":"community-theatre","g":"A","zh":"社區劇場","en":"Community theatre","short":"定義：由居民自己參與、以集體即興發展、不以專業演出為目的的戲劇形式。","long":["賴淑雅（台灣應用劇場發展中心）在《美育》第 188 期的文章指出，台灣的「社區劇場」為避開「被壓迫者」「改革」等字眼引起的排斥，以較中性的名稱推展被壓迫者劇場（源自巴西 Augusto Boal 的設計）；工作坊不教演出，而是引導民眾表達自己的故事和議題、與民眾互動對話，與強調完整製作、專業演出的劇場不同。","平台案例中，潮芳苑的人劇團社區劇場（K41）以田調與集體即興，讓芳苑在地素人把漁村生活編成戲，是清楚的例子。"],"src":["lai"],"cases":["k41","k51","k61"],"rel":["sea","community-art","community-building"]},{"id":"relocation","g":"C","zh":"遷村","en":"Village relocation","short":"因開發或政策，整個聚落的居民集體搬遷到別處。","long":["以高雄大林蒲為例，遷村安置計畫由經濟部與高雄市政府協商，並經行政院核定。2026 年 4 月起辦理協議價購說明會，截至 7 月底超過 2,500 名所有權人簽署同意書；安置地的公共工程已先行，預計 2027 年啟動抽籤配地與補償費發價。","遷村的一般定義是編輯整理。大林蒲的案例都和這段過程有關，包括大鼻青年的絹印工作坊、玫好時光 Podcast。該報導沒有說明遷村原因。"],"ed":true,"src":["dalinpu"],"cases":["k03","k04","k07","k12"],"rel":["local-memory","juancun"]},{"id":"urban-renewal","g":"C","zh":"都市更新（都更）","en":"Urban renewal","short":"依法在都市計畫範圍內，重建、整建或維護老舊地區。","long":["都市更新條例第 3 條把「都市更新」定義為：依條例所定程序，在都市計畫範圍內，實施重建、整建或維護 es":["k31","k19"],"rel":["local-memory","art-to-village"]},{"id":"advertorial","g":"D","zh":"廣編稿","en":"Advertorial","short":"由廣告主出資或提供內容、刊登在媒體上的文章，應與一般新聞區分。","long":["關鍵評論網的一篇說明提到，贊助文章由廠商提供內容，或由業務部規劃執行，標示為「廣編企劃」與「Sponsor Content」，與編輯部無關。這是單一媒體的做法，各媒體的標示方式不同。","平台在案例備註中會標明來源是廣編稿或廣告稿，因為這類文章的立場和一般新聞不同。目前有再。嘉義鄉村藝術行動（廣編稿）、藝術轉動社區（廣告稿）。"],"src":["tnl"],"cases":["k24","k26"],"casesLabel":"來源為廣編或廣告稿的案例","rel":[]},{"id":"usr","g":"D","zh":"大學社會責任（USR）與社會實踐計畫","en":"University Social Responsibility (USR) and Social-Practice Programs","short":"政府鼓勵大學把師生帶進社區、解決地方問題的計畫；USR 為教育部（高教深耕的一環），另有國科會系統的『人文創新與社會實踐（HISP）』。","long":["教育部主導的大學社會責任實踐（USR）計畫在 2017 年試辦、2018 年啟動第一期，做法包括師生進入社區駐點，與社會團體及民眾共同盤點地方現況、研擬解決方法。依教育部 USR 推動中心的成果電子書，第一期（2018–2019）114 所大專校院、220 件計畫，第二期（2020–2022）約 93 校、204 件，第三期（2023–2024）113 校、251 件，並逐期接軌聯合國永續發展目標（SDGs）與校務治理。","USR 的時程與教育部『高等教育深耕計畫（高教深耕）』相互配合，常被歸在高教深耕『善盡社會責任』的面向之下。平台案例中，打開岡山·記憶的箱子（K01）由中山大學管理學院 USR 計畫團隊執行；官田有妖怪（K31）屬南藝大在官田的 USR 計畫（藝術史學系執行、官田國中協辦），南藝大電子報與自由時報亦以『高教深耕善盡社會責任』描述。義家藝館（K37）出現在北藝大高教深耕『善盡社會責任』的成果脈絡裡，但依深耕辦公室頁面屬『校級扶植』、經費來自主冊，並非正式 USR 子計畫，故本平台不將它列為 USR 案例。","另一個相近但不同部會的計畫，是科技部（今國科會）人文司的『人文創新與社會實踐（HISP）計畫』，約自 2013 年起推動，以人文社會研究連結地方、回應區域社會變遷，線上平台為『新作坊』（hisp.ntu.edu.tw）。平台案例中，《潮濕的複寫本》街區藝術行動（K29）即由國立臺灣海洋大學的 HISP 計畫執行——與 USR 精神相近，但屬國科會系統、不是教育部 USR。"],"src":["usr","epaper","usrbook","hisp"],"cases":["k01","k31","k29","k52","k58","k60","k61","k62"],"rel":["art-to-village","art-ed","community-art"]},{"id":"ncaf","g":"D","zh":"國家文化藝術基金會（國藝會）","en":"National Culture and Arts Foundation (NCAF)","short":"定義：1996 年成立的財團法人，依《文化藝術獎助及促進條例》設置，以營造展演環境、獎勵文化藝術事業、提升藝文水準為宗旨；是台灣視覺藝術補助的主要機構，也是本平台「藝術/社會」等名詞所依呂佩怡研究案的取樣範圍。","long":["依國藝會官網，財團法人國家文化藝術基金會（簡稱國藝會）於 1996 年 1 月正式成立，「以營造有利文化藝術工作之展演環境、獎勵文化藝術事業、提升藝文水準為機構服務宗旨」；業務依〈國家文化藝術基金會設置條例〉，包括輔導辦理文化藝術活動、贊助各項文化藝術事業、獎助文化藝術工作者，以及執行文化藝術獎助條例所訂之任務。","其法源可見於《文化藝術獎助及促進條例》第五章：第 24 條第 1 項明定「為輔導辦理文化藝術活動，贊助藝文事業，設置財團法人國家文化藝術基金會」，並應定期頒發各類國家文藝獎、訂定各類獎勵補助相關辦法、提供文化藝術資訊及法律諮詢；第 25 條規定基金來源包含政府編列預算、基金孳息、國內外公私機構團體或個人之捐贈及其他收入。（本平台讀取的是《文化藝術獎助及促進條例》第五章；該會官網所稱〈國家文化藝術基金會設置條例〉本次未另行讀取，故業務條文以前者為準。）","對本平台而言，國藝會的意義在於它是呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉的取樣範圍——該研究以國藝會美術類受補助名單為主（常態補助的創作、展覽、調查研究、出版等），並納入視覺藝術策展專案補助計畫，再擴大參考國藝會 2007–2010 年的社區／社群研究計畫。因此平台的「藝術/社會」「作者論・中介・去作者」等名詞，多由這批受補助案例歸納而來。本條目列於「資料與計畫用語」，用以說明補助機構脈絡，不替個別案例貼標籤。"],"src":["ncaf","cadp","lupy"],"cases":[],"rel":["usr","art-society-turn","artist-roles"]},{"id":"transitional-justice","g":"C","zh":"白色恐怖／轉型正義","en":"White Terror / transitional justice","short":"「威權統治時期」指 1945/8/15 至 1992/11/6；轉型正義是民主化後，對過去國家大規模侵害人權所做的平復工作。「白色恐怖」是這段時期政治迫害的俗稱。","long":["依行政院推動轉型正義會報的問答集（引《促進轉型正義條例》第 3 條第 1 款），『威權統治時期』自民國 34 年（1945）8 月 15 日起，至 81 年（1992）11 月 6 日、即金門馬祖東沙南沙地區宣告解嚴前一日止。『轉型正義』依行政院人權資訊網（引聯合國）指：國家結束威權統治、邁向民主與和平時，承認並平復過去國家大規模侵害人權的不正義；晚近聯合國報告提出真相、正義、賠償、保證不再發生與追憶五個支柱。","政府依《促進轉型正義條例》分工推動多項任務：開放政治檔案（國家發展委員會）、處置威權象徵（內政部）、保存不義遺址（文化部）、平復司法不法與行政不法（法務部）、療癒政治受難者與家屬的創傷（衛生福利部）、推動轉型正義教育（教育部）、調查及處理不當黨產（不當黨產處理委員會）。『不義遺址』依該條例第 5 條第 2 項，指『威權統治時期，統治者大規模侵害人權事件之發生地』。","『白色恐怖』是這段威權時期政治迫害（逮捕、審判、關押與處決政治犯及異議者）的俗稱，為平台整理用語、非法律名詞。綠島是代表性的不義遺址之一，設有白色恐怖綠島紀念園區（由文化部所屬國家人權博物館經營）。平台案例中，記憶‧邊緣——綠島人權藝術季北藝大特展（K64）由北藝大與國家人權博物館合作，師生先透過『記憶政治與藝術介入』課程認識白色恐怖與轉型正義脈絡，再進駐綠島紀念園區現地創作。","要提醒的是：本詞條的『威權統治時期』起訖與各部會分工，依行政院兩個官方頁面（轉型正義問答集、人權資訊網）整理，《促進轉型正義條例》逐條原文本次未另行讀取，請以全國法規資料庫現行條文為準。"],"ed":true,"src":["tjbQa","hrtjTj"],"cases":["k79","k64"],"rel":["battlefield-admin","local-memory"]},{"id":"battlefield-admin","g":"C","zh":"戰地政務","en":"Battlefield (military) administration","short":"冷戰時期在金門、馬祖實施的軍事管制體制，由軍方統管行政，1992 年解除。","long":["金門自 1956 年進入戰地政務體制，金門與馬祖的戰地政務於 1992 年 11 月 7 日解除；在管制時期，一般人民很難自由往來金馬，除官方、軍方與受邀者外，多半只有海外華僑有機會登島，1994 年《金馬安輔條例》修正後才廢除出入境管制。","戰地政務時期軍方統管地方行政，居民生活受到相當限制。這個名詞的概括定義由平台整理，沒有引用法規原文。馬祖國際藝術島（K46）正是在戰地政務解除後，把一度封閉的據點、碉堡與防空洞重新轉化為創作與展演空間，處理軍管時期被隱藏的常民記憶。"],"ed":true,"src":["matsuwar"],"cases":["k46"],"rel":["juancun","local-memory","installation"]},{"id":"eastern-min","g":"C","zh":"閩東語（馬祖話）","en":"Eastern Min (Matsu dialect)","short":"通行於馬祖的在地語言，屬閩東語，已列入十二年國教本土語文課程。","long":["國家教育研究院的《本土語文（閩東語文）課程手冊》顯示，閩東語文已納入十二年國民基本教育課程綱要的本土語文領域，自 111 學年度（2022）起實施，成為正式的本土語文課程之一。這反映閩東語（馬祖話）作為地方語言的保存與傳承，已進入制度化的語言復振。","馬祖國際藝術島（K46）的核心議題之一，就是人口流失下的閩東文化與語言復振；報導寫到計畫與馬祖青年發展協會等在地單位合作。這個名詞的定義由平台整理，課綱資訊依國教院手冊。"],"ed":true,"src":["mindong"],"cases":["k46"],"rel":["battlefield-admin","hakka","local-memory"]},{"id":"site-specific","g":"B","zh":"限地製作（場域特定藝術）","en":"Site-specific art","short":"為某個特定地點量身創作、與該地點不可分離的藝術；移到別處意義就會改變。","long":["ArtLex 把限地製作（site-specific art）定義為「為精確地點構思、並與該地點互動的藝術介入」，作品的意義與那個地方綁在一起。它的『地點』可以是城市、鄉野，也可以是美術館或畫廊內部，涵蓋地景藝術（如 Smithson《螺旋堤》）、為展間而作的裝置（如 Turrell、Flavin），以及公共空間的委託創作（如 Serra《傾斜之弧》）。換句話說，限地製作並不限定場地必須是歷史或軍事場域。","平台的案例中，義家藝館（K37）、馬祖國際藝術島（K46）、眾人成莊（K44）、二村開門（K45）都把特定場域（榮民之家、戰地據點、眷村遺構）當成作品不可分割的一部分。教學方法頁的「在歷史現場與軍事遺構裡創作」，可看成限地製作用在記憶場域教學的一種應用，而不是另一種形式。"],"ed":true,"src":["artlexSite"],"cases":["k79","k37","k46","k44","k45","k02","k64","k78"],"casesLabel":"部分明顯屬限地製作的案例","rel":["installation","public-art","land-art","fieldwork"]},{"id":"shetou","g":"C","zh":"社頭","en":"Shetou (procession guilds)","short":"大溪遶境慶典中，居民依同行業或地緣自發組成的表演團體，各有獨特藝陣。","long":["『社頭』是地方自發組成的遶境團體，常因同行業或地緣關係而形成，各社的藝陣因此有獨特風格，例子包括與職業相關的牛犁陣、墨斗陣、土水仙童；慶典中也有頭旗、龍陣、獅陣、童仔、北管、神將等表演。","在平台案例中，大溪大禧（K48）以普濟堂關聖帝君聖誕遶境為核心，社頭、廟方與居民是慶典的主體，2026 年版有 32 個社頭參與。社頭是理解這個案例『居民參與』的關鍵——參與的單位不是個人，而是既有的在地團體。"],"ed":true,"src":["daxishetou"],"cases":["k48"],"rel":["community-theatre","local-memory"]},{"id":"coming-of-age","g":"C","zh":"做十六歲","en":"Coming-of-age at sixteen","short":"台南府城特有的成年禮：十六歲向七娘媽祭拜，象徵轉大人。","long":["『做十六歲』是府城舊城區特有的成年禮，傳承自清領時期的五條港：當時港區童工薪資只有成年人的一半，滿十六歲才能領全薪，家人多設宴款待工頭與親友。成年禮由十六歲青少年向七娘媽祭拜，台南主祀七娘媽的廟宇以開隆宮、臨水夫人廟為主、儀式多在開隆宮舉辦，後來在市府推廣下逐漸成為全市活動。","平台案例中，十六歲正青春藝術節（K50）正是把這個在地成年禮傳統，轉化為每年暑假的青少年藝術節與集體創作劇場。"],"ed":true,"src":["cna16"],"cases":["k50"],"rel":["local-memory","community-theatre"]},{"id":"peoples-theatre","g":"A","zh":"民眾劇場／被壓迫者劇場","en":"People's Theatre / Theatre of the Oppressed","short":"定義：源自巴西波瓦（Augusto Boal）的參與式劇場取向，打破舞台與觀眾的界線、讓民眾成為行動者。","long":["《美育》第188期于善祿的文章說明，『被壓迫者劇場』（Theatre of the Oppressed）由巴西的奧古斯都‧波瓦（Augusto Boal，1931–2009）發展，主張拆除三道牆——舞台與觀眾席之間、戲劇場景與真實生活之間、藝術家與非藝術家之間——核心是讓每個人都能運用劇場的力量、成為自己生命的主宰。其中最為人知的『論壇劇場』（Forum Theatre）把社會與政治議題編成戲，讓觀眾上場改寫情節、一起演練解決之道。波瓦的《被壓迫者劇場》自 1970 年代起影響全球。","在台灣，這一脈常被稱為『民眾劇場』。同篇文章提到鍾喬是民眾劇場工作者，1990 年代中期關注外籍勞工、國際資本與社會改革，並與亞洲民眾劇場團體合作（鍾喬即差事劇團藝術總監）。平台案例中，石岡媽媽劇團（K51）就是差事劇團在 921 災後以民眾戲劇工作坊協力輔導而成。民眾劇場與『社區劇場』相近而有別：社區劇場重在以劇場凝聚特定社區，民眾劇場則更強調從被壓迫處境出發、以戲劇作為集體行動與培力。"],"ed":true,"src":["boal188"],"cases":["k51"],"rel":["community-theatre","hakka"]},{"id":"participatory-art","g":"A","zh":"參與式藝術","en":"Participatory Art","short":"定義：以觀眾／群眾的介入與互動本身構成作品的藝術，觀眾從旁觀者轉為藝術家的合作者。","long":["依鄭林佳在《現代美術》第 177 期的整理，『參與式藝術』（Participatory Art）指透過群眾介入及互動形成的藝術創作。藝評人 Lori Waxman 認為，當創作導入觀眾參與，觀眾（audience）便不再是被傳統話語稱呼的旁觀者，而是藝術家的合作者。文章以 1993 年威尼斯雙年展開放展（Aperto 93）中 Rirkrit Tiravanija 煮湯宴客、打破距離並邀觀者參與的『作品』為代表例。","其背景是當代藝術的課題從『什麼是藝術』（what is art）轉向『哪裡是藝術』（where is art）：藝術從美術館的白盒子走入『生活場域』，創作者從藝術家轉為『觀眾社群』，作品本身成為可被參與的『事件』；藝術的主體也進入『互為主體』（intersubjectivity），把社會、文化、性別、社區等議題帶入其中。源流上可溯及達達與杜象消弭藝術與生活的界線，以及波伊斯（Joseph Beuys）的『社會雕塑』（social sculpture）與『人人都是藝術家』；台灣則與 2002 年修正《文化藝術獎助條例》、公共藝術設置與『公民美學』的推動相關。","與『社會參與式藝術』、『社區藝術』、『新類型公共藝術』、『對話性創作』等概念高度重疊；本平台多數有居民共創的案例都可視為其實踐。文章也提醒兩個風險：民眾可能只淪為藝術家完成作品的助手，或落入『為參與而參與』的迷思——過度強調形式上的互動，反而讓民眾回到被動接收的角色，形成藝術與觀者『互為被動』（interpassive）的弔詭。"],"ed":true,"src":["pa177","lupy"],"cases":["k79","k01","k10","k11","k12","k13","k14","k17","k18","k20","k51","k34","k57","k19","k27","k41","k60","k63","k65","k78"],"rel":["sea","community-art","co-creation","participation-ladder"]},{"id":"new-genre-public-art","g":"A","zh":"新類型公共藝術","en":"New Genre Public Art","short":"定義：強調社區參與、以人為本、重視過程的公共藝術取向，一詞源自 1995 年《量繪形貌：新類型公共藝術》一書所彙整、七〇年代以來的藝術實踐。","long":["依呂佩怡〈轉向「藝術/社會」：社會參與藝術實踐研究〉的梳理，「新類型公共藝術」（New Genre Public Art）一詞來自 1995 年出版的《量繪形貌：新類型公共藝術》（Mapping the Terrain: New Genre Public Art）。該書彙整七十年代以來的藝術實踐，指出它們在基本概念上已與先前的藝術不同；呂文並引藝評家 Suzi Gablik 以「連結性美學」（Connective Aesthetics）稱呼現代主義、個人主義之後的藝術樣貌，背景則是九〇年代美國的相關脈絡，如 1993 年芝加哥的「文化行動」展演。","呂文把「新類型公共藝術」與「藝術介入」「社區／社群藝術」「參與式藝術」「社會參與式藝術」等詞並列，視為台灣九〇年代末以來指稱同一波藝術實踐的多種名稱；它們共同強調公共性、參與性、關係性、合作性與過程性，不一定生產物件式作品或展覽。","本平台只在來源本身使用這個詞時才標記，相關概念的細部區辨另見「參與式藝術」「社會參與式藝術」「社區藝術」等條目。本條目依呂佩怡該研究案整理，所引書名與人名均為該文所述。","另據李奎壁〈社會參與式藝術〉一文，Suzanne Lacy 曾提出依參與深度劃分的「同心圓」參與者模型，用以區分不同程度的參與者與觀眾；該文把「新類型公共藝術」放在偶發藝術、Fluxus、情境主義國際與英國社群藝術等脈絡中一併討論。"],"src":["lupy","likueipi"],"cases":["k76","k77","k78"],"rel":["participatory-art","sea","art-intervention","community-art"]},{"id":"relational-aesthetics","g":"A","zh":"關係美學","en":"Relational Aesthetics","short":"定義：法國藝評家布里歐於 1998 年提出的概念，把「與觀眾建立關係」的作品視為一種特殊藝術類別，讓非藝術的社會行為成為創作形式。","long":["依呂佩怡的研究，法國藝評家尼可拉·布里歐（Nicolas Bourriaud）於九〇年代中透過展覽及論述，並在 1998 年出版《關係美學》（Relational Aesthetics），掀起這股實踐風潮。這類與觀眾建立關係的作品被視為一種特殊藝術類別，其中主導的氣氛是「共同饗宴」「大家一起來」，讓非藝術的社會行為變成創作形式，而「人」的參與使社會行為閃現意義。","呂文把關係美學放在社會參與藝術的歐陸脈絡中，與英國藝評與學者 Claire Bishop 回溯的歷史並置——Bishop 把這類對「藝術與社會」的想像與實驗上溯至 1920 年代現代主義（未來派、達達），以及六〇年代末、七〇年代的偶發藝術（Happening）、福魯克薩斯（Fluxus）與情境主義國際。","本條目依呂佩怡該研究案整理；布里歐與 Bishop 的原著本平台未直接讀到，概念轉述以該文為準。","Pablo Helguera 在《社會參與藝術的十個關鍵概念》中，也把「關係美學」視為後來「社會實踐」一詞的前身——相對於去掉「藝術」二字的「社會實踐」，「關係美學」在源起時仍保留了「美學」二字。"],"src":["lupy","helguera"],"cases":["k72","k76"],"rel":["participatory-art","sea","co-creation"]},{"id":"artist-roles","g":"B","zh":"作者論・中介・去作者（藝術家角色）","en":"Author / mediator / de-author (roles of the artist)","short":"定義：呂佩怡用來描述社會參與藝術中藝術家位置的三種角色——作為主體的「作者論」、作為轉化介面的「中介」，以及退居幕後的「去作者」。","long":["呂佩怡在〈轉向「藝術/社會」〉中指出，2000 年之後台灣社會參與藝術的藝術家角色可分為三類：藝術家作為主體（作者論）、藝術家作為轉化介面（中介）、以及藝術家退後（去作者）；這組區分對應她提出的另一條主張——由「藝術←→社會」轉向「藝術/社會」。","「作者論」指藝術家以其敏銳之眼，與整體社會之間產生一種有距離的批判。「中介」指藝術家以創意在系統機制之內轉換、使自身成為一個交換平台，以雙贏策略促成不同領域或立場雙方的合作，並且必須強調其藝術家身分、依賴並挪用藝術機制；呂文以周育正、黃博志為例（如周育正《東亞照明》《虹牌油漆》(2011) 中要求廠商贊助、再轉化為美術館資源的「回饋」機制）。策展人鄭慧華也形容「藝術創作其實更像一種開創性的『中介』，而藝術家則像一個『中介者』（mediator）」。「去作者」則指藝術家在創作中退居幕後。","本條目依呂佩怡該研究案整理；文中所引藝術家（周育正、黃博志等）尚未個別收錄為本平台案例，另於案例資料庫逐一查證後補入。"],"src":["lupy"],"cases":["k69","k70","k71","k72","k73","k74","k75","k78"],"rel":["art-society-turn","sea","art-intervention"]},{"id":"art-society-turn","g":"B","zh":"藝術/社會（由「藝術←→社會」轉向）","en":"Art/Society (the turn from 'art ↔ society')","short":"定義：呂佩怡提出的概念轉變——藝術與社會的關係，從把兩者視為各自獨立、彼此往來的「藝術←→社會」，轉向視藝術為社會內部一環的「藝術/社會」。","long":["呂佩怡認為，2000 年之後台灣社會參與藝術在概念上對「藝術與社會」的想像擴大，由「藝術←→社會」轉向「藝術/社會」。前者把藝術與社會視為兩個各自獨立、再彼此往來的範疇；後者則主張藝術不在社會的外部，而在社會的內部。","她引黃孫權在《典藏今藝術》專欄的回應為佐證：「我們在乎社會或如何在乎社會是個假問題，無人可以外於社會」，認為把社會與藝術預先劃分，不過是一種掩飾無力的修辭。呂文並以台灣用語的變化勾勒這條軸線：九〇年代初談「藝術下鄉」、九〇年代末以「介入」為概念、2000 年之後強調「參與」，到 2006 年北回歸線環境藝術行動提出如何與偏鄉社區居民產生關連的提問。","本條目依呂佩怡該研究案整理；黃孫權專欄原文本平台未直接讀到，轉述以該文為準。"],"src":["lupy"],"cases":["k69","k70","k71","k72","k73","k74","k75","k76","k77"],"rel":["artist-roles","sea","art-intervention"]},{"id":"servo-motor","g":"B","zh":"伺服機動（Servo Motor）","en":"Servo Motor","short":"定義：藝評家陳泰松用來比喻藝術家社會角色的詞——把藝術家視為對社會體制進行干預的「裝置」的操作者，藉以創造新的社會關係。","long":["依呂佩怡的研究，陳泰松在 2010 年一場台新座談會中，將藝術家視為「社會的交往者」，追問「藝術家如何透過創作實踐與社會交往？」，並把藝術家視為「伺服機動」（Servo Motor）的操作者。","「伺服機動」原意為「伺服馬達」或「伺動馬達」，被引申為一種對社會體制運作進行干預的裝置，而藝術家就是操作這種裝置的人，可以藉此創造新的社會關係。這個比喻與呂文所談的「中介」相呼應，都把藝術家放在社會內部、作為促成改變的操作者。","本條目依呂佩怡該研究案整理；陳泰松說法原出〈藝術家：社會的交往者〉專題（《典藏今藝術》，2010），本平台未直接讀到原文，轉述以呂文為準。"],"src":["lupy"],"cases":[],"rel":["artist-roles","art-society-turn"]},{"id":"sensory-field","g":"B","zh":"感性田野","en":"Field of the sensible (ganxing tianye)","short":"定義：藝術家陳界仁提出的說法，把「不可能」視為想像、創造與行動實踐的起點，用以思考身處社會內部的藝術家如何不同於社會中的其他人。","long":["呂佩怡在討論「無人可以外於社會」、藝術位於社會內部的脈絡時，引藝術家陳界仁提到的「感性田野」：「不可能恰恰就是想像、創造的開始，也是行動與實踐的開始」。","這個說法回應一個問題：若無人能置身社會之外，那麼身處社會之內的藝術家，又如何異於社會中的其他人？「感性田野」把看似的「不可能」翻轉為想像與行動的起點，呼應社會參與藝術強調過程、關係與介入現實的傾向。","本條目依呂佩怡該研究案整理；陳界仁原始說法的出處本平台未直接讀到，轉述以呂文為準。"],"src":["lupy"],"cases":["k69"],"rel":["art-society-turn","sea"]},
{"id":"place-activation","g":"A","zh":"地域策展／閒置空間活化","en":"Place-based curation / activating idle spaces","short":"定義：以一塊地域、或一處閒置、廢棄的空間為對象的藝術工作——從田野踏查、紀錄、個人創作，到用策展把空間重新組織、活化。","long":["這是平台為了收攏一組相關實踐而採用的工作概念。它和既有的『策展』『限地製作（場域特定藝術）』『社區營造』相鄰：差別在於它以『一個地方／一處閒置空間』為單位，把調查、徵集或共創、展呈串成一條線，目標是讓空間本身被重新看見、甚至在計畫結束後仍持續被使用。","要留意的是，被歸在這個概念下的案例其實落在一條光譜的不同位置：有的以『踏查與檔案』盤點閒置空間（如 k70《海市蜃樓：台灣閒置公共設施抽樣踏查計劃》對全台蚊子館的抽樣踏查），有的是藝術家在廢墟現場的個人創作（如 k71《廢墟影像晶體計畫》），有的才是嚴格意義的『地域策展與活化』（如 k78 星濱山在基隆正濱漁港以 CIR 與策展活化老屋與港町）。引用時宜分清：踏查紀錄、個人創作、與共創活化是不同程度的介入，不宜一概稱為『活化』。","與操作卡『在歷史現場與軍事遺構裡創作（site）』也不同：那談的是在單一現場做一件作品，這裡談的是用策展把整個空間或地域組織、活化起來。"],"src":[],"cases":["k78","k70","k71"],"rel":["curation","site-specific","community-building","urban-renewal"]}
